  21: [
    { text:true, q:'Найдите предложения, в которых запятая(-ые) ставится(-ятся) в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1)В 43 километрах к югу от Пскова находится город Остров, расположенный на обоих берегах реки Великой, впадающей в Псковское озеро. (2)Предполагается, что он существовал уже в XIII веке. (3)Первое летописное упоминание об Острове относится к 1341 году: в это время на помощь псковичам, воевавшим с ливонцами, «приспели островитяне с посадником своим Василием Онисимовичем». (4)В Средние века Остров был не только крупным пригородом Пскова, но и важным оборонительным форпостом на юге Псковской республики. (5)По предположению исследователей, крепость первоначально была деревянной и к середине XIV века уже не могла сдерживать усиливающийся натиск Ливонского ордена. (6)Тогда псковичи на островке, образуемом рекой Великой и протокой Слобожихой, построили каменную крепость с пятью башнями, а рядом в 1542 году был возведён монументальный храм Святого Николая. (7)Занимая пограничное положение, Остров неоднократно первым встречал нападение воинственных соседей. (8)В начале XVIII века, после успешного завершения Северной войны, Остров потерял своё прежнее оборонное значение. (9)Островская крепость начала разрушаться ещё в XVII веке, Великая Отечественная война стёрла её с лица земли.', a:['136'], src:'Вариант 1 · задание 21' },
    { text:true, q:'Найдите предложения, в которых тире ставится(-ятся) в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1)Летний сад – одна из главных достопримечательностей Санкт-Петербурга. (2)Для устройства этого парка Пётр I выбрал выгодно расположенную мызу на том месте, где располагалось имение шведского майора Эриха фон Коноу, – небольшой домик с хозяйственным двором и садом. (3)Однако болотистая территория не годилась для садоводчества – требовалось создать твёрдую поверхность. (4)Подсыпка земли, выкапывание каналов и прудов, посадка деревьев – эти мелиоративные работы имели важное значение и незамедлительно начались на месте будущего парка. (5)Вскоре сад стал местом проведения ассамблей, балов, фейерверков и других закрытых мероприятий, попасть на которые могли только избранные вельможи по особому приглашению царя. (6)Мраморные скульптуры – главное украшение сада – заказывались в основном в Венеции. (7)Нанятые Петром французские архитекторы спроектировали и установили в центре парка фонтаны с изображениями по сюжетам басен Эзопа – великолепный ансамбль, поставивший Летний сад в один ряд с Версалем. (8)Со времён Петра I петербуржцы не перестают любить Летний сад – один из самых посещаемых горожанами парков. (9)«Я к розам хочу, в тот единственный сад, / Где лучшая в мире стоит из оград», – писала о Летнем саде Анна Андреевна Ахматова.', a:['2678'], src:'Вариант 2 · задание 21' },
    { text:true, q:'Найдите предложения, в которых запятая(-ые) ставится(-ятся) в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1)Жила-была на свете лягушка-квакушка. (2)Сидела она в болоте, ловила комаров да мошку, весною громко квакала вместе со своими подругами. (3)И весь век она прожила бы благополучно – в том случае, если бы не съел её аист. (4)Но случилось одно происшествие. (5)Однажды она сидела на коряге, высунувшейся из воды, и наслаждалась тёплым мелким дождиком. (6)«Ах, какая сегодня прекрасная мокрая погода, – думала она. – Какое это наслаждение – жить на свете!» (7)Дождик моросил по её пёстренькой лакированной спинке, капли его подтекали ей под брюшко и за лапки, и это было восхитительно приятно – так приятно, что она чуть-чуть не заквакала. (8)К счастью, лягушка вспомнила, что была уже осень и что осенью лягушки не квакают; заквакав, она может уронить своё лягушечье достоинство. (9)Поэтому она промолчала и продолжила нежиться. (По В. М. Гаршину)', a:['378'], src:'Вариант 3 · задание 21' },
    { text:true, q:'Найдите предложения, в которых запятая ставится в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1)Плато Путора́на – расположенный на северо-западе Среднесибирского плоскогорья горный массив. (2)На севере и западе плато обрывается крутым уступом, а южная и восточная части имеют пологие склоны. (3)Максимальная высота плато – 1701 м, самые высокие горные вершины – Камень (1701 м) и Холокит (1542 м). (4)Поверхность плато покрыта базальтовыми лавовыми потоками, которые часто именуют сибирскими траппами. (5)Они встречаются по всему Среднесибирскому плоскогорью, однако плато Путорана — единственный крупный участок, полностью сложенный базальтами. (6)Его рельеф представляет собой сочетание относительно ровного плато и больших ущелий и долин. (7)На территории плато Путорана находятся верховья рек Курейка, Пясина, Хета, Котуй, Иркинда, а также правые притоки Нижней Тунгуски. (8)Реки, пробивая себе дорогу через многослойные породы, образуют глубокие каньоны и водопады.', a:['25'], src:'Вариант 4 · задание 21' },
    { text:true, q:'Найдите предложения, в которых двоеточие ставится в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1)Самое крупное озеро в Западной Сибири ‒ озеро Чаны. (2)Оно располагается на территории пяти районов Новосибирской области: Здвинского, Барабинского, Чановского, Купинского и Чистоозёрного. (3)Своё название озеро получило от тюркского слова «чан»: так на востоке называли сосуд больших размеров. (4)Острова и полуострова озера Чаны обладают отличительной особенностью: большинство из них вытянуто с юго-запада на северо-восток. (5)Озеро представляет собой систему протоков и мелководных участков, среди которых выделяется несколько наиболее крупных плёсов. (6)Известный исследователь Сибири Н. М. Ядринцев писал об озере Чаны: «Здесь встречаются целые стаи лебедей, гордо нежащихся и колеблющихся, как белые фрегаты, на поверхности вод». (7)Сегодня озеро Чаны имеет большое хозяйственное значение: на его берегах построены базы отдыха, организуются специальные экологические туры, зимой и летом проводятся оздоровительные и спортивные мероприятия.', a:['347'], src:'Вариант 5 · задание 21' },
    { text:true, q:'Найдите предложения, в которых тире ставится в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1)16 июня 1925 года в уютной и живописной бухте, где тишину и покой охраняет древний Аю-Даг, зазвучали детские голоса и под звуки горна взвился флаг – так в Крыму открыл свою первую смену лагерь-санаторий Общества Красного Креста РСФСР в «Артеке». (2)Питомцами «Артека» становились лучшие пионеры Советского Союза – ребята, заслужившие право стать артековцами своей учёбой и активной общественной позицией. (3)Многие из них выросли и стали героями Великой Отечественной войны. (4)Это Тимур Фрунзе – лётчик-истребитель, погибший в неравной схватке; это Гуля Королёва – санинструктор, несмотря на ранение поднявшая в атаку бойцов под Сталинградом и погибшая в этом бою; это Иван Туркенич – командир подпольной комсомольской организации «Молодая гвардия» в оккупированном Краснодоне. (5)Патриотизм, коллективизм, уважение к труду – вот важнейшие ценности, которые взрослые прививали детям в эти годы. (6)И относились к детям не как к деткам, глупым и слабосильным, а как к собственной смене, т.е. уважительно. (7)Сейчас «Артеку», где отдыхают и воспитываются ребята из России и многих стран мира, присвоен статус Международного детского центра.', a:['24'], src:'Вариант 6 · задание 21' },
    { text:true, q:'Найдите предложения, в которых запятая(-ые) ставится(-ятся) в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1)Воевода Фёдор Фёдорович Пушкин получил нижегородское село Большое Болдино в награду от царя Михаила Фёдоровича за ратную службу и личную доблесть, отразив наступление на Москву польско-литовских войск. (2)С тех пор дворяне Пушкины стали знатными землевладельцами, передававшими родовое имение Болдино по наследству. (3)Дед великого поэта – Лев Александрович Пушкин ‒ расширил земельные границы болдинского имения, включив в него деревню Малое Болдино и село Кистенёво, и выстроил в усадьбе Успенскую церковь. (4)А. С. Пушкин впервые приехал в Болдино в 1830 году, накануне женитьбы на Наталье Гончаровой. (5)Молодой жених собирался провести здесь пару недель, чтобы оформить все необходимые документы и вступить во владение 200 крепостными крестьянами, которых ему выделил отец. (6)Однако эпидемия холеры, охватив Нижегородчину, преградила путь поэту, и он остался в карантинной зоне на три долгих и в творческом плане очень плодотворных месяца Болдинской осени.', a:['136'], src:'Вариант 7 · задание 21' },
    { text:true, q:'Найдите предложения, в которых тире ставится в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1)Произведения Н. С. Лескова – это голос русского народа, портрет его жизни. (2)Он имел право говорить: «Я не изучаю народ по разговорам с петербургскими извозчиками, а я вырос в народе, так мне непристойно ни поднимать народ на ходули, ни класть его себе под ноги. Я с народом был свой человек», – поскольку такой откровенной правды о русском народном характере, быте, отношениях до него сказано не было. (3)Простота в изображении зла и добра – вот стилевая доминанта его прозы, соответствующая представлениям писателя о самой русской жизни. (4)Содержание его произведений определяет и жанровые предпочтения. (5)Хотя Н. С. Лесков – автор многих романов (от «Некуда» до «Соборян»), всё же этот жанр не принёс писателю полного удовлетворения. (6)Его любимые жанры другие – очерк, сказ, повесть, хроника. (7)Возродил он и жанр жития. (8)«Однодум», «Человек на часах», «Очарованный странник» и др. – это «рассказы о праведниках».', a:['1358'], src:'Вариант 8 · задание 21' },
    { text:true, q:'Найдите предложения, в которых запятая ставится в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1)…Пьесу «Дни Турбиных» М. А. Булгакова, поставленную во МХАТе, Сталин смотрел пятнадцать раз. (2)Подумать только, пятнадцать раз приезжать на один и тот же спектакль! (3)Сильно, видимо, этот спектакль чем-то его зацепил. (4)Нельзя тут сбрасывать со счёта изумительную игру актёров. (5)На лестнице гимназии Алексей Турбин в исполнении Николая Хмелёва, обращаясь к юнкерам, произнёс слова: «Слушайте меня, друзья мои…» (6)Именно эти слова стали основой знаменитого сталинского обращения к советскому народу 3 июля 1941 года: «Товарищи! Граждане!.. Братья и сёстры!..» (7)Кто из современников минувшей войны не помнит этой речи?.. (8)Помню тягостные паузы в репродукторе и как что-то звякало: то ли зубы о стакан с водой, то ли чайная ложка. (9)Оратор волновался перед микрофоном, как, может быть, ни разу в жизни не приходилось. (По В. Я. Лакшину)', a:['239'], src:'Вариант 9 · задание 21' },
    { text:true, q:'Найдите предложения, в которых тире ставится(-ятся) в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1)Ангара – единственная река в Сибири, которая вытекает из озера Байкал. (2)Начинается она между Байкальском и Листвянкой, недалеко от которой находится Шаман-камень ̶ легендарная скала, окружённая водами Байкала. (3)Легенда об этой скале гласит, что Байкал хотел отдать свою дочь ̶ красавицу Ангару ̶ замуж за молодого воина по имени Иркут. (4)Но Ангара влюбилась в другого богатыря ̶ Енисея ̶ и убежала к нему. (5)Рассерженный отец бросил вслед дочери огромную скалу ̶ Шаман-камень. (6)Стоит перечислить и другие знаковые места Приангарья: Братская ГЭС, Братское и Усть-Илимское водохранилища, промышленные и культурные центры (Иркутск, Ангарск, Братск) – все они незабываемы для путешественника.', a:['2345'], src:'Вариант 10 · задание 21' },
    { text:true, q:'Найдите предложения, в которых тире ставится в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1) В Кабардино-Балкарии находятся одни из самых глубоких карстовых озер в Европе --- Голубые озера. (2) На дно Нижнего озера --- Церик-Келя --- пытался спуститься известный исследователь и путешественник Жак-Ив Кусто, но он не смог определить глубину этого водоема. (3) В наши дни исследователи достигли отметки в 279 метров --- это всего на два метра меньше, чем в глубочайшем в мире карстовом озере Красное в Хорватии. (4) Вода в Церик-Кель нежно-голубого цвета из-за сероводорода. (5) В день в зависимости от освещения цвет водной глади может меняться до 16 раз. (6) Церик-Кель --- одно из самых прозрачных озер в мире, здесь можно увидеть предметы, которые находятся на глубине 22 метра. (7) Температура воды в Церик-Келе постоянная, девять градусов по Цельсию. (8) В таких условиях здесь обитает только рачок гаммарус и некоторые пиявки.', a:['12'], src:'Работа №1 · вопрос 1 · задание 21' },
    { text:true, q:'Найдите предложения, в которых двоеточие ставится в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1) В Томской области, между реками Иртыш и Обь, находится одна из самых крупных болотистых территорий в мире --- Васюганские болота. (2) Их площадь --- 53 тысячи квадратных километров, здесь могла бы поместиться небольшая европейская страна: Дания или Швейцария. (3) Васюганские болота еще называют гигантским фильтром планеты: поверхность трясины поглощает углерод, который может вызвать парниковый эффект. (4) На востоке Якутии находится долина Оймякон --- одно из самых холодных мест на земле. (5) Погода меняется и в течение суток: летним днем здесь может быть 30-градусная жара, а ночью --- почти заморозки. (6) Летом здесь не тают ледники, а зимой не замерзают ручьи: их подпитывают термальные источники.', a:['356'], src:'Работа №1 · вопрос 2 · задание 21' },
    { text:true, q:'Найдите предложения, в которых запятая(-ые) ставится(-ятся) в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1) На востоке Астраханской области находится озеро Баскунчак. (2) Миллионы лет назад здесь находилось древнее море, по берегам которого образовались соляные наплывы. (3) Со временем соль накрыли илистые отложения, осадочные породы. (4) Но десятки родников выносят ее на поверхность. (5) Толщина поверхностного слоя соли составляет 18 метров, а самые глубокие залежи находятся в шести километрах под землей. (6) С VIII века здесь добывали соль, отправляли ее по Шелковому пути в другие страны, сегодня на Баскунчаке производят около 80% всей российской соли.', a:['36'], src:'Работа №1 · вопрос 3 · задание 21' },
    { text:true, q:'Найдите предложения, в которых запятая(-ые) ставится(-ятся) в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1) На Южном побережье Крыма находится гора Аю-Даг. (2) Она возвышается на 577 метров и своими очертаниями напоминает медведя, который склонился к морю попить воды. (3) По своему строению Аю-Даг --- это необразовавшийся вулкан с магматическим ядром внутри. (4) Около 150 миллионов лет назад здесь началось извержение, однако давление расплавленных пород оказалось невелико --- поверхность земли лишь поднялась шапкой над разломом. (5) Со временем на Медведь-горе стали расти низкорослые кустарники и сосны, в наши дни на склонах можно увидеть заросли реликтового можжевельника высокого. (6) В 1974 году Аю-Даг признали охраняемой природной территорией, здесь обитают 16 видов краснокнижных животных и 44 вида редких растений.', a:['56'], src:'Работа №1 · вопрос 4 · задание 21' },
    { text:true, q:'Найдите предложения, в которых тире ставится в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1) Считалось, что мировое древо --- самая важная точка пространства, поэтому находится оно в центре всего мироздания и выполняет роль оси. (2) Само дерево состоит из трех ярусов, каждый из которых ассоциируется с частью мира: ветви простираются до самого неба и символизируют небесный престол, ствол --- это земной мир, а корни уходят глубоко и связаны с подземным царством. (3) К каждой части относились существа, обитающие на древе или у его подножия. (4) В ветвях, согласно верованиям, сидели мифологические или реальные птицы. (5) Средняя часть была связана с оленями, коровами, лосями --- различными видами копытных животных. (6) Позже в славянских поверьях место в центре отводилось человеку. (7) Корни символизировали прошлое, ствол --- настоящее, а крона --- будущее.', a:['12'], src:'Работа №1 · вопрос 5 · задание 21' },
    { text:true, q:'Найдите предложения, в которых двоеточие ставится в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1) Древние представления о мировом древе дошли до наших дней в фольклоре. (2) В магических словах, которые читали во время обрядов, упоминались различные деревья: дуб, кипарис, яблоня или береза. (3) Тот, кто произносил заговор, как бы отправлялся в путешествие к центру мира, и его воображаемый путь лежал через море-океан на остров, где и росло заветное дерево. (4) В заговорах также упоминалось: на древе «сидят» Богоматерь, Илья-пророк, Христос, архангел Михаил, а у подножия или в корнях собираются бесы, змеи и другие нечистые создания. (5) В славянской мифологии идея мирового древа соединилась с представлениями о древе жизни. (6) В средневековых литературных источниках они связаны с библейскими мотивами о рае, которые описаны, например, в Книге Бытия: «И произрастил Господь Бог из земли всякое дерево, приятное на вид и хорошее для пищи, и дерево жизни посреди рая...» (7) Из библейских сюжетов в фольклор пришел мотив особых плодов древа: съевший их, по поверьям, становился бессмертным. (8) После изгнания Адама и Евы из рая древо жизни стало недоступным: его охранял херувим с огненным мечом, и никто не мог добраться до плодов. (9) Представления о мировом древе отразились и в декоре бытовых предметов; многие узоры считались оберегами от несчастий или символами-заклинаниями: верили, что они защищают от безвременной гибели, болезней и старости, а также сулят благосклонность высших сил.', a:['4789'], src:'Работа №1 · вопрос 6 · задание 21' },
    { text:true, q:'Найдите предложения, в которых запятая(-ые) ставится(-ятся) в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1) В фольклоре и магических обрядах с мировым древом соотносится дуб --- самое почитаемое дерево у славянских народов. (2) В сказках встречается мотив чудесного дуба: он вырос до неба, по нему старик взобрался на небосвод и нашел там птицу, которая в огне не горит и в воде не тонет. (3) По поверьям, именно дубы существовали еще до сотворения мира. (4) На дубах или рядом с ними, по древним представлениям, обитали мифологические персонажи. (5) Представление о древе жизни проникло в обряды и суеверия. (6) В Тульской губернии люди искали в лесах старые дубы. (7) С веток снимали кору, вымачивали ее в ключевой воде, а затем носили при себе в ладанках. (8) Древние дубы со сквозным отверстием в стволе, например, следом от удара молнии, тоже считались особенными. (9) Больных детей, например, трижды проносили через эту дыру.', a:['3489'], src:'Работа №1 · вопрос 7 · задание 21' },
    { text:true, q:'Найдите предложения, в которых тире ставится в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1) Образ змеи сочетал противоположные сущности --- положительные и отрицательные начала. (2) Змей боялись, и, если человек умертвил гада, такой поступок считали подвигом, так как пресмыкающееся --- воплощение дьявола на земле. (3) «Кто змею убьет, тому прощается 40 грехов. Это поощрение, конечно, изобретено бабами, которые боятся змей», --- писал этнограф Владимир Даль. (4) В то же время в фольклоре их упоминали как защитников. (5) Во многих местностях считали домашними покровителями ужей, такие мифологические представления пришли из глубины веков. (6) Верили, что уж в доме --- это счастливый знак. (7) Якобы он отгонял ядовитых змей, истреблял лягушек и охранял скот. (8) В ужа мог обращаться хранитель избы, домовой. (9) Убийство домашней змеи считалось грехом: если убить змея-самца --- умрет хозяин, если самку --- хозяйка.', a:['26'], src:'Работа №1 · вопрос 8 · задание 21' },
    { text:true, q:'Найдите предложения, в которых двоеточие ставится в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1) К гадам или погани в разных местностях относили разных существ: червей и гусениц, стрекоз и комаров, улиток и мышей, кротов и даже волка. (2) Но чаще всего так называли змей, ящериц, жаб и лягушек, некоторых рыб c извилистыми телами тоже причисляли к гадам. (3) Этнограф Михаил Забылин отмечал, что в народе говорили: «Есть его можно, когда в семи городах рыбы нет, а на дворе Масленица». (4) Еще гадами именовали фантастических персонажей, например летающего змея. (5) Таких существ считали нечистыми дьявольскими созданиями. (6) Их объединяла хтоническая, подземная природа: в земле гады рождаются, живут и зимуют. (7) Поверья связывали их с колдунами и ведьмами: якобы они подмешивали порошок из высушенных земноводных в еду и питье, чтобы навести порчу. (8) Эти представления отразились в фольклоре: сказочная Баба-яга варила в котлах жаб, ящериц и змей, ела их мясо и добавляла его в зелья. (9) Крестьяне верили, что ведьмы и колдуны знали по именам каждую змею, могли собрать их вместе, навсегда изгнать из селения или сделать безвредными.', a:['678'], src:'Работа №1 · вопрос 9 · задание 21' },
    { text:true, q:'Найдите предложения, в которых запятая(-ые) ставится(-ятся) в соответствии с одним и тем же правилом пунктуации. Запишите номера этих предложений.', context:'(1) Люди верили, что змеи могут одаривать магическими предметами или способностями --- целебным растением, которое оживляет мертвых, или волшебной разрыв-травой, открывающей замки. (2) В фольклоре, в сказках и былинах, змей обычно противостоял главному герою. (3) Многоголовое чудище похищало девушек или требовало их на съедение от жителей осажденного города. (4) Змеи упоминались и в быличках --- так называют жанр фольклора, в котором «очевидцы» рассказывают, как увидели нечистую силу или стали свидетелями фантастических явлений. (5) В них описывали и встречи с лесными гадами. (6) Например, считалось, что 27 сентября, на праздник Воздвижения Креста Господня, нельзя ходить в лес. (7) В это время змеи особенно активны, они готовятся уходить в землю на зимнюю спячку. (8) Человек, который нарушал запрет, попадал в змеиное царство, и ему грозила опасность. (9) Двойственное отношение к пресмыкающимся отразилось в представлениях об их огненной и водной природе: змеи, как и другие гады, связаны с суевериями о дожде.', a:['1468'], src:'Работа №1 · вопрос 10 · задание 21' },
  ],
  22: [
    { match:true, q:'Установите соответствие между предложениями и названиями изобразительно-выразительных средств языка.', errors:['А) …душе, проявлению Бога, не свойственно ни вещество, ни пространство, ни движение, ни время. (Л. Н. Толстой)', 'Б) Какое лето, что за лето! Да это просто колдовство… (Ф. И. Тютчев)', 'В) Я духом бодр и жив, Я телом здрав. (Н. А. Некрасов)', 'Г) Товарища в беде не поддержать, Во чьё-то горе обратить забаву, В труде схитрить. Солгать. Обидеть мать. С недобрым другом поравняться славой… (А. Т. Твардовский)', 'Д) Здесь дремлют тёмные дубравы По скатам горных берегов… (Н. М. Языков)'], sentences:['1) риторическое обращение', '2) многосоюзие', '3) бессоюзие', '4) анафора', '5) олицетворение', '6) риторический вопрос', '7) парцелляция', '8) сравнение', '9) риторическое восклицание'], a:'29475', sourceText:'(1)Сороковые послевоенные годы. (2)Голодные годы. (3)Лавина искалеченного войной люда, разного вида нищих, малых и старых, кочующих по стране. (4)Нищие ходили по железнодорожным вагонам со своим репертуаром и всяческими обращениями к победившему народу. (5)Из множества нищих в памяти моей застрял один необычный бессловесный «обрубок». (6)Расскажу уж по порядку, как полагается. (7)После побега из детприёмника главной целью моей было возвращение на родину, в Питер. (8)Пытаясь добраться туда, я кочевал по поездам. (9)В том поезде я мирно спал, привязавшись ремнём к металлической трубе, чтобы меня ночью не сдвинули с полки. (10)Поезд приближался к станции Остров. (11)Позднее осеннее солнце вдруг осветило потолок вагона и заставило меня проснуться. (12)Отвязав себя от трубы, посмотрел вниз. (13)Вторые полки ещё спали, но нижние – женщина и девушка – встали уже, явно готовясь сойти в Острове. (14)Мой взгляд застрял на девушке красоты необыкновенной. (15)Так мне показалось. (16)А может быть, виновато солнце, которое светило прямо на неё. (17)Она сидела против окна, спиной ко входу, на чемодане, зачехлённом холстиной с латунными пуговицами от шинели, и ела картошку из капустного листа с огурцом и хлебом. (18)Её русые волосы, заплетённые в косички, золотились утренним солнцем. (19)Мне запомнилась очень красивая высокая шея и светящиеся на солнце ушки с маленькими прозрачными серьгами-слезинками. (20)Матушка её, отвернувшись от стола, что-то вынимала или, наоборот, складывала в свою сумку и была этим чрезвычайно занята. (21)Напротив – на боковых полках – ещё спали, закрывшись от солнечного света. (22)Вдруг в нашем проёме показалась огромная фигура «обрубка», одетого в военную форму. (23)За подол стираной гимнастёрки безрукого держался совсем маленький пацан-поводырь. (24)Голова солдатика-великана была расколота по диагонали, да так страшно и безжалостно, что смотреть на неё было невозможно, а уж я повидал в своей жизни к этому времени! (25)Шрам, если это можно было назвать шрамом, проходил щелью почти от правого виска вниз через всё лицо, уничтожив нос, то есть соединив рот и нос в одно отверстие с остатками лохматых губ. (26)Сдвинутые, но живые куски мяса – разбитые глазницы, правого глаза не было. (27)Война. (28)Это было воистину лицо войны. (29)Только случайность или Господь Бог и молодость оставили этого парня жить. (30)Более страшного живого человека я никогда не видел. (31)Вместо рук у него торчали «колбаски»-обрубки: в войну некогда было, поэтому резали, а кожу натягивали. (32)На шее болталась дощечка с надписью: «Подайте инвалиду войны». (33)Он, очевидно, не мог говорить, а лишь мычал: во рту болтались только ошмётки языка. (34)Никто его не видел и не слышал, кроме меня. (35)Он стоял на широко расставленных ногах, чуть подавшись туловищем вперёд, напротив не видящей его девчонки и смотрел своим уцелевшим глазом на её замечательно освещённую головку. (36)Вдруг он решительно взмахнул своим правым обрубком, сделал шаг к столу, резко нагнулся со своего высока и лохмотьями губ поцеловал шейку девушки. (37)Она, оглянувшись, вскрикнула страшным, каким-то испуганным криком, будто у неё внутри рвануло. (38)Её затрясло. (39)Матушка, онемев, побледнела и вжалась в угол полки. (40)А из его глазниц вдруг что-то рухнуло. (41)Слеза. (42)Мне показалось, что я слышал звук падающей слезы. (43)Этого не могло быть, поезд шёл быстро и шумно, но в голове у меня остался этот звук, мне показалось, что я слышал, как его слеза разбилась о нечистый пол нашего деревянного вагона. (44)Поводырь-пацан потянул «обрубка» за подол гимнастёрки и оттащил его от трясущейся в ознобе девушки. (45)Поезд прибыл на станцию Остров. (46)Они вышли: один огромный, другой неправдоподобно маленький, словно кто-то всё это срежиссировал. (47)Сошли в абсолютно разрушенном городе. (48)У вокзала не было крыши, а сам вокзал был заполнен безрукими, безногими, палёными, ослепшими… (49)Эта жуть до сих пор у меня в глазах. (50)Брейгель какой-то – и на Руси. (51)Шёл мокрый снег… (По Э. С. Кочергину*, текст адаптирован Ю. Ф. Генераловой) *Эдуард Степанович Кочергин (род. 1937) — советский и российский театральный художник, писатель.', src:'Вариант 1 · задание 22' },
    { match:true, q:'Установите соответствие между предложениями и названиями изобразительно-выразительных средств языка.', errors:['А) Ещё поля не засевали, ещё сады не зацветали... (К. А. Некрасова)', 'Б) **Н**аливавших в би**д**о**нн** **н**а**д**ои, Моло**д**ых, бе**д**овых **л**а**д**оней… (А. А. Вознесенский)', 'В) Там медленно, скрипя, тащится ряд возов, Тяжёлый груз снопов везущих... (В. А. Жуковский)', 'Г) Мать ждала для дочери венчанья, а досталось дочери молчанье... (Я. В. Смеляков)', 'Д) Как гулкий колокол набата, Неистовствовал соловей. (Б. Л. Пастернак)'], sentences:['1) ассонанс', '2) анафора', '3) метонимия', '4) антитеза', '5) сравнение', '6) эпифора', '7) инверсия', '8) аллитерация', '9) метафора'], a:'28745', src:'Вариант 2 · задание 22' },
    { match:true, q:'Установите соответствие между предложениями и названиями изобразительно-выразительных средств языка.', errors:['А) Мир гол и пуст, и я не тот, что прежде. Вот жизнь прошла, а где её следы? (Ю. П. Кузнецов)', 'Б) …и, песню без слов напевая, ходил По пеплу, по праху, по грядкам могил… (Б. Б. Рыжий)', 'В) Вспомним всех поименно, горем вспомним своим... (Р. И. Рождественский)', 'Г) На полустанке я вышел. Чугун отдыхал В крупных шарах маслянистого пара. (А. А. Тарковский)', 'Д) Пылай, великая Москва! (А. С. Пушкин)'], sentences:['1) риторическое обращение', '2) парцелляция', '3) многосоюзие', '4) анафора', '5) градация', '6) вопросно-ответная форма изложения', '7) риторический вопрос', '8) лексический повтор', '9) метонимия'], a:'75891', sourceText:'(1)Пристрастился Тимоша Есаулов стругать: попала ему в руки чурка, на корабль похожая. (2)Он кухонным ножом подровнял её немного, мачты приладил – получилась каравелла. (3)Показал Тимоша каравеллу деду Аггею. (4)Дед всегда у своего дома на завалинке сидит, корзины плетёт. (5)Он в войну у фашистов в плену был, там его искалечили: ноги у него отнялись, не ходят. (6)Дед Тимошкину каравеллу похвалил: – (7)Чистая работа! (8)Одно слово – модель! (10)С того дня Тимоша всё стругал да стругал, целая флотилия уже на окне стоит. (11)Валька Кудинов всё к Тимоше пристаёт: «Давай меняться! (12)Давай меняться!» (13)Уж чего он только за эти корабли не сулил, даже радиоприёмник на батарейках. (14)В один день Тимоша увидел на улице всех пацанов, сгрудившихся вокруг Вальки, важно дававшего пояснения: – (15)Это научное достижение! (16)Ещё никто в мире не мог вырастить лягушонка в пузырьке! (17)Может, я этого научного лягушонка в Москву повезу – мне премию дадут и по телевизору покажут! (18)А, резчик-позолотчик! – увидел он Тимошку. – (19)Иди смотри! (20)Это тебе не чурочки стругать. (21)Он протянул Тимоше плоский пузырёк из-под одеколона. (22)Там, распластавшись в мутной тесноте, сидел маленький серый лягушонок с тоненькими прозрачными лапками. – (23)Ух ты! (24)Как же ты его туда засадил? – Васька Калмыков спрашивает. – (25)Ха! – отвечает Валька. – (26)Тут научное достижение: я в пузырёк махонького головастика затолкал, а уж он там сам вырос. (27)Я, конечно, воду менял, подкармливал его… – (28)Вот у человека терпение! – говорит Васька. – (29)Это ж надо: и воду менять, и подкармливать. – (30)Ещё бы! – отвечает Валька. – (31)У меня, может, десять головастиков в пузырьках сидели, да все передохли, а этот вот выжил. (32)Значит, эксперимент получился. (33)Все мальчишки после таких научных слов даже замолчали. – (34)Ловко! – сказал Тимоша и пошёл обратно к деду на завалинку. – (35)Там Валька научного лягушонка показывает, в пузырьке вырастил! – (36)И он рассказал деду про Валькин опыт. – (37)Сидит, значит, – вздохнул дед и примолк. (38)Он не удивился, не похвалил Вальку за терпение. (39)И пруток в его больших пальцах вдруг хрустнул и сломался. (40)Тимоша посмотрел на дедовы ноги и подумал о лягушонке, бледном, прозрачном и совсем на лягушонка не похожем. (41)Лягушонкины товарищи в пруду скачут, а этот сидит и не может ни поплавать, ни попрыгать… (42)Он представил, что это они с дедом Аггеем сидят вот так, распластавшись, в душной горячей прозрачной банке. (43)Чьи-то огромные глаза приближаются и рассматривают их, потом встряхивают, и они больно ударяются о стенки пузырька и от боли двигаются. (44)И вдруг его как током ударило: обменять! (45)Обменять на коллекцию! (46)Он кинулся снимать с подоконника корабли, а перед глазами у него так и стояли прозрачные лапки лягушонка на грязном стекле. – (47)Он его в пузырёк! (48)Живого в пузырёк! – приговаривал Тимоша. (49)Корабли не помещались у него в руках и падали на землю. – (50)Корзинку возьми, – сказал дед Аггей каким-то странным голосом, словно хотел ещё что-то добавить. (51)Ребята всё толпились у кудиновского дома. – (52)Что просишь – не знаю, – выдохнул Тимоша, – эту вещь меняю. (53)По древним мальчишеским законам после этого нужно было обязательно меняться. – (54)Это же научный лягушонок! – Валька покраснел от досады, потому что знал: мальчишки сейчас могут и поколотить за нарушение неписаного закона. (55)Но обмен мог ещё и не состояться, если предложения были бы не равноценными. – (56)Что даёшь? – (57)Коллекцию! – (58)Меняю! – Валька уже опасался, как бы обмен не расстроился. (59)Тимоша схватил пузырёк и, отбежав на порядочное расстояние, закричал: – (60)Эй вы! (61)Вас бы так в пузырёк! (62)Для науки! (63)Живых в пузырёк! (64)Живодёры чёртовы! (65)Тимоша забежал в проулок; лягушонок в пузырьке был совсем неподвижен. – (66)Ты чего? – сказал Тимоша. – (67)Ты не умирай! (68)Я к Антипу побегу, к дедову сыну. (69)Он в мастерских, у него стеклорез… (70)Я мигом, ты не умирай только! – Тимоша припустил по раскалённой степной дороге. (71)В мастерских обедали. – (72)Антипушка, вот! – задохнувшись, сказал Тимоша и поставил пузырёк на стол. (73)Антип отложил ложку и стал рассматривать лягушонка; тут и Валькин отец сидел: – (74)Ишь ты! – сказал он, беря в руки пузырёк. – (75)Как же это ты его туда засадил? – (76)Вот ребятня! – сказал отец Христи. – (77)Чего только не удумают! – (78)Акселерация! – сказал старший механик. – (79)Антипушка! – едва отдышавшись, взмолился Тимоша. – (80)Вынь ты его оттуда, он же живой! (81)Это Валька его туда головастиком ещё затолкал, он и вырос в неволе! (82)Сидит, как дед Аггей в плену сидел! – Тимоша не выдержал и шмыгнул носом. (83)За столом стало тихо. – (84)Живодёр! – сказал Валькин отец и брякнул ложкой о стол. – (85)А я-то, дурак, обрадовался было… – (86)Он словно извинялся перед товарищами. – (87)Ну погоди, я ему вложу ума вечером. – (88)Ума ему не надо! – сказал деревянным голосом Антип. – (89)Ума у него в достаточности… (90)Он принёс из мастерской стеклорез и осторожно отрезал горлышко у пузырька. (91)Лягушонок выпал на сухие доски стола, Антип осторожно взял жидкое тельце и опустил его в блюдце с водой. – (92)Ну поплыви! Поплыви! – умолял Тимоша. (93)И лягушонок, словно услышав, сделал слабое движение ногами, оттолкнулся. – (94)Живой! – заулыбались все. – (95)А вот, на-ко! – сказал Антип и положил перед Тимошей свой замечательный складной ножик. – (96)За науку следует, – сказал отец Христи. – (97)Что вот, значит, такой поворот мыслям дал, на жалость. (98)Антип раскрыл лезвия и легонько ткнул Тимошу в руку, по старому казачьему обычаю, чтобы подаренный нож не причинил никому зла. (По Б. А. Алмазову*, текст адаптирован Ж. В. Афанасьевой) *Борис Александрович Алмазов (род. 1937) — советский и российский писатель, журналист, искусствовед, бард, педагог, общественный деятель.', src:'Вариант 3 · задание 22' },
    { match:true, q:'Установите соответствие между предложениями и названиями изобразительно-выразительных средств языка.', errors:['А) Колыхаясь еле-еле Всем ветрам наперерез, Птицы лёгкие висели, Как лампады средь небес. (Н. А. Заболоцкий)', 'Б) …С свинцом в груди и жаждой мести, Поникнув гордой головой. (М. Ю. Лермонтов)', 'В) Нелюдимый скалистый простор… (И. В. Елагин)', 'Г) Где-то грядки красные партера, Пышно взбиты шифоньерки лож... (О. Э. Мандельштам)', 'Д) …обеды задаёт он отличные… (И. С. Тургенев)'], sentences:['1) сравнение', '2) бессоюзие', '3) инверсия', '4) анафора', '5) эпитет', '6) метонимия', '7) парцелляция', '8) аллитерация', '9) метафора'], a:'16593', sourceText:'(1)Польза, конечно. (2)Воздух, например, – все городские люди ссылаются на этот воздух, и всегда с одинаково восклицательной интонацией или же в ужасных поэтических выражениях. (3)«Напоённый» чем-то там. (4)«Ароматами трав». (5)«Целебным настоем сосны» – как вам? (6)«Медвяным духом полей»… (7)Всё это ложь и парфюмерия, так же как и все эти наши шезлонги, вынесенные на солнышко, кофеи на веранде с окнами, распахнутыми, понимаешь ли, в сирень, пикниками на курчавой травке, хорошо построенными мангалами, спиралями от комаров. (8)Всё это – попытка уговорить и заговорить то непонятное, страшное, шумящее – или молчащее; дующее в лицо – или приблизившееся и вставшее за спиной. (9)То, что отгоняешь, то, что непременно придёт. (10)Звёздное небо придёт и ляжет; душе страшно от звёздного неба. (11)Но сначала мир потемнеет и отсыреет, отступит, и замолчит, и уйдёт в себя. (12)Лютики там какие-нибудь, – это они днём лютики, это они в детских песенках лютики, а ночью-то, а на самом деле-то они кто? (13)И в чём их собственный, немой, для себя самих, смысл? (14)Не в том ведь, чтобы позировать для портрета на эмалированном чайнике? (15)А трава? (16)А розы? (17)Ведь они нас не любят, розы; им даже не плевать на нас, им никак, им всё равно, это мы водим вокруг них хороводы, – два притопа, три прихлопа, – мы, забывшие язык природы, не знающие её цели… (18)Подстричь газон. (19)Зажечь тусклые садовые фонари. (20)Запереть калитку, спустить собаку, отгородиться от всяких тут подозрительных людей; накопить денег на высокий кирпичный забор и охрану. (21)Не поможет: никуда не скрыться от травы, от беззвучного рёва звёзд, от розы, делающей своё непонятное дело. (22)Да ведь ради них вы и покупали дачу, волновались, торговались, досадовали, выясняли и торжествовали. (23)Будем воздухом дышать! (24)Свежим воздухом! (25)К природе поближе, к букашкам! (26)Мы бежим из городов, бежим прочь от замученности, от скученности... (27)Бежим далеко, в бесконтактные поля, в безответные луга, добегаем до белого дома у синего моря: вот где мы хотим жить! (28)Чтобы и поэзия с кокосом, и пляж с полотенчиком! (29)А вечером… забыть весь этот подступающий ужас, не смотреть на страшное, забыть про гулкий звёздный храм, про жуткий шорох морей, про оцепенение гор, забыть, что висишь на тонкой ниточке, в непоправимом одиночестве, в пустыне природы, и что ни жук тебе не друг, ни кальмар не товарищ. (30)Господь вызывает человека, жалкую и возлюбленную тварь свою, на переговоры в пустыню. (31)Господь выходит из сумерек и стоит у нас за спиной. (32)Господь назначает нам свидание с лютиком – оглушительное свидание без слов, глаза в глаза. (33)Господь ложится травой под ногами, дует ветром, лает собакой, бьёт волной о берег, бежит облаком, снится сном, льётся вином. (34)Остальное – тайна переговоров. (По Т. Н. Толстой*, текст адаптирован Е. В. Колбасовой) Татьяна Никитична Толстая (род. 1951) – российская писательница, телеведущая, публицист и литературный критик.', src:'Вариант 4 · задание 22' },
    { match:true, q:'Установите соответствие между предложениями и названиями изобразительно-выразительных средств языка.', errors:['А) О, чьи стопы тебя попрали, Благословенный солнцем край? (В. А. Жуковский)', 'Б) А на дворе – то дождь, то снег. То дождь, то снег – то плач, то смех… (А. А. Галич)', 'В) Ястреб нам крылом врага укажет, Шелестом трава о нём расскажет… (Д. Б. Кедрин)', 'Г) Как солнце вешнее, она блистала… (М. Ю. Лермонтов)', 'Д) Круглый двор с кринолинами клумб… (Д. С. Самойлов)'], sentences:['1) эпифора', '2) многосоюзие', '3) бессоюзие', '4) риторическое обращение', '5) олицетворение', '6) риторическое восклицание', '7) метонимия', '8) сравнение', '9) метафора'], a:'42589', sourceText:'(1)Такого родственного чувства, как к дедушке, я в своём детстве не испытывал даже к родителям. (2)У них были свои дела и заботы, а у дедушки – только я. (3)Разница в возрасте нас не разделяла, а сплачивала – минуя родителей; за их спиной мы как будто обменивались всепонимающими взглядами. (4)И вместе коротали то долгое, сладко-тягучее время детства и старости, внутри которого им, с их спешкой и наставлениями, не было места. (5)Куда нам было спешить, когда в летний ласковый день мы гуляли, взявшись за руки, по солнышку, в который раз осматривая всё тот же повалившийся забор и ржавую бочку? (6)Наша жизнь, не спеша ни к какой цели, наполнялась смыслом сама по себе – высшее благо для тех, кто только начинает или уже заканчивает жить. (7)Мы помогали друг другу почувствовать всю щемящую прелесть ничем не обременённого существования. (8)Мне думалось, что когда дедушка умрёт, то почти вся моя жизнь будет в память о нём, я назову его именем – Самуил – своего сына. (9)Не так это вышло, и даже день его смерти, 13 марта, порой проходит в забвении. (10)Но ощущение горячего дедушкиного присутствия, невидимо охраняющего меня, остаётся во мне прочнее, чем родительское. (11)Ведь отца и мать мы знаем и тогда, когда вырастаем, в их образах уже стёрлась память детства, вытесненная более поздними и сознательными впечатлениями. (12)Дедушка же остаётся всемогущим и всеблагим богом младенчества, когда еще магически воспринимаешь мир, не развенчивая знанием его таинственную одухотворённость. (13)Не случайно наивно верующим Саваоф1 представляется как седобородый старец: они, как внуки, нуждаются в опеке и покровительстве непостижимо превосходящего опыта. (14)И как важно сохранить то чувство благоговения, которое внук испытывает к деду вследствие абсолютной несоизмеримости их опыта! (15)Ведь дед был посвящён в начальную тайну вещей задолго до моего рождения, он создал по своему образу мою маму! (16)Хотя при этом умаляется право «вечного внука» на взрослую самостоятельность, но неизмеримо возрастает его право на самого Бога, его внимание, любовь, попечение. (17)Когда дедушка был жив, я по малолетству преувеличивал его могущество и всеведение; когда же я стал взрослеть, он умер, так и оставшись навсегда за той чертой, где скрывается священное. (М. Н. Эпштейн*) *Михаил Наумович Эпштейн (род. 1950) – российский и американский философ, филолог, публицист.', src:'Вариант 5 · задание 22' },
    { match:true, q:'Установите соответствие между предложениями и названиями изобразительно-выразительных средств языка.', errors:['А) В глухой туман окрестности легли… (А.С. Пушкин)', 'Б) …и **д**о**л**я, и **д**е**л**о, и **д**об**л**есть, и по**дл**ость… (В.А. Соснора)', 'В) Как хорошо! Ты посмотри! В ущелье белый пар клубится… (Н.М. Рубцов)', 'Г) Что нужно, чтобы жить с умом? Понять свою планиду. Найти себя в себе самом И не терять из виду. (А.Т. Твардовский)', 'Д) Увижу ― прибрежные чащи, и море, и парус вдали, и правнука лёгкое счастье, и трудное счастье земли. (Г.С. Семёнов)'], sentences:['1) эпитет', '2) ассонанс', '3) многосоюзие', '4) вопросно-ответная форма изложения', '5) риторический вопрос', '6) аллитерация', '7) парцелляция', '8) сравнение', '9) риторическое восклицание'], a:'16943', sourceText:'(1)Когда на лекциях я спрашиваю: а чем, собственно говоря, дети отличаются от взрослых, ‒ незамедлительно получаю ответ: «Опытом!» (2)Взрослые убеждены, что у них опыт есть, а у детей его нет. (3)А что же имеется у детей? (4)Ничего у них нет в смысле опыта. (5)Имеется у детей наивное, чаще всего нелепое поведение маленьких существ, которые не знают суровых законов нашего взрослого мира. (6)И пока существа эти не познают наши законы, в клуб взрослых их не примут. (7)Когда мы говорим о ком-то: «Он – большой ребенок», мы имеем в виду, как правило, что это, возможно, милый и приятный человек, но совершенно не приспособленный к нашей серьёзной, взрослой жизни. (8)Это устоявшаяся точка зрения. (9)Именно отсутствие у детей опыта и даёт нам твёрдые основания воспитывать детей. (10)Увы, многие взрослые понимают воспитание именно как навязывание ребенку собственного опыта. (11)Наш опыт – это опыт жизни в нашем мире. (12)Свой опыт мы уважаем, принимаем. (13)Поведение детей мы расцениваем как неразумное и глупое лишь потому, что оно не соответствует опыту нашей жизни. (14)Однако если у детей своя жизнь, не разумно ли предположить, что у них свой опыт? (15)Вот как вспоминает детство замечательный современный поэт Сергей Трофимов: (16)У меня под майкой голубок белый, Я с утра сменял его на свой велик. (17)Ох, и будет дома нагоняй, только Нет меня счастливей в эти дни. (18)С точки зрения взрослого человека, поступок, мягко говоря, нелепый: сменять велосипед на голубя. (19)Велосипед дороже голубя, потому что стоит денег. (20)Логика понятна. (21)С точки зрения ребенка, живой, трепещущий голубь гораздо интереснее, чем механический велосипед. (22)Голубь дороже велосипеда, потому что живой. (23)Непонятная логика. (24)Логика взрослых нам ближе и ясней. (25)Но можно ли с уверенностью утверждать, что в данном случае в поведении ребенка нет совсем уж никакой логики? (26)Есть. (27)Только она нам неблизка и непонятна. (28)Уверен, что мы все признаём: мир, который построили взрослые, мягко говоря, несовершенен. (29)И тем не менее в клуб взрослых принимают только тех, кто понял законы этого мира – небезупречные, часто самоубийственные, нередко циничные… (30)Итак, какова же позиция у нас, взрослых? (31)Она элементарно проста. (32)Дети должны учиться у нас. (33)Мы должны учить детей. (34)Мы должны их воспитывать, передавая собственный опыт. (35)Худо ли, бедно ли создали мы свой мир, нашим детям жить в нём, и они должны подчиняться его законам. (36)О том, чтобы взрослым учиться у детей, речи нет. (37)Но разве детские навыки, их опыт не могут пригодиться и нам? (38)Скажем, их опыт взаимоотношения с природой? (39)Их навыки верить в предлагаемые обстоятельства, которые мы высокомерно называем игрой? (40)Или их бескомпромиссность? (41)Дети не любят выискивать вторые смыслы. (42)Они гораздо конкретнее взрослых, и такая конкретность делает общение с ними более понятным и, если угодно, более приятным. (43)Мальчика спросили: (44)– Кем ты хочешь быть, когда вырастешь? (45)Мальчик ответил: (46)– Волшебником. (47)Все расхохотались. (48)Мальчик удивился: (49)– Когда я вырасту, я, скорее всего, буду работать в банке, как папа. (50)Но вы же спросили, кем я хочу быть! (51)Казалось бы, такой манере общения не грех бы и поучиться… (52)Дети воспринимают мир в чёрно-белых цветах.(53)Они делят мир на своих и чужих. (54)Скажем, когда в споре ученика с учителем родитель встаёт на сторону учителя – он сразу становится для ребенка чужим. (55)И учителя ребенок оценивает именно так: свой или чужой, понимающий или непонимающий… (56)Делить мир на своих и чужих? (57)Не замечать оттенков? (58)В каждом вновь встреченном видеть своего или чужого? (59)Да, в нашем взрослом мире это всё не работает. (60)Мы понимаем про оттенки. (61)Мы считаем нормальным манипулировать людьми, а то и использовать их. (62)Всё так. (63)Мы построили такой мир и такую жизнь. (64)Для детей общение со взрослыми естественно, для взрослых общение с детьми – это некий процесс, требующий едва ли не усиленной теоретической подготовки. (65)Мы к этому привыкли. (66)И воспринимаем как норму… (67)Поверьте, я далек от того, чтобы идеализировать детей. (68)Дети – это люди. (69)И как люди любого возраста, они бывают добрые и злые, более циничные и менее, умные и не очень… (70)Они – разные. (71)Но я против того, чтобы считать, будто дети отличаются от взрослых тем, что у них нет опыта. (72)Я против взрослого убеждения, что нам нечему учиться у детей. (73)У детей свой (увы, чаще всего непригодный для построенной нами жизни) опыт. (74)Но он есть. (75)Как минимум он нуждается в том, чтобы его уважали. (76)Как максимум – в том, чтобы его перенимали. (77)И если взрослый человек открыт детям, он способен многому у них научиться. (78)И многое понять в самом себе, отражаясь в зеркале детства. (По А. М. Максимову*, текст адаптирован И. А. Шигиной) *Андрей Маркович Максимов (р. 1959) – современный писатель, телеведущий, автор книг по психологии общения.', src:'Вариант 6 · задание 22' },
    { match:true, q:'Установите соответствие между предложениями и названиями изобразительно-выразительных средств языка.', errors:['А) Ну что за шейка, что за глазки! (И.А. Крылов)', 'Б) И трепещет, как дивная птица, Голос твой у меня над плечом… (А.А. Ахматова)', 'В) Так Людмила жизнь кляла, Так творца на суд звала… (В.А. Жуковский)', 'Г) Высокие стоят морозы. Далёкие скрипят обозы... (И. Северянин)', 'Д) На меня наставлен сумрак ночи Тысячью биноклей на оси… (Б.Л. Пастернак)'], sentences:['1) антитеза', '2) парцелляция', '3) риторическое обращение', '4) анафора', '5) олицетворение', '6) риторическое восклицание', '7) гипербола', '8) сравнение', '9) синтаксический параллелизм'], a:'68497', sourceText:'(1)Тогда я был молод, кудряв, легкомыслен и удачлив, и девочки кокетничали со мной напропалую. (2)Наверное, как все в этом прекрасном возрасте, я совершал ошибки, и ошибок было много, но лишь теперь осмеливаюсь в них признаться. (3)Когда я появился впервые в сельской школе, все ахнули: на груди моей сверкал университетский значок! (4)Время было трудное: года четыре, как закончилась война. (5)Дипломированных учителей не хватало. (6)И вот в эту маленькую, неказистую школу приехал человек, окончивший столичный университет, фи-ло-лог! (7)Однажды подошёл ко мне кто-то и предложил выступить с лекцией перед колхозниками. (8)Я очень удивился, что ко мне подходят с такими пустяками, но отказать было нельзя, тем более что лекция намечалась через месяц. (9)Перед отъездом в область мне подарили только что вышедшую книгу «Пушкин в воспоминаниях современников». (10)И вот, вспомнив об этой книге, я сказал, что буду читать, пожалуй, лекцию о Пушкине, о его жизни, и называться лекция будет: «Частная жизнь Александра Пушкина». (11)Шло время. (12)Иногда на глаза мне попадалась эта проклятая книга, и тусклое, едва уловимое желание перелистать её страницы овладевало мной, но лишь на одно мгновение. (13)Наконец в один прекрасный день рука моей фортуны почтительно постучала в мою дверь, и я не смог уловить в том стуке дружеского предостережения. (14)У крыльца стояли колхозные сани. (15)Настроение у меня было превосходное. (16)Не было ни страха, ни даже волнения. (17)В извечном поединке меж «слыть» и «быть» верх одерживало первое. (18)О мой дорогой университетский значок, соединение белого, синего и золотого! (19) Как я любим и почитаем! (20)Лошадка бежала резво. (21)Страха не было. (22)Замечательная книга покоилась на моих коленях, тяжёленькая, плотненькая такая – источник вдохновения, кладовая успеха и славы... (23)В большой старой бревенчатой избе размещался колхозный клуб, на лавках сидели мои слушатели. (24)Были старики и дети. (25)Было много молодых людей. (26)На нехитрой сцене стоял длинный стол, покрытый красной выцветшей материей. (27)За столом в одиночестве сидел председатель колхоза. (28)О мой дорогой университетский... (29)Страха не было. (30)– Ну вот, – сказал председатель, когда я легко взлетел на подмостки, сейчас наш дорогой учитель расскажет нам о частной жизни Александра Сергеевича Пушкина. (31)И, оборотившись ко мне: «Часика в полтора уложитесь?» (32)– Кто его знает, - улыбнулся я, – во всяком случае, буду стараться. (33)Я встал за кафедру. (34)Страха не было. (35)– Пушкин – великий русский поэт! – воскликнул я легко, вдохновенно и страстно. (36)Все со мной были согласны. (37)Глядели на меня не отводя глаз, как с семейной фотографии. (38)«Отчего это я трясусь?» – подумал я. (39)Я с ужасом даже сейчас вспоминаю эту минуту: страх охватил меня, страх, которого я не испытывал даже на фронте: о чём говорить дальше? (40)Если бы передо мной лежал хотя бы маленький, ничтожный клочок измятой линованной бумаги и если бы на нём, пусть вкривь и вкось, нелепым почерком, неразборчиво было бы написано, набросано, едва угадывалось бы то, что я вычитал когда-то из этой проклятой книги! (41)Но передо мной была наклонная потёртая доска замечательной кафедры, и на ней лежала молчаливая книга, тяжёлая, словно камень на шее. (42)Я посмотрел на часы: прошло полторы минуты... (43)– Однажды, – сказал я, крепко держась рукой за кафедру, – молодой Пушкин... где-то на юге влюбился... кажется, в цыганку... (44)Она была к нему равнодушна, и он, разозлившись, пробежал по жаре двадцать четыре километра... – слушали меня внимательно, – не метра, а километра... (45)Стояла тишина. (46)– Двадцать четыре километра! – выкрикнул я. – Представляете?.. (47)Собравшиеся молчали. (48)Я посмотрел на часы – прошло две минуты. (49)Кто-то робко кашлянул... (50)О, если бы он раскашлялся как следует и надолго! (51)Но в клубе стояла тишина. (52)– Или, например, такой случай, – сказал я не своим голосом... (53)«Какой случай? Какой случай?» – загудело в голове. (54)Проклятая замечательная книга лежала передо мной, и мои бледные трясущиеся пальцы впились в неё с последней надеждой. (55)Внезапно я наткнулся на имя Натальи Гончаровой. (56)Вспыхнул ослепительный свет. (57)– Пушкин был женат на Наталье Гончаровой! – воскликнул я. – (58)Перед самой женитьбой он встретился с цыганкой Таней... нет, Стешей... (59)И тут они... (60)«Что они? Что они?..» (61)Я посмотрел на часы – прошло четыре минуты. (62)–Вы, наверное, не знаете, наверное, не знаете... (63)«Чего не знаете? Чего не знаете?..» – (64)Царь сослал его в село Михайловское... нет, сначала он сослал его в Одессу, где губернатором был граф Воронцов. (65)Воронцов Пушкина не любил и послал его на саранчу... (66)Когда саранча собирается в большом количестве... когда саранча собирается в большом количестве... (67)Я попытался незаметно отвинтить университетский значок, но не смог, хотел перевернуть страницу книги, но книга не открывалась вообще. (68)Я посмотрел на свои часы – прошло семь минут. (69)Никто не подозревал, как я мечтал, чтобы пол под моими ногами разверзся, чтобы пламя охватило бревенчатый клуб, чтобы кто-нибудь крикнул: «Волки!» – и все бросились бы к окнам, а я сказал бы: «Ну, знаете, в такой обстановке...» (70)– Может быть, будут какие-нибудь вопросы? – спросил я у задумчивого председателя как можно спокойнее. (71)– Вы уже закончили? – спросил он без тени удивления. (72)– Да, пожалуй, и всё, – сказал я, не слыша собственного голоса. (73)«Хоть бы они бросились на сцену и убили меня!» – подумал я. (74)– Ну что же, если нет вопросов, давайте поблагодарим товарища учителя, – и зааплодировал. (75)Его вяло поддержали. (76)А этот молодой, кудрявый, удачливый, с новёхоньким университетским значком на груди оглядел зал торопливо, по-заячьи, и его молодые губы дрожали, и пальцы не слушались. (77)Как я очутился на улице, никто не успел заметить. (78)Шестикилометровый обратный путь лежал через овраги и перелески. (79)Было темно. (80)Вьюжило. (81)Я шёл медленно, меня покачивало. (82)Внезапно послышался скрип полозьев, и колхозные сани догнали меня. (83)– Велено домой доставить, – весело сказал бородатый возница, – садись, учитель. (84)Больно ты на ногу скор… (85)Я уселся в сани и заплакал. (86)...С тех пор прошло много лет. (87)Тогда я был молод, кудряв и удачлив, и, отвинтив, я бросил в снег своё ромбовидное несчастье, синее, белое и золотое. (По Б. Ш. Окуджаве, текст адаптирован А. Е. Митькиной) Булат Шалвович Окуджава (1924–1997) – советский и российский поэт, бард, прозаик и сценарист, композитор.', src:'Вариант 7 · задание 22' },
    { match:true, q:'Установите соответствие между предложениями и названиями изобразительно-выразительных средств языка.', errors:['А) Степям и дорогам Не кончен счёт; Камням и порогам Не найден счёт… (Э. Г. Багрицкий)', 'Б) Идёт слогами речь реки, Рекою речи воздух пахнет… (Ю. П. Мориц)', 'В) Я припомнил это, наблюдая, как вода струится молодая… (Т. Ю. Кибиров)', 'Г) Потек**у**т в изл**у**чине лет**у**чей П**у**рп**у**ром пред**у**тренние т**у**чи. (А. Белый)', 'Д) …Перед козаками показался шинок, повалившийся на одну сторону, словно баба на пути с весёлых крестин. (Н. В. Гоголь)'], sentences:['1) эпитет', '2) аллитерация', '3) бессоюзие', '4) анафора', '5) олицетворение', '6) сравнение', '7) метафора', '8) синтаксический параллелизм', '9) ассонанс'], a:'87196', sourceText:'(1)Юность, молодость – время выбирать главное дело своей жизни. (2)Эта задача для выпускников школ становится, пожалуй, наиважнейшей. (3)Решая её, некоторые идут «от себя», основываясь исключительно на собственных склонностях, а иногда и сиюминутных увлечениях, которые могут через некоторое время сойти на нет. (4)Другие впадают в противоположную крайность, выискивая наиболее престижные, высокооплачиваемые сферы деятельности и мало задумываясь над тем, насколько их собственные способности соответствуют выбранной профессии. (5)В результате и те, и другие переживают стресс и разочарование, ведь разнообразные ресурсы – время и здоровье, усилия и деньги – бывают потрачены зря. (6)Какой же подход будет оптимальным, экологичным, правильным? (7)Где золотая середина? (8)Дадим несколько простых советов, назвав отличительные признаки «правильной» деятельности. (9)При этом «правильной» будем считать не ту, которая принесёт огромные деньги, власть и популярность, а которая станет залогом долговременного счастья, включающего (несомненно, в меру!) и сохранённое здоровье, и семейное благополучие, и творчество, и достаток, и уважение профессионального сообщества. (10)Первое. (11)Вы не просто это делаете хорошо – вы не можете этого не делать. (12)Например, если человек имеет обыденную привычку всё растолковывать, объяснять просто потому, что ему это нравится, иногда даже не к месту, – у него природа учителя, преподавателя, экскурсовода. (13)Молчун, выбравший такую профессию, будет страшно измотан, растрачивая ресурсы говорения, которых природа ему в должной мере не дала. (14)Второе. (15)Вы легко сосредотачиваетесь на этой деятельности и долго не устаёте, вам нравится сам процесс, а не только плоды; даже если не платят за эту работу, вы её всё равно делаете, подчиняясь энергии желания, удовольствия. (16)Так бывает, например, с теми, кто любит разбираться в том, как устроены механизмы, как они работают, как их совершенствовать, как их создавать. (17)Такие люди решают каждый раз увлекательные задачи и получают массу положительных эмоций, это прирождённые инженеры, механики, мастера, и неважно, что они при этом не имеют институтского диплома. (18)Далее. (19)Вы всё время стремитесь совершенствоваться в своей деятельности, и не в силу внешних причин, не из логики борьбы за первенство, а потому что есть внутреннее «горение», радость творить лучше и лучше, поднимаясь над собой прежним. (20)При этом такого профессионала распирает внутреннее желание делиться с другими профессионалами своим опытом, чтобы совершенствовалось само дело, которому они служат. (21)Мы это можем наблюдать среди врачей от бога: их тонкие знания и опыт в диагностике, хирургии, акушерстве передаются не столько по книгам, сколько от человека к человеку; интерны, ординаторы ходят за ними хвостом. (22)Наконец, последнее: это та деятельность, за которую вас ценят другие. (23)Самим нам иногда сложно быть объективными: нам кажется, что то, что мы хорошо делаем, – это просто норма, присущая всем, настолько это для нас привычно, органично. (24)И такая деятельность перестаёт нами цениться, хочется чего-то неизвестного, раскрыть какие-то другие свои таланты, которые нам порой в себе просто мерещатся. (25)Поэтому нужно прислушиваться к голосу тех, кто нас достаточно хорошо знает и хвалит за что-то. (26)Со стороны, как часто бывает, многое виднее, чем изнутри. (27)Многие очарованы блогерами, журналистами, медиафигурами; кажутся себе контактными, мобильными, да и сочинения вроде неплохо пишут – рвутся быть телезвёздами, не меньше. (28)Но стоит задуматься – легко ли Вы пишете на потоке, каждый день, быстро редактируя свои тексты? (29)Получаете ли радость от совершенствования правильности своей речи, при этом уже обладая природной грамотностью и богатой, выразительной речью? (30)Не устаёте ли от постоянной смены впечатлений в поездках, от общения с очень большим количеством людей, выступлений на публику и потока информации, имеющей отношение к совершенно разным областям жизни? (31)Не испытываете ли сильнейший стресс от негативных оценок в свой адрес? (32)И не только сами ответьте на эти вопросы, но и своих родных, учителей, психологов, товарищей попросите оценить себя с этой стороны. (По А. В. Крупчанскому*, текст адаптирован А. Д. Баландиной) *Адриан Вячеславович Крупчанский (род. в 1977 г.) − бизнесмен, писатель, общественный деятель, музыкант.', src:'Вариант 8 · задание 22' },
    { match:true, q:'Установите соответствие между предложениями и названиями изобразительно-выразительных средств языка.', errors:['А) …Ослеплённая публика на стихи наши жалуется, как египтяне на саранчу, коею [которою] небо хотело обратить их на путь истины. (И. А. Крылов)', 'Б) Я к вам пишу случайно; право, Не знаю как и для чего. Я потерял уж это право. И что скажу вам? ‒ ничего! Что помню вас? – но, боже правый, Вы это знаете давно… (М. Ю. Лермонтов)', 'В) Инеем мглы обрисованы скалы дерев… (В. А. Соснора)', 'Г) …По улицам курьеры, курьеры, курьеры... можете представить себе: тридцать пять тысяч одних курьеров!.. (Н. В. Гоголь)', 'Д) Это небо светло и легко, Этот голубь не знает печали, Это солнце стоит высоко И меня заливает лучами. (Ю. П. Кузнецов)'], sentences:['1) вопросно-ответная о форма изложения', '2) многосоюзие', '3) гипербола', '4) анафора', '5) литота', '6) метафора', '7) парцелляция', '8) метонимия', '9) риторическое восклицание'], a:'81634', sourceText:'(1)Отлично помню эту ночь – 29 ноября… (2)Привезли ко мне в больницу в одиннадцать часов ночи девочку лет трёх. (3)Только на конфетных коробках рисуют таких детей – волосы сами от природы вьются в крупные кольца почти спелой ржи. (4)Глаза синие, громаднейшие, щёки кукольные. (5)Но только странная муть гнездилась на дне её глаз, и я понял, что это страх, – ей нечем было дышать. (6)«Она умрёт через час», – подумал я совершенно уверенно, и сердце моё болезненно сжалось… (7)– Сколько дней девочка больна? – спросил я. (8)– Пятый день, пятый, – сказала её мать и сухими глазами глубоко посмотрела на меня. (9)– Дифтерийный круп, – сквозь зубы прошептал я фельдшеру, а матери сказал: (10)– Ты о чём же думала? (11)О чём думала? (12)Пять дней? (13)А? (14)– Дай ей капель, – сказала она и стукнулась лбом в пол, – удавлюсь я, если она помрёт. (15)– Каких же я капель дам? (16)Девочка задыхается, горло ей уже забило. (17)Ты пять дней морила девчонку в пятнадцати верстах от меня. (18)А теперь что прикажешь делать? (19)– Тебе лучше знать, батюшка… (20)Обратившись к фельдшеру, я приказал взять девочку. (21)Девочка стала биться и хотела, видимо, кричать, но у неё не выходил уже голос. (22)Мать старалась её защитить, но мы её отстранили, и мне удалось заглянуть при свете лампы девочке в горло. (23)Я никогда до тех пор не видел дифтерита, кроме лёгких и быстро забывшихся случаев. (24)В горле было что-то клокочущее, белое, рваное. (25)– Вот что, – сказал я, удивляясь собственному спокойствию, – дело такое. (26)Поздно. (27)Девочка умирает. (28)И ничто ей не поможет, кроме одного – операции. (29)– Как это? – спросила мать. (30)– Нужно будет горло разрезать пониже и серебряную трубку вставить, дать девочке возможность дышать, тогда, может быть, спасём её, – объяснил я. (31)В операционной было очень тихо. (32)Я взял скальпель и провёл вертикальную черту по пухлому белому горлу. (33)Не выступило ни одной капли крови. (34)Я второй раз провёл по белой полоске, которая выступила меж раздавшейся кожи. (35)Опять ни кровинки. (36)Медленно, стараясь вспомнить какие- то рисунки в медицинских атласах, я стал при помощи тупого зонда разделять тоненькие ткани. (37)И тогда внизу раны откуда-то хлынула тёмная кровь и мгновенно залила всю рану и потекла по шее. (38)Вспоминая всё, что я видел в университете, я пинцетами стал зажимать края раны, но ничего не выходило. (39)Мне стало холодно, и лоб мой намок. (40)Я остро пожалел, зачем пошёл на медицинский факультет, зачем попал в эту глушь. (41)В злобном отчаянии я сунул пинцет наобум, куда-то близ раны, защёлкнул его, и кровь тотчас же перестала течь. (42)Но никакого дыхательного горла нигде не было. (43)К концу второй минуты я отчаялся его найти. (44)«Конец, – подумал я, – зачем я это сделал? (45)Ведь мог же я не предлагать операцию, и Лидка спокойно умерла бы у меня в палате, а теперь она умрёт с разорванным горлом, и никогда, ничем я не докажу, что она всё равно умерла бы, что я не мог повредить ей…» (46)Сестра молча вытерла мой лоб. (47)«Положить скальпель, сказать: не знаю, что дальше делать», – так подумал я, и мне представились глаза матери. (48)Я снова глубоко и резко полоснул Лидку. (49)Ткани разъехались, и неожиданно передо мной оказалось дыхательное горло. (50)Я вколол скальпель в горло, затем серебряную трубку вложил в него. (51)Она ловко вскользнула, но Лидка осталась недвижимой. (52)Воздух не вошёл к ней в горло, как это нужно было. (53)Мне хотелось у кого-то попросить прощенья, покаяться в своём легкомыслии. (54)Я видел, как девочка синела. (55)Я хотел уже всё бросить и заплакать, как вдруг Лидка дико содрогнулась, фонтаном выкинула дрянные сгустки сквозь трубку, и воздух со свистом вошёл к ней в горло; потом девочка задышала и стала реветь. (56)Сквозь пелену пота, застилавшую мне глаза, я видел счастливые лица сестёр, и одна из них мне сказала: (57)– Ну и блестяще же вы сделали, доктор, операцию! (58)Я подумал, что она смеётся надо мной... (59)Потом распахнулись двери, повеяло свежестью. (60)Лидку вынесли в простыне, и сразу же в дверях показалась мать. (61)Глаза у неё были как у дикого зверя. (62)Она спросила у меня: (63)– Что?! (64)Когда я услышал звук её голоса, пот потёк у меня по спине, я только тогда сообразил, что было бы, если бы Лидка умерла на столе. (65)Но голосом очень спокойным я ей ответил: (66)– Будь поспокойнее. (67)Жива. (По М. А. Булгакову*, текст адаптирован А. Д. Баландиной) *Михаил Афанасьевич Булгаков (1891 – 1940) – русский писатель, драматург, врач.', src:'Вариант 9 · задание 22' },
    { match:true, q:'Установите соответствие между предложениями и названиями изобразительно-выразительных средств языка.', errors:['А) Не верьте, не верьте, когда по садам закричат соловьи… (Б. Ш. Окуджава)', 'Б) Оглянуться не успела, Как зима катит в глаза. (И. А. Крылов)', 'В) Окошко. Стол. Половики. В окошке – вид реки. Черны мои черновики. Чисты чистовики. (Н. М. Рубцов)', 'Г) …в ней всё ‒ неожиданность, вздыбленность, боль… (В. В. Маяковский)', 'Д) О мир, пойми! Певцом ‒ во сне – открыты Закон звезды и формула цветка. (М. И. Цветаева)'], sentences:['1) сравнение', '2) многосоюзие', '3) лексический повтор', '4) антитеза', '5) градация', '6) эпифора', '7) парцелляция', '8) литота', '9) риторическое обращение'], a:'38459', sourceText:'(1)Уезжая в город ранним утром, я дал себе слово, что вечером обязательно вернусь. (2)Работа у меня наконец пошла, и я боялся сбоя, боялся, что даже за два- три дня посторонней жизни растеряю всё, что с таким трудом собирал, настраивая себя на работу, – собирал в чтении, раздумьях, в долгих и мучительных попытках отыскать нужный голос, который не спотыкался бы на каждой фразе, а, словно намагниченная особым манером струна, сам притягивал к себе необходимые для полного и точного звучания слова. (3)Поездка в город – это три часа от порога до порога туда и столько же обратно. (4)Чтобы, не дай бог, не передумать и не задержаться, я сразу проехал на автовокзал и взял на последний автобус билет. (5)Впереди у меня оставался почти полный день, за который можно успеть и с делами, и побыть, сколько удастся, дома. (6)И всё шло хорошо, всё подвигалось по задуманному до того момента, когда я, покончив с суетой, но не сбавляя ещё взятого темпа, забежал на исходе дня в детский сад за дочерью. (7)Дочь мне очень обрадовалась. – (8)Приехал? – по-взрослому спросила она и, часто взглядывая на меня, стала торопливо одеваться. (9)До дому было слишком близко, чтобы прогуляться, и мы мимо дома прошли на набережную. (10)Погода для конца сентября стояла совсем летняя, тёплая. (11)Мы гуляли, наверное, с час, и дочь почти не вынимала своей ручонки из моей руки, выдергивая её лишь для того, чтобы показать что-то или изобразить, когда без рук не обойтись, и тут же всовывала обратно. (12)Терпение, послушание, нежность… (13)Дочь расщебеталась, разговорилась, рассказывая о садике и расспрашивая меня о нашей вороне. (14)У нас на Байкале была своя ворона. (15)Дочь первая рассмотрела высоко на лиственнице лохматую шапку её гнезда. (16)Я до того месяц жил и не замечал. (17)Летает и летает ворона, каркает, как ей положено, – что с того? (18)Мне и в голову не приходило, что это наша ворона, потому что тут, среди нас, её гнездо и в нём она выводила своих воронят. (19)Конечно, наша ворона должна была стать особенной, не такой, как все прочие вороны, и она ею стала. (20)Очень скоро мы с нею научились понимать друг друга, и она пересказывала мне всё, что видела и слышала, облетая дальние и ближние края, а я затем подробно передавал её рассказы дочери. (21)Дочь верила. (22)А может, и не верила, но с таким вниманием слушала, с таким нетерпением ждала продолжения, когда я прерывался, что и мне эти рассказы стали в удовольствие, я стал замечать в себе волнение, которое передавалось от дочери и удивительным образом уравнивало нас, точно сближая на одинаковом друг от друга возрастном расстоянии. (23)Мне между тем подступало время собираться, и я сказал дочери, что нам пора домой. – (24)Нет, давай ещё погуляем, – не согласилась она. – (25)Пора, – повторил я. – Мне сегодня уезжать обратно. (26)Её ручонка дрогнула в моей руке. (27)Дочь не сказала, а пропела: – (28)А ты не уезжай сегодня. (29)И добавила как окончательно решённое: – Вот. (30)Тут бы мне и дрогнуть: это была не просто просьба, каких у детей на каждом шагу, – нет, это была мольба, высказанная сдержанно, с достоинством, но всем существом, осторожно искавшим своего законного на меня права, не знающего и не желающего знать принятых в жизни правил. (31)Но я-то был уже немало испорчен и угнетён этими правилами, и, когда не хватало чужих, установленных для всех, я выдумывал, как и на этот раз, свои. (32)Вздохнув, я вспомнил данное себе утром слово и упёрся: – (33)Понимаешь, надо. (34)Не могу. (35)Дочь послушно дала повернуть себя к дому, перевести через улицу и вырвалась, убежала вперёд. (36)Я стал собирать рюкзак, то и дело подходя к дочери, заговаривая с ней; но она замкнулась и отвечала натянуто. (37)Всё – больше она уже не была со мной, она ушла в себя, и чем больше пытался бы я приблизиться к ней, тем дальше бы она отстранялась. (38)У меня оставалась ещё надежда на прощание. (39)Я собрался и подозвал дочь. (40)– До свидания. (41)Что передать вороне? (42)– Ничего. (43)До свидания, – отводя глаза, сказала она как-то безразлично, голосом, который ей рано было иметь. (44)Будто нарочно, сразу подошёл трамвай, и я приехал на станцию за двадцать минут до автобуса. (45)А ведь мог бы эти двадцать минут погулять с дочерью, их бы, наверное, хватило, чтобы она не заметила спешки и ничего бы между нами не случилось. (46)Дальше, как бы в урок мне, сплошь началось невезенье. (47)Автобуса долго не было. (48)Загрузив пассажиров, шофер поехал на заправку, и мы на час опоздали к переправе через Байкал. (49)Команда катера, который нас повёз, зря времени в ожиданиях не теряла и была распьянёшенька, наступала ночь, штормило. (50)Припоминая потом всю дорогу от начала и до конца, и особенно переправу, я думал обо всём случившемся не как о чём-то ужасном или неприятном, а как о неизбежном, происшедшем во всей этой последовательности и во всех обстоятельствах только из-за меня, чтобы преподать мне какой-то урок. (51)Какой? (52)Я не знал и не скоро, быть может, узнаю; да тут и не ответ важен, а ощущение своей вины. (53)Это были не случайные случайности. (54)Мне казалось, что и люди, которые ехали со мной, страдали и рисковали только по моей милости. (55)А в последние полчаса, когда мы перегребали с берега на берег, риск, конечно, существовал – что и говорить! (56)Катерок наш то вонзался в воду, то взлетал в воздух, я, мокрый и продрогший, сидел на мешке с картошкой, который ездил подо мной, и безучастно ждал, чем всё это закончится. (57)Я так изнемог за этот день, что не стал, придя к себе, ни чай кипятить, ни даже разбирать рюкзак, а тут же повалился в постель. (58)Наутро после поездки в город я поднялся поздно, разбитый. (59)С преувеличенной бодростью принялся растапливать печку и готовить чай, пил его, как всегда, с удовольствием, но он нисколько меня не взбодрил, беспричинная холодная тяжесть и не собиралась отступать. (60)Из упрямства я подсел всё-таки к столу с бумагами, но это было всё равно что слепому смотреть в бинокль: ни единого проблеска впереди, сплошь серая плотная стена. (61)Полным истуканом, с кирпичом вместо головы, просидел я полчаса и, до последней степени возненавидев себя, поднялся. (62)Что-то как бы пискнуло со злорадством за моей спиной, когда я отходил от стола… (63)Не находя себе места, я двигался бесцельно и бестолково – то выйду во двор и вслушиваюсь и всматриваюсь во что-то, сам не зная во что, то вернусь снова в избу и встану, истязая себя, подле горячей печки, пока не станет до дурноты жарко, и опять на улицу. (64)Промаявшись так, наверное, с час и чувствуя, что облегчения не найти, я закрыл избу и пошёл куда глаза глядят. (65)…Было уже совсем темно, когда я вернулся к своей избушке. (66)Ноги едва держали меня… (67)Среди ночи я проснулся от стука дождя по сухой крыше и крика вороны. (68)…Под утро, не разжигая печки, оделся и направился в диспетчерскую порта, откуда можно было позвонить в город. (69)Мне долго не удавалось соединиться, телефон подключался и тут же обрывался, а когда я наконец дозвонился до дома, мне сказали, что дочь ещё вчера слегла и лежит с высокой температурой. (По В. Г. Распутину*, текст адаптирован А. Д. Баландиной) *Валентин Григорьевич Распутин (1937 – 2015) – русский советский писатель и публицист, общественный деятель.', src:'Вариант 10 · задание 22' },

  23: [
    { multi:true, q:'Какие из перечисленных высказываний соответствуют содержанию текста? Укажите номера ответов.', opts:['Рассказчик, ветеран Великой Отечественной войны, участник боевых действий, кочевал по поездам, возвращаясь с фронта на родину – в Питер.', 'Необыкновенная красота сидевшей напротив окна девушки, освещённой утренним солнцем, поразила воображение рассказчика.', 'Инвалид войны, зашедший в вагон в сопровождении мальчишки-поводыря, был настолько обезображен ранениями, что на него невозможно было смотреть без содрогания.', 'Душевные страдания юного фронтовика, навсегда лишённого возможности испытать простое человеческое счастье, кажутся рассказчику гораздо более сильными по сравнению с физическими страданиями, вызванными увечьями.', 'Девушка, едва оправившись от испуга, с изумлением увидела, как из уцелевшего глаза инвалида скатилась слеза и упала на нечистый пол деревянного вагона.'], a:[1, 2, 3], sourceText:'(1)Сороковые послевоенные годы. (2)Голодные годы. (3)Лавина искалеченного войной люда, разного вида нищих, малых и старых, кочующих по стране. (4)Нищие ходили по железнодорожным вагонам со своим репертуаром и всяческими обращениями к победившему народу. (5)Из множества нищих в памяти моей застрял один необычный бессловесный «обрубок». (6)Расскажу уж по порядку, как полагается. (7)После побега из детприёмника главной целью моей было возвращение на родину, в Питер. (8)Пытаясь добраться туда, я кочевал по поездам. (9)В том поезде я мирно спал, привязавшись ремнём к металлической трубе, чтобы меня ночью не сдвинули с полки. (10)Поезд приближался к станции Остров. (11)Позднее осеннее солнце вдруг осветило потолок вагона и заставило меня проснуться. (12)Отвязав себя от трубы, посмотрел вниз. (13)Вторые полки ещё спали, но нижние – женщина и девушка – встали уже, явно готовясь сойти в Острове. (14)Мой взгляд застрял на девушке красоты необыкновенной. (15)Так мне показалось. (16)А может быть, виновато солнце, которое светило прямо на неё. (17)Она сидела против окна, спиной ко входу, на чемодане, зачехлённом холстиной с латунными пуговицами от шинели, и ела картошку из капустного листа с огурцом и хлебом. (18)Её русые волосы, заплетённые в косички, золотились утренним солнцем. (19)Мне запомнилась очень красивая высокая шея и светящиеся на солнце ушки с маленькими прозрачными серьгами-слезинками. (20)Матушка её, отвернувшись от стола, что-то вынимала или, наоборот, складывала в свою сумку и была этим чрезвычайно занята. (21)Напротив – на боковых полках – ещё спали, закрывшись от солнечного света. (22)Вдруг в нашем проёме показалась огромная фигура «обрубка», одетого в военную форму. (23)За подол стираной гимнастёрки безрукого держался совсем маленький пацан-поводырь. (24)Голова солдатика-великана была расколота по диагонали, да так страшно и безжалостно, что смотреть на неё было невозможно, а уж я повидал в своей жизни к этому времени! (25)Шрам, если это можно было назвать шрамом, проходил щелью почти от правого виска вниз через всё лицо, уничтожив нос, то есть соединив рот и нос в одно отверстие с остатками лохматых губ. (26)Сдвинутые, но живые куски мяса – разбитые глазницы, правого глаза не было. (27)Война. (28)Это было воистину лицо войны. (29)Только случайность или Господь Бог и молодость оставили этого парня жить. (30)Более страшного живого человека я никогда не видел. (31)Вместо рук у него торчали «колбаски»-обрубки: в войну некогда было, поэтому резали, а кожу натягивали. (32)На шее болталась дощечка с надписью: «Подайте инвалиду войны». (33)Он, очевидно, не мог говорить, а лишь мычал: во рту болтались только ошмётки языка. (34)Никто его не видел и не слышал, кроме меня. (35)Он стоял на широко расставленных ногах, чуть подавшись туловищем вперёд, напротив не видящей его девчонки и смотрел своим уцелевшим глазом на её замечательно освещённую головку. (36)Вдруг он решительно взмахнул своим правым обрубком, сделал шаг к столу, резко нагнулся со своего высока и лохмотьями губ поцеловал шейку девушки. (37)Она, оглянувшись, вскрикнула страшным, каким-то испуганным криком, будто у неё внутри рвануло. (38)Её затрясло. (39)Матушка, онемев, побледнела и вжалась в угол полки. (40)А из его глазниц вдруг что-то рухнуло. (41)Слеза. (42)Мне показалось, что я слышал звук падающей слезы. (43)Этого не могло быть, поезд шёл быстро и шумно, но в голове у меня остался этот звук, мне показалось, что я слышал, как его слеза разбилась о нечистый пол нашего деревянного вагона. (44)Поводырь-пацан потянул «обрубка» за подол гимнастёрки и оттащил его от трясущейся в ознобе девушки. (45)Поезд прибыл на станцию Остров. (46)Они вышли: один огромный, другой неправдоподобно маленький, словно кто-то всё это срежиссировал. (47)Сошли в абсолютно разрушенном городе. (48)У вокзала не было крыши, а сам вокзал был заполнен безрукими, безногими, палёными, ослепшими… (49)Эта жуть до сих пор у меня в глазах. (50)Брейгель какой-то – и на Руси. (51)Шёл мокрый снег… (По Э. С. Кочергину*, текст адаптирован Ю. Ф. Генераловой) *Эдуард Степанович Кочергин (род. 1937) — советский и российский театральный художник, писатель.', src:'Вариант 1 · задание 23' },

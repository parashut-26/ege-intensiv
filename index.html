<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ЗебРус · Краш-тест 2026 — прототип платформы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#FFFAF2; --surface:#FFFFFF; --surface-soft:#FFF7E0;
  --ink:#1A1B3A; --ink-2:#4B4E6D; --ink-3:#94A3B8;
  --y:#FACC15; --y-2:#FDE68A; --y-soft:#FEF9C3;
  --p:#8B5CF6; --p-2:#C4B5FD; --p-soft:#F3E8FF;
  --p-deep:#6D28D9;
  --o-from:#FB923C; --o-to:#F97316;
  --peach:#FED7AA; --peach-soft:#FFEDD5;
  --green:#10B981; --green-soft:#D1FAE5;
  --warn:#F59E0B; --warn-soft:#FED7AA;
  --red:#EF4444; --red-soft:#FECACA;
  --pink-soft:#FCE7F3;
  --teal:#14B8A6; --teal-soft:#CCFBF1;
  --border:#F1E9D9; --border-2:#E5E7EB;
  --shadow:0 1px 3px rgba(26,27,58,.06);
  --shadow-md:0 4px 16px rgba(26,27,58,.08);
  --shadow-lg:0 12px 32px rgba(26,27,58,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:0;background:transparent;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--p);text-decoration:none;cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:800;color:var(--ink);letter-spacing:-.01em}
h1{font-size:28px;line-height:1.15} h2{font-size:22px} h3{font-size:17px} h4{font-size:14px}
.fade-in{animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.banner{background:#FEF3C7;color:#92400E;font-size:11px;text-align:center;padding:6px;border-bottom:1px solid #FDE68A}

/* ============ ЛОГО ============ */
.zebrus{font-family:'Manrope';font-weight:800;line-height:1;display:inline-flex;align-items:center;gap:8px;letter-spacing:-.02em}
.zebrus-text{display:inline}
.zebrus .zeb{color:var(--y);text-shadow:0 1px 0 rgba(0,0,0,.08)}
.zebrus .rus{color:var(--p)}

/* ============ ШАПКА ============ */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;box-shadow:var(--shadow)}
.topbar .left{display:flex;align-items:center;gap:14px}
.role-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap}
.role-pill.student{background:var(--y);color:var(--ink)}
.role-pill.teacher{background:var(--p);color:#fff}
.role-pill.curator{background:var(--teal);color:#fff}

.topbar .right{display:flex;align-items:center;gap:10px}
.bee-counter{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--y-soft);font-weight:700;color:var(--ink)}
.bell{width:36px;height:36px;border-radius:50%;background:var(--y-soft);display:inline-flex;align-items:center;justify-content:center;position:relative;font-size:16px}
.bell .dot{position:absolute;top:6px;right:8px;width:7px;height:7px;background:var(--red);border-radius:50%;border:2px solid var(--y-soft)}
.user-pill{display:flex;align-items:center;gap:9px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--p-soft);color:var(--ink)}
.user-pill .avatar{width:30px;height:30px;border-radius:50%;background:var(--p);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.user-pill .who{line-height:1.15;font-size:12px}
.user-pill .who b{display:block;font-weight:700;font-size:13px;color:var(--ink)}
.user-pill .who span{color:var(--ink-2)}
.role-switch{font-size:11px;padding:6px 10px;border-radius:8px;border:1px solid var(--border-2);color:var(--ink-2);background:var(--surface)}
.role-switch:hover{background:var(--bg)}

/* ============ ВКЛАДКИ ============ */
.tabs{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:6px;overflow-x:auto}
.tab{display:inline-flex;align-items:center;gap:8px;padding:14px 16px;border:0;font-weight:700;color:var(--ink-2);position:relative;white-space:nowrap;font-size:14px;border-radius:14px 14px 0 0;background:transparent}
.tab .ic{font-size:18px}
.tab .badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700}
.tab .badge.warn{background:var(--warn)}
.tab .badge.purple{background:var(--p)}
.tab.active.student{background:var(--y);color:var(--ink)}
.tab.active.teacher{background:linear-gradient(135deg,#A78BFA,#8B5CF6);color:#fff}
.tab.active.teacher .badge{background:#fff;color:var(--p)}
.tab.active.curator{background:var(--teal);color:#fff}
.tab.active.curator .badge{background:#fff;color:var(--teal)}
.tab:hover:not(.active){background:var(--bg)}

/* ============ СТРУКТУРА ============ */
.main{padding:28px 32px}
@media (max-width:640px){.main{padding:18px}.tabs{padding:0 12px}.topbar{padding:10px 14px}}

/* ============ КАРТОЧКИ ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.card-soft-y{background:var(--y-soft);border:1px solid var(--y-2)}
.card-soft-p{background:var(--p-soft);border:1px solid var(--p-2)}
.card-orange{background:linear-gradient(135deg,#FB923C 0%,#F97316 100%);color:#1f1f1f;border:0}
.card-orange h2{color:var(--ink)}
.card-pink{background:#FFE4E6;border:1px solid #FECDD3}
.card-teal{background:var(--teal-soft);border:1px solid #5EEAD4}

.kpi{display:flex;flex-direction:column;gap:10px}
.kpi .ic-box{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:20px}
.kpi .label{font-size:11px;text-transform:uppercase;color:var(--ink-3);letter-spacing:.08em;font-weight:700}
.kpi .value{font-size:32px;font-weight:800;line-height:1;letter-spacing:-.02em}
.kpi .hint{font-size:12px;color:var(--ink-2)}

.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:980px){.grid-3,.grid-4{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

/* ============ КНОПКИ ============ */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;transition:all .15s;text-decoration:none}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#0F0F26}
.btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--border-2)}
.btn-secondary:hover{background:var(--bg)}
.btn-y{background:var(--y);color:var(--ink)}
.btn-y:hover{background:#F4B617}
.btn-p{background:var(--p);color:#fff}
.btn-p:hover{background:#7C3AED}
.btn-teal{background:var(--teal);color:#fff}
.btn-o{background:linear-gradient(135deg,#F97316,#EA580C);color:#fff}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:10px}
.btn-icon{width:32px;height:32px;border-radius:8px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink-2)}
.btn-icon:hover{background:var(--p-soft);color:var(--p)}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ============ ПЛАШКИ-СТАТУСЫ ============ */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.chip-y{background:var(--y-soft);color:#854D0E}
.chip-p{background:var(--p-soft);color:#5B21B6}
.chip-green{background:var(--green-soft);color:#065F46}
.chip-red{background:var(--red-soft);color:#991B1B}
.chip-warn{background:var(--warn-soft);color:#92400E}
.chip-grey{background:#F1F5F9;color:#475569}
.chip-teal{background:var(--teal-soft);color:#115E59}

/* ============ ПРОГРЕСС ============ */
.bar{height:8px;background:var(--p-soft);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--y) 0%,var(--o-to) 100%);transition:width .6s}
.bar.thin{height:6px}

/* ============ ТАБЛИЦА ============ */
.table{width:100%;border-collapse:separate;border-spacing:0}
.table th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--ink-3);letter-spacing:.08em;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700}
.table td{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:hover td{background:#FFFCF2}
.avatar-sm{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px}

/* ============ ВХОД ============ */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 32px);padding:24px}
.login-card{background:var(--surface);border-radius:24px;padding:36px;max-width:440px;width:100%;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.login-hero{display:flex;flex-direction:column;align-items:center;margin-bottom:8px}
.login-hero .bee-big{font-size:48px;margin-bottom:8px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-6px) rotate(5deg)}}
.login-card h1{text-align:center;font-size:24px;line-height:1.25}
.login-card .sub{text-align:center;color:var(--ink-2);margin:6px 0 24px;line-height:1.5}
.login-btn{display:flex;width:100%;justify-content:center;padding:14px;border-radius:14px;font-weight:700;font-size:14px;margin-bottom:10px;transition:transform .1s}
.login-btn:hover{transform:translateY(-1px)}
.divider{text-align:center;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:18px 0}
.foot-note{text-align:center;color:var(--ink-3);font-size:11px;margin-top:16px}

/* ============ КАРТА ИНТЕНСИВА ============ */
.intensive-map{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.intensive-map{grid-template-columns:1fr 1fr}}
.day-card{padding:16px;border-radius:16px;background:var(--p-soft);border:1px solid var(--p-2);min-height:130px;display:flex;flex-direction:column;justify-content:space-between}
.day-card.today{background:linear-gradient(135deg,#FDE68A,#FACC15);border:1px solid #F59E0B;color:var(--ink);box-shadow:0 4px 16px rgba(250,204,21,.35)}
.day-card.work{background:#FFFFFF;border:1px solid var(--border-2)}
.day-card.walk{background:#FCE7F3;border:1px solid #FBCFE8}
.day-card.exam{background:linear-gradient(135deg,#FB923C,#F97316);color:#fff;border:0}
.day-card.exam h3{color:#fff}
.day-card .ord{font-size:36px;font-weight:800;line-height:1;letter-spacing:-.04em;color:var(--p);font-style:italic}
.day-card.today .ord{color:#92400E}
.day-card.exam .ord{color:#fff}
.day-card .meta{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;margin-top:8px;font-weight:600}
.day-card .ttl{font-size:15px;font-weight:800;margin-top:4px}
.day-card .small{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:8px}
.day-card.today .small{color:#92400E}
.day-card .badge-today{display:inline-block;background:var(--ink);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}

/* ============ ДОСТИЖЕНИЯ ============ */
.ach-cat{margin-bottom:20px}
.ach-cat-title{font-size:12px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ach{padding:18px 14px;border-radius:14px;background:var(--y-soft);border:1px solid var(--y-2);text-align:center}
.ach.locked{background:#F1F5F9;border:1px solid #E2E8F0;opacity:.65;filter:saturate(.4)}
.ach .em{font-size:32px;line-height:1}
.ach .nm{font-size:13px;font-weight:800;margin-top:8px}
.ach .desc{font-size:11px;color:var(--ink-2);margin-top:6px;line-height:1.4}
.ach .pts{display:inline-block;font-size:10px;font-weight:700;color:var(--ink-3);margin-top:6px}

/* ============ АКТИВНОСТЬ ============ */
.act-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border)}
.act-item:first-child{border-top:0}
.act-left{display:flex;align-items:center;gap:12px;min-width:0}
.act-ic{width:36px;height:36px;border-radius:10px;background:var(--y-soft);display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.act-text{font-size:13px;font-weight:600}
.act-meta{font-size:11px;color:var(--ink-3)}
.act-points{background:var(--y);color:var(--ink);padding:4px 10px;border-radius:999px;font-weight:700;font-size:12px;flex-shrink:0}

/* ============ ТЕОРИЯ — СЕТКА 26 ============ */
.theory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.theory-card{padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-height:130px;transition:transform .12s, box-shadow .12s, border-color .12s}
.theory-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--p-2)}
.theory-card .num{font-size:30px;font-weight:800;color:var(--p);font-style:italic;line-height:1;letter-spacing:-.04em}
.theory-card .topic{font-size:12px;font-weight:700;margin-top:8px;color:var(--ink)}
.theory-card .day-tag{display:inline-block;font-size:10px;text-transform:uppercase;font-weight:700;letter-spacing:.06em;color:var(--ink-3);margin-top:6px}
.theory-card.weak{background:#FEE2E2;border-color:#FCA5A5}
.theory-card.weak .num{color:var(--red)}
.theory-card.ok{background:var(--green-soft);border-color:#86EFAC}
.theory-card.ok .num{color:var(--green)}
.theory-card.day1{border-left:4px solid var(--y)}
.theory-card.day2{border-left:4px solid var(--p)}
.theory-card.day3{border-left:4px solid var(--o-to)}

/* ============ ОБРАЗЦЫ ============ */
.sample-card{padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--border);margin-bottom:12px;cursor:pointer;transition:transform .12s, box-shadow .12s}
.sample-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.sample-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sample-card .score{font-size:22px;font-weight:800;color:var(--green)}
.sample-card .score.medium{color:var(--warn)}
.sample-card .score.low{color:var(--red)}

/* ============ ЧАТ ============ */
.chat-fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#A78BFA,#8B5CF6);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);z-index:25;border:0}
.chat-fab .dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid #fff}
.chat-panel{position:fixed;bottom:90px;right:24px;width:340px;max-width:calc(100vw - 48px);height:480px;max-height:70vh;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;border:1px solid var(--border);z-index:25;overflow:hidden}
.chat-head{padding:14px 16px;background:linear-gradient(135deg,#A78BFA,#8B5CF6);color:#fff;display:flex;align-items:center;justify-content:space-between}
.chat-head h4{color:#fff;font-size:15px}
.chat-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg)}
.chat-tabs button{flex:1;padding:10px;font-size:12px;font-weight:700;color:var(--ink-2)}
.chat-tabs button.active{background:var(--surface);color:var(--p);border-bottom:2px solid var(--p)}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#FAFAFA}
.bubble{max-width:78%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.4;position:relative}
.bubble.them{background:var(--surface);border:1px solid var(--border-2);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.them .who{font-size:10px;font-weight:700;color:var(--p);margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em;display:flex;gap:6px;align-items:center}
.bubble.them .who .role-mini{font-size:9px;background:var(--teal-soft);color:#115E59;padding:1px 6px;border-radius:999px;font-weight:700}
.bubble.me{background:linear-gradient(135deg,#A78BFA,#8B5CF6);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bubble .time{font-size:10px;opacity:.6;margin-top:4px}
.bubble .helped-btn{margin-top:6px;background:rgba(16,185,129,.15);color:var(--green);font-size:10px;padding:3px 8px;border-radius:999px;cursor:pointer;font-weight:700}
.bubble .helped-btn.active{background:var(--green);color:#fff}
.chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);background:var(--surface)}
.chat-input input{flex:1;padding:8px 12px;border:1px solid var(--border-2);border-radius:10px;font-size:13px}
.chat-input button{padding:8px 14px;border-radius:10px;background:var(--p);color:#fff;font-weight:700;font-size:12px}

/* ============ МОДАЛКА ============ */
.modal-bg{position:fixed;inset:0;background:rgba(26,27,58,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:20px;max-width:1100px;width:100%;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal-head{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head .x{font-size:24px;color:var(--ink-3);width:36px;height:36px;border-radius:8px}
.modal-head .x:hover{background:var(--bg)}
.modal-body{flex:1;overflow-y:auto;padding:24px}
.modal-foot{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--surface-soft);gap:10px;flex-wrap:wrap}

/* ============ ФОРМА ПРОВЕРКИ СОЧИНЕНИЙ ============ */
.essay-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}
@media(max-width:980px){.essay-grid{grid-template-columns:1fr}}
.essay-text{padding:20px;background:var(--surface-soft);border-radius:14px;border:1px solid var(--border);font-size:14px;line-height:1.7;max-height:60vh;overflow-y:auto;white-space:pre-wrap;font-family:'Manrope';position:relative}
.essay-text mark{background:var(--y-soft);padding:1px 2px;border-radius:3px;cursor:pointer;border-bottom:2px solid var(--y)}
.criteria{display:flex;flex-direction:column;gap:8px}
.crit{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;background:var(--surface-soft);border:1px solid var(--border);gap:10px}
.crit.locked{opacity:.5}
.crit .nm{font-weight:700;font-size:13px}
.crit .desc{font-size:11px;color:var(--ink-2)}
.crit select,.crit input{padding:6px 10px;border-radius:8px;border:1px solid var(--border-2);font-weight:700;text-align:center}
.score-total{padding:14px 18px;border-radius:14px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between}
.score-total .big{font-size:28px;font-weight:800}

/* ============ ВОЗ-КОММЕНТ ============ */
.voice-rec{background:var(--red);color:#fff;padding:8px 14px;border-radius:999px;font-weight:700;font-size:12px;display:inline-flex;align-items:center;gap:8px;border:0}
.voice-rec .pulse{width:10px;height:10px;background:#fff;border-radius:50%;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.voice-saved{background:var(--p-soft);color:var(--p);padding:8px 14px;border-radius:999px;font-size:12px;display:inline-flex;align-items:center;gap:6px;border:0}

/* ============ TOAST ============ */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:13px;z-index:40;box-shadow:var(--shadow-lg);animation:fadeIn .25s}

/* ============ ОНБОРДИНГ ============ */
.onboarding{max-width:520px;width:100%}
.onboarding ul{margin:14px 0;padding-left:0;list-style:none}
.onboarding ul li{padding:10px 14px;background:var(--y-soft);border-radius:10px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;font-size:13px}
.onboarding ul li .ic{font-size:18px;flex-shrink:0}

/* ============ ПЕРЕКЛЮЧАТЕЛИ ============ */
.toggle{background:#CBD5E1;width:40px;height:22px;border-radius:11px;position:relative;display:inline-block;cursor:pointer;flex-shrink:0;transition:background .15s}
.toggle.on{background:var(--green)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on::after{left:20px}

/* ============ ПОСЕЩАЕМОСТЬ ============ */
.attend-list{display:flex;flex-direction:column;gap:6px}
.attend-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;background:var(--surface-soft);border:1px solid var(--border)}
.attend-row.checked{background:var(--green-soft);border-color:#86EFAC}
.attend-row.self-checked{background:var(--y-soft);border-color:var(--y-2)}
.attend-check{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:2px solid var(--border-2);background:var(--surface)}
.attend-check.on{background:var(--green);color:#fff;border-color:var(--green)}
.attend-check.self{background:#FEF9C3;color:#854D0E;border-color:var(--y)}

/* ============ ОПЛАТЫ ============ */
.pay-bar{display:flex;height:24px;border-radius:12px;overflow:hidden;background:#F1F5F9;margin:14px 0}
.pay-bar .seg{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
.pay-bar .paid{background:var(--green)}
.pay-bar .partial{background:var(--warn)}
.pay-bar .pending{background:var(--red)}
</style>

async function authSendMagicLink(email){
  if(!sb){ throw new Error('Supabase не подключён'); }
  const { error } = await sb.auth.signInWithOtp({
    email: email,
    options: { emailRedirectTo: window.location.href }
  });
  if(error) throw error;
}

async function loadMyProfile(){
  if(!sb) return null;
  const { data: { user } } = await sb.auth.getUser();
  if(!user) return null;

  /* Сначала пытаемся загрузить существующий профиль */
  let { data, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();

  /* Если профиля нет — создаём его (вместо триггера, который не работает) */
  if(!data){
    const insert = await sb.from('profiles').insert({
      id: user.id,
      role: 'student',
      full_name: user.user_metadata?.full_name || user.email.split('@')[0],
      email: user.email,
      s_type: 'гость',
      s_status: 'pending',
      bee: 0
    }).select().single();
    if(insert.error){
      console.warn('Не удалось создать профиль:', insert.error.message);
      return null;
    }
    data = insert.data;
  }

  MY_PROFILE = data;
  return data;
}

async function authSignOut(){
  if(sb) await sb.auth.signOut();
  MY_PROFILE = null;
  STATE.view = 'login';
  STATE.authStage = 'idle';
  STATE.authEmail = '';
  render();
}

/* При загрузке страницы пытаемся восстановить сессию */
async function restoreSession(){
  STATE.authLoading = true;
  if(!sb){
    STATE.authLoading = false;
    STATE.authMode = 'demo';
    render();
    return;
  }
  const profile = await loadMyProfile();
  STATE.authLoading = false;
  if(profile){
    /* Маппим роль из БД на view */
    if(profile.role === 'teacher') STATE.view = 'teacher';
    else if(profile.role === 'curator') STATE.view = 'curator';
    else STATE.view = 'student';
  } else {
    STATE.view = 'login';
  }
  render();
}

/* Слушаем изменения сессии (вход через magic link, выход) */
if(sb){
  sb.auth.onAuthStateChange(async (event) => {

      }

    } else if(event === 'SIGNED_OUT'){
      MY_PROFILE = null;
      STATE.view = 'login';
      render();
    }
  });
}

/* Помощник: создать drill-вопрос из пары (с направлением). */
function paronymDrill(pair, dir){
  const word = (dir === 'b' ? pair.b : pair.a).toUpperCase();
  const ans  = (dir === 'b' ? pair.a : pair.b);
  return { text:true, pair:true,
    q:'Напишите пароним к слову:',
    word: word,
    a:[ans],
    hint: pair.hint,
    src:'Банк ФИПИ · пары паронимов' };
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildShuffledParonymBank(n){
  const shuffled = shuffleArray(PARONYM_PAIRS);
  return shuffled.slice(0, n).map(p =>
    paronymDrill(p, Math.random() < 0.5 ? 'a' : 'b'));
}

/* =======================================================================
   УТИЛИТЫ
   ======================================================================= */
function el(tag, props, ...children){
  const n = document.createElement(tag);
  if(props){
    for(const k in props){
      const v = props[k];
      if(v == null || v === false) continue;
      if(k === 'class') n.className = v;
      else if(k === 'html') n.innerHTML = v;
      else if(k === 'style' && typeof v === 'object') Object.assign(n.style, v);
      else if(k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), v);
      else n.setAttribute(k, v);
    }
  }
  const flat = [];
  for(const c of children){
    if(Array.isArray(c)) flat.push(...c); else flat.push(c);
  }
  for(const c of flat){
    if(c == null || c === false) continue;
    n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return n;
}

function showToast(text){
  STATE.toast = text;
  render();
  setTimeout(() => { STATE.toast = null; render(); }, 2400);
}

function logo(size){
  const sz = size || 20;
  const node = el('div', { class:'zebrus', style:{ fontSize: sz+'px' }});
  node.innerHTML = `<span style="font-size:${Math.round(sz*0.95)}px">🐝</span><span class="zebrus-text"><span class="zeb">Зеб</span><span class="rus">Рус</span></span>`;
  return node;
}

function avatarChip(name, color, size){
  const sz = size || 34;
  const init = name.split(' ').map(s => s[0]).join('').slice(0,2).toUpperCase();
  return el('span', { class:'avatar-sm',
    style:{ background: color || '#8B5CF6', width:sz+'px', height:sz+'px', fontSize: Math.round(sz*0.36)+'px' }
  }, init);
}

function chip(text, kind){
  return el('span', { class: 'chip chip-' + (kind || 'grey') }, text);
}

function statusChip(s){
  if(s === 'active')  return chip('● Активна', 'green');
  if(s === 'lagging') return chip('⚠ Отстаёт', 'red');
  if(s === 'pending') return chip('⏳ Ждёт одобрения', 'warn');
  return chip(s, 'grey');
}

        }, '🔐 Войти по e-mail (через Supabase)'));

      el('p', { class:'foot-note' },

           : 'Подключение к Supabase не загрузилось. Работает демо-режим.'));

        el('span', { style:{ fontSize:'12px', color:'var(--ink-3)' }}, d.weekday)),

/* =======================================================================
   МОДАЛЬ ТРЕНАЖЁРА
   ======================================================================= */
function modalTest(taskN){
  /* Если включён режим перемешанных пар — используем кэш */
  let bank;
  if(STATE.testShuffle){
    if(!STATE.shuffledBank){
      STATE.shuffledBank = buildShuffledParonymBank(STATE.testShuffle);
    }
    bank = STATE.shuffledBank;
  } else {
    bank = QUIZ_BANK[taskN];
  }
  if(!bank) return null;

  /* Все ли вопросы получили ответ? */
  const isAnswered = (q, i) => {
    const ans = STATE.testAnswers[i];
    if(q.text) return ans != null && String(ans).trim().length > 0;
    if(q.multi) return Array.isArray(ans) && ans.length > 0;
    return ans != null;
  };
  const allAnswered = bank.every(isAnswered);
  /* Показываем результат только после нажатия «Проверить» */
  const all = STATE.testChecked;

  /* Правильно ли отвечено? */
  const isCorrect = (q, i) => {
    const ans = STATE.testAnswers[i];
    if(q.text){
      const accept = Array.isArray(q.a) ? q.a : [q.a];
      const norm = String(ans || '').trim().toLowerCase();
      return accept.some(a => String(a).toLowerCase() === norm);
    }
    if(q.multi){
      const sel = Array.isArray(ans) ? ans.slice().sort() : [];
      const exp = q.a.slice().sort();
      return sel.length === exp.length && sel.every((v, k) => v === exp[k]);
    }
    return ans === q.a;
  };
  const correct = bank.filter(isCorrect).length;

  const body = el('div', { class:'modal-body' });
  bank.forEach((q, i) => {
    const block = el('div', { style:{ marginBottom:'18px', padding:'16px', border:'1px solid var(--border)', borderRadius:'14px', background:'var(--surface-soft)' }});
    block.append(el('div', { style:{ fontWeight:'700', marginBottom:'10px' }}, (i+1) + '. ' + q.q));

    if(q.context){
      block.append(el('div', { style:{ padding:'10px 12px', background:'#fff', borderRadius:'8px', borderLeft:'3px solid var(--p)', marginBottom:'10px', fontSize:'13px', fontStyle:'italic', color:'var(--ink-2)' }}, q.context));
    }

    if(q.pair && q.word){
      block.append(el('div', { style:{ textAlign:'center', padding:'18px', background:'linear-gradient(135deg, #FEF9C3, #FDE68A)', borderRadius:'12px', marginBottom:'10px', border:'1px solid var(--y-2)' }},
        el('div', { style:{ fontSize:'10px', color:'#854D0E', textTransform:'uppercase', fontWeight:'700', marginBottom:'6px', letterSpacing:'.08em' }}, '🔁 Слово'),
        el('div', { style:{ fontSize:'28px', fontWeight:'800', letterSpacing:'-.02em', color:'var(--ink)' }}, q.word),
        el('div', { style:{ fontSize:'11px', color:'#854D0E', marginTop:'6px' }}, '↓ напишите его пароним')));
    }

    if(q.sentences){
      const sentList = el('div', { style:{ marginBottom:'12px', display:'flex', flexDirection:'column', gap:'6px' }});
      q.sentences.forEach((s, si) => {
        /* Подсветим CAPS-слова жёлтым для удобства */
        const html = s.replace(/[А-ЯЁ]{3,}/g, m => '<b style="background:#FEF9C3;padding:1px 4px;border-radius:3px">' + m + '</b>');
        sentList.append(el('div', {
          html: '<span style="color:var(--ink-3);font-size:11px;font-weight:700;margin-right:6px">' + (si+1) + ')</span>' + html,
          style:{ padding:'8px 12px', background:'#fff', borderRadius:'8px', borderLeft:'3px solid var(--p-2)', fontSize:'13px', lineHeight:'1.5' }
        }));
      });
      block.append(sentList);
    }

    if(q.multi){
      block.append(el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', marginBottom:'8px' }},
        '☑ Выберите ВСЕ верные варианты'));
    }

    if(q.text){
      const ans = STATE.testAnswers[i];
      const ok = all && isCorrect(q, i);
      const bad = all && !ok;
      block.append(el('input', {
        type:'text', placeholder:'Введите ответ…', value: ans || '',
        disabled: all || undefined,
        style:{ width:'100%', padding:'10px 14px', borderRadius:'10px', fontSize:'14px',
                border: '2px solid ' + (ok ? 'var(--green)' : bad ? 'var(--red)' : 'var(--border-2)'),
                background: ok ? 'var(--green-soft)' : bad ? 'var(--red-soft)' : 'var(--surface)' },
        oninput: ev => { STATE.testAnswers[i] = ev.target.value; }
      }));
      if(all){
        const accept = Array.isArray(q.a) ? q.a : [q.a];
        block.append(el('div', { style:{ marginTop:'8px', fontSize:'12px', color: ok ? 'var(--green)' : 'var(--red)' }},
          ok ? '✓ Верно' : '✗ Правильный ответ: ' + accept[0]));
        if(q.hint){
          block.append(el('div', { style:{ marginTop:'6px', padding:'8px 10px', background:'var(--p-soft)', borderRadius:'8px', fontSize:'12px', color:'var(--p-deep)' }},
            '💡 ' + q.hint));
        }
      }
    } else {
      const opts = el('div', { style:{ display:'flex', flexDirection:'column', gap:'6px' }});
      q.opts.forEach((opt, idx) => {
        const ans = STATE.testAnswers[i];
        const sel = q.multi ? (Array.isArray(ans) && ans.includes(idx)) : ans === idx;
        const isRight = q.multi ? q.a.includes(idx) : idx === q.a;
        let bg = 'var(--surface)', color = 'var(--ink)', border = '1px solid var(--border-2)';
        if(all){
          if(isRight){ bg='var(--green-soft)'; color='#065F46'; border='1px solid var(--green)'; }
          else if(sel){ bg='var(--red-soft)'; color='#991B1B'; border='1px solid var(--red)'; }
        } else if(sel){ bg='var(--y-soft)'; color='var(--ink)'; border='1px solid var(--y)'; }
        opts.append(el('button', {
          style:{ padding:'10px 14px', textAlign:'left', borderRadius:'10px', background:bg, color:color, border:border, fontWeight:'600', display:'flex', alignItems:'center', gap:'10px' },
          onclick: () => {
            if(all) return;
            if(q.multi){
              const cur = Array.isArray(STATE.testAnswers[i]) ? STATE.testAnswers[i].slice() : [];
              const k = cur.indexOf(idx);
              if(k >= 0) cur.splice(k, 1);
              else cur.push(idx);
              STATE.testAnswers[i] = cur;
            } else {
              STATE.testAnswers[i] = idx;
            }
            render();
          }
        }, q.multi ? (sel ? '☑' : '☐') : (sel ? '●' : '○'), (idx + 1) + ') ' + opt));
      });
      block.append(opts);
    }

    if(q.src){
      block.append(el('div', { style:{ marginTop:'8px', fontSize:'10px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.06em', fontWeight:'700' }},
        '📚 ' + q.src));
    }
    body.append(block);
  });

  return el('div', { class:'modal-bg',
    onclick: e => { if(e.target.classList.contains('modal-bg')){ STATE.testOpen = null; STATE.testAnswers = {}; STATE.testChecked = false; STATE.testShuffle = null; STATE.shuffledBank = null; render(); }}
  },
    el('div', { class:'modal', style:{ maxWidth:'700px' }},
      el('div', { class:'modal-head' },
        el('div', null,
          el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.08em', fontWeight:'700' }},
            '⚡ Тренажёр · автопроверка · задание ' + taskN),
          el('h2', { style:{ marginTop:'4px' }},
            (EGE_TASKS.find(t => t.n === taskN) || {}).topic || 'Разминка')),
        el('button', { class:'x',
          onclick: () => { STATE.testOpen = null; STATE.testAnswers = {}; STATE.testChecked = false; STATE.testShuffle = null; STATE.shuffledBank = null; render(); }
        }, '×')),
      body,
      el('div', { class:'modal-foot' },
        el('span', { style:{ fontSize:'13px', color:'var(--ink-2)' }},
          STATE.testChecked
            ? '🎉 Готово · ' + correct + ' из ' + bank.length + ' · попытка записана'
            : (allAnswered ? '✓ Все ответы заполнены — нажмите «Проверить»' : 'Заполните все вопросы')),
        el('div', { style:{ display:'flex', gap:'8px', flexWrap:'wrap' }},
          STATE.testChecked
            ? el('button', { class:'btn btn-secondary',
                onclick: () => {
                  STATE.testAnswers = {};
                  STATE.testChecked = false;
                  /* В shuffled-режиме — пересобрать подборку */
                  if(STATE.testShuffle) STATE.shuffledBank = null;
                  render();
                }
              }, '↻ Пройти ещё раз')
            : null,
          STATE.testChecked
            ? el('button', { class:'btn btn-y',
                onclick: () => {
                  ME_STUDENT.bee += correct * 2;
                  STATE.testOpen = null;
                  STATE.testAnswers = {};
                  STATE.testChecked = false;
                  STATE.testShuffle = null;
                  STATE.shuffledBank = null;
                  showToast('Сохранено · +' + (correct * 2) + ' 🐝 на счёт');
                }
              }, 'Сохранить и закрыть')
            : el('button', { class:'btn btn-p',
                onclick: () => {
                  /* Берём свежее состояние — на случай если ввод текста не вызвал ререндер */
                  const allNow = bank.every(isAnswered);
                  if(!allNow){ showToast('Заполните все вопросы'); return; }
                  STATE.testChecked = true; render();
                }
              }, '✓ Проверить')))));
}

          el('h3', { style:{ color:'var(--ink)' }}, pendingCount + ' заявки ждут одобрения'),
          el('div', { style:{ fontSize:'13px', color:'var(--ink)', opacity:.85 }},
            'Гости оплатили интенсив и ждут, когда вы откроете им доступ')),
        el('button', { class:'btn btn-primary',
          onclick: () => { STATE.teacherTab = 'students'; render(); }

  }

  if(preCheckedEssays > 0){
    wrap.append(el('div', { class:'card', style:{ marginBottom:'18px', background:'var(--teal-soft)', border:'1px solid #5EEAD4' }},

        el('span', { style:{ fontSize:'28px' }}, '🤝'),
        el('div', { style:{ flex:1, minWidth:'200px' }},

            'Кураторы проверили предварительно. Просмотрите и опубликуйте.')),
        el('button', { class:'btn btn-teal',

        }, 'Открыть →'))));
  }

  const kpiRow = el('div', { class:'grid grid-4' });

    kpiCard('Учеников', total,
      STUDENTS.filter(s => s.type === 'свой').length + ' своих · ' + STUDENTS.filter(s => s.type === 'гость').length + ' гостей',
      '👥', 'var(--p-soft)'),
    kpiCard('Активны сегодня', activeCount,
      '↑ ' + Math.round(activeCount / total * 100) + '% от группы', '✅', 'var(--green-soft)'),
    kpiCard('Средний балл', '78%', '↑ +4% к вчера', '🎯', '#FFEDD5'),
    el('div', { class:'card kpi card-pink' },
      el('div', { class:'ic-box', style:{ background:'rgba(239,68,68,.18)' }}, '⚠️'),
      el('div', { class:'label' }, 'Не приступали'),
      el('div', { class:'value' }, notStarted),
      el('div', { class:'hint' }, 'стоит написать')));
  wrap.append(kpiRow);
  wrap.append(el('div', { style:{ height:'18px' }}));

  /* Посещаемость + слабые места + сочинения */
  const row = el('div', { class:'grid grid-2' });

  /* Посещаемость */
  const attendBox = el('div', { class:'card' });
  const attended = Object.keys(ATTENDANCE.webinar1).filter(k => ATTENDANCE.webinar1[k]).length;
  attendBox.append(
    el('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px' }},

      el('button', { class:'btn btn-y btn-sm',

      }, 'Отметить')),
    el('p', { style:{ color:'var(--ink-2)', fontSize:'13px', marginBottom:'14px' }},
      'Сегодняшний вебинар идёт. Ученики могут отметиться сами кнопкой «Я на уроке».'),
    el('div', { style:{ marginBottom:'10px' }},
      el('div', { style:{ display:'flex', justifyContent:'space-between', fontSize:'12px', color:'var(--ink-2)', marginBottom:'4px' }},

        el('i', { style:{ width: (attended / total * 100) + '%' }}))),
    el('div', { style:{ fontSize:'12px', color:'var(--ink-3)' }},
      '🟡 серым — отметились сами · 🟢 зелёным — отметили вы'));

  /* Слабые места */

    el('h2', { style:{ marginBottom:'10px' }}, '⚠️ Слабые места группы'),

  wrap.append(el('div', { style:{ height:'18px' }}));

    el('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:'14px' }},

      chip(ESSAYS.filter(e => e.status === 'new').length + ' новых', 'red')));
  ESSAYS.slice(0, 3).forEach(e => essayQueue.append(essayRow(e, false)));
  wrap.append(essayQueue);
  return wrap;

function weakTopicRow(t){
  const colorMap = { red:'var(--red)', orange:'var(--warn)', green:'var(--green)' };
  const bgMap = { red:'var(--red-soft)', orange:'var(--warn-soft)', green:'var(--green-soft)' };
  return el('div', {
    style:{ display:'grid', gridTemplateColumns:'160px 1fr 50px', alignItems:'center', gap:'10px', marginBottom:'8px' }
  },
    el('span', { style:{ fontSize:'13px', fontWeight:'600' }}, t.name),
    el('div', { style:{ height:'24px', background: bgMap[t.level], borderRadius:'999px', overflow:'hidden', position:'relative' }},
      el('div', { style:{ height:'100%', width: t.pct + '%', background: colorMap[t.level], display:'flex', alignItems:'center', paddingLeft:'10px', color:'#fff', fontSize:'11px', fontWeight:'700' }},
        t.pct + '% ошибок')),
    el('span', { style:{ textAlign:'right', fontWeight:'800', color: colorMap[t.level] }}, t.pct + '%'));
}

function essayRow(e, isCurator){
  let stChip;
  if(e.status === 'new') stChip = chip('новое', 'red');
  else if(e.status === 'in_progress') stChip = chip('в работе', 'warn');
  else if(e.status === 'pre_checked') stChip = chip('🤝 проверено куратором', 'teal');
  else stChip = chip('готово', 'green');

  return el('div', {
    class:'card',
    style:{ background:'var(--surface-soft)', padding:'12px 14px', cursor:'pointer', display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px' },
    onclick: () => { STATE.essayOpen = e.id; STATE.essayBy = isCurator ? 'curator' : 'teacher'; render(); }
  },
    el('div', { style:{ display:'flex', gap:'10px', alignItems:'center', minWidth:0 }},
      el('span', { style:{ fontSize:'20px' }}, '📝'),
      el('div', { style:{ minWidth:0 }},
        el('div', { style:{ fontWeight:'700' }}, e.studentName),
        el('div', { style:{ fontSize:'12px', color:'var(--ink-2)' }},
          e.text + ' · ' + e.when + (e.preBy ? ' · 🤝 София: ' + e.preScore + '/22' : '')))),
    stChip);
}

/* =======================================================================
   ФОРМА ПРОВЕРКИ СОЧИНЕНИЯ (К1–К10)
   ======================================================================= */
function modalEssayReview(essayId){
  const essay = ESSAYS.find(e => e.id === essayId);
  if(!essay) return null;

  const k1 = STATE.scoresK.K1 ?? 1;
  const lockK2K3 = k1 === 0;

  let total = 0, max = 0;
  CRIT.forEach(c => {
    max += c.max;
    let v = STATE.scoresK[c.id];
    if((c.id === 'K2' || c.id === 'K3') && lockK2K3) v = 0;
    if(v == null) v = c.max;
    total += v;
  });

  const sectionScore = sec => {
    let s = 0, m = 0;
    CRIT.filter(c => c.sec === sec).forEach(c => {
      m += c.max;
      let v = STATE.scoresK[c.id];
      if((c.id === 'K2' || c.id === 'K3') && lockK2K3) v = 0;
      if(v == null) v = c.max;
      s += v;
    });
    return s + '/' + m;
  };

  const wordCount = SAMPLE_ESSAY_TEXT.split(/\s+/).filter(Boolean).length;
  const isCurator = STATE.essayBy === 'curator';

  /* Левая колонка */
  const leftCol = el('div', null);
  leftCol.append(
    el('div', { style:{ display:'flex', gap:'8px', alignItems:'center', marginBottom:'10px', flexWrap:'wrap' }},
      chip('📝 текстовая сдача', 'p'),
      chip(wordCount + ' слов · ' + (wordCount >= 150 ? 'норма' : '< 150 — НЕ ЗАСЧИТЫВАЕТСЯ'),
           wordCount >= 150 ? 'green' : 'red'),
      el('button', { class:'btn-icon', title:'Также есть фото-вариант' }, '📷')),
    el('div', { class:'essay-text' }, SAMPLE_ESSAY_TEXT),
    el('div', { class:'card', style:{ marginTop:'14px', background:'var(--p-soft)' }},
      el('h4', null, '🎤 Голосовые комментарии'),
      el('p', { style:{ fontSize:'12px', color:'var(--ink-2)', marginBottom:'10px' }},
        'Выделите фрагмент текста — рядом появится окошко с кнопкой записи голоса.'),
      el('button', { class:'btn btn-secondary btn-sm',
        onclick: ev => {
          ev.target.classList.add('voice-rec');
          ev.target.innerHTML = '<span class="pulse"></span>● Идёт запись… (демо)';
          setTimeout(() => {
            ev.target.classList.remove('voice-rec');
            ev.target.classList.add('voice-saved');
            ev.target.innerHTML = '🎙️ Запись 0:14 ▶';
          }, 1500);
        }
      }, '🎤 Записать голос')));

  /* Правая колонка */
  const rightCol = el('div', null);
  rightCol.append(
    el('div', { class:'score-total' },
      el('div', null,
        el('div', { style:{ fontSize:'11px', textTransform:'uppercase', letterSpacing:'.08em', opacity:.8 }}, 'Итого'),
        el('div', { style:{ fontSize:'10px', opacity:.8 }},
          'Содержание ' + sectionScore('Содержание') + ' · Речь ' + sectionScore('Речь') + ' · Грамотность ' + sectionScore('Грамотность'))),
      el('div', { class:'big' }, total + ' / 22')),
    el('div', { style:{ height:'10px' }}));

  ['Содержание', 'Речь', 'Грамотность'].forEach(sec => rightCol.append(sectionBlock(sec, lockK2K3)));

  rightCol.append(
    el('div', { class:'card', style:{ marginTop:'14px', background:'var(--surface-soft)' }},
      el('h4', null, '💬 Общий комментарий ученику'),
      el('textarea', {
        placeholder: isCurator ? 'Куратор: ваш предварительный комментарий — учитель сможет его дополнить.' : 'Аня, отличная работа над комментарием…',
        style:{ width:'100%', padding:'10px', borderRadius:'10px', border:'1px solid var(--border-2)', minHeight:'80px', resize:'vertical', marginTop:'8px' }
      }),
      el('button', { class:'btn btn-secondary btn-sm', style:{ marginTop:'8px' },
        onclick: () => showToast('Запись голоса для общего комментария')
      }, '🎤 Записать голос')));

  /* Футер */
  const foot = el('div', { class:'modal-foot' });
  foot.append(
    el('div', { style:{ fontSize:'12px', color:'var(--ink-2)' }},
      lockK2K3 ? '⚠️ К1=0 → К2 и К3 автоматически 0 (по методике)' : '✓ К1≠0 — можно ставить К2 и К3'));

  if(isCurator){
    foot.append(el('button', { class:'btn btn-teal',
      onclick: () => { essay.status = 'pre_checked'; essay.preBy = 'c-sofia'; essay.preScore = total; STATE.essayOpen = null; STATE.scoresK = {}; STATE.errors = {}; showToast('Передано учителю · ' + total + '/22'); render(); }
    }, '✓ Передать учителю на подтверждение'));
  } else {
    foot.append(
      el('div', { style:{ display:'flex', gap:'8px', flexWrap:'wrap' }},
        el('button', { class:'btn btn-secondary',
          onclick: () => { essay.status = 'in_progress'; STATE.essayOpen = null; STATE.scoresK = {}; STATE.errors = {}; showToast('Сохранено как «в работе»'); render(); }
        }, 'Сохранить и закрыть'),
        el('button', { class:'btn btn-p',
          onclick: () => { essay.status = 'done'; essay.finalScore = total; STATE.essayOpen = null; STATE.scoresK = {}; STATE.errors = {}; showToast('Опубликовано · +' + total + ' 🐝'); render(); }
        }, '✓ Опубликовать ученику')));
  }

  /* Модаль */
  const modal = el('div', { class:'modal' });
  modal.append(
    el('div', { class:'modal-head' },
      el('div', null,
        el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.08em', fontWeight:'700' }},
          essay.studentName + ' · ' + essay.when + (isCurator ? ' · режим куратора' : '')),
        el('h2', null, '✍️ ' + essay.text)),
      el('button', { class:'x',
        onclick: () => { STATE.essayOpen = null; STATE.scoresK = {}; STATE.errors = {}; render(); }
      }, '×')),
    el('div', { class:'modal-body' },
      el('div', { class:'essay-grid' }, leftCol, rightCol)),
    foot);

  return el('div', { class:'modal-bg',
    onclick: e => { if(e.target.classList.contains('modal-bg')){ STATE.essayOpen = null; STATE.scoresK = {}; STATE.errors = {}; render(); }}
  }, modal);
}

function sectionBlock(sec, lockK2K3){
  const wrap = el('div', { style:{ marginBottom:'12px' }});
  wrap.append(
    el('div', { style:{ fontSize:'11px', textTransform:'uppercase', letterSpacing:'.08em', color:'var(--ink-3)', fontWeight:'700', marginBottom:'8px' }}, sec));
  const list = el('div', { class:'criteria' });
  CRIT.filter(c => c.sec === sec).forEach(c => list.append(critRow(c, lockK2K3)));
  wrap.append(list);
  return wrap;
}

function critRow(c, lockK2K3){
  const isLocked = lockK2K3 && (c.id === 'K2' || c.id === 'K3');
  let value = STATE.scoresK[c.id];
  if(isLocked) value = 0;
  if(value == null) value = c.max;

  let right;
  if(c.byErrors){
    right = el('div', { style:{ display:'flex', gap:'6px', alignItems:'center' }},
      el('input', { type:'number', min:'0', value: STATE.errors[c.id] != null ? STATE.errors[c.id] : 0,
        style:{ width:'56px', padding:'6px', borderRadius:'8px', border:'1px solid var(--border-2)', textAlign:'center', fontWeight:'700' },
        onchange: ev => {
          const n = +ev.target.value || 0;
          STATE.errors[c.id] = n;
          STATE.scoresK[c.id] = n === 0 ? 3 : n <= 2 ? 2 : n <= 4 ? 1 : 0;
          render();
        }
      }),
      el('span', { style:{ fontSize:'11px', color:'var(--ink-3)' }}, 'ош'),
      el('span', { style:{ fontWeight:'800', minWidth:'34px', textAlign:'right' }}, value + '/' + c.max));
  } else {
    const select = el('select', {
      style:{ padding:'6px 10px', borderRadius:'8px', border:'1px solid var(--border-2)', fontWeight:'700', minWidth:'70px' },
      disabled: isLocked || undefined,
      onchange: ev => { STATE.scoresK[c.id] = +ev.target.value; render(); }
    });
    for(let v = c.max; v >= 0; v--){
      const opt = el('option', { value: v }, v + ' / ' + c.max);
      if(v === value) opt.setAttribute('selected', 'selected');
      select.append(opt);
    }
    right = select;
  }

  return el('div', { class: 'crit ' + (isLocked ? 'locked' : ''), title: c.hint },
    el('div', { style:{ minWidth:0, flex:1 }},
      el('div', { class:'nm' }, c.id + ' · ' + c.name),
      el('div', { class:'desc' }, isLocked ? 'Заблокировано: К1 = 0' : c.hint.split('.')[0])),
    right);
}

/* =======================================================================
   ПРЕВЬЮ ВОПРОСА В РЕДАКТОРЕ — РЕНДЕР КАК У УЧЕНИКА, НО С ОТВЕТАМИ
   ======================================================================= */
function questionPreview(q, idx){
  const block = el('div', { style:{ marginBottom:'12px', padding:'14px', border:'1px solid var(--border)', borderRadius:'12px', background:'#FFFCF2' }});

  /* Шапка */
  let typeLabel = q.text ? (q.pair ? '🔁 пара паронимов' : '✏️ короткий ответ')
                : q.multi ? '☑ несколько верных'
                : '○ один верный';
  block.append(el('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px' }},
    el('div', { style:{ display:'flex', gap:'6px', alignItems:'center' }},
      chip(typeLabel, q.text ? 'p' : q.multi ? 'y' : 'grey'),
      el('span', { style:{ fontSize:'11px', color:'var(--ink-3)' }}, '#' + (idx+1))),
    el('div', { style:{ display:'flex', gap:'4px' }},
      el('button', { class:'btn-icon',
        onclick: () => showToast('Редактировать вопрос')
      }, '✏️'),
      el('button', { class:'btn-icon', style:{ color:'var(--red)' },
        onclick: () => showToast('Удалить вопрос')
      }, '🗑'))));

  /* Текст вопроса */
  block.append(el('div', { style:{ fontWeight:'700', marginBottom:'10px' }}, q.q));

  /* Контекст (предложение в кавычках) */
  if(q.context){
    block.append(el('div', { style:{ padding:'10px 12px', background:'#fff', borderRadius:'8px', borderLeft:'3px solid var(--p)', marginBottom:'10px', fontSize:'13px', fontStyle:'italic', color:'var(--ink-2)' }}, q.context));
  }

  /* Предложения (для задания 5) */
  if(q.sentences){
    const sentList = el('div', { style:{ marginBottom:'10px', display:'flex', flexDirection:'column', gap:'6px' }});
    q.sentences.forEach((s, si) => {
      const html = s.replace(/[А-ЯЁ]{3,}/g, m => '<b style="background:#FEF9C3;padding:1px 4px;border-radius:3px">' + m + '</b>');
      sentList.append(el('div', {
        html: '<span style="color:var(--ink-3);font-size:11px;font-weight:700;margin-right:6px">' + (si+1) + ')</span>' + html,
        style:{ padding:'8px 12px', background:'#fff', borderRadius:'8px', borderLeft:'3px solid var(--p-2)', fontSize:'13px', lineHeight:'1.5' }
      }));
    });
    block.append(sentList);
  }

  /* Большое слово для пар */
  if(q.pair && q.word){
    block.append(el('div', { style:{ textAlign:'center', padding:'14px', background:'linear-gradient(135deg, #FEF9C3, #FDE68A)', borderRadius:'12px', marginBottom:'10px', border:'1px solid var(--y-2)' }},
      el('div', { style:{ fontSize:'10px', color:'#854D0E', textTransform:'uppercase', fontWeight:'700', marginBottom:'6px', letterSpacing:'.08em' }}, '🔁 Слово'),
      el('div', { style:{ fontSize:'24px', fontWeight:'800', letterSpacing:'-.02em', color:'var(--ink)' }}, q.word)));
  }

  /* Ответ — поле или варианты с правильным ответом */
  if(q.text){
    const accept = Array.isArray(q.a) ? q.a : [q.a];
    block.append(el('div', null,
      el('input', {
        type:'text', value: accept[0], readonly:'readonly',
        style:{ width:'100%', padding:'10px 14px', borderRadius:'10px', fontSize:'14px',
                border:'2px solid var(--green)', background:'var(--green-soft)', color:'#065F46', fontWeight:'700' }
      }),
      accept.length > 1
        ? el('div', { style:{ marginTop:'6px', fontSize:'12px', color:'var(--ink-2)' }},
            'Также принимаются: ' + accept.slice(1).join(', '))
        : null));
  } else {
    const opts = el('div', { style:{ display:'flex', flexDirection:'column', gap:'6px' }});
    q.opts.forEach((opt, i) => {
      const isCorrect = q.multi ? q.a.includes(i) : i === q.a;
      opts.append(el('div', {
        style:{ padding:'10px 14px', borderRadius:'10px', display:'flex', alignItems:'center', gap:'10px',
                background: isCorrect ? 'var(--green-soft)' : '#fff',
                color: isCorrect ? '#065F46' : 'var(--ink-2)',
                border: '1px solid ' + (isCorrect ? 'var(--green)' : 'var(--border-2)'),
                fontWeight: isCorrect ? '700' : '500' }
      },
        q.multi ? (isCorrect ? '☑' : '☐') : (isCorrect ? '●' : '○'),
        (i+1) + ') ' + opt));
    });
    block.append(opts);
  }

  /* Подсказка */
  if(q.hint){
    block.append(el('div', { style:{ marginTop:'8px', padding:'8px 10px', background:'var(--p-soft)', borderRadius:'8px', fontSize:'12px', color:'var(--p-deep)' }},
      '💡 ' + q.hint));
  }

  if(q.src){
    block.append(el('div', { style:{ marginTop:'6px', fontSize:'10px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.06em', fontWeight:'700' }},
      '📚 ' + q.src));
  }

  return block;
}

            el('div', { style:{ fontSize:'12px', color:'var(--ink-3)' }}, t.kind + ' · ' + t.est)),
          el('div', { style:{ display:'flex', gap:'6px' }},
            el('button', { class:'btn btn-secondary btn-sm',
              onclick: ev => { ev.preventDefault(); showToast('Откроется редактор'); }
            }, 'Редактировать'),
            el('button', { class:'btn btn-secondary btn-sm', style:{ color:'var(--red)' },
              onclick: ev => { ev.preventDefault(); showToast('Подтвердите удаление'); }
            }, 'Удалить'))));
    });
    inner.append(
      el('button', { class:'btn btn-y btn-sm', style:{ alignSelf:'flex-start' },
        onclick: ev => { ev.preventDefault(); showToast('Форма создания нового задания'); }
      }, '＋ Добавить задание'));
    det.append(inner);
    wrap.append(det);
  });
  return wrap;
}

/* =======================================================================
   КУРАТОР · ВСЕ ВКЛАДКИ
   ======================================================================= */
function viewCuratorStudents(){
  const wrap = el('div', { class:'fade-in' });
  wrap.append(
    el('h1', null, '👥 Ученики'),
    el('p', { style:{ color:'var(--ink-2)', marginBottom:'20px' }},
      'Вы видите прогресс всех учеников. Можете писать им в чате и помечать ответы как «помогло».'),
    el('div', { class:'card', style:{ padding:0, overflow:'hidden' }},
      el('table', { class:'table' },
        el('thead', null, el('tr', null,
          el('th', null, 'Ученик'),
          el('th', null, 'Тип'),
          el('th', null, 'Прогресс'),
          el('th', null, 'Пчёлки'),
          el('th', null, 'Балл'),
          el('th', null, 'Статус'),
          el('th', { style:{ textAlign:'right' }}, ''))),
        el('tbody', null,
          STUDENTS.filter(s => s.status !== 'pending').map(s =>
            el('tr', null,
              el('td', null, el('div', { style:{ display:'flex', gap:'10px', alignItems:'center' }},
                avatarChip(s.name, s.color),
                el('div', null,
                  el('div', { style:{ fontWeight:'700' }}, s.name),
                  el('div', { style:{ fontSize:'11px', color:'var(--ink-3)' }}, s.email)))),
              el('td', null, s.type === 'свой' ? chip('🐝 свой', 'y') : chip('⭐ гость', 'grey')),
              el('td', null, s.progress != null
                ? el('div', { style:{ display:'flex', gap:'8px', alignItems:'center' }},
                    el('div', { style:{ flex:1, maxWidth:'120px' }}, el('div', { class:'bar thin' }, el('i', { style:{ width: s.progress+'%' }}))),
                    el('span', { style:{ fontWeight:'700', fontSize:'13px' }}, s.progress + '%'))
                : '—'),
              el('td', null, s.bee != null ? '🐝 ' + s.bee : '—'),
              el('td', null, s.avg != null ? el('b', null, s.avg + '%') : '—'),
              el('td', null, statusChip(s.status)),
              el('td', { style:{ textAlign:'right' }},
                el('button', { class:'btn-icon', title:'Написать в чате',
                  onclick: () => { STATE.chatOpen = true; STATE.chatChannel = 'dm'; render(); }
                }, '💬'))))))));
  return wrap;
}

function viewCuratorEssays(){
  const wrap = el('div', { class:'fade-in' });
  wrap.append(
    el('h1', null, '📝 Сочинения · предварительная проверка'),
    el('p', { style:{ color:'var(--ink-2)', marginBottom:'20px' }},
      'Куратор делает первичную оценку. После — учитель утверждает финально.'));
  ESSAYS.filter(e => e.status === 'new' || (e.status === 'pre_checked' && e.preBy === 'c-sofia')).forEach(e => wrap.append(essayRow(e, true)));
  return wrap;
}

function viewCuratorChat(){
  return el('div', { class:'fade-in' },
    el('h1', null, '💬 Чат'),
    el('p', { style:{ color:'var(--ink-2)', marginBottom:'20px' }},
      'Открывайте плавающий чат справа внизу. Под своими сообщениями вы будете подписаны как «куратор».'));
}

/* =======================================================================
   ЧАТ
   ======================================================================= */
function chatPanel(role){
  if(!STATE.chatOpen) return null;
  const meId = role === 'teacher' ? 't' : role === 'curator' ? 'c-sofia' : 's2';
  const meName = role === 'teacher' ? 'Учитель' : role === 'curator' ? 'София' : 'я';
  const msgs = STATE.chatChannel === 'group' ? CHAT_GROUP : CHAT_DM;

  const panel = el('div', { class:'chat-panel' });
  panel.append(
    el('div', { class:'chat-head' },
      el('div', null,
        el('h4', null, '💬 Чат интенсива'),
        el('div', { style:{ fontSize:'11px', opacity:.8 }}, '🐝 Краш-тест 2026')),
      el('button', { style:{ color:'#fff', fontSize:'18px' },
        onclick: () => { STATE.chatOpen = false; render(); }
      }, '×')),
    el('div', { class:'chat-tabs' },
      el('button', { class: STATE.chatChannel === 'group' ? 'active' : '',
        onclick: () => { STATE.chatChannel = 'group'; render(); }
      }, 'Общий'),
      el('button', { class: STATE.chatChannel === 'dm' ? 'active' : '',
        onclick: () => { STATE.chatChannel = 'dm'; render(); }
      }, role === 'student' ? 'Личное · Учитель' : 'Личное · Аня')));

  const msgsBox = el('div', { class:'chat-msgs', id:'chat-msgs' });
  msgs.forEach(m => msgsBox.append(chatBubble(m, role, meId)));
  panel.append(msgsBox);

  panel.append(
    el('div', { class:'chat-input' },
      el('input', { id:'chat-i', placeholder:'Сообщение…',
        onkeydown: e => { if(e.key === 'Enter'){ e.preventDefault(); sendChat(role, meId, meName); }}}),
      el('button', { onclick: () => sendChat(role, meId, meName) }, 'Отправить')));
  return panel;
}

function chatBubble(m, role, meId){
  const mine = m.from === meId;
  const canMark = (role === 'teacher' || role === 'curator') && m.helpable && !mine;
  const wasMarked = STATE.helpedMsgs[m.id];
  const bubble = el('div', { class: 'bubble ' + (mine ? 'me' : 'them') });
  if(!mine){
    const who = el('div', { class:'who' }, m.name);
    if(m.curator) who.append(el('span', { class:'role-mini' }, '🤝 куратор'));
    if(m.from === 't') who.append(el('span', { class:'role-mini', style:{ background:'var(--p-soft)', color:'var(--p-deep)' }}, '👩‍🏫 учитель'));
    bubble.append(who);
  }
  bubble.append(el('div', null, m.text));
  bubble.append(el('div', { class:'time' }, m.time));
  if(canMark){
    bubble.append(
      el('button', { class:'helped-btn ' + (wasMarked ? 'active' : ''),
        onclick: () => {
          if(!wasMarked){
            STATE.helpedMsgs[m.id] = true;
            showToast('🤝 ' + m.name + ' получает «Помогла другу» (+10 🐝)');
            render();
          }
        }
      }, wasMarked ? '✓ помогло' : '🤝 пометить «помогло»'));
  }
  return bubble;
}

function sendChat(role, meId, meName){
  const i = document.getElementById('chat-i');
  if(!i || !i.value.trim()) return;
  const arr = STATE.chatChannel === 'group' ? CHAT_GROUP : CHAT_DM;
  arr.push({
    id: 'm' + Date.now(),
    from: meId, name: meName, text: i.value,
    time: new Date().toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' }),
    curator: role === 'curator'
  });
  i.value = '';
  render();
}

function chatFab(){
  return el('button', { class:'chat-fab',
    onclick: () => { STATE.chatOpen = true; render(); },
    title: 'Чат'
  }, '💬', el('span', { class:'dot' }));
}

/* =======================================================================
   ОСНОВНОЙ РЕНДЕР
   ======================================================================= */
function render(){
  const root = document.getElementById('root');
  root.innerHTML = '';

  if(STATE.view === 'login'){
    root.append(viewLogin());
    if(STATE.toast) root.append(el('div', { class:'toast' }, STATE.toast));
    return;
  }

  if(STATE.view === 'student'){
    const tabs = [
      { key:'home', label:'Главная', ic:'🏠' },
      { key:'days', label:'Дни интенсива', ic:'📅' },
      { key:'theory', label:'Теория', ic:'📚' },
      { key:'achievements', label:'Достижения', ic:'🏆' },
      { key:'profile', label:'Профиль', ic:'👤' },
    ];
    const map = {
      home: viewStudentHome,
      days: viewStudentDays,
      theory: viewStudentTheory,
      achievements: viewStudentAchievements,
      profile: viewStudentProfile,
    };
    const content = map[STATE.studentTab]();
    root.append(
      shellHeader('student'),
      shellTabs('student', tabs, STATE.studentTab, k => { STATE.studentTab = k; render(); }),
      el('main', { class:'main' }, content),
      chatFab()
    );
  }

  if(STATE.view === 'curator'){
    const tabs = [
      { key:'students', label:'Ученики', ic:'👥' },
      { key:'essays', label:'Сочинения', ic:'📝',
        badge: ESSAYS.filter(e => e.status === 'new').length || null },
      { key:'chat', label:'Чат', ic:'💬' },
    ];
    const map = {
      students: viewCuratorStudents,
      essays: viewCuratorEssays,
      chat: viewCuratorChat,
    };
    const content = map[STATE.curatorTab]();
    root.append(
      shellHeader('curator'),
      shellTabs('curator', tabs, STATE.curatorTab, k => { STATE.curatorTab = k; render(); }),
      el('main', { class:'main' }, content),
      chatFab()
    );
  }

  if(STATE.view === 'teacher'){
    const pendingCount = STUDENTS.filter(s => s.status === 'pending').length;
    const newEssays = ESSAYS.filter(e => e.status === 'new').length;
    const preCheckEssays = ESSAYS.filter(e => e.status === 'pre_checked').length;
    const tabs = [
      { key:'overview', label:'Сводка', ic:'📊' },
      { key:'students', label:'Ученики', ic:'👥', badge: pendingCount || null, badgeKind:'warn' },
      { key:'attendance', label:'Посещаемость', ic:'✓' },
      { key:'payments', label:'Оплаты', ic:'💰' },
      { key:'essays', label:'Сочинения', ic:'📝', badge: (newEssays + preCheckEssays) || null },
      { key:'analytics', label:'Аналитика', ic:'📈' },
      { key:'content', label:'Контент', ic:'📚' },
      { key:'days', label:'Дни', ic:'📅' },
    ];
    const map = {
      overview: viewTeacherOverview,
      students: viewTeacherStudents,
      attendance: viewTeacherAttendance,
      payments: viewTeacherPayments,
      essays: viewTeacherEssays,
      analytics: viewTeacherAnalytics,
      content: viewTeacherContent,
      days: viewTeacherDays,
    };
    const content = map[STATE.teacherTab]();
    root.append(
      shellHeader('teacher'),
      shellTabs('teacher', tabs, STATE.teacherTab, k => { STATE.teacherTab = k; render(); }),
      el('main', { class:'main' }, content),
      chatFab()
    );
  }

  /* Модалки */
  if(STATE.testOpen != null) root.append(modalTest(STATE.testOpen));
  if(STATE.essayOpen) root.append(modalEssayReview(STATE.essayOpen));
  if(STATE.newStudentForm) root.append(modalNewStudent());
  if(STATE.curatorPermsFor) root.append(modalCuratorPerms());
  if(STATE.attendanceOpen) root.append(modalAttendance());
  if(STATE.theoryOpen != null) root.append(modalTheory(STATE.theoryOpen));
  if(STATE.contentEditTaskN != null) root.append(modalEditTheory(STATE.contentEditTaskN));
  if(STATE.variantMode) root.append(modalVariantBuilder());
  if(STATE.showOnboarding) root.append(modalOnboarding());
  if(STATE.chatOpen && STATE.view !== 'login') root.append(chatPanel(STATE.view));
  if(STATE.toast) root.append(el('div', { class:'toast' }, STATE.toast));
}

/* Стартуем с восстановления сессии (если есть) */
if(sb){
  restoreSession();
} else {
  STATE.authLoading = false;
  STATE.authMode = 'demo';
  render();
}
</script>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ЗебРус · Краш-тест 2026 — прототип платформы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
:root{
  --bg:#FFFAF2; --surface:#FFFFFF; --surface-soft:#FFF7E0;
  --ink:#1A1B3A; --ink-2:#4B4E6D; --ink-3:#94A3B8;
  --y:#FACC15; --y-2:#FDE68A; --y-soft:#FEF9C3;
  --p:#8B5CF6; --p-2:#C4B5FD; --p-soft:#F3E8FF;
  --p-deep:#6D28D9;
  --o-from:#FB923C; --o-to:#F97316;
  --peach:#FED7AA; --peach-soft:#FFEDD5;
  --green:#10B981; --green-soft:#D1FAE5;
  --warn:#F59E0B; --warn-soft:#FED7AA;
  --red:#EF4444; --red-soft:#FECACA;
  --pink-soft:#FCE7F3;
  --teal:#14B8A6; --teal-soft:#CCFBF1;
  --border:#F1E9D9; --border-2:#E5E7EB;
  --shadow:0 1px 3px rgba(26,27,58,.06);
  --shadow-md:0 4px 16px rgba(26,27,58,.08);
  --shadow-lg:0 12px 32px rgba(26,27,58,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:0;background:transparent;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--p);text-decoration:none;cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:800;color:var(--ink);letter-spacing:-.01em}
h1{font-size:28px;line-height:1.15} h2{font-size:22px} h3{font-size:17px} h4{font-size:14px}
.fade-in{animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.banner{background:#FEF3C7;color:#92400E;font-size:11px;text-align:center;padding:6px;border-bottom:1px solid #FDE68A}

/* ============ ЛОГО ============ */
.zebrus{font-family:'Manrope';font-weight:800;line-height:1;display:inline-flex;align-items:center;gap:8px;letter-spacing:-.02em}
.zebrus-text{display:inline}
.zebrus .zeb{color:var(--y);text-shadow:0 1px 0 rgba(0,0,0,.08)}
.zebrus .rus{color:var(--p)}

/* ============ ШАПКА ============ */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;box-shadow:var(--shadow)}
.topbar .left{display:flex;align-items:center;gap:14px}
.role-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap}
.role-pill.student{background:var(--y);color:var(--ink)}
.role-pill.teacher{background:var(--p);color:#fff}
.role-pill.curator{background:var(--teal);color:#fff}

.topbar .right{display:flex;align-items:center;gap:10px}
.bee-counter{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--y-soft);font-weight:700;color:var(--ink)}
.bell{width:36px;height:36px;border-radius:50%;background:var(--y-soft);display:inline-flex;align-items:center;justify-content:center;position:relative;font-size:16px}
.bell .dot{position:absolute;top:6px;right:8px;width:7px;height:7px;background:var(--red);border-radius:50%;border:2px solid var(--y-soft)}
.user-pill{display:flex;align-items:center;gap:9px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--p-soft);color:var(--ink)}
.user-pill .avatar{width:30px;height:30px;border-radius:50%;background:var(--p);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.user-pill .who{line-height:1.15;font-size:12px}
.user-pill .who b{display:block;font-weight:700;font-size:13px;color:var(--ink)}
.user-pill .who span{color:var(--ink-2)}
.role-switch{font-size:11px;padding:6px 10px;border-radius:8px;border:1px solid var(--border-2);color:var(--ink-2);background:var(--surface)}
.role-switch:hover{background:var(--bg)}

/* ============ ВКЛАДКИ ============ */
.tabs{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:6px;overflow-x:auto}
.tab{display:inline-flex;align-items:center;gap:8px;padding:14px 16px;border:0;font-weight:700;color:var(--ink-2);position:relative;white-space:nowrap;font-size:14px;border-radius:14px 14px 0 0;background:transparent}
.tab .ic{font-size:18px}
.tab .badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700}
.tab .badge.warn{background:var(--warn)}
.tab .badge.purple{background:var(--p)}
.tab.active.student{background:var(--y);color:var(--ink)}
.tab.active.teacher{background:linear-gradient(135deg,#A78BFA,#8B5CF6);color:#fff}
.tab.active.teacher .badge{background:#fff;color:var(--p)}
.tab.active.curator{background:var(--teal);color:#fff}
.tab.active.curator .badge{background:#fff;color:var(--teal)}
.tab:hover:not(.active){background:var(--bg)}

/* ============ СТРУКТУРА ============ */
.main{padding:28px 32px}
@media (max-width:640px){
  .main{padding:14px}
  .tabs{padding:0 8px;-webkit-overflow-scrolling:touch}
  .tab{padding:12px 10px;font-size:13px}
  /* Шапка: левая группа на первой строке, правая (счётчик/аватар/кнопки) — на второй */
  .topbar{padding:8px 12px;flex-wrap:wrap;row-gap:8px;align-items:flex-start}
  .topbar .left{gap:8px;flex:1 0 100%;justify-content:flex-start;min-width:0}
  .topbar .right{gap:6px;flex:1 0 100%;flex-wrap:wrap;justify-content:flex-end;align-items:center}
  /* Если плашка интенсива слишком длинная — сжимаем шрифт и обрезаем по ширине */
  .role-pill{font-size:12px;padding:5px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55vw}
  /* В user-pill оставляем имя, но без подзаголовка «Ученик»/«Учитель» */
  .user-pill{padding:3px 10px 3px 3px}
  .user-pill .who{font-size:11px;line-height:1.1}
  .user-pill .who b{font-size:12px}
  .user-pill .who span{display:none}
  /* Кнопка «Сменить роль» сжимается, текст одной строкой */
  .role-switch{font-size:11px;padding:5px 8px;white-space:nowrap}
  .bee-counter{font-size:12px;padding:4px 9px}
}

/* ============ КАРТОЧКИ ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.theory-md h1, .theory-md h2, .theory-md h3, .theory-md h4{margin:14px 0 6px; color:var(--ink); font-weight:700}
.theory-md h1{font-size:18px} .theory-md h2{font-size:16px; color:var(--p)} .theory-md h3{font-size:14px}
.theory-md p{margin:6px 0}
.theory-md ul, .theory-md ol{margin:6px 0 6px 18px; padding-left:6px}
.theory-md li{margin:3px 0}
.theory-md strong{color:var(--ink); font-weight:700}
.theory-md em{color:var(--ink-2)}
.theory-md blockquote{margin:8px 0; padding:8px 12px; border-left:3px solid var(--y); background:#FFFCF2; border-radius:8px; color:var(--ink)}
.theory-md code{background:var(--bg); padding:2px 5px; border-radius:4px; font-size:90%}
.theory-md hr{border:none; border-top:1px solid var(--border); margin:12px 0}
.card-soft-y{background:var(--y-soft);border:1px solid var(--y-2)}
.card-soft-p{background:var(--p-soft);border:1px solid var(--p-2)}
.card-orange{background:linear-gradient(135deg,#FB923C 0%,#F97316 100%);color:#1f1f1f;border:0}
.card-orange h2{color:var(--ink)}
.card-pink{background:#FFE4E6;border:1px solid #FECDD3}
.card-teal{background:var(--teal-soft);border:1px solid #5EEAD4}

.kpi{display:flex;flex-direction:column;gap:10px}
.kpi .ic-box{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:20px}
.kpi .label{font-size:11px;text-transform:uppercase;color:var(--ink-3);letter-spacing:.08em;font-weight:700}
.kpi .value{font-size:32px;font-weight:800;line-height:1;letter-spacing:-.02em}
.kpi .hint{font-size:12px;color:var(--ink-2)}

.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:980px){.grid-3,.grid-4{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

/* ============ КНОПКИ ============ */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;transition:all .15s;text-decoration:none}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#0F0F26}
.btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--border-2)}
.btn-secondary:hover{background:var(--bg)}
.btn-y{background:var(--y);color:var(--ink)}
.btn-y:hover{background:#F4B617}
.btn-p{background:var(--p);color:#fff}
.btn-p:hover{background:#7C3AED}
.btn-teal{background:var(--teal);color:#fff}
.btn-o{background:linear-gradient(135deg,#F97316,#EA580C);color:#fff}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:10px}
.btn-icon{width:32px;height:32px;border-radius:8px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink-2)}
.btn-icon:hover{background:var(--p-soft);color:var(--p)}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ============ ПЛАШКИ-СТАТУСЫ ============ */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.chip-y{background:var(--y-soft);color:#854D0E}
.chip-p{background:var(--p-soft);color:#5B21B6}
.chip-green{background:var(--green-soft);color:#065F46}
.chip-red{background:var(--red-soft);color:#991B1B}
.chip-warn{background:var(--warn-soft);color:#92400E}
.chip-grey{background:#F1F5F9;color:#475569}
.chip-teal{background:var(--teal-soft);color:#115E59}

/* ============ ПРОГРЕСС ============ */
.bar{height:8px;background:var(--p-soft);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--y) 0%,var(--o-to) 100%);transition:width .6s}
.bar.thin{height:6px}

/* ============ ТАБЛИЦА ============ */
.table{width:100%;border-collapse:separate;border-spacing:0}
.table th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--ink-3);letter-spacing:.08em;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700}
.table td{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:hover td{background:#FFFCF2}
.avatar-sm{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px}

/* ============ ВХОД ============ */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 32px);padding:24px}
.login-card{background:var(--surface);border-radius:24px;padding:36px;max-width:440px;width:100%;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.login-hero{display:flex;flex-direction:column;align-items:center;margin-bottom:8px}
.login-hero .bee-big{font-size:48px;margin-bottom:8px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-6px) rotate(5deg)}}
.login-card h1{text-align:center;font-size:24px;line-height:1.25}
.login-card .sub{text-align:center;color:var(--ink-2);margin:6px 0 24px;line-height:1.5}
.login-btn{display:flex;width:100%;justify-content:center;padding:14px;border-radius:14px;font-weight:700;font-size:14px;margin-bottom:10px;transition:transform .1s}
.login-btn:hover{transform:translateY(-1px)}
.divider{text-align:center;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:18px 0}
.foot-note{text-align:center;color:var(--ink-3);font-size:11px;margin-top:16px}

/* ============ КАРТА ИНТЕНСИВА ============ */
.intensive-map{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.intensive-map{grid-template-columns:1fr 1fr}}
.day-card{padding:16px;border-radius:16px;background:var(--p-soft);border:1px solid var(--p-2);min-height:130px;display:flex;flex-direction:column;justify-content:space-between}
.day-card.today{background:linear-gradient(135deg,#FDE68A,#FACC15);border:1px solid #F59E0B;color:var(--ink);box-shadow:0 4px 16px rgba(250,204,21,.35)}
.day-card.work{background:#FFFFFF;border:1px solid var(--border-2)}
.day-card.walk{background:#FCE7F3;border:1px solid #FBCFE8}
.day-card.exam{background:linear-gradient(135deg,#FB923C,#F97316);color:#fff;border:0}
.day-card.exam h3{color:#fff}
.day-card .ord{font-size:36px;font-weight:800;line-height:1;letter-spacing:-.04em;color:var(--p);font-style:italic}
.day-card.today .ord{color:#92400E}
.day-card.exam .ord{color:#fff}
.day-card .meta{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;margin-top:8px;font-weight:600}
.day-card .ttl{font-size:15px;font-weight:800;margin-top:4px}
.day-card .small{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:8px}
.day-card.today .small{color:#92400E}
.day-card .badge-today{display:inline-block;background:var(--ink);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}

/* ============ ДОСТИЖЕНИЯ ============ */
.ach-cat{margin-bottom:20px}
.ach-cat-title{font-size:12px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ach{padding:18px 14px;border-radius:14px;background:var(--y-soft);border:1px solid var(--y-2);text-align:center}
.ach.locked{background:#F1F5F9;border:1px solid #E2E8F0;opacity:.65;filter:saturate(.4)}
.ach .em{font-size:32px;line-height:1}
.ach .nm{font-size:13px;font-weight:800;margin-top:8px}
.ach .desc{font-size:11px;color:var(--ink-2);margin-top:6px;line-height:1.4}
.ach .pts{display:inline-block;font-size:10px;font-weight:700;color:var(--ink-3);margin-top:6px}

/* ============ АКТИВНОСТЬ ============ */
.act-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border)}
.act-item:first-child{border-top:0}
.act-left{display:flex;align-items:center;gap:12px;min-width:0}
.act-ic{width:36px;height:36px;border-radius:10px;background:var(--y-soft);display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.act-text{font-size:13px;font-weight:600}
.act-meta{font-size:11px;color:var(--ink-3)}
.act-points{background:var(--y);color:var(--ink);padding:4px 10px;border-radius:999px;font-weight:700;font-size:12px;flex-shrink:0}

/* ============ ТЕОРИЯ — СЕТКА 26 ============ */
.theory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.theory-card{padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-height:130px;transition:transform .12s, box-shadow .12s, border-color .12s}
.theory-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--p-2)}
.theory-card .num{font-size:30px;font-weight:800;color:var(--p);font-style:italic;line-height:1;letter-spacing:-.04em}
.theory-card .topic{font-size:12px;font-weight:700;margin-top:8px;color:var(--ink)}
.theory-card .day-tag{display:inline-block;font-size:10px;text-transform:uppercase;font-weight:700;letter-spacing:.06em;color:var(--ink-3);margin-top:6px}
.theory-card.weak{background:#FEE2E2;border-color:#FCA5A5}
.theory-card.weak .num{color:var(--red)}
.theory-card.ok{background:var(--green-soft);border-color:#86EFAC}
.theory-card.ok .num{color:var(--green)}
.theory-card.day1{border-left:4px solid var(--y)}
.theory-card.day2{border-left:4px solid var(--p)}
.theory-card.day3{border-left:4px solid var(--o-to)}

/* ============ ОБРАЗЦЫ ============ */
.sample-card{padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--border);margin-bottom:12px;cursor:pointer;transition:transform .12s, box-shadow .12s}
.sample-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.sample-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sample-card .score{font-size:22px;font-weight:800;color:var(--green)}
.sample-card .score.medium{color:var(--warn)}
.sample-card .score.low{color:var(--red)}

/* ============ ЧАТ ============ */
.chat-fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#A78BFA,#8B5CF6);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);z-index:25;border:0}
.chat-fab .dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid #fff}
.chat-panel{position:fixed;bottom:90px;right:24px;width:340px;max-width:calc(100vw - 48px);height:480px;max-height:70vh;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;border:1px solid var(--border);z-index:25;overflow:hidden}
.chat-head{padding:14px 16px;background:linear-gradient(135deg,#A78BFA,#8B5CF6);color:#fff;display:flex;align-items:center;justify-content:space-between}
.chat-head h4{color:#fff;font-size:15px}
.chat-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg)}
.chat-tabs button{flex:1;padding:10px;font-size:12px;font-weight:700;color:var(--ink-2)}
.chat-tabs button.active{background:var(--surface);color:var(--p);border-bottom:2px solid var(--p)}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#FAFAFA}
.bubble{max-width:78%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.4;position:relative}
.bubble.them{background:var(--surface);border:1px solid var(--border-2);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.them .who{font-size:10px;font-weight:700;color:var(--p);margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em;display:flex;gap:6px;align-items:center}
.bubble.them .who .role-mini{font-size:9px;background:var(--teal-soft);color:#115E59;padding:1px 6px;border-radius:999px;font-weight:700}
.bubble.me{background:linear-gradient(135deg,#A78BFA,#8B5CF6);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bubble .time{font-size:10px;opacity:.6;margin-top:4px}
.bubble .helped-btn{margin-top:6px;background:rgba(16,185,129,.15);color:var(--green);font-size:10px;padding:3px 8px;border-radius:999px;cursor:pointer;font-weight:700}
.bubble .helped-btn.active{background:var(--green);color:#fff}
.chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);background:var(--surface)}
.chat-input input{flex:1;padding:8px 12px;border:1px solid var(--border-2);border-radius:10px;font-size:13px}
.chat-input button{padding:8px 14px;border-radius:10px;background:var(--p);color:#fff;font-weight:700;font-size:12px}

/* ============ МОДАЛКА ============ */
.modal-bg{position:fixed;inset:0;background:rgba(26,27,58,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}

<script>
/* =======================================================================
   ПОДКЛЮЧЕНИЕ К SUPABASE
   ======================================================================= */
const SUPABASE_URL = 'https://hyczawwuehrqsqqosgub.supabase.co';
const SUPABASE_KEY = 'sb_publishable_lDyKoPpFywtZg3fG-SQS8Q_AxqsvljL';

/* Клиент создаётся при загрузке страницы. Если SDK не загрузился —
   платформа работает в демо-режиме (всё на моках, как раньше). */
let sb = null;
try {
  if(window.supabase && window.supabase.createClient){
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    console.log('✓ Supabase подключён');
  } else {
    console.warn('Supabase SDK не загрузился — работаем в демо-режиме');
  }
} catch(e){
  console.warn('Ошибка инициализации Supabase:', e.message);
}

/* Текущий профиль — заполняется после входа */
let MY_PROFILE = null;

/* =======================================================================
   СОСТОЯНИЕ
   ======================================================================= */
const STATE = {
  view: 'login',           // login | student | curator | teacher
  studentTab: 'home',      // home | days | theory | achievements | profile
  curatorTab: 'students',  // students | essays | chat
  teacherTab: 'overview',  // overview | students | attendance | payments | essays | analytics | content | days
  contentTab: 'theory',    // theory | tests | materials | samples
  contentEditTaskN: null,  // открыта модалка редактирования теории по номеру
  chatOpen: false,
  chatChannel: 'group',
  testOpen: null,
  essayOpen: null,
  essayBy: null,           // 'curator' | 'teacher' — кто проверяет
  essayDraftOpen: false,   // открыта форма сдачи сочинения у ученика
  essayDraftText: '',      // черновик текста
  essayDraftMode: 'typed', // 'typed' | 'photo'
  essayDraftPhotos: [],    // [{ url, name }] — уже залитые в Storage
  newStudentForm: false,
  curatorPermsFor: null,   // id куратора — открыта модалка прав
  variantMode: false,      // сборка случайного варианта
  toast: null,
  showOnboarding: false,
  theoryOpen: null,        // номер задания
  attendanceOpen: false,   // открыта модалка посещаемости
  scoresK: {}, errors: {}, essayComment: '', essayVoiceUrl: null,
  studentEssayResultOpen: null,
  sampleOpen: null,
  sampleEditOpen: null,  // 'new' | id — открыта форма добавления/редактирования образца
  testAnswers: {},
  testChecked: false,
  testShuffle: null,    // если задано — открыт тренажёр случайных пар (число вопросов)
  testLimit: null,      // если задано — выбрана подборка из N случайных вопросов из QUIZ_BANK
  shuffledBank: null,   // кэш перемешанной подборки на время теста
  attemptsByTask: {},   // кэш истории попыток ученика по taskN: { 5: [{...}, ...] }
  studentDetailOpen: null,        // id ученика — открыта детальная карточка у учителя
  studentAttempts: {},            // кэш попыток конкретного ученика: { studentId: [{...}, ...] }
  _onboardingDismissed: false,    // ученик закрыл onboarding-модалку (не показывать снова в этой сессии)
  helpedMsgs: {},
  /* === Авторизация === */
  authMode: 'live',     // 'live' (реальный e-mail) | 'demo' (роли как раньше)
  authEmail: '',
  authCode: '',         // введённый ученицей 6-значный код
  authStage: 'idle',    // 'idle' | 'sending' | 'sent' | 'error'
  authError: null,
  authLoading: true,    // показываем «Загрузка…» пока проверяем сессию
};

/* =======================================================================
   ФУНКЦИИ АВТОРИЗАЦИИ
   ======================================================================= */
async function authSendMagicLink(email){
  if(!sb){ throw new Error('Supabase не подключён'); }
  const { error } = await sb.auth.signInWithOtp({
    email: email,
    options: { emailRedirectTo: window.location.href }
  });
  if(error) throw error;
}

/* === Вход по 6-значному коду через Edge Functions (обход блокировки /auth/v1 в РФ) === */
async function authRequestCode(email){
  const url = SUPABASE_URL + '/functions/v1/request-login-code';
  const resp = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'apikey': SUPABASE_KEY
    },
    body: JSON.stringify({ email })
  });
  if(!resp.ok){
    const txt = await resp.text();
    let msg = txt;
    try { msg = JSON.parse(txt).error || txt; } catch(e){}
    throw new Error(msg);
  }
  return await resp.json();
}

async function authVerifyCode(email, code){
  const url = SUPABASE_URL + '/functions/v1/verify-login-code';
  const resp = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'apikey': SUPABASE_KEY
    },
    body: JSON.stringify({ email, code })
  });
  if(!resp.ok){
    const txt = await resp.text();
    let msg = txt;
    try { msg = JSON.parse(txt).error || txt; } catch(e){}
    throw new Error(msg);
  }
  const data = await resp.json();
  /* Сохраняем токен в том же ключе, где его ждёт getAccessToken (как Supabase Auth SDK) */
  const projectRef = SUPABASE_URL.replace('https://', '').split('.')[0];
  const tokenObj = {
    access_token: data.access_token,
    refresh_token: data.access_token,
    token_type: 'bearer',
    expires_at: Math.floor(Date.now() / 1000) + (data.expires_in || 60 * 60 * 24 * 7),
    expires_in: data.expires_in || 60 * 60 * 24 * 7,
    user: data.user
  };
  try {
    localStorage.setItem('sb-' + projectRef + '-auth-token', JSON.stringify(tokenObj));
  } catch(e){
    console.warn('Не удалось записать токен в localStorage:', e);
  }
  return data;
}

/* Декодируем payload JWT (без проверки подписи — сервер всё равно проверит) */
function decodeJwtPayload(token){
  try {
    const parts = token.split('.');
    if(parts.length !== 3) return null;
    /* base64url → base64 */
    let b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
    while(b64.length % 4) b64 += '=';
    const json = decodeURIComponent(escape(atob(b64)));
    return JSON.parse(json);
  } catch(e){
    console.warn('JWT decode failed:', e.message);
    return null;
  }
}

/* Прямой REST-запрос к /rest/v1/profiles в обход auth/v1 endpoints */
async function loadProfileDirect(access_token){
  console.log('→ loadProfileDirect: декодируем JWT…');
  const payload = decodeJwtPayload(access_token);
  if(!payload || !payload.sub){
    console.warn('JWT не содержит sub (user_id)');
    return null;
  }
  const userId = payload.sub;
  const userEmail = payload.email || '';
  console.log('✓ JWT декодирован, user_id:', userId, 'email:', userEmail);

  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + access_token,
    'Content-Type': 'application/json',
    'Accept': 'application/json'
  };

  /* GET /rest/v1/profiles?id=eq.<userId> */
  let profile = null;
  try {
    console.log('→ REST GET /profiles…');
    const resp = await Promise.race([
      fetch(SUPABASE_URL + '/rest/v1/profiles?id=eq.' + encodeURIComponent(userId) + '&select=*', { headers }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout REST GET')), 8000))
    ]);
    if(!resp.ok){
      console.warn('REST GET profile вернул', resp.status, await resp.text());
    } else {
      const arr = await resp.json();
      if(arr.length > 0){
        profile = arr[0];
        console.log('✓ Профиль найден через REST:', profile.role);
      }
    }
  } catch(e){
    console.warn('REST GET profile упал:', e.message);
    throw e;
  }

  /* Если профиля нет — создаём student'а */
  if(!profile){
    console.log('→ Профиля нет, создаём через REST POST…');
    try {
      const body = {
        id: userId, role: 'student', email: userEmail,
        full_name: userEmail.split('@')[0] || 'Гость',
        s_type: 'гость', s_status: 'pending', bee: 0
      };
      const resp = await Promise.race([
        fetch(SUPABASE_URL + '/rest/v1/profiles', {
          method: 'POST',
          headers: { ...headers, 'Prefer': 'return=representation' },
          body: JSON.stringify(body)
        }),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout REST POST')), 8000))
      ]);
      if(resp.ok){
        const arr = await resp.json();
        profile = Array.isArray(arr) ? arr[0] : arr;
        console.log('✓ Профиль создан через REST');
      } else {
        console.warn('REST POST profile вернул', resp.status, await resp.text());
        return null;
      }
    } catch(e){
      console.warn('REST POST profile упал:', e.message);
      return null;
    }
  }

  if(profile && payload.exp){
    profile._tokenExpiresAt = payload.exp;
  }
  return profile;
}

/* =======================================================================
   REST-хелперы — работают через /rest/v1/, обходя /auth/v1/ который
   блокируется в РФ. Токен берём из localStorage (там его сохранил
   loadProfileDirect или supabase-js).
   ======================================================================= */
function getAccessToken(){
  try {
    const projectRef = SUPABASE_URL.replace('https://', '').split('.')[0];
    const raw = localStorage.getItem('sb-' + projectRef + '-auth-token');
    if(!raw) return null;
    const obj = JSON.parse(raw);
    return obj.access_token || null;
  } catch(e){
    return null;
  }
}

async function restRequest(method, path, body, opts){
  opts = opts || {};
  const token = getAccessToken();
  if(!token) throw new Error('нет access_token в localStorage');
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + token,
    'Content-Type': 'application/json',
    'Accept': 'application/json'
  };
  if(opts.prefer) headers['Prefer'] = opts.prefer;
  const url = SUPABASE_URL + '/rest/v1' + path;
  const resp = await Promise.race([
    fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined }),
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout REST ' + method)), 10000))
  ]);
  if(!resp.ok){
    const txt = await resp.text();
    throw new Error('REST ' + method + ' ' + path + ' → ' + resp.status + ': ' + txt);
  }
  /* PATCH без return=representation возвращает пустоту */
  const ct = resp.headers.get('content-type') || '';
  if(ct.includes('application/json')){
    const t = await resp.text();
    return t ? JSON.parse(t) : null;
  }
  return null;
}

/* Кэш теории по 26 заданиям: { 1: 'markdown text', 2: '...', ... } */
const THEORY = {};

async function loadTheoryFromDb(){
  try {
    console.log('→ загружаем теорию из ege_tasks…');
    const arr = await restRequest('GET', '/ege_tasks?select=n,theory_md');
    if(Array.isArray(arr)){
      arr.forEach(row => { THEORY[row.n] = row.theory_md || ''; });
      console.log('✓ Теория загружена:', arr.length, 'записей');
    }
  } catch(e){
    console.warn('Не удалось загрузить теорию:', e.message);
  }
}

async function saveTheoryToDb(n, text){
  await restRequest('PATCH', '/ege_tasks?n=eq.' + n, { theory_md: text }, { prefer: 'return=minimal' });
  THEORY[n] = text;
}

/* =======================================================================
   ПОПЫТКИ В ТРЕНАЖЁРЕ — сохранение и загрузка через REST → таблица attempts.
   Структура answers JSONB: { limit, shuffled, items: [{src, user, expected, ok}] }
   ======================================================================= */
async function saveAttempt({ taskN, bank, getUser, isCorrect, beeEarned, limit, shuffled }){
  if(!sb || !MY_PROFILE) return null;  /* демо-режим — не сохраняем */
  const items = bank.map((q, i) => ({
    src: q.src || null,
    user: getUser(i),
    expected: q.match ? q.a : (q.text ? q.a : (q.multi ? q.a : q.a)),
    ok: !!isCorrect(q, i)
  }));
  const score = items.filter(x => x.ok).length;
  const max_score = bank.length;
  const payload = {
    student_id: MY_PROFILE.id,
    ege_task_n: taskN,
    is_random: !!(limit || shuffled),
    answers: { limit: limit || null, shuffled: !!shuffled, items },
    score,
    max_score,
    bee_earned: beeEarned
  };
  try {
    const inserted = await restRequest('POST', '/attempts', payload, { prefer: 'return=representation' });
    /* Триггер on_attempt_insert сам обновит profiles.bee и добавит запись в bee_transactions. */
    if(MY_PROFILE){ MY_PROFILE.bee = (MY_PROFILE.bee || 0) + beeEarned; }
    return Array.isArray(inserted) ? inserted[0] : inserted;
  } catch(e){
    console.warn('saveAttempt упал:', e.message);
    return null;

async function loadMyProfile(){
  if(!sb) return null;
  /* Хелпер: ставим таймаут на любой await, чтобы не зависать */
  const withTimeout = (promise, ms, label) => Promise.race([
    promise,
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout: ' + label)), ms))
  ]);

  let user;
  try {
    console.log('→ запрашиваем auth.getUser()…');
    const r = await withTimeout(sb.auth.getUser(), 6000, 'auth.getUser');
    user = r.data?.user;
  } catch(e){
    console.warn('auth.getUser упал:', e.message);
    return null;
  }
  if(!user){
    console.log('Сессии нет, пользователь не авторизован');
    return null;
  }
  console.log('✓ Авторизован как:', user.email);

  let data, error;
  try {
    console.log('→ запрашиваем профиль из таблицы profiles…');
    const r = await withTimeout(
      sb.from('profiles').select('*').eq('id', user.id).maybeSingle(),
      6000, 'select profiles'
    );
    data = r.data; error = r.error;
  } catch(e){
    console.warn('Запрос профиля упал:', e.message);
    return null;
  }

  if(error){
    console.warn('Ошибка загрузки профиля:', error.message);
    return null;
  }

  if(!data){
    console.log('Профиля нет, создаём…');
    try {
      const r = await sb.from('profiles').insert({
        id: user.id,
        role: 'student',
        full_name: user.user_metadata?.full_name || user.email.split('@')[0],
        email: user.email,
        s_type: 'гость',
        s_status: 'pending',
        bee: 0
      }).select().single();
      if(r.error){
        console.warn('Не удалось создать профиль:', r.error.message);
        return null;
      }
      data = r.data;
      console.log('✓ Профиль создан');
    } catch(e){
      console.warn('Создание профиля упало:', e.message);
      return null;
    }
  } else {
    console.log('✓ Профиль загружен:', data.role, data.email);
  }

  MY_PROFILE = data;
  return data;
}

/* При загрузке страницы пытаемся восстановить сессию */
/* Проверяем, нет ли в URL ошибки от Supabase auth (например, otp_expired) */
function checkAuthErrorInUrl(){
  const hash = window.location.hash || '';
  if(!hash.includes('error=') && !hash.includes('error_code=')) return null;
  const params = new URLSearchParams(hash.slice(1));
  const code = params.get('error_code') || '';
  const desc = (params.get('error_description') || '').replace(/\+/g, ' ');
  let friendly = 'Не удалось войти';
  if(code === 'otp_expired') friendly = '⏰ Ссылка для входа устарела. Magic link живёт 1 час — получите новую.';
  else if(code) friendly = '⚠ ' + decodeURIComponent(desc);
  /* Очищаем URL, чтобы при перезагрузке ошибки не было */
  try { history.replaceState(null, '', window.location.pathname); } catch(_){}
  return friendly;
}

async function restoreSession(){
  STATE.authLoading = true;
  render();   /* Показать «Загрузка…» сразу, до сетевых вызовов */

  /* Если URL содержит ошибку от Supabase — сразу показываем её, не ждём сети */
  const urlErr = checkAuthErrorInUrl();
  if(urlErr){
    STATE.authLoading = false;
    STATE.authMode = 'live';
    STATE.authStage = 'idle';
    STATE.authError = urlErr;
    STATE.view = 'login';
    render();
    return;
  }

  if(!sb){
    STATE.authLoading = false;
    STATE.authMode = 'demo';
    render();
    return;
  }

  /* Если в URL есть токен — парсим его вручную и явно устанавливаем сессию */
  const hash = window.location.hash || '';
  if(hash.includes('access_token=')){
    console.log('🔑 Обнаружен access_token в URL — обходным путём (без auth.getUser)…');
    const params = new URLSearchParams(hash.slice(1));
    const access_token = params.get('access_token');
    const refresh_token = params.get('refresh_token');

    /* Чистим URL от токена */
    try { history.replaceState(null, '', window.location.pathname); } catch(_){}

    /* Пробуем напрямую: декодируем JWT, тянем профиль через REST */
    try {
      const profile = await loadProfileDirect(access_token);
      if(profile){
        /* Сохраняем токен в localStorage в формате supabase-js, чтобы потом sb.from() работал */
        try {
          const projectRef = SUPABASE_URL.replace('https://', '').split('.')[0];
          const sessionData = {
            access_token, refresh_token,
            expires_at: profile._tokenExpiresAt || (Math.floor(Date.now()/1000) + 3600),
            expires_in: 3600,
            token_type: 'bearer',
            user: { id: profile.id, email: profile.email, aud: 'authenticated', role: 'authenticated' }
          };
          localStorage.setItem('sb-' + projectRef + '-auth-token', JSON.stringify(sessionData));
          console.log('✓ Сессия сохранена в localStorage');
        } catch(_){}

        MY_PROFILE = profile;
        STATE.authLoading = false;
        if(profile.role === 'teacher') STATE.view = 'teacher';
        else if(profile.role === 'curator') STATE.view = 'curator';
        else STATE.view = 'student';
        render();
        /* Подгружаем теорию из БД в фоне — после первого render'а */
        Promise.all([loadTheoryFromDb(), loadMaterialsFromDb(), loadEssaysFromDb(), loadEssaySamplesFromDb()]).then(() => render()).catch(() => {});
        return;
      } else {
        STATE.authLoading = false;
        STATE.view = 'login';
        STATE.authError = 'Не удалось загрузить профиль (REST-запрос завис). Попробуйте через VPN или обновите страницу.';
        render();
        return;
      }
    } catch(e){
      console.warn('loadProfileDirect упал:', e.message);
      STATE.authLoading = false;
      STATE.view = 'login';
      STATE.authError = 'Сервер не отвечает: ' + e.message;
      render();
      return;
    }
  }

  /* Защита от зависания: если Supabase не отвечает за 5 секунд — показываем экран входа */
  const timeoutId = setTimeout(() => {
    if(STATE.authLoading){
      console.warn('Загрузка профиля заняла >5с — показываем вход');
      STATE.authLoading = false;
      STATE.view = 'login';
      render();
    }
  }, 5000);

  /* Если auth.getUser завис — пробуем JWT decode + REST из localStorage */
  let profile = null;
  try {
    profile = await loadMyProfile();
  } catch(e) {
    console.warn('loadMyProfile упал, пробуем JWT-обход…', e.message);
  }
  if(!profile){
    /* Fallback: вытаскиваем токен из localStorage и идём через REST */
    const token = getAccessToken();
    if(token){
      try {
        console.log('→ Fallback: загружаем профиль через REST по сохранённому токену');
        profile = await loadProfileDirect(token);
      } catch(e){
        console.warn('Fallback тоже не удался:', e.message);
      }
    }
  }
  clearTimeout(timeoutId);
  STATE.authLoading = false;
  if(profile){
    MY_PROFILE = profile;
    if(profile.role === 'teacher') STATE.view = 'teacher';
    else if(profile.role === 'curator') STATE.view = 'curator';
    else STATE.view = 'student';
    /* Загружаем теорию в фоне */
    Promise.all([loadTheoryFromDb(), loadMaterialsFromDb(), loadEssaysFromDb(), loadEssaySamplesFromDb()]).then(() => render()).catch(() => {});
  } else {
    STATE.view = 'login';
  }
  render();
}

/* Слушаем изменения сессии (вход через magic link, выход) */
if(sb){
  sb.auth.onAuthStateChange(async (event, session) => {
    console.log('🔄 Auth event:', event, 'session:', !!session);
    if(event === 'SIGNED_IN' || (event === 'INITIAL_SESSION' && session)){
      /* Если профиль уже загружен (например, через restoreSession) — выходим, чтобы не гонять запросы */
      if(MY_PROFILE && (STATE.view === 'teacher' || STATE.view === 'curator' || STATE.view === 'student')){
        console.log('SIGNED_IN: профиль уже загружен, пропускаем повторный запрос');
        return;
      }
      STATE.authLoading = false;
      STATE.authError = null;
      /* Чистим URL от токена сразу, до ожидания сети */
      if(window.location.hash.includes('access_token')){
        try { history.replaceState(null, '', window.location.pathname); } catch(_){}
      }
      /* Защита от зависания: если profile не загрузится за 8 секунд — показываем вход */
      const sigTimeout = setTimeout(() => {
        if(STATE.view !== 'teacher' && STATE.view !== 'curator' && STATE.view !== 'student'){
          console.warn('SIGNED_IN: профиль не загрузился за 8с — показываем вход');
          STATE.view = 'login';
          STATE.authError = 'Не удалось загрузить профиль за разумное время. Попробуйте обновить страницу (Cmd+Shift+R).';
          render();
        }
      }, 8000);
      try {
        const profile = await loadMyProfile();
        clearTimeout(sigTimeout);
        if(profile){
          if(profile.role === 'teacher') STATE.view = 'teacher';
          else if(profile.role === 'curator') STATE.view = 'curator';
          else STATE.view = 'student';
        } else {
          STATE.view = 'login';
          STATE.authError = 'Не удалось загрузить профиль. Попробуйте перезагрузить страницу.';
        }
      } catch(e){
        clearTimeout(sigTimeout);
        console.warn('Ошибка загрузки профиля:', e);
        STATE.view = 'login';
        STATE.authError = 'Ошибка: ' + (e.message || 'неизвестная');
      }
      render();
    } else if(event === 'SIGNED_OUT'){
      MY_PROFILE = null;
      STATE.view = 'login';
      render();
    }
  });
}

/* Форматирование размера файла */
function formatSize(bytes){
  if(!bytes) return '';
  if(bytes < 1024) return bytes + ' Б';
  if(bytes < 1024*1024) return Math.round(bytes/1024) + ' КБ';
  return (bytes / (1024*1024)).toFixed(1) + ' МБ';
}

/* =======================================================================
   СЧЁТЧИК СЛОВ для сочинений (правила Ольги: «всё-таки» = 1, «всё же» = 2,
   цифры и знаки не считаются, инициалы с фамилией = 1 слово, минимум 150). */
function countEssayWords(text){
  if(!text || !text.trim()) return 0;
  let t = ' ' + text + ' ';
  /* 1) Инициалы (А. С. Пушкин / А.С.Пушкин) — превращаем всю группу в один токен */
  t = t.replace(/(?:[А-ЯЁ]\s*\.\s*){1,3}\s*[А-ЯЁ][а-яёА-ЯЁ\-]+/g, ' Инициал ');
  /* 2) Цифры — заменяем пробелом */
  t = t.replace(/\d+/g, ' ');
  /* 3) Знаки препинания, кроме дефисов внутри слов и неразрывного пробела */
  t = t.replace(/[^\wа-яёА-ЯЁ\-\s]/g, ' ');
  /* 4) Дефис в начале/конце слова — пробел */
  t = t.replace(/(^|\s)-+|-+(\s|$)/g, ' ');
  /* 5) Разделяем на слова */
  const words = t.split(/\s+/).filter(w => w && /[а-яёА-ЯЁA-Za-z]/.test(w));
  return words.length;
}

/* Виджет «Записать / Стоп / Прослушать / Удалить».
   Состояние локально для конкретного экземпляра — несколько виджетов на странице
   независимы друг от друга. Если узел виджета удалён из DOM (например, попап
   закрыли) — запись и поток микрофона останавливаются автоматически. */
function makeVoiceRecorder(initialUrl, onChange){
  const wrap = el('div', { style:{ display:'flex', gap:'6px', alignItems:'center', flexWrap:'wrap' }});
  let currentUrl = initialUrl || null;
  let isRecording = false;
  let timerId = null;
  let startedAt = 0;
  let mediaRec = null;
  let mediaStream = null;
  let chunks = [];
  let observer = null;

  const setUrl = u => { currentUrl = u; onChange && onChange(u); };

  const cleanupTracks = () => {
    if(mediaStream){
      try { mediaStream.getTracks().forEach(t => t.stop()); } catch(e){}
      mediaStream = null;
    }
  };

  const forceAbort = () => {
    if(timerId){ clearInterval(timerId); timerId = null; }
    if(mediaRec && mediaRec.state !== 'inactive'){
      try { mediaRec.onstop = null; mediaRec.stop(); } catch(e){}
    }
    cleanupTracks();
    mediaRec = null;
    chunks = [];
    isRecording = false;
    if(observer){ try { observer.disconnect(); } catch(e){} observer = null; }
  };

  let _everMounted = false;
  const refresh = () => {
    /* Первый refresh может быть до append() — это нормально, разрешаем.
       После того, как виджет хоть раз был в DOM — следим за его удалением. */
    if(_everMounted && !document.body.contains(wrap)){
      forceAbort();
      return;
    }
    if(document.body.contains(wrap)) _everMounted = true;
    wrap.innerHTML = '';
    const recBtn = el('button', { type:'button', class: isRecording ? 'btn btn-sm' : 'btn btn-secondary btn-sm',
      style: isRecording ? { background:'var(--red)', color:'#fff' } : {},
      onclick: async () => {
        if(isRecording){
          /* Остановить + дождаться blob + залить */
          recBtn.disabled = true;
          recBtn.textContent = '⏳ заливаем…';
          if(timerId){ clearInterval(timerId); timerId = null; }
          try {
            const blob = await new Promise((resolve, reject) => {
              if(!mediaRec){ reject(new Error('Запись не была начата')); return; }
              mediaRec.onstop = () => {
                cleanupTracks();
                resolve(new Blob(chunks, { type: mediaRec.mimeType || 'audio/webm' }));
              };
              try { mediaRec.stop(); } catch(e){ reject(e); }
            });
            mediaRec = null;
            chunks = [];
            const url = await uploadEssayAudio(blob);
            setUrl(url);
            isRecording = false;
            refresh();
          } catch(e){
            alert('⚠ ' + e.message);
            forceAbort();
            refresh();
          }
        } else {
          /* Старт */
          try {
            if(!navigator.mediaDevices || !window.MediaRecorder) throw new Error('Браузер не поддерживает запись звука');
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
              : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm'
              : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
              : '';
            mediaRec = new MediaRecorder(mediaStream, mime ? { mimeType: mime } : {});
            chunks = [];
            mediaRec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
            mediaRec.start();
            isRecording = true;
            startedAt = Date.now();
            /* Наблюдатель: если узел исчезнет из DOM — стопаем поток */
            if(!observer){
              observer = new MutationObserver(() => {
                if(!document.body.contains(wrap)) forceAbort();
              });
              observer.observe(document.body, { childList: true, subtree: true });
            }
            refresh();
            timerId = setInterval(refresh, 500);
          } catch(e){
            cleanupTracks();
            alert('⚠ ' + e.message);
          }
        }
      }
    }, isRecording ? '⏹ Стоп' : (currentUrl ? '🔁 Перезаписать' : '🎤 Запись'));
    wrap.append(recBtn);

    if(isRecording){
      const sec = Math.floor((Date.now() - startedAt) / 1000);
      wrap.append(el('span', { style:{ color:'var(--red)', fontSize:'12px', fontWeight:'700' }},
        '● ' + Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0')));
    } else if(currentUrl){
      wrap.append(el('audio', { controls:'controls', src: currentUrl, style:{ height:'32px', maxWidth:'180px' }}));
      wrap.append(el('button', { type:'button', class:'btn-icon', title:'Убрать запись',
        style:{ background:'var(--red-soft)', color:'var(--red)' },
        onclick: () => { setUrl(null); refresh(); }
      }, '×'));
    }
  };
  refresh();
  return { node: wrap, getUrl: () => currentUrl, abort: forceAbort };
}

const ERR_KINDS = [
  { id: 'orf',   crit: 'К7',  label: 'Орфо',   bg: '#FCA5A5' },
  { id: 'pun',   crit: 'К8',  label: 'Пункт',  bg: '#93C5FD' },

  { id: 'eth',   crit: 'К6',  label: 'Этика',  bg: '#D1D5DB' },
  { id: 'other', crit: '—',   label: 'Другое', bg: '#FED7AA' },
];
function errKindMeta(id){ return ERR_KINDS.find(k => k.id === id) || ERR_KINDS[ERR_KINDS.length - 1]; }

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* Рендерит текст сочинения с подсветкой фрагментов из comments[].
   comments: [{ id, start_pos, end_pos, kind, comment, fragment }]
   opts.readonly: если true — клики только показывают тултип; иначе можно удалять */
function renderEssayWithMarks(text, comments, opts){
  opts = opts || {};
  const wrap = el('div', { class: 'essay-text', style: { whiteSpace:'pre-wrap', position:'relative' }});
  if(!text){ wrap.textContent = ''; return wrap; }
  if(!comments || !comments.length){ wrap.textContent = text; return wrap; }
  const sorted = comments
    .filter(c => c.start_pos != null && c.end_pos != null && c.end_pos > c.start_pos && c.start_pos >= 0 && c.end_pos <= text.length)
    .sort((a, b) => a.start_pos - b.start_pos);
  let html = '';
  let pos = 0;
  for(const c of sorted){
    if(c.start_pos < pos) continue; /* пропускаем пересекающиеся */
    if(c.start_pos > pos) html += escHtml(text.slice(pos, c.start_pos));
    const meta = errKindMeta(c.kind);
    const tip = (meta.crit + ' · ' + meta.label + (c.comment ? ' — ' + c.comment : '')).replace(/"/g, '&quot;');
    html += '<mark class="err-mark err-' + meta.id + '" data-id="' + (c.id != null ? c.id : '') + '" title="' + tip + '">' + escHtml(text.slice(c.start_pos, c.end_pos)) + '</mark>';
    pos = c.end_pos;
  }
  if(pos < text.length) html += escHtml(text.slice(pos));
  wrap.innerHTML = html;
  return wrap;
}

/* Рендерит галерею фото-страниц с пинами-замечаниями.
   photos: [url1, url2, ...]  comments: [{ id, kind, comment, photo_anchor:{x,y,page} }]
   opts.readonly: false → клик по фото ставит новый пин (учитель), клик по пину — редакт/удаление
                 true  → только просмотр (ученик) */
function renderPhotosWithPins(photos, comments, opts){
  opts = opts || {};
  const wrap = el('div', { class:'essay-photos' });
  if(!photos || !photos.length){
    wrap.append(el('div', { style:{ color:'var(--ink-3)', fontStyle:'italic' }}, 'Фото не загружены'));
    return wrap;
  }
  /* Группируем комментарии по странице и считаем номера */
  const byPage = {};
  const photoComments = (comments || []).filter(c => c.photo_anchor);
  photoComments.forEach(c => {
    const p = (c.photo_anchor && c.photo_anchor.page) || 0;
    if(!byPage[p]) byPage[p] = [];
    byPage[p].push(c);
  });
  console.log('[renderPhotosWithPins] readonly=' + !!opts.readonly +
    ', photos=' + photos.length +
    ', photoComments=' + photoComments.length +
    ', firstAnchor=' + (photoComments[0] ? JSON.stringify(photoComments[0].photo_anchor) : 'нет'));
  photos.forEach((url, idx) => {
    const pageWrap = el('div', { class: 'essay-photo' + (opts.readonly ? '' : ' editable') });
    pageWrap.dataset.page = String(idx);
    const img = el('img', { src: url, alt: 'фото ' + (idx+1) });
    img.addEventListener('dragstart', ev => ev.preventDefault());
    pageWrap.append(img,
      el('span', { class:'page-num' }, 'стр. ' + (idx + 1)));
    /* Пины */
    (byPage[idx] || []).forEach((c, i) => {
      const meta = errKindMeta(c.kind);
      const pin = el('div', {
        class: 'pin pin-' + meta.id,
        style: { left: ((c.photo_anchor.x || 0) * 100) + '%',
                 top:  ((c.photo_anchor.y || 0) * 100) + '%' },
        title: meta.crit + ' · ' + meta.label + (c.comment ? ' — ' + c.comment : '')
      }, String(i + 1));
      pin.dataset.cid = String(c.id);
      pin.addEventListener('click', ev => {
        ev.stopPropagation();
        opts.onPinClick && opts.onPinClick(c, pin);
      });
      pageWrap.append(pin);
    });
    /* Клик по фото → новый пин (учитель) */
    if(!opts.readonly){
      pageWrap.addEventListener('click', ev => {
        if(ev.target.classList.contains('pin')) return;
        if(ev.target.tagName !== 'IMG') return;
        const r = pageWrap.getBoundingClientRect();
        const x = (ev.clientX - r.left) / r.width;
        const y = (ev.clientY - r.top) / r.height;
        opts.onPhotoClick && opts.onPhotoClick({ page: idx, x, y, pageWrap, ev });
      });
    }
    wrap.append(pageWrap);
  });
  return wrap;
}

/* Возвращает позицию (в символах) внутри textContent контейнера root */
function getCharOffsetIn(root, node, offset){
  let pos = 0;
  let found = false;
  function walk(n){
    if(found) return;
    if(n === node){
      if(n.nodeType === Node.TEXT_NODE){ pos += offset; }
      else {
        for(let i = 0; i < offset; i++){
          if(n.childNodes[i]) pos += (n.childNodes[i].textContent || '').length;
        }
      }
      found = true;
      return;
    }
    if(n.nodeType === Node.TEXT_NODE){ pos += n.textContent.length; }
    else { for(const c of n.childNodes){ walk(c); if(found) return; }}
  }
  walk(root);
  return found ? pos : -1;
}

/* Загрузить все комментарии-выделения для сочинения */
async function loadEssayComments(essayId){
  if(!sb) return [];
  try {
    /* Без order — иначе для фото-комментариев (start_pos = null) PostgREST может выдать NULLS-проблемы.
       Сортируем уже на клиенте: сначала текстовые по start_pos, потом фото-пины по странице/y. */
    const arr = await restRequest('GET', '/essay_comments?essay_id=eq.' + encodeURIComponent(essayId) + '&select=*');
    if(!Array.isArray(arr)) return [];
    arr.sort((a, b) => {
      const aHasText = a.start_pos != null;
      const bHasText = b.start_pos != null;
      if(aHasText && !bHasText) return -1;
      if(!aHasText && bHasText) return 1;
      if(aHasText) return a.start_pos - b.start_pos;
      const ap = (a.photo_anchor && a.photo_anchor.page) || 0;
      const bp = (b.photo_anchor && b.photo_anchor.page) || 0;
      if(ap !== bp) return ap - bp;
      return ((a.photo_anchor && a.photo_anchor.y) || 0) - ((b.photo_anchor && b.photo_anchor.y) || 0);
    });
    console.log('✓ Замечаний загружено для сочинения ' + essayId + ': ' + arr.length);
    return arr;
  } catch(e){
    console.warn('✗ Не удалось загрузить комментарии:', e.message);
    return [];
  }
}

/* Автоподсчёт ошибок по выделениям → обновляем STATE.errors и STATE.scoresK.
   К4 (fact, max=1): 0=1, 1+=0
   К5 (log, max=2):  0=2, 1-2=1, 3+=0
   К6 (eth, max=1):  0=1, 1+=0
   К7-К10 (orf/pun/gram/rech, max=3): 0=3, 1-2=2, 3-4=1, 5+=0 */
function recomputeErrorsFromComments(comments){
  const cnt = { fact:0, log:0, eth:0, orf:0, pun:0, gram:0, rech:0 };
  (comments || []).forEach(c => { if(cnt[c.kind] != null) cnt[c.kind]++; });
  const map = [
    { id:'K4', kind:'fact', score: n => n === 0 ? 1 : 0 },
    { id:'K5', kind:'log',  score: n => n === 0 ? 2 : (n <= 2 ? 1 : 0) },
    { id:'K6', kind:'eth',  score: n => n === 0 ? 1 : 0 },
    { id:'K7', kind:'orf',  score: n => n === 0 ? 3 : (n <= 2 ? 2 : (n <= 4 ? 1 : 0)) },
    { id:'K8', kind:'pun',  score: n => n === 0 ? 3 : (n <= 2 ? 2 : (n <= 4 ? 1 : 0)) },
    { id:'K9', kind:'gram', score: n => n === 0 ? 3 : (n <= 2 ? 2 : (n <= 4 ? 1 : 0)) },
    { id:'K10',kind:'rech', score: n => n === 0 ? 3 : (n <= 2 ? 2 : (n <= 4 ? 1 : 0)) },
  ];
  map.forEach(m => {
    const n = cnt[m.kind] || 0;
    STATE.errors[m.id] = n;
    STATE.scoresK[m.id] = m.score(n);
  });
}

/* Сохранить оценку К1-К10 + общий комментарий + сменить статус сочинения.
   nextStatus: 'in_progress' | 'pre_checked' | 'done'
   isPreCheck: true для куратора */
async function saveEssayReview(essayId, nextStatus, isPreCheck){
  if(!sb || !MY_PROFILE) throw new Error('нет авторизации');
  /* собираем баллы из STATE */
  const k1 = STATE.scoresK.K1 != null ? +STATE.scoresK.K1 : 1;
  const lockK2K3 = k1 === 0;
  const pick = id => {
    if((id === 'K2' || id === 'K3') && lockK2K3) return 0;
    const v = STATE.scoresK[id];
    if(v != null) return +v;
    /* default = max из CRIT */
    const c = CRIT.find(x => x.id === id);
    return c ? c.max : 0;
  };
  let total = 0;
  CRIT.forEach(c => total += pick(c.id));
  const payload = {
    essay_id: essayId,
    k1: pick('K1'), k2: pick('K2'), k3: pick('K3'),
    k4: pick('K4'), k5: pick('K5'), k6: pick('K6'),
    k7: pick('K7'), k8: pick('K8'), k9: pick('K9'), k10: pick('K10'),
    k7_errors: STATE.errors.K7 != null ? +STATE.errors.K7 : null,
    k8_errors: STATE.errors.K8 != null ? +STATE.errors.K8 : null,
    k9_errors: STATE.errors.K9 != null ? +STATE.errors.K9 : null,
    k10_errors: STATE.errors.K10 != null ? +STATE.errors.K10 : null,
    total: total,
    general_comment: (STATE.essayComment || '').trim() || null,
    voice_url: STATE.essayVoiceUrl || null,
    is_pre_check: !!isPreCheck,
    reviewer_id: MY_PROFILE.id,
    reviewed_at: new Date().toISOString()
  };
  /* upsert через Prefer: resolution=merge-duplicates (essay_id — PK) */
  await restRequest('POST', '/essay_reviews', payload, { prefer: 'resolution=merge-duplicates,return=minimal' });
  /* теперь обновим статус самого сочинения */
  const essayUpdate = { status: nextStatus };
  if(isPreCheck) essayUpdate.pre_checked_by = MY_PROFILE.id;
  if(nextStatus === 'done'){
    essayUpdate.finalized_by = MY_PROFILE.id;
    essayUpdate.finalized_at = new Date().toISOString();
  }
  await restRequest('PATCH', '/essays?id=eq.' + encodeURIComponent(essayId), essayUpdate, { prefer: 'return=minimal' });
  /* обновим локальный кэш и счётчики */
  const e = DB_ESSAYS.find(x => x.id === essayId);
  if(e){
    e.status = nextStatus;
    if(nextStatus === 'done') e.finalScore = total;
    if(isPreCheck) e.preScore = total;
  }
  return total;
}

/* Загрузить файл в Storage + создать запись в materials.
   Опционально привязка к заданию ЕГЭ (taskN) или к активности дня (activityId). */
async function uploadMaterial(file, taskN, activityId){
  if(!sb || !MY_PROFILE) throw new Error('нет авторизации');
  const ext = (file.name.match(/\.([a-zA-Z0-9]{1,10})$/) || ['', 'bin'])[1].toLowerCase();
  const folder = activityId ? 'act_' + activityId : ('task' + (taskN || 0));
  const path = folder + '/' + Date.now() + '_' +
               Math.random().toString(36).slice(2, 10) + '.' + ext;
  const { error: upErr } = await sb.storage.from('materials').upload(path, file, {
    cacheControl: '3600', upsert: false,
    contentType: file.type || 'application/octet-stream'
  });
  if(upErr) throw new Error('Storage: ' + upErr.message);
  const inserted = await restRequest('POST', '/materials', {
    name: file.name,
    storage_path: path,
    size_bytes: file.size,
    ege_task_n: taskN || null,
    activity_id: activityId || null,
    tag: 'теория',
    uploaded_by: MY_PROFILE.id
  }, { prefer: 'return=representation' });
  return Array.isArray(inserted) ? inserted[0] : inserted;
}

/* Редактирование: для файла — только название; для ссылки — название и URL */
async function editMaterial(m){
  if(!sb) throw new Error('нет авторизации');
  const newName = prompt('Название (что увидит ученик):', m.name);
  if(newName === null) return false;        /* пользователь отменил */
  const trimmedName = newName.trim();
  if(!trimmedName){ showToast('Название не может быть пустым'); return false; }
  const patch = { name: trimmedName };
  if(m.external_url){
    const newUrl = prompt('URL ссылки:', m.external_url);
    if(newUrl === null) return false;
    let cleanUrl = newUrl.trim();
    if(!cleanUrl){ showToast('URL не может быть пустым'); return false; }
    if(!/^https?:\/\//i.test(cleanUrl)) cleanUrl = 'https://' + cleanUrl;
    patch.external_url = cleanUrl;
  }
  await restRequest('PATCH', '/materials?id=eq.' + m.id, patch, { prefer: 'return=minimal' });
  return true;
}

/* Извлечь домен из URL для дефолтного названия ссылки */
function extractDomain(url){
  try { return new URL(url).hostname.replace(/^www\./, ''); }
  catch(_){ return url; }
}

/* Помощник: создать drill-вопрос из пары (с направлением). */
function paronymDrill(pair, dir){
  const word = (dir === 'b' ? pair.b : pair.a).toUpperCase();
  const ans  = (dir === 'b' ? pair.a : pair.b);
  return { text:true, pair:true,
    q:'Напишите пароним к слову:',
    word: word,
    a:[ans],
    hint: pair.hint,
    src:'Банк ФИПИ · пары паронимов' };
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildShuffledParonymBank(n){
  const shuffled = shuffleArray(PARONYM_PAIRS);
  return shuffled.slice(0, n).map(p =>
    paronymDrill(p, Math.random() < 0.5 ? 'a' : 'b'));
}

/* Фильтр сломанных вопросов: text-вопрос, который ссылается на «текст/абзац»,
   но при этом в данных нет ни sourceText, ни context. Такой вопрос невозможно решить.
   Возникает, когда вопрос завели, а исходный текст варианта забыли пристыковать.
   Эти заглушки нужно дозаполнить в QUIZ_BANK — пока что просто прячем их от ученика. */
function isQuestionValid(q){
  if(q.sourceText || q.context) return true;
  const refsText = /абзац|тексте\b|из\s+текста|предложени(?:и|е)\s+текста|во\s+(?:первом|втором|третьем|четвёртом|пятом)\s+предложении/i;
  return !refsText.test(q.q || '');
}

/* Видимый банк по заданию — без сломанных. */
function bankFor(taskN){
  return (QUIZ_BANK[taskN] || []).filter(isQuestionValid);
}

/* Случайная подборка N вопросов из банка по конкретному заданию.
   Если в банке меньше N — берём все, что есть. */
function buildLimitedBank(taskN, n){
  const full = bankFor(taskN);
  if(n == null || n >= full.length) return full;
  return shuffleArray(full).slice(0, n);
}

/* Правильная русская форма множественного числа: 1 вопрос, 2 вопроса, 5 вопросов. */
function ruPlural(n, one, few, many){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod10 === 1 && mod100 !== 11) return one;
  if(mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return few;
  return many;
}

const QUIZ_BANK = {
  1: [
    { text:true, q:'Самостоятельно подберите указательное местоимение, которое должно стоять на месте пропуска в третьем (3) абзаце текста. Запишите это местоимение.', sourceText:'Ф. М. Достоевский написал, что красота спасёт мир. Но какую красоту он имел в виду – женскую? В романе «Идиот» эти слова произносит 18-летний юноша Ипполит Терентьев: «Господа, – закричал он громко всем, – князь утверждает, что мир спасёт красота! А я утверждаю, что у него оттого такие игривые мысли, что он теперь влюблён». Достоевский неспроста вложил свою идею в уста героя романа «Идиот», к тому же выразив её через «посредника». Во время написания романа в обществе набирали силу тенденции жёсткого рационализма, и такая идея выглядела очень и очень странно. Сегодня мало кто воспринимает <...> мысль Достоевского всерьёз. Она кажется нам просто выражением тоски писателя по утраченной гармонии. Да и древние греки, которые впервые задумались о философской сущности красоты, считали её непрактичной, неутилитарной. Но почему тогда великий авиаконструктор А. Туполев любил повторять, что некрасивые самолёты не летают? Может быть, красота всё-таки имеет практическую значимость? Может, именно в её законах и кроется прообраз новой технологической системы, которая спасёт человечество от всех надвигающихся на него ресурсных, социальных и экологических проблем? Хочется надеяться, что, научно постигнув тайны красоты, мы сможем преобразить всю нашу жизнь, получив при этом не только эстетический, но и огромный экономический результат. И тогда прогноз Достоевского окажется самым гениальным из всех великих прогнозов.', a:['эту', 'ту', 'такую'], src:'Вариант 1 · задание 1' },
    { text:true, q:'Самостоятельно подберите местоименное наречие, которое должно стоять на месте пропуска во втором абзаце текста. Запишите это наречие.', sourceText:'Какие взаимоотношения с природой нужны человеку сейчас? Да просто необходим союз с природой. Сегодня в моде бег трусцой, но раньше самыми полезными для здоровья и для духовной жизни человека считались длительные пешеходные прогулки. Чем дальние пешие прогулки отличаются от бега трусцой? Когда человек бежит, он волей или неволей должен думать о том, что у него под ногами, в это время он не размышляет. Во время же пеших прогулок он размышляет. Старинные петербургские парки были рассчитаны на работу мысли, а не только на движение ногами. Прогулки по паркам вызывали мысли о природе, о смерти, о бренности существования, о животных, о тех или иных событиях. Гуляющий имел «материал» для размышлений лирических и эмоциональных, для размышлений о своём детстве, о союзе с природой, <…> так популярны были «романтические» парки, в которых природа находится в союзе с человеком. В романтических парках человек только слегка вмешивается в природу, улучшая её, вот почему романтические парки жизненно необходимы современным городам. Мы устали от городской суеты, от непрекращающегося шума, преобладания техники и человека над природой; природа нами усиленно портится, и именно в романтических парках заключён идеальный союз с природой. (По Д. С. Лихачёву)', a:['поэтому', 'потому'], src:'Вариант 2 · задание 1' },
    { text:true, q:'Самостоятельно подберите определительное местоимение, которое должно стоять на месте пропуска в третьем (3) абзаце текста. Запишите это местоимение.', sourceText:'Установлено, что в экстремальных погодных условиях некоторые виды лягушек погружаются в состояние анабиоза и могут не проявлять никакой активности в течение нескольких месяцев. В холодных областях лягушки зимой впадают в спячку. Некоторые виды прячутся в расщелинах или закапываются в сухие листья. Водные виды, например лягушка-бык, как правило, залегают на дне водоёма, частично погружаясь в ил, но сохраняя при этом доступ к кислороду, растворённому в воде. Их метаболизм замедляется, и они выживают за счёт потребления внутренних энергетических резервов. Многие лягушки могут выжить после замерзания. Несмотря на то что под их кожей и в полостях тела образуются кристаллы льда, жизненно важные органы защищены от замерзания вследствие высокой концентрации глюкозы в тканях. С виду безжизненная, замёрзшая лягушка может начать дышать и возобновить работу сердца, если её отогреть. Некоторые лягушки во время жаркого сухого сезона впадают в состояние эстивации – летней спячки, обходясь без пищи и воды 9−10 месяцев в году. Такие лягушки зарываются в землю и сворачиваются в защитном коконе, который образуется из сброшенной кожи. В процессе одного из исследований выяснилось, что во время эстивации метаболизм лягушки меняется так, что КПД митохондрий увеличивается, позволяя более эффективно использовать ограниченное количество энергетических ресурсов, доступных лягушке в состоянии спячки. А <…> исследование показало, что для удовлетворения минимальных энергетических требований у лягушки атрофируется большинство мышц, за исключением мышц задних конечностей.', a:['другое', 'иное'], src:'Вариант 3 · задание 1' },
    { text:true, q:'Самостоятельно подберите союзное слово, которое должно стоять на месте пропуска в третьем абзаце текста. Запишите это слово.', sourceText:'Земельный кодекс Российской Федерации устанавливает нормы земельного законодательства имущественных отношений по владению, пользованию и распоряжению земельными участками, а также по совершению сделок с ними, указывая, что гражданское законодательство применяется, если иное не предусмотрено земельным, лесным, водным законодательством, законодательством о недрах, об охране окружающей среды, специальными федеральными законами. Согласно п. 3 ст. 6 Земельного кодекса Российской Федерации земельный участок как объект права собственности и иных предусмотренных настоящим кодексом прав на землю является недвижимой вещью, которая представляет собой часть земной поверхности и имеет характеристики, позволяющие определить её в качестве индивидуально определённой вещи. В соответствии со ст. 11.1 Земельного кодекса Российской Федерации земельным участком является часть земной поверхности, границы <…> определены в соответствии с федеральными законами. Собственнику принадлежат права владения, пользования и распоряжения своим имуществом. В соответствии с п. 6 ст. 27 Земельного кодекса Российской Федерации оборот земель сельскохозяйственного назначения регулируется Федеральным законом «Об обороте земель сельскохозяйственного назначения».', a:['которой'], src:'Вариант 4 · задание 1' },
    { text:true, q:'Самостоятельно подберите указательное местоимение, которое должно стоять на месте пропуска во втором (2) абзаце текста. Запишите это местоимение.', sourceText:'Мы многое растеряли. В каталоге потерь – самые неожиданные вещи. Куда- то исчезли дедушки. Дедушка – это не просто муж бабушки. Это добрый человек с умными глазами, седой бородой и натруженными руками. В ту нежную пору жизни, когда вы узнаёте мир, дедушка должен сажать вас на колени и рассказывать о далёких звёздах и великих героях. <…> дедушки куда-то пропали. Причём бабушки остались. Они даже почувствовали себя хозяйками положения. Некому на них прикрикнуть. Некому поставить их на место. Бабушки застёгивают вам пуговицы и кормят вас манной кашей. А разве может вырасти из человека что-нибудь дельное, если в детстве он не слышит о звёздах и великих людях, но ест кашу из женских рук? От дедушки пахнет табаком и солнцем. Бабушку он называет «мать», а маму – «дочка». Но настоящая дружба у него с внуком. Они посвящены в одну тайну. Мир для них одинаково свеж и загадочен. Поэтому за обедом они хитро подмигивают друг другу и смеются глазами. Сейчас они встанут и пойдут вместе. Может, рыбачить, а может – ремонтировать велосипед. Внуку интересно жить, а деду умирать не страшно. У нас давно не было ни войн, ни эпидемий. Дедушек никто не убивал, но они куда-то исчезли. Бросили своих бабушек и ушли к другим. Глупо растратили жизнь и не дожили до внуков. Не обзавелись семьёй и остались бездетными. Короче, всё расшаталось и сдвинулось с основания. Поэтому в мире так много капризных и нервных детей. И много никому не нужных стареющих мужчин, пьющих с тоски и никого не называющих словом «внучок». (А. Ю. Ткачёв)', a:['такие', 'эти', 'те'], src:'Вариант 5 · задание 1' },
    { text:true, q:'Самостоятельно подберите указательную частицу, которая должна стоять на месте пропуска во втором предложении текста. Запишите эту частицу.', sourceText:'Правоспособность возникает у человека с момента рождения, а дееспособность, т. е. способность самостоятельно осуществлять свои права, выполнять обязанности, нести ответственность ‒ в полной мере по достижении 18-летнего возраста. Правовой статус ребёнка – <…> совокупность его прав, обязанностей и ответственности от рождения до достижения совершеннолетия. Правовой статус ребёнка меняется в процессе взросления. К правам, которые ребёнок приобретает с момента рождения, относятся право на жизнь; право на имя, отчество и фамилию; право на гражданство; право знать своих родителей; право жить и воспитываться в семье; право говорить на родном языке и др. С шести лет ребёнок имеет право на поступление в школу. С восьми лет имеет право быть членом и участником детского общественного объединения. С десяти лет имеет право дать согласие на изменение своего имени и (или) фамилии, выразить свое мнение о том, с кем из своих родителей, расторгающих брак в суде, он хотел бы проживать после развода. С четырнадцатилетнего возраста ребёнок приобретает право давать согласие на изменение своего гражданства, право без согласия родителей распоряжаться заработком (стипендией) и иными доходами, право быть принятым на работу в свободное от учёбы время для выполнения лёгкого труда, право и обязанность иметь паспорт. С пятнадцатилетнего возраста у подростка появляется право соглашаться или не соглашаться на медицинское вмешательство. С шестнадцатилетнего возраста молодой человек получает право при наличии уважительной причины вступить в брак и самостоятельно осуществлять родительские обязанности.', a:['это'], src:'Вариант 6 · задание 1' },
    { text:true, q:'Самостоятельно подберите местоименное наречие, которое должно стоять на месте пропуска в первом предложении текста. Запишите это наречие.', sourceText:'В нижнем этаже отведённого для лицея флигеля царскосельского дворца было размещено всё лицейское начальство; во втором этаже были столовая, зал, канцелярия и больница; в третьем ‒ классы, рекреационный зал, физический кабинет, а в арке, соединявшей лицей с главным зданием дворца, – библиотека лицеистов, <…> насчитывалось уже в 1811 году 800 томов; наконец, весь четвёртый этаж, куда поднялись теперь Пушкин и Пущин, был занят дортуарами воспитанников. Вдоль всего этого этажа шёл коридор, который освещался только решётчатыми окошечками в дверях комнат, расположенных по обе его стороны, так что даже в светлый, солнечный день там царствовал полумрак, а теперь, в пасмурную погоду, было ещё темнее. На одной из дверей Пушкин прочёл надпись: «№ 14. Александр Пушкин». – А посмотри-ка, рядом кто, ‒ сказал Пущин. На соседней двери такая же дощечка гласила: «№ 13. Иван Пущин». Пушкин переглянулся с приятелем сияющим взором. – Сама судьба нас свела! Комнатка была невелика, но во всяком случае достаточно поместительна для одного человека, тем более для подростка. В ней стояли под окном ‒ столик, у одной стены – кровать и умывальный стол, у другой ‒ комод с зеркальцем над ним, стул и конторка. Окрашенная в светло-серый цвет с красной каёмкой по потолку, освещаемая единственным, но высоким окном, комнатка эта даже теперь, в серый зимний день, имела приветливый, уютный вид. На конторке стояли чернильница и шандал со щипцами (в то время употреблялись одни только сальные свечи, с которых нагар «снимался» щипцами), а на гвоздях у дверей аккуратно были развешаны полотенце и казённая амуниция нового постояльца. Глаза Александра прежде всего с удовольствием остановились на чернильнице. – И чернила уж налиты! ‒ сказал он. – Да, чернильная душа, ‒ отвечал Пущин. – Можешь хоть сейчас приняться писать стихи. (По В. П. Авенариусу)', a:['где', 'там', 'здесь'], src:'Вариант 7 · задание 1' },
    { text:true, q:'Самостоятельно подберите подчинительный союз, который должен стоять на месте пропуска в первом предложении текста. Запишите этот союз.', sourceText:'Аркадий Ильич, как заметил, что я в себя прихожу, пригнулся ко мне и говорит: «Любушка, голубушка! за нами гонятся… согласна ли умереть, <…> не уйдем?» Я отвечала, что даже с радостью согласна. Надеялся он уйти в турецкий Хрущук, куда тогда много наших людей от Каменского бежали. И вдруг тут мы по льду какую-то речку перелетели, и впереди что-то вроде жилья засерело и собаки залаяли; а ямщик ещё тройку нахлестал и сразу на один бок саней навалился, скособочил их, и мы с Аркадием в снег вывалились, а он, и сани, и лошади, всё из глаз пропало. Аркадий говорит: «Ничего не бойся, это так надобно, потому что ямщик, который нас вёз, я его не знаю, а он нас не знает. Он с тем за три золотых нанялся, чтобы тебя увезть, а ему бы свою душу спасти. Теперь над нами будь воля божья: вот село Сухая Орлица – тут смелый священник живёт, отчаянные свадьбы венчает и много наших людей проводил. Мы ему подарок подарим, он нас до вечера спрячет и перевенчает, а к вечеру ямщик опять подъедет, и мы тогда скроемся». Постучали мы в дом и взошли в сени. Отворил сам священник, старый, приземковатый, одного зуба в переднем строю нет, и жена у него старушка старенькая – огонь вздула. Мы им оба в ноги кинулись. «Спасите, дайте обогреться и спрячьте до вечера». (По Н. С. Лескову)', a:['если', 'коли'], src:'Вариант 8 · задание 1' },
    { text:true, q:'Самостоятельно подберите указательное местоимение, которое должно стоять на месте пропуска в пятом абзаце текста. Запишите это местоимение.', sourceText:'Обида – одна из негативных эмоций, которая основана на заблуждениях по поводу окружающей реальности. Чаще всего мы обижаемся на конкретных людей. Причём одно из главных условий – это значимость для нас тех, на кого мы обижаемся. Мы привязаны к ним и поэтому приписываем им несуществующие положительные качества. Модель взаимоотношений, создаваемая в нашем сознании, приобретает в таком случае идеализированный характер с акцентом на долженствовании. Врачи должны быть только от бога; полицейские – исключительно героями- альтруистами; мастера – асами каждый в своём деле; ну а человек, в которого мы влюбились, несомненно, будет бесконечно счастлив жить по тем сценариям, которые мы заранее «срежиссировали» у себя в голове. Понятно, что иллюзорные ожидания не оправдываются, поскольку мир и люди несовершенны и не подчиняются нашим «хотелкам». Неоправдавшиеся ожидания порождают обиду, которая мешает жить. Чем взрослее человек (речь не о возрасте!), тем менее он драматизирует несовершенство мира, тем больше склонен принимать людей и обстоятельства, тем реже оказывается в плену иллюзий и, как следствие, затяжной, бессмысленной рефлексии. Если же ожидания не оправдываются, он не обижается, а входит в конструктивный диалог. После <…> взвешивает, насколько оптимальными будут дальнейшие взаимоотношения, сопоставляет свои и чужие ресурсы и принимает окончательное решение по поводу улучшения или окончания взаимоотношений. Обида же в подобной ситуации порождает либо гневные высказывания, либо молчание, которые мешают конструктивному диалогу. Проработать обиду не означает «не чувствовать обиды», «смириться с несправедливостью» или, уж тем более, «полюбить обидчика». Это означает признать своё реальное место в сложившейся ситуации, оценить свои ресурсы для решения возникшей проблемы отношений, понять, что делать со своей жизнью, а не с чужой. И после этого менять что-то в реальности, а не увязать в затягивающей трясине обиды, лишающей человека и сил, и радости. (По Ю. В. Мошкину)', a:['этого', 'того'], src:'Вариант 9 · задание 1' },
    { text:true, q:'Самостоятельно подберите притяжательное местоимение, которое должно стоять на месте пропуска во втором (2) абзаце текста. Запишите это местоимение.', sourceText:'Когда мы видим своё отражение в зеркале или фотографию, на которой мы изображены, у нас не возникает сомнений, что это всего лишь наш зрительный образ, но не собственно мы. Образ этот – часть виртуального, отражённого мира, не реального. Тогда как мы сами вполне реальны. То же самое и в литературе. Писатель изображает мир. А слово «изображает» произошло от слова «образ». Это значит, что писатель создаёт образы. Их множество: пейзажные, интерьерные, образы героев, поступков, событий, образы предметного мира и т. д., всего и не перечесть. И всё <…> произведение – это виртуальный мир, в который мы попадаем благодаря своему умению читать и воображать. Заметьте, слово «воображать» опять-таки однокоренное к слову «образ», оно означает способность видеть мир в образах, представлять их в своём сознании. Среди множества образов художественных произведений хочется выделить один, который иногда остаётся незамеченным. Это образ повествователя. Того, кто нам рассказывает обо всех героях и их поступках, событиях, случающихся в их жизни, кто описывает место действия и т.д. Обратим внимание: повествователь – это не автор. Автор – живой человек, сидит себе за письменным столом и пишет рассказы. И повествователя он тоже изображает в рассказе. Но особым способом! Можно сказать, что он его как будто бы превращает в собственного тайного агента. У повествователя часто нет ни имени, ни внешних черт, ни поступков, о его жизни мы ничегошеньки не узнаём. Невидим и таинствен. Всё, что у него есть, – это только его речь – с её манерой, стилем, с возможностью мельком дать какие-то оценки происходящему, поиронизировать, например, или, наоборот, восхититься. Иногда повествователь очень близок автору по стилю речи и мироощущению (как у Тургенева, например), иногда – совершенно далёк от него (как у Лескова или Зощенко). Повествователь в произведениях В. Г. Распутина о деревне благодаря простоте речи, включающей местную лексику, воспринимается как деревенский житель, знающий всё про всех, переживающий и сочувствующий, мудрый, любящий свою малую родину и соотечественников. Такому доверяешься безотчётно, веришь в правдивость того, о чём он повествует. Часто повествование ведётся от первого лица и повествователь вспоминает и рассказывает о событиях, участником которых он был. Тогда он приобретает черты героя, участника действия, иначе говоря, становится персонифицированным повествователем: совершает поступки, вступает в отношения и разговоры с другими персонажами (Максим Максимыч, Печорин в «Журнале Печорина» у Лермонтова). В таком случае повествователя можно называть рассказчиком или героем-рассказчиком. И тогда становится уже совершенно ясно, что перед нами точно не сам автор.', a:['его'], src:'Вариант 10 · задание 1' },
  ],
  2: [
    { multi:true, q:'В тексте выделено пять слов. Укажите варианты ответов, в которых лексическое значение выделенного слова соответствует его значению в данном тексте. Запишите номера ответов.', opts:['МЫСЛЬ. Знание, познание в какой-либо области. Научная, техническая мысль.', 'ЖЁСТКИЙ. Не допускающий отклонений, изменений; строгий, безоговорочный. Установить жёсткие правила.', 'СЧИТАТЬ. Расценивать, воспринимать каким-либо образом. Считать кого-либо счастливым.', 'ЗАКОН. Объективно существующая необходимая связь между явлениями, основное положение какой-л. деятельности, творчества. Закон природы.', 'СИСТЕМА. Техническое устройство, представляющее собой совокупность взаимно связанных сооружений, машин, механизмов, служащих одной цели. Система отопления.'], a:[1, 2, 3], sourceText:'Ф. М. Достоевский написал, что красота спасёт мир. Но какую красоту он имел в виду — женскую? В романе «Идиот» эти слова произносит 18-летний юноша Ипполит Терентьев: «Господа, — закричал он громко всем, — князь утверждает, что мир спасёт красота! А я утверждаю, что у него оттого такие игривые **мысли**, что он теперь влюблён». Достоевский неспроста вложил свою идею в уста героя романа «Идиот», к тому же выразив её через «посредника». Во время написания романа в обществе набирали силу тенденции **жёсткого** рационализма, и такая идея выглядела очень и очень странно. Сегодня мало кто воспринимает <…> мысль Достоевского всерьёз. Она кажется нам просто выражением тоски писателя по утраченной гармонии. Да и древние греки, которые впервые задумались о философской сущности красоты, **считали** её непрактичной, неутилитарной. Но почему тогда великий авиаконструктор А. Туполев любил повторять, что некрасивые самолёты не летают? Может быть, красота всё-таки имеет практическую значимость? Может, именно в её **законах** и кроется прообраз новой технологической **системы**, которая спасёт человечество от всех надвигающихся на него ресурсных, социальных и экологических проблем? Хочется надеяться, что, научно постигнув тайны красоты, мы сможем преобразить всю нашу жизнь, получив при этом не только эстетический, но и огромный экономический результат. И тогда прогноз Достоевского окажется самым гениальным из всех великих прогнозов.', src:'Вариант 1 · задание 2' },
    { multi:true, q:'В тексте выделено пять слов. Укажите варианты ответов, в которых лексическое значение выделенного слова соответствует его значению в данном тексте. Запишите номера ответов.', opts:['ДВИЖЕНИЕ. Изменение положения тела или его частей. Неловкое движение.', 'ВЫЗВАТЬ (несов. вызывать). Попросить прийти, пригласить. Вызвать врача.', 'Лирический. Проникнутый лиризмом, эмоциями, полный чувства. Лирические порывы.', 'ШУМ. Громкий спор, ссора, крики. Поднять шум из-за пустяка.', 'СОЮЗ. Тесное соединение, связь. Братский союз.'], a:[0, 2, 4], sourceText:'Какие взаимоотношения с природой нужны человеку сейчас? Да просто необходим союз с природой. Сегодня в моде бег трусцой, но раньше самыми полезными для здоровья и для духовной жизни человека считались длительные пешеходные прогулки. Чем дальние пешие прогулки отличаются от бега трусцой? Когда человек бежит, он волей или неволей должен думать о том, что у него под ногами, в это время он не размышляет. Во время же пеших прогулок он размышляет. Старинные петербургские парки были рассчитаны на работу мысли, а не только на **движение** ногами. Прогулки по паркам **вызывали** мысли о природе, о смерти, о бренности существования, о животных, о тех или иных событиях. Гуляющий имел «материал» для размышлений **лирических** и эмоциональных, для размышлений о своём детстве, о союзе с природой, <…> так популярны были «романтические» парки, в которых природа находится в союзе с человеком. В романтических парках человек только слегка вмешивается в природу, улучшая её, вот почему романтические парки жизненно необходимы современным городам. Мы устали от городской суеты, от непрекращающегося **шума**, преобладания техники и человека над природой; природа нами усиленно портится, и именно в романтических парках заключён идеальный **союз** с природой. (По Д. С. Лихачёву)', src:'Вариант 2 · задание 2' },
    { multi:true, q:'В тексте выделено пять слов. Укажите варианты ответов, в которых лексическое значение выделенного слова соответствует его значению в данном тексте. Запишите номера ответов.', opts:['УСЛОВИЕ. Обстановка, в которой происходит, протекает что-либо. Природные, географические условия.', 'ОБЛАСТЬ. Часть какой-либо территории (страны, государства, материка и т. п.). Северо-западная область.', 'НАЧАТЬ. Заняться чем-то в первую очередь. Начать урок с разминки.', 'СУХОЙ. Не содержащий жидкости или содержащий мало жидкости; не жидкий. Сухое молоко.', 'ЗЕМЛЯ. Верхний слой земной коры; почва, грунт. Пахать землю. В недрах земли.'], a:[0, 4], sourceText:'Установлено, что в экстремальных погодных **условиях** некоторые виды лягушек погружаются в состояние анабиоза и могут не проявлять никакой активности в течение нескольких месяцев. В холодных **областях** лягушки зимой впадают в спячку. Некоторые виды прячутся в расщелинах или закапываются в сухие листья. Водные виды, например лягушка-бык, как правило, залегают на дне водоёма, частично погружаясь в ил, но сохраняя при этом доступ к кислороду, растворённому в воде. Их метаболизм замедляется, и они выживают за счёт потребления внутренних энергетических резервов. Многие лягушки могут выжить после замерзания. Несмотря на то что под их кожей и в полостях тела образуются кристаллы льда, жизненно важные органы защищены от замерзания вследствие высокой концентрации глюкозы в тканях. С виду безжизненная, замёрзшая лягушка может **начать** дышать и возобновить работу сердца, если её отогреть. Некоторые лягушки во время жаркого **сухого** сезона впадают в состояние эстивации — летней спячки, обходясь без пищи и воды 9−10 месяцев в году. Такие лягушки зарываются в **землю** и сворачиваются в защитном коконе, который образуется из сброшенной кожи. В процессе одного из исследований выяснилось, что во время эстивации метаболизм лягушки меняется так, что КПД митохондрий увеличивается, позволяя более эффективно использовать ограниченное количество энергетических ресурсов, доступных лягушке в состоянии спячки. А <…> исследование показало, что для удовлетворения минимальных энергетических требований у лягушки атрофируется большинство мышц, за исключением мышц задних конечностей.', src:'Вариант 3 · задание 2' },
    { multi:true, q:'В тексте выделено пять слов. Укажите варианты ответов, в которых лексическое значение выделенного слова соответствует его значению в данном тексте. Запишите номера ответов.', opts:['СРЕДА. Совокупность природных условий, в которых протекает жизнедеятельность какого-либо организма, жизнь общества. Географическая, природная среда.', 'УЧАСТОК. Выделенная часть земельной площади, занятая чем-либо или предназначенная для чего-либо. Огородный, приусадебный, участок.', 'ПРАВО. Предоставляемая законами государства возможность пользоваться чем- либо. Авторское право.', 'НАСТОЯЩИЙ. Подлинный, истинный; натуральный. Настоящее золото.', 'ПРИНАДЛЕЖАТЬ. Входить в состав, группу. Принадлежать к числу лучших.'], a:[0, 1, 2], sourceText:'Земельный кодекс Российской Федерации устанавливает нормы земельного законодательства имущественных отношений по владению, пользованию и распоряжению земельными участками, а также по совершению сделок с ними, указывая, что гражданское законодательство применяется, если иное не предусмотрено земельным, лесным, водным законодательством, законодательством о недрах, об охране окружающей **среды**, специальными федеральными законами. Согласно п. 3 ст. 6 Земельного кодекса Российской Федерации земельный **участок** как объект **права** собственности и иных предусмотренных **настоящим** кодексом прав на землю является недвижимой вещью, которая представляет собой часть земной поверхности и имеет характеристики, позволяющие определить её в качестве индивидуально определённой вещи. В соответствии со ст. 11.1 Земельного кодекса Российской Федерации земельным участком является часть земной поверхности, границы <…> определены в соответствии с федеральными законами. Собственнику **принадлежат** права владения, пользования и распоряжения своим имуществом. В соответствии с п. 6 ст. 27 Земельного кодекса Российской Федерации оборот земель сельскохозяйственного назначения регулируется Федеральным законом «Об обороте земель сельскохозяйственного назначения».', src:'Вариант 4 · задание 2' },
    { multi:true, q:'В тексте выделено пять слов. Укажите варианты ответов, в которых лексическое значение выделенного слова соответствует его значению в данном тексте. Запишите номера ответов.', opts:['ВЕЩЬ. Явление действительности, факт, обстоятельство, событие, случай. Произошла невероятная вещь.', 'НЕЖНЫЙ. Отличающийся изяществом очертаний или миниатюрностью. Нежный профиль.', 'ЗВЕЗДА. Геометрическая фигура с остроконечными выступами, равномерно расположенными по окружности. Пятиконечная звезда.', 'ВСТАТЬ. Принять стоячее положение, подняться на ноги. Встать со стула.', 'ОСНОВАНИЕ. Причина, повод, которые объясняют, оправдывают, делают понятным что-либо. Нет оснований для недовольства.'], a:[0, 3], sourceText:'Мы многое растеряли. В каталоге потерь — самые неожиданные **вещи**. Куда-то исчезли дедушки. Дедушка — это не просто муж бабушки. Это добрый человек с умными глазами, седой бородой и натруженными руками. В ту **нежную** пору жизни, когда вы узнаёте мир, дедушка должен сажать вас на колени и рассказывать о далёких звёздах и великих героях. <…> дедушки куда-то пропали. Причём бабушки остались. Они даже почувствовали себя хозяйками положения. Некому на них прикрикнуть. Некому поставить их на место. Бабушки застёгивают вам пуговицы и кормят вас манной кашей. А разве может вырасти из человека что-нибудь дельное, если в детстве он не слышит о **звёздах** и великих людях, но ест кашу из женских рук? От дедушки пахнет табаком и солнцем. Бабушку он называет «мать», а маму — «дочка». Но настоящая дружба у него с внуком. Они посвящены в одну тайну. Мир для них одинаково свеж и загадочен. Поэтому за обедом они хитро подмигивают друг другу и смеются глазами. Сейчас они **встанут** и пойдут вместе. Может, рыбачить, а может — ремонтировать велосипед. Внуку интересно жить, а деду умирать не страшно. У нас давно не было ни войн, ни эпидемий. Дедушек никто не убивал, но они куда-то исчезли. Бросили своих бабушек и ушли к другим. Глупо растратили жизнь и не дожили до внуков. Не обзавелись семьёй и остались бездетными. Короче, всё расшаталось и сдвинулось с **основания**. Поэтому в мире так много капризных и нервных детей. И много никому не нужных стареющих мужчин, пьющих с тоски и никого не называющих словом «внучок». (А. Ю. Ткачёв)', src:'Вариант 5 · задание 2' },
    { multi:true, q:'В тексте выделено пять слов. Укажите варианты ответов, в которых лексическое значение выделенного слова соответствует его значению в данном тексте. Запишите номера ответов.', opts:['СПОСОБНОСТЬ. Умение, а также возможность производить какие-нибудь действия. Способность двигаться.', 'ПРИОБРЕСТИ. Стать владельцем, обладателем чего-нибудь, получить что- нибудь. Приобрести власть.', 'ПРАВО. Совокупность устанавливаемых и охраняемых государственной властью норм и правил, регулирующих отношения людей в обществе, а также наука, изучающая эти нормы. Конституционное, гражданское право.', 'ЯЗЫК. Исторически сложившаяся система звуковых, словарных и грамматических средств, объективирующая работу мышления и являющаяся орудием общения, обмена мыслями и взаимного понимания людей в обществе. Славянские языки.', 'МОЛОДОЙ. Свойственный, присущий молодости. Молодой задор.'], a:[0, 1, 3], sourceText:'Правоспособность возникает у человека с момента рождения, а дееспособность, т. е. **способность** самостоятельно осуществлять свои права, выполнять обязанности, нести ответственность ‒ в полной мере по достижении 18-летнего возраста. Правовой статус ребёнка — <…> совокупность его прав, обязанностей и ответственности от рождения до достижения совершеннолетия. Правовой статус ребёнка меняется в процессе взросления. К правам, которые ребёнок **приобретает** с момента рождения, относятся **право** на жизнь; право на имя, отчество и фамилию; право на гражданство; право знать своих родителей; право жить и воспитываться в семье; право говорить на родном **языке** и др. С шести лет ребёнок имеет право на поступление в школу. С восьми лет имеет право быть членом и участником детского общественного объединения. С десяти лет имеет право дать согласие на изменение своего имени и (или) фамилии, выразить свое мнение о том, с кем из своих родителей, расторгающих брак в суде, он хотел бы проживать после развода. С четырнадцатилетнего возраста ребёнок приобретает право давать согласие на изменение своего гражданства, право без согласия родителей распоряжаться заработком (стипендией) и иными доходами, право быть принятым на работу в свободное от учёбы время для выполнения лёгкого труда, право и обязанность иметь паспорт. С пятнадцатилетнего возраста у подростка появляется право соглашаться или не соглашаться на медицинское вмешательство. С шестнадцатилетнего возраста **молодой** человек получает право при наличии уважительной причины вступить в брак и самостоятельно осуществлять родительские обязанности.', src:'Вариант 6 · задание 2' },
    { multi:true, q:'В тексте выделено пять слов. Укажите варианты ответов, в которых лексическое значение выделенного слова соответствует его значению в данном тексте. Запишите номера ответов.', opts:['ИДТИ. Следовать, двигаться в каком-нибудь направлении для достижения чего- нибудь. Идти к намеченной цели.', 'ПАСМУРНЫЙ. перен. Мрачный, невеселый. Пасмурное лицо.', 'СУДЬБА. Стечение обстоятельств, не зависящих от воли человека, ход жизненных событий. Удары, превратности судьбы.', 'ВИД. Внешность, видимый облик; состояние. Сад имел запущенный вид.', 'ДУША. Совокупность характерных свойств, черт, присущих личности. Продажная душа.'], a:[2, 3, 4], sourceText:'В нижнем этаже отведённого для лицея флигеля царскосельского дворца было размещено всё лицейское начальство; во втором этаже были столовая, зал, канцелярия и больница; в третьем ‒ классы, рекреационный зал, физический кабинет, а в арке, соединявшей лицей с главным зданием дворца, — библиотека лицеистов, <…> насчитывалось уже в 1811 году 800 томов; наконец, весь четвёртый этаж, куда поднялись теперь Пушкин и Пущин, был занят дортуарами воспитанников. Вдоль всего этого этажа **шёл** коридор, который освещался только решётчатыми окошечками в дверях комнат, расположенных по обе его стороны, так что даже в светлый, солнечный день там царствовал полумрак, а теперь, в **пасмурную** погоду, было ещё темнее. На одной из дверей Пушкин прочёл надпись: «№ 14. Александр Пушкин». — А посмотри-ка, рядом кто, ‒ сказал Пущин. На соседней двери такая же дощечка гласила: «№ 13. Иван Пущин». Пушкин переглянулся с приятелем сияющим взором. — Сама **судьба** нас свела! Комнатка была невелика, но во всяком случае достаточно поместительна для одного человека, тем более для подростка. В ней стояли под окном ‒ столик, у одной стены — кровать и умывальный стол, у другой ‒ комод с зеркальцем над ним, стул и конторка. Окрашенная в светло-серый цвет с красной каёмкой по потолку, освещаемая единственным, но высоким окном, комнатка эта даже теперь, в серый зимний день, имела приветливый, уютный **вид**. На конторке стояли чернильница и шандал со щипцами (в то время употреблялись одни только сальные свечи, с которых нагар «снимался» щипцами), а на гвоздях у дверей аккуратно были развешаны полотенце и казённая амуниция нового постояльца. Глаза Александра прежде всего с удовольствием остановились на чернильнице. — И чернила уж налиты! ‒ сказал он. — Да, чернильная **душа**, ‒ отвечал Пущин. — Можешь хоть сейчас приняться писать стихи. (По В. П. Авенариусу)', src:'Вариант 7 · задание 2' },
    { multi:true, q:'В тексте выделено пять слов. Укажите варианты ответов, в которых лексическое значение выделенного слова соответствует его значению в данном тексте. Запишите номера ответов.', opts:['ПЕРЕЛЕТЕЛИ. разг. Стремительно перепрыгнуть, перебежать, переехать через что-либо. Белка перелетела с дерева на дерево.', 'ТРОЙКА. Костюм, состоящий из пиджака, брюк (или жакета, юбки) и жилета. Мужская, женская тройка.', 'ВОЛЯ. Сознательное стремление к осуществлению чего-нибудь. Воля к победе.', 'СТАРЫЙ. Достигший старости. Старый человек.', 'ОГОНЬ. Внутреннее горение, страсть, пыл. В его характере много страсти, огня.'], a:[0, 3], sourceText:'Аркадий Ильич, как заметил, что я в себя прихожу, пригнулся ко мне и говорит: «Любушка, голубушка! за нами гонятся... согласна ли умереть, <…> не уйдем?» Я отвечала, что даже с радостью согласна. Надеялся он уйти в турецкий Хрущук, куда тогда много наших людей от Каменского бежали. И вдруг тут мы по льду какую-то речку **перелетели**, и впереди что-то вроде жилья засерело и собаки залаяли; а ямщик ещё **тройку** нахлестал и сразу на один бок саней навалился, скособочил их, и мы с Аркадием в снег вывалились, а он, и сани, и лошади, всё из глаз пропало. Аркадий говорит: «Ничего не бойся, это так надобно, потому что ямщик, который нас вёз, я его не знаю, а он нас не знает. Он с тем за три золотых нанялся, чтобы тебя увезть, а ему бы свою душу спасти. Теперь над нами будь **воля** божья: вот село Сухая Орлица — тут смелый священник живёт, отчаянные свадьбы венчает и много наших людей проводил. Мы ему подарок подарим, он нас до вечера спрячет и перевенчает, а к вечеру ямщик опять подъедет, и мы тогда скроемся». Постучали мы в дом и взошли в сени. Отворил сам священник, **старый**, приземковатый, одного зуба в переднем строю нет, и жена у него старушка старенькая — **огонь** вздула. Мы им оба в ноги кинулись. «Спасите, дайте обогреться и спрячьте до вечера». (По Н. С. Лескову)', src:'Вариант 8 · задание 2' },
    { multi:true, q:'В тексте выделено пять слов. Укажите варианты ответов, в которых лексическое значение выделенного слова соответствует его значению в данном тексте. Запишите номера ответов.', opts:['УСЛОВИЕ. Требование, предъявляемое одной из договаривающихся сторон. Назовите ваши условия.', 'ПРИПИСАТЬ (несов. ПРИПИСЫВАТЬ). Написать в добавление к чему-нибудь. Приписать несколько строк.', 'ХАРАКТЕР. Отличительное свойство, особенность, качество чего-нибудь. Затяжной характер болезни.', 'ДЕЛО. Сфера знаний, деятельности, работы. Горное дело.', 'РЕАЛЬНЫЙ. Действительно существующий, не воображаемый. Реальная действительность.'], a:[2, 3, 4], sourceText:'> Обида — одна из негативных эмоций, которая основана на > заблуждениях по поводу окружающей реальности. > > Чаще всего мы обижаемся на конкретных людей. Причём одно из > главных **условий** — это значимость для нас тех, > на кого мы обижаемся. Мы привязаны к ним и поэтому > **приписываем** им несуществующие положительные > качества. Модель взаимоотношений, создаваемая в нашем сознании, > приобретает в таком случае идеализированный > **характер** с акцентом на долженствовании. > > Врачи должны быть только от бога; полицейские — исключительно > героями-альтруистами; мастера — асами каждый в своём > **деле**; ну а человек, в которого мы влюбились, > несомненно, будет бесконечно счастлив жить по тем сценариям, > которые мы заранее «срежиссировали» у себя в голове. Понятно, что > иллюзорные ожидания не оправдываются, поскольку мир и люди > несовершенны и не подчиняются нашим «хотелкам». > > Неоправдавшиеся ожидания порождают обиду, которая мешает жить. > > Чем взрослее человек (речь не о возрасте!), тем менее он > драматизирует несовершенство мира, тем больше склонен принимать > людей и обстоятельства, тем реже оказывается в плену иллюзий и, > как следствие, затяжной, бессмысленной рефлексии. Если же ожидания > не оправдываются, он не обижается, а входит в конструктивный > диалог. После <…> взвешивает, насколько оптимальными будут > дальнейшие взаимоотношения, сопоставляет свои и чужие ресурсы и > принимает окончательное решение по поводу улучшения или окончания > взаимоотношений. Обида же в подобной ситуации порождает либо > гневные высказывания, либо молчание, которые мешают > конструктивному диалогу. > > Проработать обиду не означает «не чувствовать обиды», «смириться > с несправедливостью» или, уж тем более, «полюбить обидчика». Это > означает признать своё **реальное** место в > сложившейся ситуации, оценить свои ресурсы для решения возникшей > проблемы отношений, понять, что делать со своей жизнью, а не с > чужой. И после этого менять что-то в реальности, а не увязать > в затягивающей трясине обиды, лишающей человека и сил, и радости. (По Ю. В. Мошкину)', src:'Вариант 9 · задание 2' },
    { multi:true, q:'В тексте выделено пять слов. Укажите варианты ответов, в которых лексическое значение выделенного слова соответствует его значению в данном тексте. Запишите номера ответов.', opts:['ОТРАЖЕНИЕ. Образ предмета на полированной гладкой поверхности. Увидел своё отражение в воде.', 'ЛИТЕРАТУРА. Вид словесного искусства, целью которого является изображение жизни, создание художественных образов при помощи слова. Художественная литература.', 'ПЕРЕЧЕСТЬ. Прочитать всё или многое. Перечесть много книг.', 'ОБРАЗ. В художественном произведении: тип, характер. Плюшкин – образ скупца.', 'МЕСТНЫЙ. Здешний, не приезжий. Местный житель.'], a:[0, 1, 3], sourceText:'> Когда мы видим своё **отражение** в зеркале или > фотографию, на которой мы изображены, у нас не возникает сомнений, > что это всего лишь наш зрительный образ, но не собственно мы. > Образ этот — часть виртуального, отражённого мира, не реального. > Тогда как мы сами вполне реальны. > > То же самое и в **литературе**. Писатель изображает > мир. А слово «изображает» произошло от слова «образ». Это значит, > что писатель создаёт образы. Их множество: пейзажные, интерьерные, > образы героев, поступков, событий, образы предметного мира и т. > д., всего и не **перечесть**. И всё <…> > произведение — это виртуальный мир, в который мы попадаем > благодаря своему умению читать и воображать. Заметьте, слово > «воображать» опять-таки однокоренное к слову «образ», оно означает > способность видеть мир в образах, представлять их в своём > сознании. > > Среди множества образов художественных произведений хочется > выделить один, который иногда остаётся незамеченным. Это > **образ** повествователя. Того, кто нам рассказывает > обо всех героях и их поступках, событиях, случающихся в их жизни, > кто описывает место действия и т.д. Обратим внимание: > повествователь — это не автор. Автор — живой человек, сидит себе > за письменным столом и пишет рассказы. И повествователя он тоже > изображает в рассказе. Но особым способом! Можно сказать, что он > его как будто бы превращает в собственного тайного агента. > У повествователя часто нет ни имени, ни внешних черт, ни > поступков, о его жизни мы ничегошеньки не узнаём. Невидим и > таинствен. Всё, что у него есть, — это только его речь — с её > манерой, стилем, с возможностью мельком дать какие-то оценки > происходящему, поиронизировать, например, или, наоборот, > восхититься. > > Иногда повествователь очень близок автору по стилю речи и > мироощущению (как у Тургенева, например), иногда — совершенно > далёк от него (как у Лескова или Зощенко). Повествователь в > произведениях В. Г. Распутина о деревне благодаря простоте речи, > включающей **местную** лексику, воспринимается как > деревенский житель, знающий всё про всех, переживающий и > сочувствующий, мудрый, любящий свою малую родину и > соотечественников. Такому доверяешься безотчётно, веришь > в правдивость того, о чём он повествует. > > Часто повествование ведётся от первого лица и повествователь > вспоминает и рассказывает о событиях, участником которых он был. > Тогда он приобретает черты героя, участника действия, иначе > говоря, становится персонифицированным повествователем: совершает > поступки, вступает в отношения и разговоры с другими персонажами > (Максим Максимыч, Печорин в «Журнале Печорина» у Лермонтова). В > таком случае повествователя можно называть рассказчиком или > героем-рассказчиком. И тогда становится уже совершенно ясно, что > перед нами точно не сам автор.', src:'Вариант 10 · задание 2' },
  ],
  3: [
    { multi:true, q:'Укажите варианты ответов, в которых даны верные характеристики фрагмента текста. Запишите номера этих ответов.', opts:['Лексический состав текста характеризуется обилием научных терминов, среди которых слова авиаконструктор, прообраз, гармония.', 'Диалогичность текста выражается в частотном использовании вопросительных предложений, которые помогают автору вовлекать читателя в совместные рассуждения о сущности красоты.', 'В тексте перечисляются последовательные действия персонажей, поэтому ведущий функционально-смысловой тип речи в приведённом фрагменте – повествование.', 'Синтаксический строй текста отличается регулярным использованием безличных предложений, что придаёт информации объективный характер.', 'Главная цель автора – побудить читателя к рассуждению на предложенную тему, что свидетельствует о принадлежности текста к публицистическому стилю.'], a:[1, 4], sourceText:'Ф. М. Достоевский написал, что красота спасёт мир. Но какую красоту он имел в виду – женскую? В романе «Идиот» эти слова произносит 18-летний юноша Ипполит Терентьев: «Господа, – закричал он громко всем, – князь утверждает, что мир спасёт красота! А я утверждаю, что у него оттого такие игривые мысли, что он теперь влюблён». Достоевский неспроста вложил свою идею в уста героя романа «Идиот», к тому же выразив её через «посредника». Во время написания романа в обществе набирали силу тенденции жёсткого рационализма, и такая идея выглядела очень и очень странно. Сегодня мало кто воспринимает <...> мысль Достоевского всерьёз. Она кажется нам просто выражением тоски писателя по утраченной гармонии. Да и древние греки, которые впервые задумались о философской сущности красоты, считали её непрактичной, неутилитарной. Но почему тогда великий авиаконструктор А. Туполев любил повторять, что некрасивые самолёты не летают? Может быть, красота всё-таки имеет практическую значимость? Может, именно в её законах и кроется прообраз новой технологической системы, которая спасёт человечество от всех надвигающихся на него ресурсных, социальных и экологических проблем? Хочется надеяться, что, научно постигнув тайны красоты, мы сможем преобразить всю нашу жизнь, получив при этом не только эстетический, но и огромный экономический результат. И тогда прогноз Достоевского окажется самым гениальным из всех великих прогнозов.', src:'Вариант 1 · задание 3' },
    { multi:true, q:'Укажите варианты ответов, в которых даны верные характеристики фрагмента текста. Запишите номера этих ответов.', opts:['Соблюдено требование понятности текста для широкой аудитории: большинство слов в тексте относятся к разряду общеупотребительных.', 'Экологическая проблематика текста обусловила широкое использование научной лексики из этой сферы (природа, парки, прогулки, бег трусцой и т. п.)', 'Авторское воздействие на читателя реализуется в том числе с помощью синтаксических средств и приёмов, среди которых вопросно-ответная форма изложения, ряды однородных членов, антитеза.', 'Текст содержит грамматические особенности, характерные для письменной речи: отглагольные существительные (преобладание, движение, взаимоотношения), конструкции с существительными в родительном падеже (работа мысли, духовная жизнь человека, преобладание техники над природой).', 'Наличие конкретных существительных (мысль, взаимоотношения, союз) указывает на принадлежность текста к художественному стилю речи.'], a:[0, 2, 3], src:'Вариант 2 · задание 3' },
    { multi:true, q:'Укажите варианты ответов, в которых даны верные характеристики фрагмента текста. Запишите номера этих ответов.', opts:['В тексте реализуется функция эмоционального воздействия на читателя, с этой целью применяются такие языковые средства, как повышенная экспрессивность лексики и синтаксический параллелизм.', 'Последовательное употребление узкоспециальных научных терминов (анабиоз, метаболизм, эстивация, митохондрии) свидетельствует о высокой степени точности текста, что характерно для научного стиля речи.', 'Текст отличается сложностью синтаксических конструкций: в предложениях представлены обособленные определения и обстоятельства, вводные слова и сочетания слов. Частотны сложноподчинённые предложения.', 'Отглагольные существительные (потребление, замерзание, исследование, удовлетворение) указывают на преобладающий в тексте тип речи – повествование.', 'Благодаря использованию производных предлогов (за счёт, в течение, вследствие, за исключением) подчёркивается логичность и последовательность излагаемой в тексте информации.'], a:[1, 2, 4], sourceText:'Установлено, что в экстремальных погодных условиях некоторые виды лягушек погружаются в состояние анабиоза и могут не проявлять никакой активности в течение нескольких месяцев. В холодных областях лягушки зимой впадают в спячку. Некоторые виды прячутся в расщелинах или закапываются в сухие листья. Водные виды, например лягушка-бык, как правило, залегают на дне водоёма, частично погружаясь в ил, но сохраняя при этом доступ к кислороду, растворённому в воде. Их метаболизм замедляется, и они выживают за счёт потребления внутренних энергетических резервов. Многие лягушки могут выжить после замерзания. Несмотря на то что под их кожей и в полостях тела образуются кристаллы льда, жизненно важные органы защищены от замерзания вследствие высокой концентрации глюкозы в тканях. С виду безжизненная, замёрзшая лягушка может начать дышать и возобновить работу сердца, если её отогреть. Некоторые лягушки во время жаркого сухого сезона впадают в состояние эстивации – летней спячки, обходясь без пищи и воды 9−10 месяцев в году. Такие лягушки зарываются в землю и сворачиваются в защитном коконе, который образуется из сброшенной кожи. В процессе одного из исследований выяснилось, что во время эстивации метаболизм лягушки меняется так, что КПД митохондрий увеличивается, позволяя более эффективно использовать ограниченное количество энергетических ресурсов, доступных лягушке в состоянии спячки. А <…> исследование показало, что для удовлетворения минимальных энергетических требований у лягушки атрофируется большинство мышц, за исключением мышц задних конечностей.', src:'Вариант 3 · задание 3' },
    { multi:true, q:'Укажите варианты ответов, в которых даны верные характеристики фрагмента текста. Запишите номера этих ответов.', opts:['Лексической особенностью текста является частотное использование книжной и специальной лексики (кодекс, пользование, объект, норма, владение, настоящий в значении ‘данный’).', 'Текст относится к административно-правовой сфере жизнедеятельности человека, поэтому соответствует требованиям предельной точности и однозначности информации, исключающей разные толкования содержания. Это проявляется, в том числе, в отсутствии риторических фигур и слов в переносном значении.', 'Синтаксис текста характеризуется упрощённостью: количество сложных и осложнённых предложений незначительно, преобладают простые неосложнённые предложения, что делает текст доступным широкому кругу читателей.', 'Частое повторение в тексте одних и тех же слов, форм, оборотов, конструкций, однотипность способов выражения мысли свидетельствуют о стремлении к стандартизации, необходимой при составлении законодательной документации, регулирующей деятельность государственных органов.', 'Наличие относительных имён прилагательных (водный, лесной, земельный, федеральный, имущественный, сельскохозяйственный, специальный) указывает на преобладание в тексте функционально-смыслового типа речи – описания.'], a:[0, 1, 3], sourceText:'Земельный кодекс Российской Федерации устанавливает нормы земельного законодательства имущественных отношений по владению, пользованию и распоряжению земельными участками, а также по совершению сделок с ними, указывая, что гражданское законодательство применяется, если иное не предусмотрено земельным, лесным, водным законодательством, законодательством о недрах, об охране окружающей среды, специальными федеральными законами. Согласно п. 3 ст. 6 Земельного кодекса Российской Федерации земельный участок как объект права собственности и иных предусмотренных настоящим кодексом прав на землю является недвижимой вещью, которая представляет собой часть земной поверхности и имеет характеристики, позволяющие определить её в качестве индивидуально определённой вещи. В соответствии со ст. 11.1 Земельного кодекса Российской Федерации земельным участком является часть земной поверхности, границы <…> определены в соответствии с федеральными законами. Собственнику принадлежат права владения, пользования и распоряжения своим имуществом. В соответствии с п. 6 ст. 27 Земельного кодекса Российской Федерации оборот земель сельскохозяйственного назначения регулируется Федеральным законом «Об обороте земель сельскохозяйственного назначения».', src:'Вариант 4 · задание 3' },
    { multi:true, q:'Укажите варианты ответов, в которых даны верные характеристики фрагмента текста. Запишите номера этих ответов.', opts:['Выразительность, динамичность и лёгкость восприятия текста достигаются за счёт использования синтаксических средств: небольших по длине простых предложений, рядов однородных членов предложения.', 'Лексической особенностью текста является употребление антонимов (пропали – остались, жить – умирать), слов с оценочным значением (добрый, умными, дельное, глупо, капризных, нервных).', 'Стандартизированность языка и официальность стиля проявляются в использовании фразеологизмов: «смеются глазами», «пьющих с тоски», «растратили жизнь», «хозяйка положения».', 'В тексте представлена неподготовленная диалогическая речь в условиях свободного общения её участников.', 'Причинно-следственные отношения между предложениями текста выражаются с помощью местоимённого наречия поэтому.'], a:[0, 1, 4], sourceText:'Мы многое растеряли. В каталоге потерь – самые неожиданные вещи. Куда- то исчезли дедушки. Дедушка – это не просто муж бабушки. Это добрый человек с умными глазами, седой бородой и натруженными руками. В ту нежную пору жизни, когда вы узнаёте мир, дедушка должен сажать вас на колени и рассказывать о далёких звёздах и великих героях. <…> дедушки куда-то пропали. Причём бабушки остались. Они даже почувствовали себя хозяйками положения. Некому на них прикрикнуть. Некому поставить их на место. Бабушки застёгивают вам пуговицы и кормят вас манной кашей. А разве может вырасти из человека что-нибудь дельное, если в детстве он не слышит о звёздах и великих людях, но ест кашу из женских рук? От дедушки пахнет табаком и солнцем. Бабушку он называет «мать», а маму – «дочка». Но настоящая дружба у него с внуком. Они посвящены в одну тайну. Мир для них одинаково свеж и загадочен. Поэтому за обедом они хитро подмигивают друг другу и смеются глазами. Сейчас они встанут и пойдут вместе. Может, рыбачить, а может – ремонтировать велосипед. Внуку интересно жить, а деду умирать не страшно. У нас давно не было ни войн, ни эпидемий. Дедушек никто не убивал, но они куда-то исчезли. Бросили своих бабушек и ушли к другим. Глупо растратили жизнь и не дожили до внуков. Не обзавелись семьёй и остались бездетными. Короче, всё расшаталось и сдвинулось с основания. Поэтому в мире так много капризных и нервных детей. И много никому не нужных стареющих мужчин, пьющих с тоски и никого не называющих словом «внучок». (А. Ю. Ткачёв)', src:'Вариант 5 · задание 3' },
    { multi:true, q:'Укажите варианты ответов, в которых даны верные характеристики фрагмента текста. Запишите номера этих ответов.', opts:['Лексические повторы (право) и употребление однокоренных слов (правовой, правоспособность), характерные для данного текста, позволяют точно, объективно и логично донести до читателя однотипную информацию.', 'Синтаксический параллелизм и ряды однородных членов дают возможность структурировать и уплотнять информацию текста.', 'Для синтаксического строения предложений данного текста характерен прямой порядок слов.', 'Юридические термины (правоспособность, дееспособность, правовой статус) являются свидетельством того, что данный тест создан средствами научного стиля речи.', 'Официально-деловой стиль текста предполагает использование в данном фрагменте такого функционально-смыслового типа речи, как повествование.'], a:[0, 1, 2], sourceText:'Правоспособность возникает у человека с момента рождения, а дееспособность, т. е. способность самостоятельно осуществлять свои права, выполнять обязанности, нести ответственность ‒ в полной мере по достижении 18-летнего возраста. Правовой статус ребёнка – <…> совокупность его прав, обязанностей и ответственности от рождения до достижения совершеннолетия. Правовой статус ребёнка меняется в процессе взросления. К правам, которые ребёнок приобретает с момента рождения, относятся право на жизнь; право на имя, отчество и фамилию; право на гражданство; право знать своих родителей; право жить и воспитываться в семье; право говорить на родном языке и др. С шести лет ребёнок имеет право на поступление в школу. С восьми лет имеет право быть членом и участником детского общественного объединения. С десяти лет имеет право дать согласие на изменение своего имени и (или) фамилии, выразить свое мнение о том, с кем из своих родителей, расторгающих брак в суде, он хотел бы проживать после развода. С четырнадцатилетнего возраста ребёнок приобретает право давать согласие на изменение своего гражданства, право без согласия родителей распоряжаться заработком (стипендией) и иными доходами, право быть принятым на работу в свободное от учёбы время для выполнения лёгкого труда, право и обязанность иметь паспорт. С пятнадцатилетнего возраста у подростка появляется право соглашаться или не соглашаться на медицинское вмешательство. С шестнадцатилетнего возраста молодой человек получает право при наличии уважительной причины вступить в брак и самостоятельно осуществлять родительские обязанности.', src:'Вариант 6 · задание 3' },
    { multi:true, q:'Укажите варианты ответов, в которых даны верные характеристики фрагмента текста. Запишите номера этих ответов.', opts:['Лексика, использованная в тексте, разнообразна с точки зрения сферы употребления: книжные слова (канцелярия, дортуары, амуниция) и обороты речи (царствовал полумрак, «сама судьба нас свела») соседствуют с разговорными формами (посмотри-ка, дощечка, комнатка, окошечко, зеркальце) и оборотами (чернильная душа), основной же лексический массив составляют общеупотребительные слова.', 'Устаревшие слова (шандал, поместительна) и формы (во втором этаже) помогают читателю почувствовать атмосферу минувшей эпохи.', 'К синтаксическим особенностям текста относится использование двух диалогов, а также сложных и простых осложнённых предложений в описательных частях.', 'Использование эпитетов (приветливый, уютный вид; сияющий взор) и инверсий (стояли чернильница и шандал; употреблялись одни только сальные свечи) – признаки художественного стиля речи.', 'В данном тексте представлены все три функционально-смысловых типа речи.'], a:[0, 1, 2, 3], sourceText:'В нижнем этаже отведённого для лицея флигеля царскосельского дворца было размещено всё лицейское начальство; во втором этаже были столовая, зал, канцелярия и больница; в третьем ‒ классы, рекреационный зал, физический кабинет, а в арке, соединявшей лицей с главным зданием дворца, – библиотека лицеистов, <…> насчитывалось уже в 1811 году 800 томов; наконец, весь четвёртый этаж, куда поднялись теперь Пушкин и Пущин, был занят дортуарами воспитанников. Вдоль всего этого этажа шёл коридор, который освещался только решётчатыми окошечками в дверях комнат, расположенных по обе его стороны, так что даже в светлый, солнечный день там царствовал полумрак, а теперь, в пасмурную погоду, было ещё темнее. На одной из дверей Пушкин прочёл надпись: «№ 14. Александр Пушкин». – А посмотри-ка, рядом кто, ‒ сказал Пущин. На соседней двери такая же дощечка гласила: «№ 13. Иван Пущин». Пушкин переглянулся с приятелем сияющим взором. – Сама судьба нас свела! Комнатка была невелика, но во всяком случае достаточно поместительна для одного человека, тем более для подростка. В ней стояли под окном ‒ столик, у одной стены – кровать и умывальный стол, у другой ‒ комод с зеркальцем над ним, стул и конторка. Окрашенная в светло-серый цвет с красной каёмкой по потолку, освещаемая единственным, но высоким окном, комнатка эта даже теперь, в серый зимний день, имела приветливый, уютный вид. На конторке стояли чернильница и шандал со щипцами (в то время употреблялись одни только сальные свечи, с которых нагар «снимался» щипцами), а на гвоздях у дверей аккуратно были развешаны полотенце и казённая амуниция нового постояльца. Глаза Александра прежде всего с удовольствием остановились на чернильнице. – И чернила уж налиты! ‒ сказал он. – Да, чернильная душа, ‒ отвечал Пущин. – Можешь хоть сейчас приняться писать стихи. (По В. П. Авенариусу)', src:'Вариант 7 · задание 3' },
    { multi:true, q:'Укажите варианты ответов, в которых даны верные характеристики фрагмента текста. Запишите номера этих ответов.', opts:['Использование наряду с общеупотребительной лексикой разговорных и диалектных слов (нахлестал, скособочил, приземковатый, увезть, вздула), а также фразеологизмов разговорного стиля (из глаз пропало, в ноги кинулись) позволяет автору создать речевой портрет героини-рассказчицы.', 'К синтаксическим особенностям текста относится частое употребление прямой и косвенной речи.', 'Основной функционально-стилевой тип речи – повествование: преобладают глаголы, обозначающие физические действия, в форме прошедшего времени совершенного вида; в истории, рассказанной героиней, события и действия героев совершаются последовательно.', 'Эпитеты (смелый, отчаянные, старый, старенькая, приземковатый) указывают на то, что, помимо повествования, в тексте присутствует описание.', 'Стиль текста – публицистический: позиция автора выражена открыто, ясно и просто.'], a:[0, 1, 2, 3], sourceText:'Аркадий Ильич, как заметил, что я в себя прихожу, пригнулся ко мне и говорит: «Любушка, голубушка! за нами гонятся… согласна ли умереть, <…> не уйдем?» Я отвечала, что даже с радостью согласна. Надеялся он уйти в турецкий Хрущук, куда тогда много наших людей от Каменского бежали. И вдруг тут мы по льду какую-то речку перелетели, и впереди что-то вроде жилья засерело и собаки залаяли; а ямщик ещё тройку нахлестал и сразу на один бок саней навалился, скособочил их, и мы с Аркадием в снег вывалились, а он, и сани, и лошади, всё из глаз пропало. Аркадий говорит: «Ничего не бойся, это так надобно, потому что ямщик, который нас вёз, я его не знаю, а он нас не знает. Он с тем за три золотых нанялся, чтобы тебя увезть, а ему бы свою душу спасти. Теперь над нами будь воля божья: вот село Сухая Орлица – тут смелый священник живёт, отчаянные свадьбы венчает и много наших людей проводил. Мы ему подарок подарим, он нас до вечера спрячет и перевенчает, а к вечеру ямщик опять подъедет, и мы тогда скроемся». Постучали мы в дом и взошли в сени. Отворил сам священник, старый, приземковатый, одного зуба в переднем строю нет, и жена у него старушка старенькая – огонь вздула. Мы им оба в ноги кинулись. «Спасите, дайте обогреться и спрячьте до вечера». (По Н. С. Лескову)', src:'Вариант 8 · задание 3' },
    { multi:true, q:'Укажите варианты ответов, в которых даны верные характеристики фрагмента текста. Запишите номера этих ответов.', opts:['К лексическим особенностям фрагмента текста относится преобладание книжной лексики (условия, значимость, качества, акцент и др.), наличие терминов (рефлексия, негативные эмоции) и разговорной лексики («хотелки»).', 'Выразительные средства, такие как ирония в третьем абзаце и метафора (увязать в трясине обиды), позволяют донести научную информацию в доступной, популярной форме.', 'В синтаксической структуре текста преобладают простые предложения, осложнённые однородными членами.', 'Такие особенности речи, как логичность, аргументированность, смысловая точность, доступность и ясность изложения, а также информационная насыщенность, позволяют отнести данный текст к научно-популярному подстилю научного стиля речи.', 'Функционально-стилевой тип речи теста – рассуждение: автор в первом предложении указывает на предмет речи и затем даёт развёрнутую информацию о нём.'], a:[0, 1, 3, 4], sourceText:'Обида – одна из негативных эмоций, которая основана на заблуждениях по поводу окружающей реальности. Чаще всего мы обижаемся на конкретных людей. Причём одно из главных условий – это значимость для нас тех, на кого мы обижаемся. Мы привязаны к ним и поэтому приписываем им несуществующие положительные качества. Модель взаимоотношений, создаваемая в нашем сознании, приобретает в таком случае идеализированный характер с акцентом на долженствовании. Врачи должны быть только от бога; полицейские – исключительно героями- альтруистами; мастера – асами каждый в своём деле; ну а человек, в которого мы влюбились, несомненно, будет бесконечно счастлив жить по тем сценариям, которые мы заранее «срежиссировали» у себя в голове. Понятно, что иллюзорные ожидания не оправдываются, поскольку мир и люди несовершенны и не подчиняются нашим «хотелкам». Неоправдавшиеся ожидания порождают обиду, которая мешает жить. Чем взрослее человек (речь не о возрасте!), тем менее он драматизирует несовершенство мира, тем больше склонен принимать людей и обстоятельства, тем реже оказывается в плену иллюзий и, как следствие, затяжной, бессмысленной рефлексии. Если же ожидания не оправдываются, он не обижается, а входит в конструктивный диалог. После <…> взвешивает, насколько оптимальными будут дальнейшие взаимоотношения, сопоставляет свои и чужие ресурсы и принимает окончательное решение по поводу улучшения или окончания взаимоотношений. Обида же в подобной ситуации порождает либо гневные высказывания, либо молчание, которые мешают конструктивному диалогу. Проработать обиду не означает «не чувствовать обиды», «смириться с несправедливостью» или, уж тем более, «полюбить обидчика». Это означает признать своё реальное место в сложившейся ситуации, оценить свои ресурсы для решения возникшей проблемы отношений, понять, что делать со своей жизнью, а не с чужой. И после этого менять что-то в реальности, а не увязать в затягивающей трясине обиды, лишающей человека и сил, и радости. (По Ю. В. Мошкину)', src:'Вариант 9 · задание 3' },
    { multi:true, q:'Укажите варианты ответов, в которых даны верные характеристики фрагмента текста. Запишите номера этих ответов.', opts:['Лексические особенности текста связаны с употреблением литературоведческих терминов (образ, персонифицированный повествователь, повествование от первого лица, стиль речи), общеупотребительной лексики, а также разговорных слов и их сочетаний (ничегошеньки, сидит себе).', 'Синтаксическое строение предложений разнообразно: благодаря использованию простых предложений удаётся доступнее изложить информацию; ряды однородных членов и вставные конструкции повышают информативную насыщенность текста.', 'Данный текст относится к научно-популярному подстилю научного стиля речи: толкование литературоведческих понятий даётся логично, аргументированно, просто и ясно.', 'Функционально-стилевой тип речи теста – описание с элементами рассуждения.', 'Вводные слова, восклицательное предложение, лексические повторы, парцелляции, развёрнутое сравнение (он его как будто бы превращает в своего тайного агента) позволяют автору выстроить свой разговор с читателем в яркой, свободной манере.'], a:[0, 1, 2, 4], sourceText:'Когда мы видим своё отражение в зеркале или фотографию, на которой мы изображены, у нас не возникает сомнений, что это всего лишь наш зрительный образ, но не собственно мы. Образ этот – часть виртуального, отражённого мира, не реального. Тогда как мы сами вполне реальны. То же самое и в литературе. Писатель изображает мир. А слово «изображает» произошло от слова «образ». Это значит, что писатель создаёт образы. Их множество: пейзажные, интерьерные, образы героев, поступков, событий, образы предметного мира и т. д., всего и не перечесть. И всё <…> произведение – это виртуальный мир, в который мы попадаем благодаря своему умению читать и воображать. Заметьте, слово «воображать» опять-таки однокоренное к слову «образ», оно означает способность видеть мир в образах, представлять их в своём сознании. Среди множества образов художественных произведений хочется выделить один, который иногда остаётся незамеченным. Это образ повествователя. Того, кто нам рассказывает обо всех героях и их поступках, событиях, случающихся в их жизни, кто описывает место действия и т.д. Обратим внимание: повествователь – это не автор. Автор – живой человек, сидит себе за письменным столом и пишет рассказы. И повествователя он тоже изображает в рассказе. Но особым способом! Можно сказать, что он его как будто бы превращает в собственного тайного агента. У повествователя часто нет ни имени, ни внешних черт, ни поступков, о его жизни мы ничегошеньки не узнаём. Невидим и таинствен. Всё, что у него есть, – это только его речь – с её манерой, стилем, с возможностью мельком дать какие-то оценки происходящему, поиронизировать, например, или, наоборот, восхититься. Иногда повествователь очень близок автору по стилю речи и мироощущению (как у Тургенева, например), иногда – совершенно далёк от него (как у Лескова или Зощенко). Повествователь в произведениях В. Г. Распутина о деревне благодаря простоте речи, включающей местную лексику, воспринимается как деревенский житель, знающий всё про всех, переживающий и сочувствующий, мудрый, любящий свою малую родину и соотечественников. Такому доверяешься безотчётно, веришь в правдивость того, о чём он повествует. Часто повествование ведётся от первого лица и повествователь вспоминает и рассказывает о событиях, участником которых он был. Тогда он приобретает черты героя, участника действия, иначе говоря, становится персонифицированным повествователем: совершает поступки, вступает в отношения и разговоры с другими персонажами (Максим Максимыч, Печорин в «Журнале Печорина» у Лермонтова). В таком случае повествователя можно называть рассказчиком или героем-рассказчиком. И тогда становится уже совершенно ясно, что перед нами точно не сам автор.', src:'Вариант 10 · задание 3' },
  ],

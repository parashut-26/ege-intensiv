  16: [
    { multi:true, q:'Укажите предложения, в которых нужно поставить ОДНУ запятую. Запишите номера этих предложений.', opts:['Гостям было скучно и никто не хотел оставаться после десерта.', 'Сергей не помнил ни отца ни матери и сейчас не узнал бы их при встрече.', 'В Лондоне каждый день если не дождь то туман или морось или мокрый снег.', 'В деревнях по праздникам песни поют да хороводы водят.', 'Учителя не было в классе и дети шумно переговаривались.'], a:[0, 1, 4], src:'Вариант 1 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите предложения, в которых нужно поставить ОДНУ запятую. Запишите номера этих предложений.', opts:['Ему мешали сосредоточиться крики чаек и паровозные гудки и даже тиканье старинных часов.', 'Мы сидели на террасе и любовались оранжевым закатом и мятно-зелёными очертаниями гор.', 'Сероглазый король не обманул и скоро произошла долгожданная встреча возлюбленных.', 'Прогноз обещал грозу и нам пришлось быстро выбираться из леса.', 'Старые деревья в некоторых странах награждаются медалями за возраст и эти медали вывешиваются на стволах.'], a:[2, 3, 4], src:'Вариант 2 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите предложения, в которых нужно поставить ОДНУ запятую. Запишите номера этих предложений.', opts:['В случае возникновения аварийной ситуации следует выдернуть шнур выдавить стекло.', 'Отец встал ни свет ни заря быстро собрался и отправился на охоту.', 'В доме жарко натоплено и все окна закрыты.', 'На ужин подали настоящее гусиное жаркое и гости восхищённо благодарили щедрую именинницу.', 'Больше всего дед любил перечитывать «Полтаву» и «Медного всадника» и «Домик в Коломне».'], a:[0, 1, 3], src:'Вариант 3 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите предложения, в которых нужно поставить ОДНУ запятую. Запишите номера этих предложений.', opts:['Близок локоть да не укусишь.', 'Нестерпимо хотелось пить и путникам пришлось остановиться у ближайшего ручья.', 'Редкие прохожие не замечали или не хотели замечать ни багряных вспышек осеннего леса ни ядовитого мерцания фонарей ни чуть слышного пения цикад.', 'Однажды ты поймешь это сам или люди подскажут.', 'Семьи Монтекки и Капулетти издревле враждовали и их конфликт стал причиной нелепой бессмысленной гибели юных возлюбленных.'], a:[0, 1], src:'Вариант 4 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите предложения, в которых нужно поставить ОДНУ запятую. Запишите номера этих предложений.', opts:['Запрет на купание в водоёмах касается как прудов так и пресноводных озёр лесных рек.', 'Издавна люди верили в могущество природы и пытались с помощью мифов постичь её тайны.', 'Пешеход решил убедиться в безопасности движения остановился и только поэтому столкновения удалось избежать.', 'Чкалов обнаружил задымление в хвостовой части самолёта и машина в тот же миг потеряла управление.', 'Далёкие звёзды мерцали над гладью воды да свет маяка тонким лучом рассекал темноту ночи.'], a:[3, 4], src:'Вариант 5 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите предложения, в которых нужно поставить ОДНУ запятую. Запишите номера этих предложений.', opts:['Род Лермонтовых происходил из Шотландии и восходил к полумифическому барду- пророку Томасу Лермонту.', 'В пансионе юный поэт ищет родную душу увлекается дружбой то с одним то с другим товарищем.', 'В отношениях с Натальей Фёдоровной Ивановой Лермонтова угнетает нежелание возлюбленной оценить насыщенность его духовной жизни и глубину его талантливой самобытной поэзии.', 'Ни время ни расстояния не властны были над глубокими и чистыми чувствами молодого поэта.', 'Во время ссылки на Кавказ Лермонтов проявлял в боях и бесстрашие и мужество рисковал жизнью.'], a:[2, 3], src:'Вариант 6 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите предложения, в которых нужно поставить ОДНУ запятую. Запишите номера этих предложений.', opts:['Мальчику не хватало родительского тепла и внимания и поэтому он был привязан более всего к няне – Арине Родионовне.', 'Кто из нас в отрочестве не мечтал о настоящей дружбе и о взаимной любви?!', 'Критики с воодушевлением приняли как стихи так и рассказы юного поэта.', 'С каждым осенним днём становилось всё холоднее и дождь всё чаще сменялся мокрым снегом.', 'В Санкт-Петербурге стало пустынно и даже на Невском проспекте царило странное безмолвие.'], a:[0, 2, 4], src:'Вариант 7 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите предложения, в которых нужно поставить ОДНУ запятую. Запишите номера этих предложений.', opts:['Источником для многих эпизодов и образов «Очарованного странника» являются русские народные сказания и былины а также монастырские легенды.', 'Иван Флягин прошёл путь многих героев житийной литературы и перемена имени свидетельствует о начале его новой жизни.', 'Какими чертами обладает герой «Очарованного странника» Н. С. Лескова и чем он оказывается очарован?', 'В истории Ивана Северьяныча Н. С. Лескова интересовали духовные поиски человека и его личный религиозный опыт.', 'Жизнь проверяет героя не только на физическую но и на психологическую выносливость.'], a:[0, 1, 4], src:'Вариант 8 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите предложения, в которых нужно поставить ОДНУ запятую. Запишите номера этих предложений.', opts:['Отец и мать Булгакова любили играть на рояле и скрипке и исполнять романсы.', 'Булгаков успешно сдал экзамены и вскоре он был зачислен на первый курс медицинского факультета Киевского университета.', 'К ученикам в гимназии обращались на «вы» и разрешали высказывать своё мнение.', 'Кому это выгодно и кто мог решится на столь отчаянный шаг?', 'Он хотел было пойти погулять да поленился выходить из тёплой квартиры.'], a:[1, 4], src:'Вариант 9 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите предложения, в которых нужно поставить ОДНУ запятую. Запишите номера этих предложений.', opts:['Объективная оценка художественного произведения требует как способности глубоко проникать в содержание текста так и умения сопереживать развитого воображения и эстетического чувства.', 'Детство и юность В. Г. Распутина пришлись на суровые послевоенные годы.', 'Красота природы Сибири ещё в детстве поразила писателя и стала неотъемлемой спутницей его повестей.', 'Источниками вдохновения для писателя были родная земля и родной народ а также творчество Ивана Бунина и Фёдора Достоевского.', 'В последние годы жизни писатель много времени и сил отдавал общественной и публицистической деятельности создавал и художественные произведения.'], a:[3, 4], src:'Вариант 10 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите номера предложений, в которых нужно поставить ОДНУ запятую.', opts:['Огонек в башне светился ровным красноватым светом.', 'Жизнь моя в Белогорской крепости сделалась для меня не только сносною но даже и приятною.', 'Море вечно и неумолчно шумит и плещется.', 'Буран крутит швыряет снегом и высвистывает и заливается жутким воем.', 'Слуги в прежние времена носили блюда на званых обедах по чинам и поэтому сидевшие на «нижнем» конце стола гости часто созерцали лишь пустые тарелки.'], a:[1,4], src:'Работа №1 · вопрос 1 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите номера предложений, в которых нужно поставить ОДНУ запятую.', opts:['Многие литературоведы и историки вновь и вновь спорят о тайнах« Слова о полку Игореве.»', 'Наша хозяйка одинаково хорошо умела мыть и гладить вязать и шить.', 'Солдат держал в руках рюкзак и палатку и был одет в летнюю форму.', 'Розовый свет уже загорался на заснеженных вершинах гор и медленно опускался вниз.', 'Сквозь шум ветра до нас доносился не то собачий лай не то уханье филина.'], a:[1,4], src:'Работа №1 · вопрос 2 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите номера предложений, в которых нужно поставить ОДНУ запятую.', opts:['Перед обедом из окон высовывались мамы и бабушки и звали детей домой.', 'На другой день бабушка проснулась ни свет ни заря.', 'На столе всегда можно было увидеть исписанные листы или открытую тетрадь или папку с рукописью.', 'Шофёр или не расслышал моих слов или не обратил на них внимания.', 'В минуты меланхолии грозный генерал становился беспомощнее ребёнка и многие спешили выместить на нём свои обиды.'], a:[3,4], src:'Работа №1 · вопрос 3 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите номера предложений, в которых нужно поставить ОДНУ запятую.', opts:['На утренней морозной заре или в золотистых летних сумерках город был похож на ожившую сказку.', 'От домов во все стороны шли ряды деревьев или кустарников или цветов.', 'Поэту и вся природа кажется одушевлённой и разделяющей его переживания.', 'Для праздничной иллюминации использовались как электрические гирлянды так и фонари.', 'Звуки скрипки неотчётливо раздавались в сумраке ночи и постепенно они доходили до самой глубины человеческого сердца.'], a:[3,4], src:'Работа №1 · вопрос 4 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите номера предложений, в которых', opts:['Багряные золотые листья медленно и плавно кружатся в воздухе и тихо опускаются на влажную землю.', 'Довольно скоро он обжился в этом районе и подружился с соседями.', 'Работа шла быстро и весело и была вовремя закончена.', 'Причастия способны как образно описать предмет или явление так и представить его признак в динамике.', 'Учебник М.В. Ломоносова по риторике пользовался большой популярностью и при жизни автора издавался трижды.'], a:[0,3], src:'Работа №1 · вопрос 5 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите номера предложений, в которых нужно поставить ОДНУ запятую.', opts:['Я имею поручение как от судьи так и от всех наших знакомых помирить вас с приятелем вашим.', 'И Петра Первого и царевну Софью и удалых покорителей Сибири увидите вы на картинах Сурикова.', 'В Древней Греции не было ни секундомера ни рулетки ни точных весов.', 'Дружба да братство дороже всякого богатства.', 'На рубежах русской земли начали мелькать низкорослые лошадки воинов-степняков и вот по славянским городам рассыпались гонцы с призывами высылать дружины для общего отпора неприятелю.'], a:[0,4], src:'Работа №1 · вопрос 6 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите номера предложений, в которых нужно поставить ОДНУ запятую.', opts:['В конце XVI века в царских и боярских палатах и в монастырях печи стали облицовывать изразцами.', 'В последние годы жизни Рубенс достиг удивительного совершенства как в искусстве портрета так и в пейзаже.', 'Профессор Киевского университета Прахов заведовал росписью знаменитого Владимирского собора и к работе над росписями он привлёк художников из Абрамцева.', 'Подтвердить или опровергнуть эти предположения довольно трудно.', 'Медвежонок лежал на соломе у самой мачты или взбирался на неё вверх до беседки и здесь сидел или тоже лежал.'], a:[1,2], src:'Работа №1 · вопрос 7 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите номера предложений, в которых', opts:['Первые тополиные листочки сильно и терпко пахли и аромат их перебивал все остальные запахи.', 'Пушкин часто упоминает о тех или иных периодах своей жизни.', 'Своими пьесами и рассказами Чехов создал самобытный и совершенно автономный мир.', 'Крайние домики уже спали и слепо таращились темными окнами на путника.', 'Литература сострадает обиженным судьбой людям и через это сострадание читатель находит в книге свою связь с другими людьми.'], a:[0,4], src:'Работа №1 · вопрос 8 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите номера предложений, в которых', opts:['В передней врачи переговариваются на латыни и это придаёт их разговору ещё большую таинственность.', 'Расчистился золотисто-светлый запад и раскрыл свои объятия усталым путникам.', 'Сама жизнь диктует художнику сюжет и композицию и краски.', 'Она шестнадцать лет была классной дамой в институте благородных девиц и пользовалась исключительным уважением всего начальства.', 'Больше указаний не последовало и Миша толкнул дверь в горницу.'], a:[0,4], src:'Работа №1 · вопрос 9 · задание 16' },
    { multi:true, q:'Расставьте знаки препинания. Укажите номера предложений, в которых нужно поставить ОДНУ запятую.', opts:['Крестьяне разводили кур и уток и гусей.', 'Эскимосы используют для украшения одежды кусочки кожи или рыбьей чешуи.', 'Русские мастерицы расшивали мундиры и камзолы церковные облачения и женские платья.', 'Полёты кораблей в космос и пребывание людей в космическом пространстве стали для нас привычными и даже будничными.', 'Пролив казался дорогой из тусклого золота и по ней неспешно дрейфовали парусники.'], a:[2,4], src:'Работа №1 · вопрос 10 · задание 16' },

    { text:true, q:'Расставьте знаки препинания: укажите все цифры, на месте которых в предложении должны стоять запятые.', context:'Будучи слабым и болезненным (1) маленький Лермонтов жил на лоне природы – в имении своей бабушки (2) расположенном в Пензенской губернии (3) изредка выезжая для лечения на Кавказ.', a:['123'], src:'Вариант 6 · задание 17' },
    { text:true, q:'Укажите цифру(-ы), на месте которой(-ых) должна(-ы) стоять запятая(-ые).', context:'Однажды Лизавета Ивановна (1) сидя под окошком (2) за пяльцами (3) нечаянно взглянула на улицу (4) и увидела молодого инженера (5) стоящего неподвижно (6) и (7) устремившего глаза к её окошку. (А. С. Пушкин)', a:['135'], src:'Вариант 7 · задание 17' },

    { text:true, q:'Укажите цифру(-ы), на месте которой(-ых) должна(-ы) стоять запятая(-ые).', context:'В 1919 году (1) проживая в городе Киеве (2) последовательно призывался на службу (3) в качестве врача (4) всеми властями (5) занимавшими город. (М. А. Булгаков)', a:['125'], src:'Вариант 9 · задание 17' },

  18: [
    { text:true, q:'Укажите цифру(-ы), на месте которой(-ых) должна(-ы) стоять запятая(-ые). ...Не всё от полновластной природы получила (1) ты! увы (2) дитя (3) ты (4) хочешь быть прекрасной ― что красота (5) без доброты?', context:'(А. Де Мюссе, перевод Владимира Набокова)', a:['23'], src:'Вариант 1 · задание 18' },
    { text:true, q:'Укажите цифру(-ы), на месте которой(-ых) должна(-ы) стоять запятая(-ые).', context:'В парке (1) плакала девочка: «Посмотри-ка ты (2) папочка (3) У хорошенькой ласточки (4) переломлена лапочка, – Я возьму птицу бедную и в платочек укутаю...» И (5) отец (6) призадумался, потрясённый минутою, И простил все грядущие и капризы и шалости Милой маленькой дочери, зарыдавшей от жалости. (И. Северянин)', a:['23'], src:'Вариант 2 · задание 18' },
    { text:true, q:'Укажите цифру(-ы), на месте которой(-ых) должна(-ы) стоять запятая(-ые).', context:'Видите ли (1) Сашенька (2) на вашем месте немногие поступили бы (3) именно (4) так: скорее всего (5) ваши однокурсники предпочтут более лёгкий путь достижения профессиональных высот. Вы же (6) выбрали научную карьеру, а она требует от человека полной умственной и эмоциональной самоотдачи – в этом (7) пожалуй (8) её основное отличие от карьеры в производственной сфере.', a:['12578'], src:'Вариант 3 · задание 18' },
    { text:true, q:'Укажите цифру(-ы), на месте которой(-ых) должна(-ы) стоять запятая(-ые).', context:'Ой (1) зелёная (2) верба (3) Молодая луна! Этой ночью (4) наверно (5) Никому не до сна. Ой вы (6) звёзды-снежинки (7) Золотой хоровод! По заветной тропинке Милый к милой идёт. Стынут милые ножки От холодной росы, Подождите немножко, Не спешите (8) часы! (В. И. Лебедев-Кумач)', a:['1345678'], src:'Вариант 4 · задание 18' },
    { text:true, q:'Укажите цифру(-ы), на месте которой(-ых) должна(-ы) стоять запятая(-ые).', context:'В доме тревога большая. Счастливы, светлы лицом, Заново дом убирая, Шепчутся (1) мама с отцом. Как весела их беседа! Сын подмечает, молчит. «Скоро увидишь (2) ты (3) деда!» – Саше отец говорит… Дедушкой только и бредит Саша, не может уснуть: «Что же он долго не едет?» – «Друг (4) мой (5) далёк ему путь!» Саша тоскливо вздыхает, Думает: «Что за ответ!» Вот (6) наконец (7) приезжает Этот таинственный дед. (Н. А. Некрасов)', a:['5'], src:'Вариант 5 · задание 18' },
    { text:true, q:'Расставьте все недостающие знаки препинания: укажите все цифры, на месте которых в предложениях должны стоять запятые.', context:'Я никому не мог сказать Священных слов «отец» и «мать». Конечно (1) ты (2) хотел (3) старик (4) Чтоб я в обители отвык От этих сладостных имён <…> <…> Меня могила не страшит: Там (5) говорят (6) страданье спит… (М. Ю. Лермонтов)', a:['13456'], src:'Вариант 6 · задание 18' },

    { text:true, q:'Укажите цифру(-ы), на месте которой(-ых) должна(-ы) стоять запятая(-ые).', context:'Но предложение отправить Канта в Соловки не только не поразило иностранца, но даже привело в восторг. – Именно, именно, – закричал он, и левый зелёный глаз его, обращённый к Берлиозу, засверкал, – ему там самое место! Ведь (1) говорил я ему тогда за завтраком: «Вы (2) профессор (3) воля ваша, что-то нескладное придумали! Оно (4) может (5) и умно, но больно непонятно. Над вами (6) потешаться будут». (М. А. Булгаков)', a:['2345'], src:'Вариант 9 · задание 18' },

    { text:true, q:'Укажите цифру(-ы), на месте которой(-ых) должна(-ы) стоять запятая(-ые).', context:'Когда после революции 1917 года (1) началась борьба с капиталистами (2) дед лишился своего состояния (3) и (4) чтобы содержать семью (5) в которой были ещё не вставшие на ноги дети (6) стал преподавать в одной из киевских школ (7) французский язык и музыку.', a:['2456'], src:'Вариант 3 · задание 20' },
    { text:true, q:'Укажите цифру(-ы), на месте которой(-ых) должна(-ы) стоять запятая(-ые).', context:'За неделю турист может пройти немалое расстояние, достаточное для того (1) чтобы (2) если не выйти к людям (3) то спуститься к лесу (4) где летом растут съедобные ягоды и грибы.', a:['134'], src:'Вариант 4 · задание 20' },
    { text:true, q:'Укажите цифру(-ы), на месте которой(-ых) должна(-ы) стоять запятая(-ые).', context:'Свист был очень неприятного тембра (1) и Митя подумал (2) что (3) если бы красные кхмеры (4) в Кампучии делали электронные будильники (5) то те наверняка звенели бы (6) именно так.', a:['125'], src:'Вариант 5 · задание 20' },
    { text:true, q:'Расставьте знаки препинания: укажите все цифры, на месте которых в предложении должны стоять запятые.', context:'Я остановился в гостинице (1) где останавливаются все проезжие (2) и (3) где между тем некому велеть зажарить фазана (4) и сварить щей (5) ибо три инвалида (6) которым она поручена (7) так глупы (8) или так пьяны (9) что от них никакого толка нельзя добиться. (М.Ю. Лермонтов)', a:['15679'], src:'Вариант 6 · задание 20' },
    { text:true, q:'Укажите цифру(-ы), на месте которой(-ых) должна(-ы) стоять запятая(-ые).', context:'Хотя я нрава от природы тихого (1) но (2) нетерпение вновь увидеть места (3) где провёл я лучшие свои годы (4) так сильно овладело мной (5) что я (6) поминутно погонял моего ямщика. (А. С. Пушкин)', a:['1345'], src:'Вариант 7 · задание 20' },
    { text:true, q:'Укажите цифру(-ы), на месте которой(-ых) должна(-ы) стоять запятая(-ые).', context:'Дело (1) о котором я вам говорил (2) заняло нас на суде (3) так (4) что мы с ним не чаяли освободиться и к празднику (5) домой же я являлся (6) только поесть (7) да выспаться (8) а все дни и часть ночей проводил пред алтарем Фемиды. (Н. С. Лесков)', a:['12458'], src:'Вариант 8 · задание 20' },
    { text:true, q:'Укажите цифру(-ы), на месте которой(-ых) должна(-ы) стоять запятая(-ые).', context:'Этот мир не обещал нам (1) что будет соответствовать всем нашим представлениям о справедливости (2) и мы можем только выбирать (3) как жить вот в этих условиях (4) но не диктовать сами условия.', a:['1234'], src:'Вариант 9 · задание 20' },
    { text:true, q:'Укажите цифру(-ы), на месте которой(-ых) должна(-ы) стоять запятая(-ые).', context:'После выхода в свет повести «Последний срок» (1) стало ясно (2) что от произведений В. Г. Распутина протягиваются нити к житийному и философскому жанру (3) и (4) что он стремится постигнуть жизненную философию русского человека (5) героини же (6) его произведений (7) сродни толстовским простонародным мудрецам.', a:['25'], src:'Вариант 10 · задание 20' },
    { text:true, q:'Расставьте все недостающие знаки препинания: укажите цифру(-ы), на месте которой(-ых) в предложении должна(-ы) стоять запятая(-ые).', context:'Что бы ни ждало впереди (1) каким бы ни был (2) завтрашний день (3) он рад (4) что вернулся (5) и что этот день встретит с товарищами.', a:['134'], src:'Работа №1 · вопрос 1 · задание 20' },
    { text:true, q:'Расставьте все недостающие знаки препинания: укажите цифру(-ы), на месте которой(-ых) в предложении должна(-ы) стоять запятая(-ые).', context:'Звягинцев не мог понять (1) где он находится (2) хотя (3) хорошо знал этот район (4) и не раз бывал здесь.', a:['12'], src:'Работа №1 · вопрос 2 · задание 20' },
    { text:true, q:'Расставьте все недостающие знаки препинания: укажите цифру(-ы), на месте которой(-ых) в предложении должна(-ы) стоять запятая(-ые).', context:'Доложив генералу всё (1) что нужно было (2) он прошёл в свою комнату (3) в которой, уже давно вернувшись (4) и дожидаясь его, сидел князь Гальцин, читая роман (5) который (6) нашёл на столе Калугина.', a:['1235'], src:'Работа №1 · вопрос 3 · задание 20' },
    { text:true, q:'Расставьте все недостающие знаки препинания: укажите цифру(-ы), на месте которой(-ых) в предложении должна(-ы) стоять запятая(-ые).', context:'Когда впоследствии (1) Женя припомнила тот день на Осинской улице (2) где они тогда жили (3) он представлялся ей (4) всегда таким (5) каким она его увидела в тот второй долгий день.', a:['235'], src:'Работа №1 · вопрос 4 · задание 20' },
    { text:true, q:'Расставьте все недостающие знаки препинания: укажите цифру(-ы), на месте которой(-ых) в предложении должна(-ы) стоять запятая(-ые).', context:'И папа прочёл заметку (1) о том (2) что прошлой ночью (3) сейсмическая станция обсерватории отметила в нашем городе небольшие подземные толчки -- следствие отдалённого землетрясения (4) эпицентр (5) которого (6) расположен на берегу Чёрного моря в Турции (7) где разрушено несколько селений.', a:['247'], src:'Работа №1 · вопрос 5 · задание 20' },
    { text:true, q:'Расставьте все недостающие знаки препинания: укажите цифру(-ы), на месте которой(-ых) в предложении должна(-ы) стоять запятая(-ые).', context:'Если вначале он думал (1) что (2) он теряет драгоценное время (3) что ему надлежит чем-то распоряжаться, чем-то командовать (4) то теперь он убеждался (5) в том (6) что противовоздушная оборона организована отлично (7) и ему очень полезно детальнее ознакомиться с постановкой дела.', a:['1346'], src:'Работа №1 · вопрос 6 · задание 20' },
    { text:true, q:'Расставьте все недостающие знаки препинания: укажите цифру(-ы), на', context:'\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_. месте которой(-ых) в предложении должна(-ы) стоять запятая(-ые). В тихий августовский полдень (1) когда всё в природе сверкало и лоснилось (2) но по каким-то ещё незаметным признакам (3) уже чувствовалась в горячем воздухе тихая грусть увядания (4) на берегу крохотной речонки, извивающейся с мягким журчанием между кустами, на маленьком песчаном пляже (5) загорало несколько лётчиков.', a:['124'], src:'Работа №1 · вопрос 7 · задание 20' },
    { text:true, q:'Расставьте все недостающие знаки препинания: укажите цифру(-ы), на месте которой(-ых) в предложении должна(-ы) стоять запятая(-ые).', context:'А наутро (1) она стала задавать вопросы (2) о том (3) что такое Мотовилиха (4) и что там делали ночью (5) и узнала (6) что Мотовилиха казённый завод (7) и что делают там чугун.', a:['356'], src:'Работа №1 · вопрос 8 · задание 20' },
    { text:true, q:'Расставьте все недостающие знаки препинания: укажите цифру(-ы), на месте которой(-ых) в предложении должна(-ы) стоять запятая(-ые).', context:'И собаки притихли оттого (1) что никто посторонний не тревожил их покоя (2) и что хозяева не ссорились (3) хотя (4) это было непривычно.', a:['13'], src:'Работа №1 · вопрос 9 · задание 20' },
    { text:true, q:'Расставьте все недостающие знаки препинания: укажите цифру(-ы), на месте которой(-ых) в предложении должна(-ы) стоять запятая(-ые).', context:'И конечно, они не заметили (1) что на одной из страниц этой газеты (2) напечатано то самое стихотворение (3) которое мысленно декламировал Байрон (4) когда в карете, увозившей его в Лондон, готовился к речи, увы, ничего не изменившей.', a:['134'], src:'Работа №1 · вопрос 10 · задание 20' },

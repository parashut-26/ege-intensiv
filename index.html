    { text:true, q:'Среди предложений 18–21 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим с помощью указательного местоимения и форм слова. Напишите номер(-а) этого(-их) предложения(-ий).', sourceText:'(1)Разбивать – слово неоднозначное. (2)Оно имеет два противоположных по направленности значения: разрушать и создавать, – например, парк. (3)Сейчас в России садово-парковый период: в Москве недавно создали «Зарядье», в Петербурге готовятся разбить парк на берегу Малой Невы против Пушкинского Дома. (4)Не сомневаюсь, что это только начало движения. (5)После всего, что мы в нашей истории разбили и разрушили, стремление разбивать парки можно только приветствовать. (6)Говоря о семантике садов и парков, можно вспомнить о связи сада с Раем. (7)Не думаю, что создание парков вернёт нас к райскому состоянию, но само стремление разбивать сады лежит в правильном направлении. (8)Замечательную книгу о садово-парковом искусстве написал Дмитрий Сергеевич Лихачёв, научные интересы которого не ограничивались литературой. (9)В обеих столицах новым зонам отдыха отданы лучшие места – соответственно, у Кремля и Петропавловской крепости. (10)В сущности, идея парка у Малой Невы не является новой. (11)Ещё в дореволюционное время в Петербурге разрабатывался план создания садово-паркового пояса, начинающегося на Петровском острове и оканчивающегося у Троицкого моста. (12)Несчастья, свалившиеся на нашу страну в XX веке, эту идею похоронили. (13)На пространство между Тучковым и Биржевым мостами вторглись два малопривлекательных сооружения – Институт прикладной химии и спортивно-концертный комплекс «Юбилейный». (14)Химический институт к тому же захватил всю прибрежную территорию, не допуская даже мысли о том, что здесь могла бы быть набережная. (15)Случилось, однако же, невероятное: несколько лет назад прикладную химию, словно порошок из стиральной машины, из центра города вымыло. (16) Появилась реальная возможность вернуться к забытой идее паркового пояса – по крайней мере, частично. (17)Впрочем, история химического института вселяет надежду на то, что в один прекрасный день мы увидим на низком старте и спорткомплекс «Юбилейный». (18)С появлением нового петербургского парка возникла и проблема его наименования. (19)Если быть точным, то эта проблема возникла несколько раньше – вскоре после смерти Дмитрия Сергеевича, когда забрезжила идея отвоевать у химиков хотя бы набережную. (20)Этой набережной сотрудники Пушкинского Дома предложили дать имя Лихачёва. (21)Мы с коллегами присутствовали тогда на заседании городской Топонимической комиссии. (22)Основания для такого выбора нам виделись в следующем: Дмитрий Сергеевич Лихачёв – бесспорно, один из самых известных петербуржцев. (23)Велики его заслуги не только перед нашей культурой, но и перед российской жизнью в целом. (24)Может быть, благодаря его тихому голосу в эпоху перемен мы избежали гораздо худшего сценария развития событий. (25)Окна кабинета Дмитрия Сергеевича в Пушкинском Доме выходили как раз на предполагаемую набережную, так что её название было бы не абстрактным «увековечением памяти» – в основе этого лежала бы реальная связь человека и места. (26)Можно вспомнить и о том, что в стоящий рядом Князь-Владимирский собор Лихачёв ходил в блокаду. (27)В этом соборе его и отпевали. (28)К нашему предложению Топонимическая комиссия отнеслась тогда прохладно. (29)Одним из контраргументов было несколько экзотическое заявление о том, что если на набережной будет построено что-то неподобающее, то это будет дискредитировать имя Лихачёва. (30)Я предложил было простой и рациональный выход: не строить ничего неподобающего. (31)Но это возражение не было услышано. (32)Между тем сфера неподобающего тогда катастрофически разрасталась. (33)Вопреки всем градостроительным принципам Петербурга был возведён так называемый петербургский Монблан – китчевое сооружение, нанёсшее непоправимый урон великим петербургским горизонталям, которые Лихачёв называл «небесной линией города». (34)При его жизни Монблан бы построить не посмели, как не посмели после его вмешательства сделать гостиницу «Ленинград» (сейчас «Санкт-Петербург») на пять этажей выше. (35)Теперь речь идёт о наименовании парка. (36)Этот вопрос вполне демократично решается голосованием в интернете. (37)Предложено множество вариантов, из которых будет выбрано название. (38)После первых дней голосования лидируют «Тучков буян», «Петроградский» и «Невский сад». (39)Есть несколько романтических названий: «Сердце Петербурга», «Пальмира», «Парадиз». (40)«Парк Лихачёва» получил пока только 2% голосов. (41)Кстати говоря, я бы предложил здесь ещё подумать. (42)В своё время Дмитрий Сергеевич отмечал, что русской топонимической традиции более свойственны названия в форме прилагательного. (43)Это замечание было сделано им по поводу улиц, но в равной степени оно касается и садово-парковой сферы: Александровский парк, Румянцевский сад, Юсуповский сад. (44)В этом ряду мне представляется вполне логичным появление Лихачёвского парка. (45)Приветствуя интернет-голосование сограждан, я бы хотел, чтобы демократизм сочетался в нём с исторической памятью. (46)Памятью о человеке, защищавшем «небесную линию». (47)Не только в архитектуре – в жизни каждого из нас. (По Е. Г. Водолазкину*, текст адаптирован С. А. Громиной) *Евгений Германович Водолазкин (род. 1964 г.) – писатель, доктор филологических наук, ведущий научный сотрудник Института русской литературы.', a:['20'], src:'Вариант 2 · задание 26' },
    { text:true, q:'Среди предложений 34–40 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим с помощью сочинительного союза и притяжательного местоимения. Напишите номер(-а) этого(-их) предложения(-ий).', sourceText:'(1)Пристрастился Тимоша Есаулов стругать: попала ему в руки чурка, на корабль похожая. (2)Он кухонным ножом подровнял её немного, мачты приладил – получилась каравелла. (3)Показал Тимоша каравеллу деду Аггею. (4)Дед всегда у своего дома на завалинке сидит, корзины плетёт. (5)Он в войну у фашистов в плену был, там его искалечили: ноги у него отнялись, не ходят. (6)Дед Тимошкину каравеллу похвалил: – (7)Чистая работа! (8)Одно слово – модель! (10)С того дня Тимоша всё стругал да стругал, целая флотилия уже на окне стоит. (11)Валька Кудинов всё к Тимоше пристаёт: «Давай меняться! (12)Давай меняться!» (13)Уж чего он только за эти корабли не сулил, даже радиоприёмник на батарейках. (14)В один день Тимоша увидел на улице всех пацанов, сгрудившихся вокруг Вальки, важно дававшего пояснения: – (15)Это научное достижение! (16)Ещё никто в мире не мог вырастить лягушонка в пузырьке! (17)Может, я этого научного лягушонка в Москву повезу – мне премию дадут и по телевизору покажут! (18)А, резчик-позолотчик! – увидел он Тимошку. – (19)Иди смотри! (20)Это тебе не чурочки стругать. (21)Он протянул Тимоше плоский пузырёк из-под одеколона. (22)Там, распластавшись в мутной тесноте, сидел маленький серый лягушонок с тоненькими прозрачными лапками. – (23)Ух ты! (24)Как же ты его туда засадил? – Васька Калмыков спрашивает. – (25)Ха! – отвечает Валька. – (26)Тут научное достижение: я в пузырёк махонького головастика затолкал, а уж он там сам вырос. (27)Я, конечно, воду менял, подкармливал его… – (28)Вот у человека терпение! – говорит Васька. – (29)Это ж надо: и воду менять, и подкармливать. – (30)Ещё бы! – отвечает Валька. – (31)У меня, может, десять головастиков в пузырьках сидели, да все передохли, а этот вот выжил. (32)Значит, эксперимент получился. (33)Все мальчишки после таких научных слов даже замолчали. – (34)Ловко! – сказал Тимоша и пошёл обратно к деду на завалинку. – (35)Там Валька научного лягушонка показывает, в пузырьке вырастил! – (36)И он рассказал деду про Валькин опыт. – (37)Сидит, значит, – вздохнул дед и примолк. (38)Он не удивился, не похвалил Вальку за терпение. (39)И пруток в его больших пальцах вдруг хрустнул и сломался. (40)Тимоша посмотрел на дедовы ноги и подумал о лягушонке, бледном, прозрачном и совсем на лягушонка не похожем. (41)Лягушонкины товарищи в пруду скачут, а этот сидит и не может ни поплавать, ни попрыгать… (42)Он представил, что это они с дедом Аггеем сидят вот так, распластавшись, в душной горячей прозрачной банке. (43)Чьи-то огромные глаза приближаются и рассматривают их, потом встряхивают, и они больно ударяются о стенки пузырька и от боли двигаются. (44)И вдруг его как током ударило: обменять! (45)Обменять на коллекцию! (46)Он кинулся снимать с подоконника корабли, а перед глазами у него так и стояли прозрачные лапки лягушонка на грязном стекле. – (47)Он его в пузырёк! (48)Живого в пузырёк! – приговаривал Тимоша. (49)Корабли не помещались у него в руках и падали на землю. – (50)Корзинку возьми, – сказал дед Аггей каким-то странным голосом, словно хотел ещё что-то добавить. (51)Ребята всё толпились у кудиновского дома. – (52)Что просишь – не знаю, – выдохнул Тимоша, – эту вещь меняю. (53)По древним мальчишеским законам после этого нужно было обязательно меняться. – (54)Это же научный лягушонок! – Валька покраснел от досады, потому что знал: мальчишки сейчас могут и поколотить за нарушение неписаного закона. (55)Но обмен мог ещё и не состояться, если предложения были бы не равноценными. – (56)Что даёшь? – (57)Коллекцию! – (58)Меняю! – Валька уже опасался, как бы обмен не расстроился. (59)Тимоша схватил пузырёк и, отбежав на порядочное расстояние, закричал: – (60)Эй вы! (61)Вас бы так в пузырёк! (62)Для науки! (63)Живых в пузырёк! (64)Живодёры чёртовы! (65)Тимоша забежал в проулок; лягушонок в пузырьке был совсем неподвижен. – (66)Ты чего? – сказал Тимоша. – (67)Ты не умирай! (68)Я к Антипу побегу, к дедову сыну. (69)Он в мастерских, у него стеклорез… (70)Я мигом, ты не умирай только! – Тимоша припустил по раскалённой степной дороге. (71)В мастерских обедали. – (72)Антипушка, вот! – задохнувшись, сказал Тимоша и поставил пузырёк на стол. (73)Антип отложил ложку и стал рассматривать лягушонка; тут и Валькин отец сидел: – (74)Ишь ты! – сказал он, беря в руки пузырёк. – (75)Как же это ты его туда засадил? – (76)Вот ребятня! – сказал отец Христи. – (77)Чего только не удумают! – (78)Акселерация! – сказал старший механик. – (79)Антипушка! – едва отдышавшись, взмолился Тимоша. – (80)Вынь ты его оттуда, он же живой! (81)Это Валька его туда головастиком ещё затолкал, он и вырос в неволе! (82)Сидит, как дед Аггей в плену сидел! – Тимоша не выдержал и шмыгнул носом. (83)За столом стало тихо. – (84)Живодёр! – сказал Валькин отец и брякнул ложкой о стол. – (85)А я-то, дурак, обрадовался было… – (86)Он словно извинялся перед товарищами. – (87)Ну погоди, я ему вложу ума вечером. – (88)Ума ему не надо! – сказал деревянным голосом Антип. – (89)Ума у него в достаточности… (90)Он принёс из мастерской стеклорез и осторожно отрезал горлышко у пузырька. (91)Лягушонок выпал на сухие доски стола, Антип осторожно взял жидкое тельце и опустил его в блюдце с водой. – (92)Ну поплыви! Поплыви! – умолял Тимоша. (93)И лягушонок, словно услышав, сделал слабое движение ногами, оттолкнулся. – (94)Живой! – заулыбались все. – (95)А вот, на-ко! – сказал Антип и положил перед Тимошей свой замечательный складной ножик. – (96)За науку следует, – сказал отец Христи. – (97)Что вот, значит, такой поворот мыслям дал, на жалость. (98)Антип раскрыл лезвия и легонько ткнул Тимошу в руку, по старому казачьему обычаю, чтобы подаренный нож не причинил никому зла. (По Б. А. Алмазову*, текст адаптирован Ж. В. Афанасьевой) *Борис Александрович Алмазов (род. 1937) — советский и российский писатель, журналист, искусствовед, бард, педагог, общественный деятель.', a:['39'], src:'Вариант 3 · задание 26' },
    { text:true, q:'Среди предложений 10–17 найдите такое(-ие), которое(-ые) связано(- ы) с предыдущим с помощью сочинительного союза и притяжательного местоимения. Напишите номер(-а) этого(-их) предложения(-ий).', sourceText:'(1)Польза, конечно. (2)Воздух, например, – все городские люди ссылаются на этот воздух, и всегда с одинаково восклицательной интонацией или же в ужасных поэтических выражениях. (3)«Напоённый» чем-то там. (4)«Ароматами трав». (5)«Целебным настоем сосны» – как вам? (6)«Медвяным духом полей»… (7)Всё это ложь и парфюмерия, так же как и все эти наши шезлонги, вынесенные на солнышко, кофеи на веранде с окнами, распахнутыми, понимаешь ли, в сирень, пикниками на курчавой травке, хорошо построенными мангалами, спиралями от комаров. (8)Всё это – попытка уговорить и заговорить то непонятное, страшное, шумящее – или молчащее; дующее в лицо – или приблизившееся и вставшее за спиной. (9)То, что отгоняешь, то, что непременно придёт. (10)Звёздное небо придёт и ляжет; душе страшно от звёздного неба. (11)Но сначала мир потемнеет и отсыреет, отступит, и замолчит, и уйдёт в себя. (12)Лютики там какие-нибудь, – это они днём лютики, это они в детских песенках лютики, а ночью-то, а на самом деле-то они кто? (13)И в чём их собственный, немой, для себя самих, смысл? (14)Не в том ведь, чтобы позировать для портрета на эмалированном чайнике? (15)А трава? (16)А розы? (17)Ведь они нас не любят, розы; им даже не плевать на нас, им никак, им всё равно, это мы водим вокруг них хороводы, – два притопа, три прихлопа, – мы, забывшие язык природы, не знающие её цели… (18)Подстричь газон. (19)Зажечь тусклые садовые фонари. (20)Запереть калитку, спустить собаку, отгородиться от всяких тут подозрительных людей; накопить денег на высокий кирпичный забор и охрану. (21)Не поможет: никуда не скрыться от травы, от беззвучного рёва звёзд, от розы, делающей своё непонятное дело. (22)Да ведь ради них вы и покупали дачу, волновались, торговались, досадовали, выясняли и торжествовали. (23)Будем воздухом дышать! (24)Свежим воздухом! (25)К природе поближе, к букашкам! (26)Мы бежим из городов, бежим прочь от замученности, от скученности... (27)Бежим далеко, в бесконтактные поля, в безответные луга, добегаем до белого дома у синего моря: вот где мы хотим жить! (28)Чтобы и поэзия с кокосом, и пляж с полотенчиком! (29)А вечером… забыть весь этот подступающий ужас, не смотреть на страшное, забыть про гулкий звёздный храм, про жуткий шорох морей, про оцепенение гор, забыть, что висишь на тонкой ниточке, в непоправимом одиночестве, в пустыне природы, и что ни жук тебе не друг, ни кальмар не товарищ. (30)Господь вызывает человека, жалкую и возлюбленную тварь свою, на переговоры в пустыню. (31)Господь выходит из сумерек и стоит у нас за спиной. (32)Господь назначает нам свидание с лютиком – оглушительное свидание без слов, глаза в глаза. (33)Господь ложится травой под ногами, дует ветром, лает собакой, бьёт волной о берег, бежит облаком, снится сном, льётся вином. (34)Остальное – тайна переговоров. (По Т. Н. Толстой*, текст адаптирован Е. В. Колбасовой) Татьяна Никитична Толстая (род. 1951) – российская писательница, телеведущая, публицист и литературный критик.', a:['13'], src:'Вариант 4 · задание 26' },
    { text:true, q:'Среди предложений 13–16 найдите такое(-ие), которое(-ые) связано(ы) с предыдущим с помощью сочинительного союза и форм слова. Напишите номер(- а) этого(-их) предложения(-ий).', sourceText:'(1)Такого родственного чувства, как к дедушке, я в своём детстве не испытывал даже к родителям. (2)У них были свои дела и заботы, а у дедушки – только я. (3)Разница в возрасте нас не разделяла, а сплачивала – минуя родителей; за их спиной мы как будто обменивались всепонимающими взглядами. (4)И вместе коротали то долгое, сладко-тягучее время детства и старости, внутри которого им, с их спешкой и наставлениями, не было места. (5)Куда нам было спешить, когда в летний ласковый день мы гуляли, взявшись за руки, по солнышку, в который раз осматривая всё тот же повалившийся забор и ржавую бочку? (6)Наша жизнь, не спеша ни к какой цели, наполнялась смыслом сама по себе – высшее благо для тех, кто только начинает или уже заканчивает жить. (7)Мы помогали друг другу почувствовать всю щемящую прелесть ничем не обременённого существования. (8)Мне думалось, что когда дедушка умрёт, то почти вся моя жизнь будет в память о нём, я назову его именем – Самуил – своего сына. (9)Не так это вышло, и даже день его смерти, 13 марта, порой проходит в забвении. (10)Но ощущение горячего дедушкиного присутствия, невидимо охраняющего меня, остаётся во мне прочнее, чем родительское. (11)Ведь отца и мать мы знаем и тогда, когда вырастаем, в их образах уже стёрлась память детства, вытесненная более поздними и сознательными впечатлениями. (12)Дедушка же остаётся всемогущим и всеблагим богом младенчества, когда еще магически воспринимаешь мир, не развенчивая знанием его таинственную одухотворённость. (13)Не случайно наивно верующим Саваоф1 представляется как седобородый старец: они, как внуки, нуждаются в опеке и покровительстве непостижимо превосходящего опыта. (14)И как важно сохранить то чувство благоговения, которое внук испытывает к деду вследствие абсолютной несоизмеримости их опыта! (15)Ведь дед был посвящён в начальную тайну вещей задолго до моего рождения, он создал по своему образу мою маму! (16)Хотя при этом умаляется право «вечного внука» на взрослую самостоятельность, но неизмеримо возрастает его право на самого Бога, его внимание, любовь, попечение. (17)Когда дедушка был жив, я по малолетству преувеличивал его могущество и всеведение; когда же я стал взрослеть, он умер, так и оставшись навсегда за той чертой, где скрывается священное. (М. Н. Эпштейн*) *Михаил Наумович Эпштейн (род. 1950) – российский и американский философ, филолог, публицист.', a:['14'], src:'Вариант 5 · задание 26' },
    { text:true, q:'Среди предложений 7–14 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим с помощью сочинительного союза и форм слов. Напишите номер(-а) этого(-их) предложения(-ий).', sourceText:'(1)Когда на лекциях я спрашиваю: а чем, собственно говоря, дети отличаются от взрослых, ‒ незамедлительно получаю ответ: «Опытом!» (2)Взрослые убеждены, что у них опыт есть, а у детей его нет. (3)А что же имеется у детей? (4)Ничего у них нет в смысле опыта. (5)Имеется у детей наивное, чаще всего нелепое поведение маленьких существ, которые не знают суровых законов нашего взрослого мира. (6)И пока существа эти не познают наши законы, в клуб взрослых их не примут. (7)Когда мы говорим о ком-то: «Он – большой ребенок», мы имеем в виду, как правило, что это, возможно, милый и приятный человек, но совершенно не приспособленный к нашей серьёзной, взрослой жизни. (8)Это устоявшаяся точка зрения. (9)Именно отсутствие у детей опыта и даёт нам твёрдые основания воспитывать детей. (10)Увы, многие взрослые понимают воспитание именно как навязывание ребенку собственного опыта. (11)Наш опыт – это опыт жизни в нашем мире. (12)Свой опыт мы уважаем, принимаем. (13)Поведение детей мы расцениваем как неразумное и глупое лишь потому, что оно не соответствует опыту нашей жизни. (14)Однако если у детей своя жизнь, не разумно ли предположить, что у них свой опыт? (15)Вот как вспоминает детство замечательный современный поэт Сергей Трофимов: (16)У меня под майкой голубок белый, Я с утра сменял его на свой велик. (17)Ох, и будет дома нагоняй, только Нет меня счастливей в эти дни. (18)С точки зрения взрослого человека, поступок, мягко говоря, нелепый: сменять велосипед на голубя. (19)Велосипед дороже голубя, потому что стоит денег. (20)Логика понятна. (21)С точки зрения ребенка, живой, трепещущий голубь гораздо интереснее, чем механический велосипед. (22)Голубь дороже велосипеда, потому что живой. (23)Непонятная логика. (24)Логика взрослых нам ближе и ясней. (25)Но можно ли с уверенностью утверждать, что в данном случае в поведении ребенка нет совсем уж никакой логики? (26)Есть. (27)Только она нам неблизка и непонятна. (28)Уверен, что мы все признаём: мир, который построили взрослые, мягко говоря, несовершенен. (29)И тем не менее в клуб взрослых принимают только тех, кто понял законы этого мира – небезупречные, часто самоубийственные, нередко циничные… (30)Итак, какова же позиция у нас, взрослых? (31)Она элементарно проста. (32)Дети должны учиться у нас. (33)Мы должны учить детей. (34)Мы должны их воспитывать, передавая собственный опыт. (35)Худо ли, бедно ли создали мы свой мир, нашим детям жить в нём, и они должны подчиняться его законам. (36)О том, чтобы взрослым учиться у детей, речи нет. (37)Но разве детские навыки, их опыт не могут пригодиться и нам? (38)Скажем, их опыт взаимоотношения с природой? (39)Их навыки верить в предлагаемые обстоятельства, которые мы высокомерно называем игрой? (40)Или их бескомпромиссность? (41)Дети не любят выискивать вторые смыслы. (42)Они гораздо конкретнее взрослых, и такая конкретность делает общение с ними более понятным и, если угодно, более приятным. (43)Мальчика спросили: (44)– Кем ты хочешь быть, когда вырастешь? (45)Мальчик ответил: (46)– Волшебником. (47)Все расхохотались. (48)Мальчик удивился: (49)– Когда я вырасту, я, скорее всего, буду работать в банке, как папа. (50)Но вы же спросили, кем я хочу быть! (51)Казалось бы, такой манере общения не грех бы и поучиться… (52)Дети воспринимают мир в чёрно-белых цветах.(53)Они делят мир на своих и чужих. (54)Скажем, когда в споре ученика с учителем родитель встаёт на сторону учителя – он сразу становится для ребенка чужим. (55)И учителя ребенок оценивает именно так: свой или чужой, понимающий или непонимающий… (56)Делить мир на своих и чужих? (57)Не замечать оттенков? (58)В каждом вновь встреченном видеть своего или чужого? (59)Да, в нашем взрослом мире это всё не работает. (60)Мы понимаем про оттенки. (61)Мы считаем нормальным манипулировать людьми, а то и использовать их. (62)Всё так. (63)Мы построили такой мир и такую жизнь. (64)Для детей общение со взрослыми естественно, для взрослых общение с детьми – это некий процесс, требующий едва ли не усиленной теоретической подготовки. (65)Мы к этому привыкли. (66)И воспринимаем как норму… (67)Поверьте, я далек от того, чтобы идеализировать детей. (68)Дети – это люди. (69)И как люди любого возраста, они бывают добрые и злые, более циничные и менее, умные и не очень… (70)Они – разные. (71)Но я против того, чтобы считать, будто дети отличаются от взрослых тем, что у них нет опыта. (72)Я против взрослого убеждения, что нам нечему учиться у детей. (73)У детей свой (увы, чаще всего непригодный для построенной нами жизни) опыт. (74)Но он есть. (75)Как минимум он нуждается в том, чтобы его уважали. (76)Как максимум – в том, чтобы его перенимали. (77)И если взрослый человек открыт детям, он способен многому у них научиться. (78)И многое понять в самом себе, отражаясь в зеркале детства. (По А. М. Максимову*, текст адаптирован И. А. Шигиной) *Андрей Маркович Максимов (р. 1959) – современный писатель, телеведущий, автор книг по психологии общения.', a:['14'], src:'Вариант 6 · задание 26' },
    { text:true, q:'Среди предложений 51–66 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим с помощью личного местоимения и однокоренных слов. Напишите номер(-а) этого(-их) предложения(-ий).', sourceText:'(1)Тогда я был молод, кудряв, легкомыслен и удачлив, и девочки кокетничали со мной напропалую. (2)Наверное, как все в этом прекрасном возрасте, я совершал ошибки, и ошибок было много, но лишь теперь осмеливаюсь в них признаться. (3)Когда я появился впервые в сельской школе, все ахнули: на груди моей сверкал университетский значок! (4)Время было трудное: года четыре, как закончилась война. (5)Дипломированных учителей не хватало. (6)И вот в эту маленькую, неказистую школу приехал человек, окончивший столичный университет, фи-ло-лог! (7)Однажды подошёл ко мне кто-то и предложил выступить с лекцией перед колхозниками. (8)Я очень удивился, что ко мне подходят с такими пустяками, но отказать было нельзя, тем более что лекция намечалась через месяц. (9)Перед отъездом в область мне подарили только что вышедшую книгу «Пушкин в воспоминаниях современников». (10)И вот, вспомнив об этой книге, я сказал, что буду читать, пожалуй, лекцию о Пушкине, о его жизни, и называться лекция будет: «Частная жизнь Александра Пушкина». (11)Шло время. (12)Иногда на глаза мне попадалась эта проклятая книга, и тусклое, едва уловимое желание перелистать её страницы овладевало мной, но лишь на одно мгновение. (13)Наконец в один прекрасный день рука моей фортуны почтительно постучала в мою дверь, и я не смог уловить в том стуке дружеского предостережения. (14)У крыльца стояли колхозные сани. (15)Настроение у меня было превосходное. (16)Не было ни страха, ни даже волнения. (17)В извечном поединке меж «слыть» и «быть» верх одерживало первое. (18)О мой дорогой университетский значок, соединение белого, синего и золотого! (19) Как я любим и почитаем! (20)Лошадка бежала резво. (21)Страха не было. (22)Замечательная книга покоилась на моих коленях, тяжёленькая, плотненькая такая – источник вдохновения, кладовая успеха и славы... (23)В большой старой бревенчатой избе размещался колхозный клуб, на лавках сидели мои слушатели. (24)Были старики и дети. (25)Было много молодых людей. (26)На нехитрой сцене стоял длинный стол, покрытый красной выцветшей материей. (27)За столом в одиночестве сидел председатель колхоза. (28)О мой дорогой университетский... (29)Страха не было. (30)– Ну вот, – сказал председатель, когда я легко взлетел на подмостки, сейчас наш дорогой учитель расскажет нам о частной жизни Александра Сергеевича Пушкина. (31)И, оборотившись ко мне: «Часика в полтора уложитесь?» (32)– Кто его знает, - улыбнулся я, – во всяком случае, буду стараться. (33)Я встал за кафедру. (34)Страха не было. (35)– Пушкин – великий русский поэт! – воскликнул я легко, вдохновенно и страстно. (36)Все со мной были согласны. (37)Глядели на меня не отводя глаз, как с семейной фотографии. (38)«Отчего это я трясусь?» – подумал я. (39)Я с ужасом даже сейчас вспоминаю эту минуту: страх охватил меня, страх, которого я не испытывал даже на фронте: о чём говорить дальше? (40)Если бы передо мной лежал хотя бы маленький, ничтожный клочок измятой линованной бумаги и если бы на нём, пусть вкривь и вкось, нелепым почерком, неразборчиво было бы написано, набросано, едва угадывалось бы то, что я вычитал когда-то из этой проклятой книги! (41)Но передо мной была наклонная потёртая доска замечательной кафедры, и на ней лежала молчаливая книга, тяжёлая, словно камень на шее. (42)Я посмотрел на часы: прошло полторы минуты... (43)– Однажды, – сказал я, крепко держась рукой за кафедру, – молодой Пушкин... где-то на юге влюбился... кажется, в цыганку... (44)Она была к нему равнодушна, и он, разозлившись, пробежал по жаре двадцать четыре километра... – слушали меня внимательно, – не метра, а километра... (45)Стояла тишина. (46)– Двадцать четыре километра! – выкрикнул я. – Представляете?.. (47)Собравшиеся молчали. (48)Я посмотрел на часы – прошло две минуты. (49)Кто-то робко кашлянул... (50)О, если бы он раскашлялся как следует и надолго! (51)Но в клубе стояла тишина. (52)– Или, например, такой случай, – сказал я не своим голосом... (53)«Какой случай? Какой случай?» – загудело в голове. (54)Проклятая замечательная книга лежала передо мной, и мои бледные трясущиеся пальцы впились в неё с последней надеждой. (55)Внезапно я наткнулся на имя Натальи Гончаровой. (56)Вспыхнул ослепительный свет. (57)– Пушкин был женат на Наталье Гончаровой! – воскликнул я. – (58)Перед самой женитьбой он встретился с цыганкой Таней... нет, Стешей... (59)И тут они... (60)«Что они? Что они?..» (61)Я посмотрел на часы – прошло четыре минуты. (62)–Вы, наверное, не знаете, наверное, не знаете... (63)«Чего не знаете? Чего не знаете?..» – (64)Царь сослал его в село Михайловское... нет, сначала он сослал его в Одессу, где губернатором был граф Воронцов. (65)Воронцов Пушкина не любил и послал его на саранчу... (66)Когда саранча собирается в большом количестве... когда саранча собирается в большом количестве... (67)Я попытался незаметно отвинтить университетский значок, но не смог, хотел перевернуть страницу книги, но книга не открывалась вообще. (68)Я посмотрел на свои часы – прошло семь минут. (69)Никто не подозревал, как я мечтал, чтобы пол под моими ногами разверзся, чтобы пламя охватило бревенчатый клуб, чтобы кто-нибудь крикнул: «Волки!» – и все бросились бы к окнам, а я сказал бы: «Ну, знаете, в такой обстановке...» (70)– Может быть, будут какие-нибудь вопросы? – спросил я у задумчивого председателя как можно спокойнее. (71)– Вы уже закончили? – спросил он без тени удивления. (72)– Да, пожалуй, и всё, – сказал я, не слыша собственного голоса. (73)«Хоть бы они бросились на сцену и убили меня!» – подумал я. (74)– Ну что же, если нет вопросов, давайте поблагодарим товарища учителя, – и зааплодировал. (75)Его вяло поддержали. (76)А этот молодой, кудрявый, удачливый, с новёхоньким университетским значком на груди оглядел зал торопливо, по-заячьи, и его молодые губы дрожали, и пальцы не слушались. (77)Как я очутился на улице, никто не успел заметить. (78)Шестикилометровый обратный путь лежал через овраги и перелески. (79)Было темно. (80)Вьюжило. (81)Я шёл медленно, меня покачивало. (82)Внезапно послышался скрип полозьев, и колхозные сани догнали меня. (83)– Велено домой доставить, – весело сказал бородатый возница, – садись, учитель. (84)Больно ты на ногу скор… (85)Я уселся в сани и заплакал. (86)...С тех пор прошло много лет. (87)Тогда я был молод, кудряв и удачлив, и, отвинтив, я бросил в снег своё ромбовидное несчастье, синее, белое и золотое. (По Б. Ш. Окуджаве, текст адаптирован А. Е. Митькиной) Булат Шалвович Окуджава (1924–1997) – советский и российский поэт, бард, прозаик и сценарист, композитор.', a:['58'], src:'Вариант 7 · задание 26' },
    { text:true, q:'Среди предложений 3–13 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим с помощью указательного местоимения и контекстных синонимов. Напишите номер(-а) этого(-их) предложения (-й).', sourceText:'(1)Юность, молодость – время выбирать главное дело своей жизни. (2)Эта задача для выпускников школ становится, пожалуй, наиважнейшей. (3)Решая её, некоторые идут «от себя», основываясь исключительно на собственных склонностях, а иногда и сиюминутных увлечениях, которые могут через некоторое время сойти на нет. (4)Другие впадают в противоположную крайность, выискивая наиболее престижные, высокооплачиваемые сферы деятельности и мало задумываясь над тем, насколько их собственные способности соответствуют выбранной профессии. (5)В результате и те, и другие переживают стресс и разочарование, ведь разнообразные ресурсы – время и здоровье, усилия и деньги – бывают потрачены зря. (6)Какой же подход будет оптимальным, экологичным, правильным? (7)Где золотая середина? (8)Дадим несколько простых советов, назвав отличительные признаки «правильной» деятельности. (9)При этом «правильной» будем считать не ту, которая принесёт огромные деньги, власть и популярность, а которая станет залогом долговременного счастья, включающего (несомненно, в меру!) и сохранённое здоровье, и семейное благополучие, и творчество, и достаток, и уважение профессионального сообщества. (10)Первое. (11)Вы не просто это делаете хорошо – вы не можете этого не делать. (12)Например, если человек имеет обыденную привычку всё растолковывать, объяснять просто потому, что ему это нравится, иногда даже не к месту, – у него природа учителя, преподавателя, экскурсовода. (13)Молчун, выбравший такую профессию, будет страшно измотан, растрачивая ресурсы говорения, которых природа ему в должной мере не дала. (14)Второе. (15)Вы легко сосредотачиваетесь на этой деятельности и долго не устаёте, вам нравится сам процесс, а не только плоды; даже если не платят за эту работу, вы её всё равно делаете, подчиняясь энергии желания, удовольствия. (16)Так бывает, например, с теми, кто любит разбираться в том, как устроены механизмы, как они работают, как их совершенствовать, как их создавать. (17)Такие люди решают каждый раз увлекательные задачи и получают массу положительных эмоций, это прирождённые инженеры, механики, мастера, и неважно, что они при этом не имеют институтского диплома. (18)Далее. (19)Вы всё время стремитесь совершенствоваться в своей деятельности, и не в силу внешних причин, не из логики борьбы за первенство, а потому что есть внутреннее «горение», радость творить лучше и лучше, поднимаясь над собой прежним. (20)При этом такого профессионала распирает внутреннее желание делиться с другими профессионалами своим опытом, чтобы совершенствовалось само дело, которому они служат. (21)Мы это можем наблюдать среди врачей от бога: их тонкие знания и опыт в диагностике, хирургии, акушерстве передаются не столько по книгам, сколько от человека к человеку; интерны, ординаторы ходят за ними хвостом. (22)Наконец, последнее: это та деятельность, за которую вас ценят другие. (23)Самим нам иногда сложно быть объективными: нам кажется, что то, что мы хорошо делаем, – это просто норма, присущая всем, настолько это для нас привычно, органично. (24)И такая деятельность перестаёт нами цениться, хочется чего-то неизвестного, раскрыть какие-то другие свои таланты, которые нам порой в себе просто мерещатся. (25)Поэтому нужно прислушиваться к голосу тех, кто нас достаточно хорошо знает и хвалит за что-то. (26)Со стороны, как часто бывает, многое виднее, чем изнутри. (27)Многие очарованы блогерами, журналистами, медиафигурами; кажутся себе контактными, мобильными, да и сочинения вроде неплохо пишут – рвутся быть телезвёздами, не меньше. (28)Но стоит задуматься – легко ли Вы пишете на потоке, каждый день, быстро редактируя свои тексты? (29)Получаете ли радость от совершенствования правильности своей речи, при этом уже обладая природной грамотностью и богатой, выразительной речью? (30)Не устаёте ли от постоянной смены впечатлений в поездках, от общения с очень большим количеством людей, выступлений на публику и потока информации, имеющей отношение к совершенно разным областям жизни? (31)Не испытываете ли сильнейший стресс от негативных оценок в свой адрес? (32)И не только сами ответьте на эти вопросы, но и своих родных, учителей, психологов, товарищей попросите оценить себя с этой стороны. (По А. В. Крупчанскому*, текст адаптирован А. Д. Баландиной) *Адриан Вячеславович Крупчанский (род. в 1977 г.) − бизнесмен, писатель, общественный деятель, музыкант.', a:['13'], src:'Вариант 8 · задание 26' },
    { text:true, q:'Среди предложений 48–55 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим с помощью личного местоимения. Напишите номер(-а) этого(-их) предложения(-ий).', sourceText:'(1)Отлично помню эту ночь – 29 ноября… (2)Привезли ко мне в больницу в одиннадцать часов ночи девочку лет трёх. (3)Только на конфетных коробках рисуют таких детей – волосы сами от природы вьются в крупные кольца почти спелой ржи. (4)Глаза синие, громаднейшие, щёки кукольные. (5)Но только странная муть гнездилась на дне её глаз, и я понял, что это страх, – ей нечем было дышать. (6)«Она умрёт через час», – подумал я совершенно уверенно, и сердце моё болезненно сжалось… (7)– Сколько дней девочка больна? – спросил я. (8)– Пятый день, пятый, – сказала её мать и сухими глазами глубоко посмотрела на меня. (9)– Дифтерийный круп, – сквозь зубы прошептал я фельдшеру, а матери сказал: (10)– Ты о чём же думала? (11)О чём думала? (12)Пять дней? (13)А? (14)– Дай ей капель, – сказала она и стукнулась лбом в пол, – удавлюсь я, если она помрёт. (15)– Каких же я капель дам? (16)Девочка задыхается, горло ей уже забило. (17)Ты пять дней морила девчонку в пятнадцати верстах от меня. (18)А теперь что прикажешь делать? (19)– Тебе лучше знать, батюшка… (20)Обратившись к фельдшеру, я приказал взять девочку. (21)Девочка стала биться и хотела, видимо, кричать, но у неё не выходил уже голос. (22)Мать старалась её защитить, но мы её отстранили, и мне удалось заглянуть при свете лампы девочке в горло. (23)Я никогда до тех пор не видел дифтерита, кроме лёгких и быстро забывшихся случаев. (24)В горле было что-то клокочущее, белое, рваное. (25)– Вот что, – сказал я, удивляясь собственному спокойствию, – дело такое. (26)Поздно. (27)Девочка умирает. (28)И ничто ей не поможет, кроме одного – операции. (29)– Как это? – спросила мать. (30)– Нужно будет горло разрезать пониже и серебряную трубку вставить, дать девочке возможность дышать, тогда, может быть, спасём её, – объяснил я. (31)В операционной было очень тихо. (32)Я взял скальпель и провёл вертикальную черту по пухлому белому горлу. (33)Не выступило ни одной капли крови. (34)Я второй раз провёл по белой полоске, которая выступила меж раздавшейся кожи. (35)Опять ни кровинки. (36)Медленно, стараясь вспомнить какие- то рисунки в медицинских атласах, я стал при помощи тупого зонда разделять тоненькие ткани. (37)И тогда внизу раны откуда-то хлынула тёмная кровь и мгновенно залила всю рану и потекла по шее. (38)Вспоминая всё, что я видел в университете, я пинцетами стал зажимать края раны, но ничего не выходило. (39)Мне стало холодно, и лоб мой намок. (40)Я остро пожалел, зачем пошёл на медицинский факультет, зачем попал в эту глушь. (41)В злобном отчаянии я сунул пинцет наобум, куда-то близ раны, защёлкнул его, и кровь тотчас же перестала течь. (42)Но никакого дыхательного горла нигде не было. (43)К концу второй минуты я отчаялся его найти. (44)«Конец, – подумал я, – зачем я это сделал? (45)Ведь мог же я не предлагать операцию, и Лидка спокойно умерла бы у меня в палате, а теперь она умрёт с разорванным горлом, и никогда, ничем я не докажу, что она всё равно умерла бы, что я не мог повредить ей…» (46)Сестра молча вытерла мой лоб. (47)«Положить скальпель, сказать: не знаю, что дальше делать», – так подумал я, и мне представились глаза матери. (48)Я снова глубоко и резко полоснул Лидку. (49)Ткани разъехались, и неожиданно передо мной оказалось дыхательное горло. (50)Я вколол скальпель в горло, затем серебряную трубку вложил в него. (51)Она ловко вскользнула, но Лидка осталась недвижимой. (52)Воздух не вошёл к ней в горло, как это нужно было. (53)Мне хотелось у кого-то попросить прощенья, покаяться в своём легкомыслии. (54)Я видел, как девочка синела. (55)Я хотел уже всё бросить и заплакать, как вдруг Лидка дико содрогнулась, фонтаном выкинула дрянные сгустки сквозь трубку, и воздух со свистом вошёл к ней в горло; потом девочка задышала и стала реветь. (56)Сквозь пелену пота, застилавшую мне глаза, я видел счастливые лица сестёр, и одна из них мне сказала: (57)– Ну и блестяще же вы сделали, доктор, операцию! (58)Я подумал, что она смеётся надо мной... (59)Потом распахнулись двери, повеяло свежестью. (60)Лидку вынесли в простыне, и сразу же в дверях показалась мать. (61)Глаза у неё были как у дикого зверя. (62)Она спросила у меня: (63)– Что?! (64)Когда я услышал звук её голоса, пот потёк у меня по спине, я только тогда сообразил, что было бы, если бы Лидка умерла на столе. (65)Но голосом очень спокойным я ей ответил: (66)– Будь поспокойнее. (67)Жива. (По М. А. Булгакову*, текст адаптирован А. Д. Баландиной) *Михаил Афанасьевич Булгаков (1891 – 1940) – русский писатель, драматург, врач.', a:['5152'], src:'Вариант 9 · задание 26' },
    { text:true, q:'Среди предложений 3–8 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим с помощью форм слова. Напишите номер(-а) этого(-их) предложения(-ий).', sourceText:'(1)Уезжая в город ранним утром, я дал себе слово, что вечером обязательно вернусь. (2)Работа у меня наконец пошла, и я боялся сбоя, боялся, что даже за два- три дня посторонней жизни растеряю всё, что с таким трудом собирал, настраивая себя на работу, – собирал в чтении, раздумьях, в долгих и мучительных попытках отыскать нужный голос, который не спотыкался бы на каждой фразе, а, словно намагниченная особым манером струна, сам притягивал к себе необходимые для полного и точного звучания слова. (3)Поездка в город – это три часа от порога до порога туда и столько же обратно. (4)Чтобы, не дай бог, не передумать и не задержаться, я сразу проехал на автовокзал и взял на последний автобус билет. (5)Впереди у меня оставался почти полный день, за который можно успеть и с делами, и побыть, сколько удастся, дома. (6)И всё шло хорошо, всё подвигалось по задуманному до того момента, когда я, покончив с суетой, но не сбавляя ещё взятого темпа, забежал на исходе дня в детский сад за дочерью. (7)Дочь мне очень обрадовалась. – (8)Приехал? – по-взрослому спросила она и, часто взглядывая на меня, стала торопливо одеваться. (9)До дому было слишком близко, чтобы прогуляться, и мы мимо дома прошли на набережную. (10)Погода для конца сентября стояла совсем летняя, тёплая. (11)Мы гуляли, наверное, с час, и дочь почти не вынимала своей ручонки из моей руки, выдергивая её лишь для того, чтобы показать что-то или изобразить, когда без рук не обойтись, и тут же всовывала обратно. (12)Терпение, послушание, нежность… (13)Дочь расщебеталась, разговорилась, рассказывая о садике и расспрашивая меня о нашей вороне. (14)У нас на Байкале была своя ворона. (15)Дочь первая рассмотрела высоко на лиственнице лохматую шапку её гнезда. (16)Я до того месяц жил и не замечал. (17)Летает и летает ворона, каркает, как ей положено, – что с того? (18)Мне и в голову не приходило, что это наша ворона, потому что тут, среди нас, её гнездо и в нём она выводила своих воронят. (19)Конечно, наша ворона должна была стать особенной, не такой, как все прочие вороны, и она ею стала. (20)Очень скоро мы с нею научились понимать друг друга, и она пересказывала мне всё, что видела и слышала, облетая дальние и ближние края, а я затем подробно передавал её рассказы дочери. (21)Дочь верила. (22)А может, и не верила, но с таким вниманием слушала, с таким нетерпением ждала продолжения, когда я прерывался, что и мне эти рассказы стали в удовольствие, я стал замечать в себе волнение, которое передавалось от дочери и удивительным образом уравнивало нас, точно сближая на одинаковом друг от друга возрастном расстоянии. (23)Мне между тем подступало время собираться, и я сказал дочери, что нам пора домой. – (24)Нет, давай ещё погуляем, – не согласилась она. – (25)Пора, – повторил я. – Мне сегодня уезжать обратно. (26)Её ручонка дрогнула в моей руке. (27)Дочь не сказала, а пропела: – (28)А ты не уезжай сегодня. (29)И добавила как окончательно решённое: – Вот. (30)Тут бы мне и дрогнуть: это была не просто просьба, каких у детей на каждом шагу, – нет, это была мольба, высказанная сдержанно, с достоинством, но всем существом, осторожно искавшим своего законного на меня права, не знающего и не желающего знать принятых в жизни правил. (31)Но я-то был уже немало испорчен и угнетён этими правилами, и, когда не хватало чужих, установленных для всех, я выдумывал, как и на этот раз, свои. (32)Вздохнув, я вспомнил данное себе утром слово и упёрся: – (33)Понимаешь, надо. (34)Не могу. (35)Дочь послушно дала повернуть себя к дому, перевести через улицу и вырвалась, убежала вперёд. (36)Я стал собирать рюкзак, то и дело подходя к дочери, заговаривая с ней; но она замкнулась и отвечала натянуто. (37)Всё – больше она уже не была со мной, она ушла в себя, и чем больше пытался бы я приблизиться к ней, тем дальше бы она отстранялась. (38)У меня оставалась ещё надежда на прощание. (39)Я собрался и подозвал дочь. (40)– До свидания. (41)Что передать вороне? (42)– Ничего. (43)До свидания, – отводя глаза, сказала она как-то безразлично, голосом, который ей рано было иметь. (44)Будто нарочно, сразу подошёл трамвай, и я приехал на станцию за двадцать минут до автобуса. (45)А ведь мог бы эти двадцать минут погулять с дочерью, их бы, наверное, хватило, чтобы она не заметила спешки и ничего бы между нами не случилось. (46)Дальше, как бы в урок мне, сплошь началось невезенье. (47)Автобуса долго не было. (48)Загрузив пассажиров, шофер поехал на заправку, и мы на час опоздали к переправе через Байкал. (49)Команда катера, который нас повёз, зря времени в ожиданиях не теряла и была распьянёшенька, наступала ночь, штормило. (50)Припоминая потом всю дорогу от начала и до конца, и особенно переправу, я думал обо всём случившемся не как о чём-то ужасном или неприятном, а как о неизбежном, происшедшем во всей этой последовательности и во всех обстоятельствах только из-за меня, чтобы преподать мне какой-то урок. (51)Какой? (52)Я не знал и не скоро, быть может, узнаю; да тут и не ответ важен, а ощущение своей вины. (53)Это были не случайные случайности. (54)Мне казалось, что и люди, которые ехали со мной, страдали и рисковали только по моей милости. (55)А в последние полчаса, когда мы перегребали с берега на берег, риск, конечно, существовал – что и говорить! (56)Катерок наш то вонзался в воду, то взлетал в воздух, я, мокрый и продрогший, сидел на мешке с картошкой, который ездил подо мной, и безучастно ждал, чем всё это закончится. (57)Я так изнемог за этот день, что не стал, придя к себе, ни чай кипятить, ни даже разбирать рюкзак, а тут же повалился в постель. (58)Наутро после поездки в город я поднялся поздно, разбитый. (59)С преувеличенной бодростью принялся растапливать печку и готовить чай, пил его, как всегда, с удовольствием, но он нисколько меня не взбодрил, беспричинная холодная тяжесть и не собиралась отступать. (60)Из упрямства я подсел всё-таки к столу с бумагами, но это было всё равно что слепому смотреть в бинокль: ни единого проблеска впереди, сплошь серая плотная стена. (61)Полным истуканом, с кирпичом вместо головы, просидел я полчаса и, до последней степени возненавидев себя, поднялся. (62)Что-то как бы пискнуло со злорадством за моей спиной, когда я отходил от стола… (63)Не находя себе места, я двигался бесцельно и бестолково – то выйду во двор и вслушиваюсь и всматриваюсь во что-то, сам не зная во что, то вернусь снова в избу и встану, истязая себя, подле горячей печки, пока не станет до дурноты жарко, и опять на улицу. (64)Промаявшись так, наверное, с час и чувствуя, что облегчения не найти, я закрыл избу и пошёл куда глаза глядят. (65)…Было уже совсем темно, когда я вернулся к своей избушке. (66)Ноги едва держали меня… (67)Среди ночи я проснулся от стука дождя по сухой крыше и крика вороны. (68)…Под утро, не разжигая печки, оделся и направился в диспетчерскую порта, откуда можно было позвонить в город. (69)Мне долго не удавалось соединиться, телефон подключался и тут же обрывался, а когда я наконец дозвонился до дома, мне сказали, что дочь ещё вчера слегла и лежит с высокой температурой. (По В. Г. Распутину*, текст адаптирован А. Д. Баландиной) *Валентин Григорьевич Распутин (1937 – 2015) – русский советский писатель и публицист, общественный деятель.', a:['5678'], src:'Вариант 10 · задание 26' },
    { text:true, q:'Среди предложений 18--23 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим при помощи притяжательного местоимения.', context:'(18)Операция шла долго. (19)Хирургу не раз вытирали потный лоб. (20)Больной лежал в забытьи под действием наркоза. (21)В вену его руки медленно, капля за каплей, вливалась живительная жидкость. (22)А Прасковья Андреевна, измученная бессонной ночью и плохими мыслями, уже сидела в вестибюле больницы. (23)После окончания операции хирург огорчил её: -- Не стану скрывать: положение серьёзное, хотя сделано всё, что в наших силах.', a:['21'], src:'Вариант 1 (формат ЕГЭ) · вопрос 1 · задание 26' },
    { text:true, q:'Среди предложений 17--21 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим с помощью союза.', context:'(17)Принято считать, что телеграф, телефон, поезда, автомобили и лайнеры призваны экономить человеку его драгоценное время, высвобождать досуг, который можно употребить для развития своих духовных способностей. (18)Но произошёл удивительный парадокс. (19)Можем ли мы положа руку на сердце сказать, что времени у каждого из нас, пользующегося услугами техники, больше, чем его было у людей дотелефонной, дотелеграфной, доавиационной поры? (20)Да боже мой! (21)У каждого, кто жил тогда в относительном достатке (а мы все живём теперь в относительном достатке), времени было во много раз больше, хотя каждый тратил тогда на дорогу из города в город неделю, а то и месяц вместо наших двух-трёх часов.', a:['18'], src:'Вариант 1 (формат ЕГЭ) · вопрос 2 · задание 26' },
    { text:true, q:'Среди предложений 24--30 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим при помощи притяжательного местоимения.', context:'(24)Давно замечено: и лучшие, и худшие стороны человека выявляет беда. (25)Януш Корчак не только последние часы и минуты своего бытия, когда вместе с детьми принял мученическую смерть в фашистской газовой камере, но и всю предыдущую жизнь стоял рядом с бедой, точнее, жил в её гуще, работая с детьми-сиротами. (26)Сиротство, эта библейски древняя форма человеческого одиночества, требует сострадания и соучастия, самоотверженной и терпеливой любви настоящих гуманистов. (27)Януш Корчак первый из них, и первенство это измерено мерой его выбора, мерой честности. (28)Мера эта − смерть. (29)Не только поляки чтут выбор своего бессмертного учителя. (30)Его имя внесено в святцы и мировой педагогики, и элементарной человеческой порядочности.', a:['30'], src:'Вариант 1 (формат ЕГЭ) · вопрос 3 · задание 26' },
    { text:true, q:'Среди предложений 11--19 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим при помощи указательного местоимения и лексического повтора.', context:'(11)«Может быть, у них тоже война, -- думает Родимцев, -- вот и ползут колонны мобилизованных на строительство рвов и укреплений. (12)Или это хозяин ставит себе новый дом, и тянутся плотники, штукатуры на работу...» (13)Огромен мир, который видят его глаза, чует ухо, втягивают с воздухом ноздри. (14)Аршин земли на опушке леса, куст шиповника. (15)Как велик этот аршин земли! (16)Как богат этот отцветший куст! (17)По сухой земле молнией прошла трещина, муравьи проходят по мосту, в строгом порядке один за другим, а по ту сторону трещины терпеливо выжидают встречные. (18)Божья коровка, толстая, в красном сарафане, мечется, ищет перехода. (19)Ох ты!', a:['15'], src:'Вариант 1 (формат ЕГЭ) · вопрос 4 · задание 26' },
    { text:true, q:'Среди предложений 1--7 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим при помощи определительного и указательного местоимений, формы слова и контекстных синонимов.', context:'(1)Нам лишь кажется, что, когда с нами что-то случается, это уникальное явление, единственное в своём роде. (2)На самом деле нет ни одной проблемы, которая уже не была бы отражена в мировой литературе: любовь, верность, ревность, измена, трусость, поиски смысла жизни... (3)Всё это уже когда-то кем-то было пережито, передумано; найдены причины, ответы и советы и запечатлены на страницах художественной литературы. (4)Дело за малым: бери и читай! (5)И всё найдёшь в книге. (6) Неслучайно Ф.М. Достоевский призывал: «Читайте! (7)А остальное сделает жизнь».', a:['3'], src:'Вариант 1 (формат ЕГЭ) · вопрос 5 · задание 26' },
    { text:true, q:'Среди предложений 27--33 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим при помощи личного местоимения и лексического повтора.', context:'(27)Теперь я знаю: юноша в затасканной ученической шинели был Илларион Певцов. (28)Он был тяжёлый и, как все считали, неизлечимый заика. (29)А он мечтал стать актёром! (30)И у него в самом деле был талант! (31)Он уходил за город, в лес, взбирался на горы; там он декламировал, читал монологи, отрывки из пьес. (32)Над ним насмехались, считали его полоумным. (33)Но он превозмог непреодолимое, он сделал невозможное: через пятнадцать -- двадцать лет после этой нашей встречи с ним на Замковой горе он стал одним из самых замечательных русских актёров*.*', a:['28'], src:'Вариант 1 (формат ЕГЭ) · вопрос 6 · задание 26' },
    { text:true, q:'Среди предложений 29--36 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим при помощи сочинительного союза и форм(ы) слов(а).', context:'(29)Рождается желание глубоко постигнуть, осмыслить явления и сопоставить одно явление с другим. (30)Отсюда наш интерес к истории искусства, литературы, к биографии создателей гениальных творений, к процессу их творчества, к той эпохе, в которую они жили. (31)Разрозненные впечатления соединяются в общую картину культуры. (32)Каждому явлению отводится своё место. (33)И каждое явление оценивается не только само по себе, но и в сопоставлении с другими. (34)Значительное, великое мы научаемся отличать от пошлого и преходящего. (35)Великие творения слушаем, смотрим и перечитываем неоднократно. (36)И с каждым разом находим в творениях всё больше красот.', a:['3336'], src:'Вариант 1 (формат ЕГЭ) · вопрос 7 · задание 26' },
    { text:true, q:'Среди предложений 11--18 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим с помощью указательного местоимения.', context:'(11)В каждой стране есть свой Главный педагог -- народ и есть Главный учебник ‒ язык. (12)Я не должен объяснять, что такое счастье, я должен смиренно спросить об этом наш язык ‒ в нём всё есть, из него всё поймёшь, прислушиваясь к слову в сегодняшней нашей речи. (13)Народная мысль содержится не только в пословицах и поговорках, в народной мудрости, но и в распространённых, обычных фразах и оборотах речи. (14)Поищем: с какими другими словами сочетается интересующее нас понятие, почему так можно сказать, а так нельзя. (15)Это никогда не бывает случайным. (16)Мы говорим: «счастливая доля», «счастливый случай», «счастливая судьба», «счастье привалило», «вытянул счастливый билет». (17)Самые деятельные, всего достигшие своим трудом люди говорят: «Мне выпало счастье, мне дано счастье...» (18)Счастье ‒ фортуна, судьба, о которой мы ничего не знаем, и если его нет, то говорят: «Такая уж у меня судьба», «Видно, мне так на роду написано».', a:['15'], src:'Вариант 1 (формат ЕГЭ) · вопрос 8 · задание 26' },
    { text:true, q:'Среди предложений 27--34 найдите такое(-ие), которое(-ые) связано(-ы) с предыдущим при помощи указательного местоимения, форм слова и контекстных синонимов.', context:'(27)Старшина распахнул плащ-палатку, и хлеб был встречен почтительным молчанием. (28)В этой-то почтительной тишине и раздался вопрос. -- (29)А где?.. (30)Тут полбуханка была! (31)Произошло лёгкое движение, тёмные лица повернулись ко мне, со всех сторон -- глаза, глаза, жуткая насторожённость в них. -- (32)Эй ты! (33)Где?! (34)Тебя спрашиваю!', a:['28'], src:'Вариант 1 (формат ЕГЭ) · вопрос 9 · задание 26' },

function el(tag, props, ...children){
  const n = document.createElement(tag);
  if(props){
    for(const k in props){
      const v = props[k];
      if(v == null || v === false) continue;
      if(k === 'class') n.className = v;
      else if(k === 'html') n.innerHTML = v;
      else if(k === 'style' && typeof v === 'object') Object.assign(n.style, v);
      else if(k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), v);
      else n.setAttribute(k, v);
    }
  }
  const flat = [];
  for(const c of children){
    if(Array.isArray(c)) flat.push(...c); else flat.push(c);
  }
  for(const c of flat){
    if(c == null || c === false) continue;
    n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return n;
}

function showToast(text){
  STATE.toast = text;
  render();
  setTimeout(() => { STATE.toast = null; render(); }, 2400);
}

function logo(size){
  const sz = size || 20;
  const node = el('div', { class:'zebrus', style:{ fontSize: sz+'px' }});
  node.innerHTML = `<span style="font-size:${Math.round(sz*0.95)}px">🐝</span><span class="zebrus-text"><span class="zeb">Зеб</span><span class="rus">Рус</span></span>`;
  return node;
}

function avatarChip(name, color, size){
  const sz = size || 34;
  const init = name.split(' ').map(s => s[0]).join('').slice(0,2).toUpperCase();
  return el('span', { class:'avatar-sm',
    style:{ background: color || '#8B5CF6', width:sz+'px', height:sz+'px', fontSize: Math.round(sz*0.36)+'px' }
  }, init);
}

function chip(text, kind){
  return el('span', { class: 'chip chip-' + (kind || 'grey') }, text);
}

function statusChip(s){
  if(s === 'active')  return chip('● Активна', 'green');
  if(s === 'lagging') return chip('⚠ Отстаёт', 'red');
  if(s === 'pending') return chip('⏳ Ждёт одобрения', 'warn');
  return chip(s, 'grey');
}

      el('span', { class:'avatar' }, me.init),

        el('b', null, me.name),
        el('span', null, me.sub))));
  /* «Сменить роль» — это демо-фича для перепрыгивания между персонажами учитель/куратор/ученик.
     Для залогиненных пользователей (MY_PROFILE есть) её скрываем — у реального пользователя одна роль. */
  if(!MY_PROFILE){
    right.append(el('button', { class:'role-switch',
      onclick: () => { STATE.view = role==='teacher' ? 'student' : role==='student' ? 'curator' : 'teacher'; render(); }

  return el('header', { class:'topbar' },
    el('div', { class:'left' }, logo(20), rolePill),

function shellTabs(role, tabs, activeKey, onPick){
  const wrap = el('nav', { class:'tabs' });
  tabs.forEach(t => {
    const cl = 'tab ' + (activeKey === t.key ? 'active ' + role : '');
    const tab = el('button', { class: cl,
      onclick: () => onPick(t.key)
    }, el('span', { class:'ic' }, t.ic), t.label);
    if(t.badge) tab.append(el('span', { class:'badge ' + (t.badgeKind || '') }, t.badge));
    wrap.append(tab);
  });
  return wrap;
}

        el('div', { class:'ttl' }, d.title),
        el('div', { class:'small' }, d.subtitle)));

  if(d.kind === 'exam'){

        el('div', { class:'small', style:{ color:'rgba(255,255,255,.85)' }}, d.subtitle)));

function dayBlock(d){
  const isToday = d.id === COURSE.todayDayId;
  const locked = d.id > COURSE.todayDayId;
  const card = el('div', { class:'card', style:{ marginBottom:'16px', opacity: locked ? '.65' : '1' }});
  card.append(
    el('div', { style:{ marginBottom:'14px' }},
      el('div', { style:{ display:'flex', gap:'8px', alignItems:'center', marginBottom:'4px' }},
        chip(isToday ? '● Сегодня' : locked ? '🔒 Откроется ' + d.date : '✅ Открыт',

        el('span', { style:{ fontSize:'12px', color:'var(--ink-3)' }}, d.weekday)),

function taskRow(d, t, locked){
  const ICONS = { morning:'☀️', webinar:'🎙️', review:'📝', essay:'✍️' };
  const LABELS = { morning:'Утро', webinar:'Вебинар', review:'Разбор', essay:'Сочинение' };
  const actMats = MATERIALS.filter(m => m.activityId === t.id);
  const head = el('div', {
    style:{ padding:'12px', border:'1px solid var(--border)', borderRadius:'12px', display:'flex', alignItems:'center', justifyContent:'space-between', gap:'12px' }
  },
    el('div', { style:{ display:'flex', gap:'12px', alignItems:'center', minWidth:0 }},
      el('span', { style:{ fontSize:'24px' }}, ICONS[t.kind] || '•'),
      el('div', { style:{ minWidth:0 }},
        el('div', { style:{ fontSize:'10px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.06em', fontWeight:'700' }},
          (t.time || '') + ' · ' + LABELS[t.kind]),
        el('div', { style:{ fontWeight:'600' }}, t.title),
        el('div', { style:{ fontSize:'12px', color:'var(--ink-3)', marginTop:'2px' }},
          '⏱ ' + t.est + ' · до ' + t.maxBee + ' 🐝'))),
    taskAction(t, locked));
  /* Если есть прикреплённые материалы — показываем их сразу под активностью */
  if(actMats.length){
    const mats = el('div', { style:{ display:'flex', flexDirection:'column', gap:'4px', padding:'8px 12px', background:'var(--bg)', borderRadius:'10px', marginTop:'-4px' }});
    actMats.forEach(m => {
      const icon = m.external_url ? '🔗' : '📎';
      mats.append(el('a', { href: materialOpenUrl(m), target:'_blank', rel:'noopener',
        style:{ fontSize:'12px', color:'var(--ink)', textDecoration:'none', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }
      }, icon + ' ' + m.name + (m.size ? ' · ' + m.size : '') + ' ↗'));
    });
    return el('div', { style:{ display:'flex', flexDirection:'column', gap:'4px' }}, head, mats);
  }
  return head;
}

function taskAction(t, locked){
  if(locked) return chip('🔒 закрыто', 'grey');
  if(t.kind === 'morning')
    return el('button', { class:'btn btn-y btn-sm',
      onclick: () => { STATE.testOpen = 4; STATE.testAnswers = {}; STATE.testChecked = false; render(); }
    }, '⚡ Пройти');
  if(t.kind === 'essay'){
    const myId = MY_PROFILE && MY_PROFILE.id;
    const myEssay = myId ? DB_ESSAYS.find(x => x.studentId === myId) : null;
    /* Кнопка-пересдача — небольшая, рядом с основным статусом */
    const resubmitBtn = el('button', { class:'btn btn-secondary btn-sm', title:'Сдать ещё одну работу',
      onclick: ev => {
        ev.stopPropagation();
        STATE.essayDraftOpen = true;
        STATE.essayDraftText = '';
        STATE.essayDraftPhotos = [];
        STATE.essayDraftMode = 'typed';
        render();
      }
    }, '↻ Пересдать');

    if(myEssay){
      let primary;
      if(myEssay.status === 'done'){
        primary = el('button', { class:'btn btn-p btn-sm',
          onclick: async () => {
            if(typeof myEssay.id === 'number' && sb && !ESSAY_COMMENTS_CACHE[myEssay.id]){
              try {
                const arr = await loadEssayComments(myEssay.id);
                myEssay.comments = arr;
                ESSAY_COMMENTS_CACHE[myEssay.id] = arr;
              }
              catch(e){ myEssay.comments = []; }
            }
            STATE.studentEssayResultOpen = myEssay.id;
            render();
          }
        }, '🐝 Результат: ' + (myEssay.finalScore != null ? myEssay.finalScore + '/22' : 'смотреть'));
      } else if(myEssay.status === 'pre_checked'){
        primary = chip('🤝 куратор проверил', 'teal');
      } else if(myEssay.status === 'in_progress'){
        primary = chip('📝 учитель проверяет', 'warn');
      } else {
        primary = chip('📝 на проверке', 'p');
      }
      return el('div', { style:{ display:'flex', gap:'6px', alignItems:'center', flexWrap:'wrap', justifyContent:'flex-end' }},
        primary, resubmitBtn);
    }
    return el('button', { class:'btn btn-p btn-sm',
      onclick: () => { STATE.essayDraftOpen = true; STATE.essayDraftText = ''; STATE.essayDraftPhotos = []; STATE.essayDraftMode = 'typed'; render(); }
    }, '✍️ Сдать');
  }
  if(t.kind === 'webinar')
    return el('button', { class:'btn btn-secondary btn-sm',
      onclick: () => showToast('🎯 Засчитано как «Я на уроке» (+3 🐝)')
    }, 'Я на уроке');
  return el('button', { class:'btn btn-secondary btn-sm',
    onclick: () => showToast('Откроется страница разбора')
  }, 'Смотреть');
}

  5: [
    { text:true, q:'В одном из приведённых ниже предложений НЕВЕРНО употреблено выделенное слово. Исправьте лексическую ошибку, подобрав к выделенному слову пароним. Запишите подобранное слово, соблюдая нормы современного русского литературного языка.', sentences:['Степная земля, на которой хозяйствовали казаки, чернозёмная, а не ГЛИНИСТАЯ.', 'ПРОИЗВОДИТЕЛЬНОСТЬ труда казачьей семьи напрямую зависела от количества мужских рук и наличия лошади.', 'ЖИТЕЙСКИЙ уклад казачества складывался веками, его черты запечатлены во многих произведениях М. А. Шолохова.', 'ДОБРОТНАЯ хата у Мелеховых: большая семья живёт в ней, всем хватает места.', 'Прирождённый воин не бывает ПУГЛИВЫМ, прирождённый мастер – ленивым, прирождённый торговец – скупым, прирождённый учёный – нечестным.'], a:['жизненный'], src:'Вариант 1 · задание 5' },
    { text:true, q:'В одном из приведённых ниже предложений НЕВЕРНО употреблено выделенное слово. Исправьте лексическую ошибку, подобрав к выделенному слову пароним. Запишите подобранное слово, соблюдая нормы современного русского литературного языка.', sentences:['В образах Простаковой и Скотинина Д. И. Фонвизиным обличаются невежество, алчность и жестокость поместного дворянства, ХИЩНОЕ отношение к крепостным.', 'ВЕКОВОЙ груз крепостничества не мог не сказаться и на характере Еремеевны: няня Митрофана давно смирилась с грубостью и неблагодарностью господ.', 'Правдин – чиновник, приехавший в имение Простаковых по долгу службы, – выявляет отнюдь не ЕДИНИЧНЫЕ правонарушения со стороны крепостников, поэтому имение Простаковых берётся под опеку государства.', 'КОРЕННОЙ вопрос, который автор задаёт читателю и зрителю: «Как воспитать достойного гражданина?»', 'Эгоизм, невежество и лень Митрофана – «злонравия достойные плоды», БЛАГОТВОРНОЕ же влияние Стародума на Софью проявилось в её чувстве собственного достоинства и разумности поступков.'], a:['хищническое'], src:'Вариант 2 · задание 5' },
    { text:true, q:'В одном из приведённых ниже предложений НЕВЕРНО употреблено выделенное слово. Исправьте лексическую ошибку, подобрав к выделенному слову пароним. Запишите подобранное слово.', sentences:['В повести М. А. Булгакова «Роковые яйца» повествуется о БЕДСТВЕННОМ положении, постигшем Россию из-за неконтролируемой деятельности учёных в области генной инженерии и хозяйственников, внедряющих их изобретения.', 'Крупный специалист по голым гадам – учёный Персиков ‒ изобрёл оптическое устройство, позволявшее с помощью необыкновенного красного луча с невероятной скоростью размножать и ОТРАЩИВАТЬ живые организмы.', 'В предвкушении ощутимой ВЫГОДЫ от научного открытия хозяйственники внедрили его в животноводство.', 'Однако вскоре из-за нелепой и ЖЕСТОКОЙ ошибки – не курицы, а змеи и крокодилы заполонили всё российское пространство; ни ГПУ, ни Красная Армия не могли спасти страну от новоявленных монстров.', 'ДЕЙСТВЕННУЮ помощь в борьбе с нашествием, как это часто бывало в России, оказали морозы, неожиданно ударившие в середине августа и уничтожившие чудовищ.'], a:['выращивать'], src:'Вариант 3 · задание 5' },
    { text:true, q:'В одном из приведённых ниже предложений НЕВЕРНО употреблено выделенное слово. Исправьте лексическую ошибку, подобрав к выделенному слову пароним. Запишите подобранное слово.', sentences:['Белогорская крепость стала ареной борьбы пугачёвцев, мечтающих о власти справедливого царя, и русской армии, верной присяге ЦАРСТВУЮЩЕЙ императрице.', 'Жила она одна, ― вдовый отец её, ПРОСВЕТИТЕЛЬСКИЙ человек знатного купеческого рода, жил на покое в Твери, что-то, как все такие купцы, собирал.', 'Милосердие в романе «Капитанская дочка» по отношению к Петру Гринёву проявляет Екатерина II, однако Пугачёв тоже милосерден по отношению к нему: ОТПЛАТИВ добром за добро, он спас его от смерти.', 'Василиса Егоровна, жена капитана Миронова, представляет собой узнаваемый русский женский характер: НАЛИЧИЕ таких черт, как верность семье, сила духа, чувство собственного достоинства, вызывает искреннее уважение к этой героине.', 'ЗАЧИНЩИКОМ ссоры и дуэли между недавними приятелями становится не Гринёв, а Швабрин: именно он позволяет себе оскорбительные выпады против Маши Мироновой.'], a:['просвещённый'], src:'Вариант 4 · задание 5' },
    { text:true, q:'В одном из приведённых ниже предложений НЕВЕРНО употреблено выделенное слово. Исправьте лексическую ошибку, подобрав к выделенному слову пароним. Запишите подобранное слово.', sentences:['Жизненный путь Юрия Живаго похож на цепь случайностей: он, как былинка на ветру, не может избежать власти стихий над своей жизнью; это и стихия революции и гражданской войны, и стихия ЕДИНСТВЕННОЙ на всю жизнь любви к Ларе.', 'Жизнь крутит его и вертит: из уютного дома бросает на фронт, затем в Варыкино, а потом и в партизанский отряд; от семьи ‒ к Ларе, потом уносит Лару и прилепляет к Марине, лишает профессии врача и ввергает в БЕДНОЕ положение.', 'Одинокий, среди чужих людей, он, затерянный на дорогах своей жизни, умирает, так и не соединившись с новым временем, новой эпохой, но при этом до последнего ВЗДОХА оставаясь верным себе внутренне.', 'Через кажущуюся пассивность героя Пастернак раскрывает довольно ПОПУЛЯРНУЮ мысль русской литературы ХХ века: когда обстоятельства жизни приобретают роковой характер и контроль над ними невозможен, человек должен принять их как неизбежность и приспособиться к ним внешне, не изменяя себе внутренне, по сути.', 'Суть же ЛИЧНОСТНОГО, внутреннего «Я» героя в том, что он поэт, и эта его миссия не предаётся им под властью обстоятельств.'], a:['бедственное'], src:'Вариант 5 · задание 5' },
    { text:true, q:'В одном из приведённых ниже предложений НЕВЕРНО употреблено выделенное слово. Исправьте лексическую ошибку, подобрав к выделенному слову пароним. Запишите подобранное слово.', sentences:['Герой лермонтовского «Мцыри» ‒ носитель РОМАНТИЧЕСКИХ идеалов, главным из которых является свобода (=воля), именно поэтому в поэме четыре раза употреблено это слово, а кроме того – однокоренные «вольный», «привольный», «вольность».', 'Мцыри пытается оказать СОПРОТИВЛЯЕМОСТЬ судьбе, связавшей его жизнь с монастырём (=пленом), стремится разомкнуть пространство своей жизни.', 'Его побег из заточения – это акт, СРАВНИМЫЙ с бунтом, дерзким и неразумным, по мнению монаха.', 'ПРЕТЕРПЕВ многочисленные лишения (блуждания по лесу, схватку с барсом), так и не найдя приюта на родине и в сердце прекрасной женщины, Мцыри оказывается снова у стен монастыря, проиграв схватку с судьбой.', 'Однако даже на пороге смерти герой ощущает свою причастность не к смерти и покою, которыми соблазняла его рыбка, а к ЖЕЛАННОЙ живой действительности, обрекшей его на одиночество и страдание.'], a:['сопротивление'], src:'Вариант 6 · задание 5' },
    { text:true, q:'В одном из приведённых ниже предложений НЕВЕРНО употреблено выделенное слово. Исправьте лексическую ошибку, подобрав к выделенному слову пароним. Запишите подобранное слово.', sentences:['Главный герой «Моцарта и Сальери» А. С. Пушкина – Сальери, потому что именно он – ЕДИНСТВЕННЫЙ по-настоящему трагический герой этого произведения.', 'Эту мысль лишний раз подтверждает тот факт, что первоначальное название «Моцарта и Сальери» – «Зависть» – имело отношение отнюдь не к Моцарту: ОПАСНОЕ шевеление зависти ощущал в своей душе именно Сальери.', 'Трагедия Сальери состоит в том, что Моцарт своим существованием разрушает систему его представлений о справедливости: не труд, упорство и постоянство вознаграждены свыше успехом и славой; гениальным оказывается «гуляка праздный», он же сам на его фоне всего лишь ИСКУСНЫЙ ремесленник.', 'Раз «нет правды на земле» и даже «нет её и выше», Сальери берёт на себя ответственность восстановить справедливость благодаря «злодейству» ‒ так ДРУЖЕСТВЕННЫЙ, казалось бы, разговор заканчивается отравлением Моцарта.', 'Однако слово «злодейство», повторяемое Сальери вслед за Моцартом, не случайно звучит в финале: в глубине души он понимает, что не является вершителем справедливости, что он всего лишь ЖЕСТОКИЙ злодей и завистник.'], a:['дружеский'], src:'Вариант 7 · задание 5' },
    { text:true, q:'В одном из приведённых ниже предложений НЕВЕРНО употреблено выделенное слово. Исправьте лексическую ошибку, подобрав к выделенному слову пароним. Запишите подобранное слово.', sentences:['Обращали ли вы внимание на то, насколько ёмкие по смыслу и одновременно ЭСТЕТИЧНЫЕ по звучанию неологизмы (окказионализмы) использует Н. С. Лесков в «Сказе о тульском косом Левше и о стальной блохе»?', 'Кулак атамана Платова назван «бугровым», и в одном этом слове ЭКОНОМИЧНО вместилось сразу несколько характеристик: он и бугристый, и багровый одновременно, весь в шрамах, так как обычно шрамы бывают багровыми.', 'Эффект СЛОВЕСНОЙ игры возникает и при употреблении других «искажённых» слов: барометр используется на кораблях, поэтому превращается в «буреметр» ‒ прибор для определения бури, а водка «кизлярка» – в «кислярку», поскольку кислая на вкус.', 'Особенно же ПОПУЛЯРНЫМ в ребячьей среде стал окказионализм «долбица умножения»: каждый зубрил-долбил эту несчастную таблицу!', 'ИЗОБРЕТАТЕЛЬНОСТЬ Н. С. Лескова в плане создания «искажённой» в народной речи лексики поразительна; благодаря ей возникает полная иллюзия присутствия народного повествователя в произведении.'], a:['экономно'], src:'Вариант 8 · задание 5' },
    { text:true, q:'В одном из приведённых ниже предложений НЕВЕРНО употреблено выделенное слово. Исправьте лексическую ошибку, подобрав к выделенному слову пароним. Запишите подобранное слово.', sentences:['«Дьявольский», гротескно-фантастический сюжет романа М. А. Булгакова «Мастер и Маргарита» причудливо переплетается с реально-бытовым и историко- мифологическим, вынуждая читателя сравнивать БЫЛЫЕ времена с современностью.', 'В центре реальных событий романа – разнообразные картины жизни Москвы и москвичей послереволюционного времени, причём большинство ДЕЙСТВЕННЫХ персонажей испытывают постоянное чувство неустроенности и страха, становятся злыми и агрессивными, теряют свои интеллектуальные и душевные качества.', 'Исторический план книги представлен событиями, которые происходили в Древней Иудее около двух тысяч лет тому назад с бродячим философом Иешуа Га-Ноцри, ОБВИНЁННЫМ в государственном преступлении, и могущественным римским прокуратором Понтием Пилатом.', 'Гротескно-фантастический пласт романа ПРЕДСТАВЛЯЮТ Воланд, его свита и вереница характеров московских обывателей, таких, например, как директор театра Варьете Стёпа Лиходеев, «пострадавший» за то, что «жутко свинячил».', 'Ялтинский угрозыск слал телеграммы в Москву, желая удостоверить личность уважаемого Степана Богданыча, но его АДРЕСАТАМ было невдомёк, как он там оказался, и они решили, что ялтинский самозванец – не их начальник.'], a:['действующих'], src:'Вариант 9 · задание 5' },
    { text:true, q:'В одном из приведённых ниже предложений НЕВЕРНО употреблено выделенное слово. Исправьте лексическую ошибку, подобрав к выделенному слову пароним. Запишите подобранное слово.', sentences:['Повесть Валентина Григорьевича Распутина «Прощание с Матёрой» ‒ не только об экологических, но и о нравственных проблемах, обострившихся в обществе в результате ТЕХНИЧЕСКОГО прогресса.', 'Отношение к строительству Братской ГЭС на Ангаре у автора и его героев ДВОЙСТВЕННОЕ: с одной стороны, электрификация позволит людям жить более цивилизованно, а с другой – многие острова и деревни, такие как Матёра, будут затоплены; разрушатся не только дома, но и привычный, патриархальный уклад жизни, основанный на единении с природой.', 'Наиболее ДРАМАТИЧНЫМ является эпизод, в котором перед затоплением главная героиня повести, старая женщина ‒ Дарья Пинигина, готовит свою избу «в последний путь»: она убирает дом, белит стены, украшает комнаты ветками, как будто прощается с родным человеком.', 'На её фоне санитарная бригада, которая в спешке разоряет кладбище, готовя остров к затоплению, ведёт себя цинично, ПО-ЗВЕРСКИ.', 'АРТИСТИЧНЫЙ талант Стефании Михайловны Станюты, воплотившей на экране образ Дарьи Пинигиной (х/ф «Прощание», 1981), поражает не одно поколение зрителей.'], a:['артистический'], src:'Вариант 10 · задание 5' },

    { text:true, q:'Отредактируйте предложение: исправьте лексическую ошибку, исключив лишнее слово. Запишите это слово, соблюдая нормы современного русского литературного языка.', context:'После двухмесячного перерыва, вызванного техническими неполадками в работе транспортной сети, поставки медицинского оборудования были возобновлены вновь с сохранением прежних объёмов товарооборота.', a:['вновь'], src:'Вариант 5 · задание 6' },
    { text:true, q:'Отредактируйте предложение: исправьте лексическую ошибку, заменив неверно использованное слово. Запишите подобранное слово, соблюдая нормы современного русского литературного языка.', context:'Для Максима Максимыча, привыкшего к опасностям службы на Кавказе, очень важно было сохранять братские отношения с теми, кто вместе с ним принял военное крещение, поэтому холодность Печорина поселила в его сердце горькую обиду.', a:['боевое'], src:'Вариант 6 · задание 6' },

  8: [
    { match:true, q:'Установите соответствие между грамматическими ошибками и предложениями, в которых они допущены.', errors:['А) нарушение в построении предложения с несогласованным приложением', 'Б) нарушение в построении предложения с однородными членами', 'В) нарушение в построении предложения с причастным оборотом', 'Г) нарушение связи между подлежащим и сказуемым', 'Д) нарушение в построении предложения с деепричастным оборотом'], sentences:['1) Новая технология получения пластмассы позволяет не только уменьшить экономический ущерб, а также даёт возможность утилизировать опасные отходы.', '2) Д. Н. Мамин-Сибиряк в очерке «Бойцы» описывал Печку так: «…нависла над самой рекой громадная скала Печка».', '3) Заглянув в любой учебник, станет понятно, что существует четыре популярных метода формирования рекламного бюджета.', '4) Следует отметить, что согласно физическим и философским представлениям пространство является формой существования материи и характеризует структурность и протяжённость материальных систем.', '5) Когда цилиндр готов, на обеих заготовках отгибаем кромки для фальцевого шва, и детали соединяются.', '6) Те, кто встали рано и настроили радиоприёмники на волну и радиостанции «Маяк», первыми узнают о послаблениях для водителей праворульных машин.', '7) Можно только посочувствовать судам, которые будут рассматривать дела, опираясь на данный закон.', '8) Небеса умеют быть безоглядно щедрыми, и для того, чтобы эту щедрость оценить и понять чувства баловней судьбы, надо заглянуть в самую знаменитую гостиницу столицы – в гостиницу «Москву».', '9) Эти идеи, по мнению автора, важны для всех людей, пользующиеся русским языком, и автор хотел предложить читателям не столько рыбу, сколько удочку.'], a:'81963', src:'Вариант 1 · задание 8' },
    { match:true, q:'Установите соответствие между грамматическими ошибками и предложениями, в которых они допущены.', errors:['А) нарушение в построении предложения с несогласованным приложением', 'Б) нарушение в построении предложения с деепричастным оборотом', 'В) нарушение в построении предложения с причастным оборотом', 'Г) нарушение в построении предложения с однородными членами', 'Д) неправильное употребление падежной (предложно-падежной) формы управляемого слова'], sentences:['1) Сад и парк теснейшим образом связаны не только с бытовой жизнью, протекающей в них, но и со строем создавшего их общества.', '2) В статье «Заметках о русском» Д. С. Лихачёв отмечал, что сады и парки создают своего рода «идеальное» взаимодействие человека и природы.', '3) Садоводы различных эстетических вкусов, мировоззрений по-разному относились к богатствам природы, по-разному её преобразовывали.', '4) Реставратор не возвращает реставрируемое произведение к определённому моменту его жизни, а, стараясь сохранить первозданный облик объекта, продлевает его жизнь во времени культуры.', '5) В книге «Поэзия садов» Д. С. Лихачёв утверждал, что каждая эпоха обладает определёнными признаками «стиля эпохи», проявляющиеся и в садах, и в поэзии.', '6) В своей поэме «Сады» Жак Делиль прямо заявляет, что сады «говорят», «вещают», «ведут разговор», «дают уроки».', '7) К старым насаждениям во все века существовало бережное отношение: деревья ценились, сохранялась прежняя планировка садов — сады не столько строились, как преобразовывались.', '8) В старину каждый сад, согласно принципов садово-паркового искусства, должен был изумлять посетителя редкими растениями, птицами, животными.', '9) Не случайно в своё время помещиков настигало разорение, устраивая парки в своих усадьбах.'], a:'29578', src:'Вариант 2 · задание 8' },
    { match:true, q:'Установите соответствие между грамматическими ошибками и предложениями, в которых они допущены.', errors:['А) нарушение в построении предложения с причастным оборотом', 'Б) неправильное употребление падежной (предложно- падежной) формы управляемого слова', 'В) нарушение в построении предложения с косвенной речью', 'Г) нарушение в построении предложения с однородными членами', 'Д) нарушение в построении предложения с деепричастным оборотом'], sentences:['1) Через несколько мгновений успокоившиеся моржи опустили головы и снова погрузились в сон.', '2) Ещё в конце XIX столетия исследователь Стреттон в опытах с ношением специальных очков, переворачивающими изображение на сетчатке, отмечал, что при этом возникает переживание нереальности воспринимаемого мира.', '3) По аплодисментам чувствовалось, что зрители узнали и обрадовались появлению популярного актёра в кульминационном эпизоде пьесы.', '4) В стихотворении, посвящённом Александру Блоку, Марина Цветаева писала, что «…имя твоё – льдинка на языке».', '5) Тому, кто сообщит, где находится гигантский удав, сбежавший из труппы эстрадного объединения, будет выплачена награда в десять тысяч.', '6) По прибытию в стольный град Киев Игорь явился в Княжескую Думу, где с глубоким прискорбием сообщил боярам о том, что Великий Киевский князь Олег умер от укуса змеи.', '7) Услышав где-то вверху лёгкий шорох, альпинист едва успел увернуться от глыбы, рухнувшей у его ног.', '8) Согласно древней легенде, город был настолько величественным, что завистливые боги вызвали наводнение, в результате которого он был затоплен.', '9) Оставшись наконец в одиночестве, никто не мешал мне спокойно подумать о предстоящем разговоре.'], a:'26439', src:'Вариант 3 · задание 8' },
    { match:true, q:'Установите соответствие между грамматическими ошибками и предложениями, в которых они допущены.', errors:['А) нарушение в построении предложения с несогласованным приложением', 'Б) нарушение в построении предложения с именем числительным', 'В) нарушение в построении предложения с причастным оборотом', 'Г) нарушение в построении предложения с однородными членами', 'Д) нарушение связи между подлежащим и сказуемым'], sentences:['1) Они ещё не знали, что до освобождения оставалось всего четверо дней.', '2) В репетиционном классе будущие артисты читали и восхищались пьесой, разбирали характеры персонажей и обсуждали их взаимоотношения.', '3) Сочи, если предельная численность населения города будет превышена, рано или поздно распадутся на четыре муниципальных образования.', '4) Я надеюсь, что благоразумие восторжествует и этот кошмар современного мира перестанет угрожать людям.', '5) Приветствуемый, хотя и не без некоторых оговорок, Белинским, автор «Обыкновенной истории», «Обломова» и «Обрыва» сделался любимцем читателей.', '6) Гость сделал жест, означавший, что он никогда и никому этого не скажет, и продолжал свой рассказ.', '7) Надышавшись морским воздухом и перекусив в безлюдном кафе «Ромашке», он поднялся в город и к началу сумерек вышел по Базарной площади на Канатную дорогу.', '8) Константин Паустовский и его близкие друзья – известные писатели Исаак Бабель, Аркадий Гайдар, Эдуард Багрицкий – находились в творческой оппозиции официальной советской литературе.', '9) Дагестанский кинжал, принадлежавший Михаилу Лермонтову, – экспонат выставки, открывшийся к 200- летию поэта в Пушкинском доме в Санкт-Петербурге.'], a:'71923', src:'Вариант 4 · задание 8' },
    { match:true, q:'Установите соответствие между грамматическими ошибками и предложениями, в которых они допущены.', errors:['А) нарушение в построении предложения с деепричастным оборотом.', 'Б) нарушение в построении предложения с причастным оборотом.', 'В) нарушение в построении сложного предложения.', 'Г) нарушение в построении предложения с однородными членами.', 'Д) нарушение в построении предложения с несогласованным приложением.'], sentences:['1) В заключение следует отметить то, что, к сожалению, пока единственным русским лауреатом Нобелевской премии по экономике оказался математик и экономист Леонид Канторович.', '2) Русский язык – очень гибкий, как теперь говорят, самонастраивающийся инструмент познания.', '3) Подбирая примеры повыразительнее, мне помогли академические картотеки, я просматривал множество мемуаров и дневниковых записей, выцветшие от времени листы газет и журналов.', '4) Быть может, погрузившись в эту книгу, читатель задумается, какая ответственность лежит на каждом носителе языка: он – связывающая нить прошлые поколения с будущими.', '5) Известен целый набор прилагательных, которыми женщины XIX века, по свидетельству писателей, в непринуждённом разговоре оценивали мужчин.', '6) В 1853 году журнал «Отечественные записки» размышлял над тем, отчего это нынешние дамы вместо «милый, желанный» всё чаще говорят «симпатичный».', '7) Предкам нашим достаточно было приятности, нежности: нежный мужчина, приятный мужчина, а с середины XIX века требования изменились: мужчина должен быть не только культурным, но и появился спрос на деликатных.', '8) И. И. Панаев вспоминал, как в кругу сотрудников журнала «Современника» рождалось новое слово, немного литературное, не столь короткое, но зато уважительное: «молодые люди».', '9) Шестнадцатилетнего мальчика принимали в салоне «как взрослого молодого человека», а те, кому оказался он не по нраву, величали его мальчишкой.'], a:'34178', src:'Вариант 5 · задание 8' },
    { match:true, q:'Установите соответствие между грамматическими ошибками и предложениями, в которых они допущены.', errors:['А) неправильное построение предложения с деепричастным оборотом', 'Б) неправильное построение предложения с косвенной речью', 'В) нарушение в построении предложения с несогласованным приложением', 'Г) неправильное построение предложения с причастным оборотом', 'Д) нарушение видо-временной соотнесённости глагольных форм'], sentences:['1) В предисловии к «Герою нашего времени» М. Ю. Лермонтов утверждает, что в образе Печорина запечатлены «пороки всего нашего поколения, в полном их развитии».', '2) Полюбив Печорина, доверившись ему, Бэла вынуждена была разорвать отношения с родными, нарушить законы своей веры и предать нормы морали, установленные в соответствии с этой верой.', '3) Читая сцены ранения и смерти этой героини, сострадание к ней и негодование по отношению к погубившим её мужчинам переполняет сердце.', '4) Зададимся вопросом: можно ли назвать доктора Вернера единственным другом Печорина, а Веру единственной по-настоящему уважаемой и любимой им женщиной?', '5) Кавказские пейзажи всегда очаровывали Лермонтова, он запоминает их детали, а потом вдохновенно изобразил в романе «Герой нашего времени».', '6) Роман М. Ю. Лермонтова начинается с главы «Бэлы», повествование в которой ведётся от лица Максима Максимыча.', '7) Припоминается очень известная самохарактеристика Печорина, изложенная в его «Журнале…»: «Я к дружбе неспособен: из двух друзей всегда один раб другого, хотя часто ни один из них в этом себе не признаётся».', '8) Сияющее тишиной небо, свысока глядящие на нас яркие звёзды, отрывистое эхо ущелий и бодрящий холодок горной реки – всё это Кавказ, его природа.', '9) Одним из первых критиков, высоко оценивший роман, стал В. Г. Белинский, который посвятил ему статью «Герой нашего времени. Сочинение М. Лермонтова».'], a:'31695', src:'Вариант 6 · задание 8' },
    { match:true, q:'Установите соответствие между грамматическими ошибками и предложениями, в которых они допущены.', errors:['А) нарушение связи между подлежащим и сказуемым', 'Б) ошибка в построении предложения с однородными членами', 'В) неправильное построение предложения с косвенной речью', 'Г) неправильное построение предложения с причастным оборотом', 'Д) нарушение в построении предложения с несогласованным приложением'], sentences:['1) В стихотворении А. С. Пушкина с образом моря тесно связаны размышления о двух великих могилах, как бы возникающим в поэтическом воображении автора при взгляде в туманную беспредельную даль.', '2) «Пора, мой друг, пора…» – элегия, любимая многими уставшими на дорогах жизни.', '3) Произведение «Полтава» написана великим русским поэтом А. С. Пушкиным в 1828 году и посвящена одному из значимых событий в истории нашей страны.', '4) Не зная, что «день грядущий» ему готовит, Ленский находился в меланхоличном и сентиментальном настроении.', '5) Не зря говорил великий канцлер Германии Отто фон Бисмарк, что нам не стоит воевать с Россией, а стоит быть с ней в дружбе.', '6) В маленькой трагедии «Скупом рыцаре» Пушкин обращается к одной из вечных тем – омертвения души человеческой.', '7) Петруша Гринёв – недоросль, воспитывавшийся в дворянской семье, гонявший голубей, игравший с дворовыми мальчишками.', '8) Евгений Онегин – светский баловень, учившийся понемногу «чему-нибудь и как-нибудь», увлекавшийся не только театром, но и читавший сочинения Адама Смита – английского экономиста.', '9) Значительная часть рукописного варианта произведения была повреждена и восстановлению не подлежала.'], a:'38516', src:'Вариант 7 · задание 8' },
    { match:true, q:'Установите соответствие между грамматическими ошибками и предложениями, в которых они допущены.', errors:['А) нарушение в построении предложения с деепричастным оборотом', 'Б) нарушение в построении предложения с однородными членами', 'В) нарушение в построении предложения с причастным оборотом', 'Г) нарушение связи между подлежащим и сказуемым', 'Д) нарушение в построении предложения с косвенной речью'], sentences:['1) Многие герои Лескова мучительно ищут своё место в жизни, путь их тернист и наполнен ошибками, страданиями и крутыми поворотами.', '2) Левша рано нашёл своё дело и стал мастером, Иван же Флягин сменил много занятий, проявляя разные свои таланты, но главное служение обрёл лишь в преклонные годы.', '3) На просьбу попутчиков рассказать им историю своей жизни Флягин откликается охотно, но предупреждает их, что «всей моей обширной протекшей жизненности … обнять не могу».', '4) Иван Северьяныч старается говорить спокойно и обстоятельно, однако поникшая голова, затянувшаяся пауза или вырвавшийся вздох из груди выдают его переживания.', '5) Речь его постоянно меняется, сохраняя колорит той среды, в которой ему приходилось вращаться.', '6) Собравшаяся компания слушателей воспринимали его приключения как сказку, и только история Груши изменила это мнение.', '7) Читая произведение, возникает глубокое сострадание и уважение по отношению к герою.', '8) Флягин, будучи монахом, ищет не превосходства над неверующими, сколько истину в религии и бога в своей душе.', '9) Он произнёс замечательные слова о том, что «себя не продавал ни за большие деньги, ни за малые…»'], a:'78463', src:'Вариант 8 · задание 8' },
    { match:true, q:'Установите соответствие между грамматическими ошибками и предложениями, в которых они допущены.', errors:['А) неправильное употребление падежной (предложно- падежной) формы управляемого слова', 'Б) неправильное употребление имени числительного', 'В) нарушение в построении предложения несогласованным приложением', 'Г) нарушение в построении предложения с причастным оборотом', 'Д) нарушение связи между подлежащим и сказуемым'], sentences:['1) Прообразом Дома Грибоедова в булгаковском романе стал Дом Герцена, располагавшийся на Страстном бульваре и занятый РАПП-ом и МАПП-ом, пародийно представленные в образе МАССОЛИТа.', '2) Булгакову с каждым годом всё больше претил дух неумолимо надвигавшейся эпохи, он жил и творил вопреки ей, тайно создавая свой роман для будущих читателей.', '3) Прототипов Маргариты было несколько, и прежде всего, вразрез устоявшегося мнения, мне хочется назвать его вторую жену – Любовь Евгеньевну Белозерскую, принадлежавшую к богемному миру, яркую, раскрепощённую женщину.', '4) С обоими героинями, Аннушкой и Наташей, связаны важные события романа «Мастер и Маргарита».', '5) В экранизации романа «Мастера и Маргариты» Владимира Бортко звучит музыка Игоря Корнелюка.', '6) Штурман Жорж – это пародия не только на известную французскую писательницу Жорж Санд, но и на двух современниц писателя – Ларису Рейснер и Софью Апраксину-Лавринайтис, писавшую под псевдонимом Сергей Мятежный.', '7) Булгаковеды считают, что, вероятнее всего, прообразом подвала мастера в Москве был дом в Мансуровском переулке, где жили его друзья – братья Топлениновы – и где он сам позднее поселился и написал несколько глав «Мастера и Маргариты».', '8) Представьте только, как нелеп поэт Бездомный, передвигавшийся в кальсонах по Москве в состоянии психоза, и как комична и одновременно страшна сцена лишения головы Жоржа Бенгальского!', '9) Дюжина членов руководства МАССОЛИТа, напрасно ожидающих в Доме Грибоедова своего председателя, пародийно уподоблено двенадцати апостолам, только не христианской, а новой, коммунистической веры.'], a:'34519', src:'Вариант 9 · задание 8' },
    { match:true, q:'Установите соответствие между грамматическими ошибками и предложениями, в которых они допущены.', errors:['А) неправильное построение предложения с причастным оборотом', 'Б) ошибка в построении предложения с однородными членами', 'В) нарушение в построении предложения с несогласованным приложением', 'Г) неправильное употребление падежной (предложно- падежной) формы управляемого слова', 'Д) неправильное построение предложения с косвенной речью'], sentences:['1) По приезду из деревни в город маленький герой рассказа В. Г. Распутина «Уроки французского» живёт в чужом доме, чувствует себя одиноким, несчастным, тоскует по матери.', '2) Володя недоедал, даже голодал, потому что хлеб и картошку, привозящие ему из деревни, воровал сын хозяйки Федька.', '3) Главному герою было стыдно вспоминать, как «я пугался и терялся, когда учительница французского языка Лидия Михайловна звала меня ужинать».', '4) Володя сердился и возмущался из-за того, что Лидия Михайловна прислала ему посылку с продуктами.', '5) Тогда она решила сыграть с ним в «пристенок» на деньги, при этом «мошенничала» в пользу ребёнка, чтобы подкормить его, не ставя при этом в неловкое положение и не унижая его человеческое достоинство.', '6) Директор школы оказался формалистом и не проявил человечности: разоблачил и уволил учительницу, не разобравшись в истинных причинах её непедагогичного поступка.', '7) Так получилось, что Лидия Михайловна не только научила Володю французскому языку, но и доброте, бескорыстию, самопожертвованию, милосердию.', '8) Интересно, что в основе рассказа «Уроков французского» лежит эпизод биографии самого писателя.', '9) Прототипом Лидии Михайловны стала учительница Валентина Григорьевича Распутина, которая пыталась скрасить его голодное детство и о которой он всегда с теплотой вспоминал.'], a:'27813', src:'Вариант 10 · задание 8' },

  13: [
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется РАЗДЕЛЬНО. Запишите номера ответов.', opts:['В его тёмных глазах отражалась (НЕ)ПРИЯТНОЕ чувство быстрого, под звон бубенцов, движения, а какое-то душевное смятение, беспокойство.', 'Грузно перевалившись на другой бок, уже никем (НЕ)СДЕРЖИВАЕМЫЙ, камень повернулся снова и быстро покатился по склону вниз.', 'Это (НЕ)ПОНИМАНИЕ делало Андрея ещё более капризным и обидчивым.', 'Дед на кухне безмятежно и (НЕ)СПЕША ел тёплые макароны с кетчупом и читал любимую книгу.', 'Мы покидали родной дом в преддверии зимы, ехали в (НЕ)ИЗВЕСТНОСТЬ.'], a:[0, 1, 3], src:'Вариант 1 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется СЛИТНО. Запишите номера ответов.', opts:['Клиент обязан перечислить (не)достающую сумму в течение двух рабочих дней с момента получения от банка уведомления о возврате средств.', 'Астрономы изучили фотографии и обнаружили канавки, желобки, ущелья, склоны, (НЕ)ЗАМЕЧЕННЫЕ на прежних снимках.', 'Всю ночь налимы (НЕ)МОГЛИ уснуть и лениво шевелились в садке.', 'Хрустальная мечта, магнетическое сияние, (НЕ)ДОСЯГАЕМЫЙ идеал всех городов, искус голодных душ – Париж.', 'С новобранцами говорил (НЕ)ЗЕЛЁНЫЙ, перепуганный войной лейтенант, а главный военный идеолог армии.'], a:[0, 3], src:'Вариант 2 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется РАЗДЕЛЬНО. Запишите номера ответов.', opts:['Герой ничем (НЕ)ПРИМЕЧАТЕЛЕН — таких сотни тысяч: обыкновенный безработный, усталый, скучный человек.', 'Предатели находились (НЕ)СРЕДИ солдат, а в высших эшелонах командования и власти.', 'Хомяк, так и (НЕ)ПРИВЫКШИЙ к цилиндру, жадно ел картофельную шелуху, успокаивая нервы.', 'Павел Витальевич (НЕ)ВНИМАТЕЛЬНО поливал из лейки рассаду в деревянных длинных ящиках, а Максим ходил возле него и размахивал руками.', '— Я извиняюсь, — уже (НЕ)ГОДУЯ, заговорил Никанор Иванович, — какие тут закуски!'], a:[0, 1, 2], src:'Вариант 3 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется РАЗДЕЛЬНО. Запишите номера ответов.', opts:['Я шёл, (НЕ)ГЛЯДЯ по сторонам, уткнувшись глазами в носки ботинок.', 'Якуты топят юрту всю ночь без перерыва: в короткую, (НЕ)ЗАКРЫТУЮ ничем трубу тепло вытягивает быстро.', 'Мать Шолохова, женщина совершенно (НЕ)ГРАМОТНАЯ, но крепкого, живого ума, выучилась читать и писать, чтоб самостоятельно вести переписку с сыном.', 'Умел он нагнать на людей страху, когда видел или считал, что работают они скверно, равнодушно, (НЕ)ДОБРОСОВЕСТНО.', 'А март уж поднимается в рост и на затёкших хмельных ногах расхаживает (НЕ)СПЕША, заплетаясь и кружась...'], a:[0, 1, 4], src:'Вариант 4 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется РАЗДЕЛЬНО. Запишите номера ответов.', opts:['Кто-то включил фонарик, но (НЕ)ПРОСТОЙ, а суперъяркий, как прожектор.', '(НЕ)СМОТРЯ по сторонам, с землистыми лицами, они шли полчаса и час, а земля охала глухим грудным звуком под тяжёлыми шагами.', 'Действие пьесы разворачивается в период, когда Индия переживает (НЕ)БЫВАЛЫЙ экономический подъём.', 'Некоторые российские производители чая (НЕ)ОБОСНОВАННО используют для своего продукта название «Индийский чай».', 'Изучение искусственного интеллекта ― ещё молодая дисциплина, и её структура, круг вопросов и методики (НЕ)ТАК чётко определены, как в более зрелых науках, например физике.'], a:[0, 1, 4], src:'Вариант 5 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется РАЗДЕЛЬНО. Запишите номера ответов.', opts:['Грушницкий был (НЕ)СОГЛАСЕН оставаться в тени Печорина, он хотел быть победителем в борьбе за симпатию княжны.', 'Его (НЕ)ПОЗВОЛИТЕЛЬНО дерзкие высказывания о княжне Мери были расценены Печориным как клевета.', 'Вовсе (НЕ)ЖЕЛАЯ смерти Грушницкого и предлагая ему извиниться, Печорин сталкивается с малодушием бывшего приятеля.', 'Понимая, что дуэли (НЕ)ИЗБЕЖАТЬ, Печорин в очередной раз хочет испытать судьбу.', 'Фатализм (НЕ)ВПОЛНЕ был близок Лермонтову: писатель, как и его герой, не раз пытался переломить свою судьбу.'], a:[0, 2, 3, 4], src:'Вариант 6 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется СЛИТНО. Запишите номера ответов.', opts:['В среде лицеистов поступить (НЕ)ПО-ТОВАРИЩЕСКИ – значило проявить низость.', 'У Модеста Корфа, чей ум, организованность и исполнительность поражали наставников, были отнюдь (НЕ)ЗАОБЛАЧНЫЕ перспективы в построении успешной карьеры.', 'Добрая улыбка и нежность в голосе сглаживали впечатление от (НЕ)СКЛАДНОЙ фигуры Дельвига.', '(НЕ)ЛЕГКО было Кюхельбекеру научиться светским манерам.', 'Пушкин (НЕ)ДОЛЖЕН был знать об участии Ивана Пущина в подготовке восстания декабристов.'], a:[2, 3], src:'Вариант 7 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется РАЗДЕЛЬНО. Запишите номера ответов.', opts:['Внешне Левша был (НЕ)ПРИВЛЕКАТЕЛЬНЫМ человеком.', 'Кроме того, он (НЕ)ОБРАЗОВАН, как и многие люди из народа.', 'Тем (НЕ)МЕНЕЕ этот скромный герой сумел раскрыть свой талант.', '(НЕ)ИМЕЯ «мелкоскопа», он сумел блоху подковать.', 'Левша (НЕ)ГОНИТСЯ за материальным достатком, его заботит не личное благополучие, а общее счастье и слава России.'], a:[2, 3, 4], src:'Вариант 8 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется РАЗДЕЛЬНО. Запишите номера ответов.', opts:['Он был сам (НЕ)СВОЙ.', 'В центре города стояло старое (НЕ)ПРИМЕТНОЕ здание.', 'Говорила (НЕ)ВПОПАД.', 'Обидно прожить жизнь, так и (НЕ)УЗНАВ себя и свои способности.', 'Ничего нет хуже, товарищи, чем малодушие и (НЕ)УВЕРЕННОСТЬ в себе.'], a:[0, 3], src:'Вариант 9 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется РАЗДЕЛЬНО. Запишите номера ответов.', opts:['Молодых «сманивали к себе поселения побольше да пошумней, с видом на будущее, а у Атамановки его (НЕ)БЫЛО».', '«Судьба её, надо сказать, (НЕ)ВЕЧНО была такой…»', '«Андрей Гуськов, чужой, но расторопный и бравый парень, сплавлял на плотах горючее, которое брали в цистернах (НЕ)ПОДАЛЕКУ».', '«Поднимаясь от Ангары с водой, Настёна (НЕ)ВОЛЬНО всякий раз посматривала на дым из трубы».', 'Настёна «замерла от предательской мысли: а разве (НЕ)ЛУЧШЕ, если бы это и вправду был только оборотень?» (По В. Г. Распутину)'], a:[0, 1, 4], src:'Вариант 10 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется РАЗДЕЛЬНО. Запишите номера ответов.', opts:['Каждая (НЕ) СЧАСТЛИВАЯ семья несчастлива по-своему.', 'Жена (НЕ) ВЫХОДИЛА из своих комнат, мужа третий день не было дома.', 'Мучало Степана Аркадьича (НЕ) СТОЛЬКО самое событие, сколько то, как он ответил на эти слова жены.', 'Она, ничем (НЕ) ЗАМЕЧАТЕЛЬНАЯ, простая, только добрая мать семейства, по чувству справедливости должна быть снисходительна.', 'Это была состарившаяся, отнюдь (НЕ) КРАСИВАЯ женщина.'], a:[1,2,3,4], src:'Работа №1 · вопрос 1 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется СЛИТНО. Запишите номера ответов.', opts:['Писатель задумался над (НЕ) ЗАКОНЧЕННЫМ романом.', 'Поражала (НЕ) СПРАВЕДЛИВОСТЬ выставленных баллов.', 'Рассуждение это ни в какой степени (НЕ) УДОВЛЕТВОРИЛО председателя домоуправления.', 'Первый был (НЕ) КТО иной, как Михаил Александрович Берлиоз, председатель правления одной из крупнейших московских литературных ассоциаций.', '(НЕ) ТОЛЬКО у будочки, но и во всей аллее, параллельной Малой Бронной улице, не оказалось ни одного человека.'], a:[0,1], src:'Работа №1 · вопрос 2 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется РАЗДЕЛЬНО. Запишите номера ответов.', opts:['Напившись, литераторы (НЕ) МЕДЛЕННО начали икать, расплатились и уселись на скамейке лицом к пруду и спиной к Бронной.', 'Кроме того, Берлиоза охватил ничем (НЕ) ОБОСНОВАННЫЙ, но столь сильный страх, что ему захотелось тотчас же бежать с Патриарших без оглядки.', 'Берлиоз тоскливо оглянулся, (НЕ) ПОНИМАЯ, что его напугало.', 'Иисус в его изображении получился ну совершенно как живой, хотя и (НЕ) ПРИВЛЕКАЮЩИЙ к себе персонаж.', 'В деревне протекала (НЕ) БОЛЬШАЯ речушка.'], a:[1,2,3], src:'Работа №1 · вопрос 3 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется СЛИТНО. Запишите номера ответов.', opts:['Иван Николаевич сочинил поэму, и в очень короткий срок, но, к сожалению, ею редактора нисколько (НЕ) УДОВЛЕТВОРИЛ.', 'Михаил Александрович забирался в дебри, в которые может забираться, (НЕ) РИСКУЯ свернуть себе шею, лишь очень образованный человек', 'Жизнь Берлиоза складывалась так, что к (НЕ) ОБЫКНОВЕННЫМ явлениям он не привык.', 'Ни на какую ногу описываемый не хромал, и росту был (НЕ) МАЛЕНЬКОГО.', 'Тут он вежливо снял берет, и друзьям ничего (НЕ) ОСТАВАЛОСЬ, как приподняться и раскланяться.'], a:[2,3], src:'Работа №1 · вопрос 4 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется РАЗДЕЛЬНО. Запишите номера ответов.', opts:['В нашей стране атеизм никого (НЕ) УДИВЛЯЕТ, -- дипломатически вежливо сказал Берлиоз.', 'Оно, может, и умно, но вовсе (НЕ) ПОНЯТНО.', 'Бездомный поспешил ответить на этот (НЕ) ОЧЕНЬ ясный вопрос.', 'А вы соглашались с вашим собеседником? -- осведомился (НЕ) ИЗВЕСТНЫЙ, повернувшись вправо к Бездомному.', 'Берлиоз с великим вниманием слушал (НЕ) ПРИЯТНЫЙ рассказ про саркому и трамвай, и какие-то тревожные мысли начали мучить его.'], a:[0,1,2], src:'Работа №1 · вопрос 5 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется СЛИТНО. Запишите номера ответов.', opts:['(НЕ) ПРАВИЛЬНЕЕ ли думать, что управился с ним кто-то совсем другой?', 'Родные вам начинают лгать, вы, чуя (НЕ) ЛАДНОЕ, бросаетесь к ученым врачам, затем к шарлатанам, а бывает, и к гадалкам.', 'Кирпич ни с того ни с сего никому и никогда на голову (НЕ) СВАЛИТСЯ.', 'Вот моя карточка, паспорт и приглашение приехать в Москву для консультации, -- веско проговорил (НЕ) ЗНАКОМЫЙ человек.', 'И доказательств никаких не требуется, -- ответил профессор и заговорил далеко (НЕ) ГРОМКО, причем его акцент почему-то пропал.'], a:[1,3], src:'Работа №1 · вопрос 6 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется РАЗДЕЛЬНО. Запишите номера ответов.', opts:['-- Бывал, бывал и не раз! -- вскричал он, смеясь, но не сводя никогда (НЕ) СМЕЮЩЕГОСЯ глаза с поэта.', 'И все теперь предвещало (НЕ) ХОРОШИЙ, а скверный день.', 'Это она, опять она, (НЕ) ПОБЕДИМАЯ, ужасная болезнь гемикрания, при которой болит полголовы.', 'На мозаичном полу у фонтана уже было приготовлено кресло, и прокуратор, (НЕ) ГЛЯДЯ ни на кого, сел в него и протянул руку в сторону.', 'Крысобой был на голову выше самого высокого из солдат легиона и настолько широк в плечах, что совершенно заслонил еще (НЕ) ПОДНЯВШЕЕСЯ солнце.'], a:[0,1,3,4], src:'Работа №1 · вопрос 7 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется СЛИТНО. Запишите номера ответов.', opts:['И все, кроме (НЕ) ПОДВИЖНОГО прокуратора, проводили взглядом Марка Крысобоя, который махнул рукою арестованному, показывая, что тот должен следовать за ним.', 'Но он знал, что и это ему (НЕ) ПОМОЖЕТ.', 'Прокуратор сказал (НЕ) ГРОМКО, чтобы он не притворялся глупцом.', '(НЕ) ЗНАЯ, как ответить на это, секретарь счел нужным повторить улыбку Пилата.', 'Он думал о том, какие еще (НЕ) НУЖНЫЕ вопросы ему придется задавать.'], a:[0,2,4], src:'Работа №1 · вопрос 8 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется РАЗДЕЛЬНО. Запишите номера ответов.', opts:['Секретарь вытаращил глаза на арестанта и (НЕ) ДОПИСАЛ слова.', 'Беда в том, -- продолжал никем (НЕ) ОСТАНАВЛИВАЕМЫЙ связанный, -- что ты слишком замкнут и окончательно потерял веру в людей.', 'Крысобой вынул из рук у легионера, стоявшего у подножия бронзовой статуи, бич и, (НЕ) СИЛЬНО размахнувшись, ударил арестованного по плечам.', 'О да, ты (НЕ) ПОХОЖ на слабоумного, -- тихо ответил прокуратор и улыбнулся какой-то страшной улыбкой.', 'Он и правда (НЕ) СЧАСТЛИВЫЙ человек'], a:[0,1,3], src:'Работа №1 · вопрос 9 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется СЛИТНО. Запишите номера ответов.', opts:['Мысли понеслись короткие, бессвязные и (НЕ) ОБЫКНОВЕННЫЕ.', 'Никто (НЕ) ЗНАЕТ, что случилось с прокуратором Иудеи, но он позволил себе поднять руку, как бы заслоняясь от солнечного луча.', 'Перед прокуратором развернулся весь ненавистный ему Ершалаим с висячими мостами, крепостями и -- самое главное -- с (НЕ) ПОДДАЮЩЕЙСЯ никакому описанию глыбой мрамора с золотою драконовой чешуею вместо крыши.', 'Голос отвечавшего, казалось, колол Пилату в висок, был (НЕ) ВЫРАЗИМО мучителен, и этот голос говорил.', 'В самом деле: преступления Вар-раввана и Га-Ноцри отнюдь (НЕ) СРАВНИМЫ по тяжести.'], a:[0,3], src:'Работа №1 · вопрос 10 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется СЛИТНО. Запишите номера ответов.', opts:['Тогда секретарь постарался представить себе, в какую именно причудливую форму выльется гнев вспыльчивого прокуратора при этой (НЕ) СЛЫХАННОЙ дерзости арестованного.', '(НЕ) ЭТА мысль поразила сейчас Пилата.', 'Все та же (НЕ) ПОНЯТНАЯ тоска, что уже приходила на балконе, пронизала все его существо.', 'Он тотчас постарался ее объяснить, и объяснение было странное: показалось смутно прокуратору, что он чего-то (НЕ) ДОГОВОРИЛ с осужденным.', 'Темные глаза первосвященника блеснули, и, (НЕ) ХУЖЕ, чем ранее прокуратор, он выразил на своем лице удивление.'], a:[0,2], src:'Работа №1 · вопрос 11 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется', opts:['Князь (НЕ) ОТВЕЧАЛ, но она молча, значительно глядя на него, ждала ответа.', 'Я часто думаю, как иногда (НЕ) СПРАВЕДЛИВО распределяется счастие жизни.', 'Приехала молодая, маленькая княгиня Болконская, прошлую зиму вышедшая замуж и теперь (НЕ) ВЫЕЗЖАВШАЯ в большой свет по причине своей беременности.', 'Княгиня ездила на (НЕ) БОЛЬШИЕ вечера.', 'Все гости совершали обряд приветствия никому (НЕ) ИЗВЕСТНОЙ тётушки.'], a:[0,2,4], src:'Работа №1 · вопрос 12 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется СЛИТНО. Запишите номера ответов.', opts:['Все подходившие, из приличия (НЕ) ВЫКАЗЫВАЯ поспешности, с чувством облегчения исполненной тяжелой обязанности отходили от старушки.', 'Этот толстый молодой человек был (НЕ) ЗАКОННЫЙ сын знаменитого екатерининского вельможи, графа Безухова, умиравшего теперь в Москве.', 'Пьер нигде (НЕ) СЛУЖИЛ еще, только что приехал из-за границы, где он воспитывался, и был первый раз в обществе.', 'В лице Анны Павловны изобразилось беспокойство и страх, подобный тому, который выражается при виде чего-нибудь слишком огромного и (НЕ) СВОЙСТВЕННОГО месту.', 'Пьер пробурлил что-то вовсе (НЕ) ПОНЯТНОЕ и продолжал отыскивать что-то глазами.'], a:[1,3], src:'Работа №1 · вопрос 13 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется РАЗДЕЛЬНО. Запишите номера ответов.', opts:['Страх Анны Павловны был (НЕ) НАПРАСЕН.', 'Пьер, (НЕ) ДОСЛУШАВ речи тетушки о здоровье ее величества, отошел от нее.', 'Отделавшись от молодого человека, (НЕ) УМЕЮЩЕГО жить, Анна Павловна возвратилась к своим занятиям хозяйки дома.', 'Как хозяин прядильной мастерской прохаживается по заведению, замечая (НЕ) ПРИВЫЧНЫЙ, скрипящий, слишком громкий звук веретена, торопливо идет, пускает его в надлежащий ход, --- так и Анна Павловна, прохаживаясь по своей гостиной и заводила равномерную, приличную разговорную машину.', 'Люди с разных сторон равномерно и (НЕ) УМОЛКАЯ шумели.'], a:[0,1,2,4], src:'Работа №1 · вопрос 14 · задание 13' },
    { multi:true, q:'Укажите варианты ответов, в которых НЕ с выделенным словом пишется СЛИТНО. Запишите номера ответов.', opts:['Княжна Элен улыбалась; она поднялась с той же (НЕ) ИЗМЕНЯЮЩЕЮСЯ улыбкой вполне красивой женщины, с которою она вошла в гостиную.', 'Слегка шумя своею белою бальною робой, она прошла между расступившимися мужчинами, (НЕ) ГЛЯДЯ ни на кого.', 'Она как будто желала и (НЕ) МОГЛА умалить действие своей красоты.', 'Глаза, нос, рот --- все сжималось как будто в одну (НЕ) ОПРЕДЕЛЕННУЮ и скучную гримасу.', 'Князь Болконский был (НЕ) БОЛЬШОГО роста, весьма красивый молодой человек с определенными и сухими чертами.'], a:[0,3,4], src:'Работа №1 · вопрос 15 · задание 13' },
  ],
  14: [
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся РАЗДЕЛЬНО. Запишите номера ответов.', opts:['Я кинулся было (НА)ПРЯМИК через газончик, и ТУТ(ЖЕ) острая боль пронзила ногу: подошву тапочки пропорола острая колючка.', 'И мне ТО(ЖЕ) хотелось найти этих женщин ранеными, или замерзающими, или больными, или в КАКОЙ(НИБУДЬ) ужасной ситуации, и спасти, выходить, выручить.', 'Бездомные животные, (В)ОТЛИЧИЕ от домашних, не имели права на существование, ПОТОМУ(ЧТО) портили её цветник.', '(ПО)СКОЛЬКУ начало линьки у краснозобых казарок совпадает с периодом окончания размножения, первые пёстрые перышки, появляющиеся на полу вольера, неопровержимо свидетельствуют о том, что год прошел (В)ПУСТУЮ и потомства ждать уже нечего.', 'Если, (К)ПРИМЕРУ, трудно регулировать температуру (В)ВЕРХУ духовки, закройте пирог фольгой: верхняя корочка не будет подгорать.'], a:[2, 4], src:'Вариант 1 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся ЧЕРЕЗ ДЕФИС. Запишите номера ответов.', opts:['(ПО)СКОЛЬКУ ни одну пьесу Шекспира полностью (ПО)ПАМЯТИ восстановить не получилось, волонтёрам пришлось написать Шекспира заново.', '(В)ПРОЧЕМ, широта кругозора – это не ТО(ЖЕ) самое, что глубина и прочность знаний.', 'Мы должны были как(то) общаться, проживая в одной комнате, но он не говорил (по)русски.', 'Эксперимент оказался удачным, и мы (в)последствии повторили его (в)связи с очередным юбилеем.', 'Речка ползёт (по)пластунски, словно (ПО)ТИХОМУ тащит водоросли за волосы.'], a:[2, 4], src:'Вариант 2 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся РАЗДЕЛЬНО. Запишите номера ответов.', opts:['(В)ОТЛИЧИЕ от жены, Иван Александрович прекрасно помнил о наилучшем (АНТИ)ДЕПРЕССАНТЕ для таких случаев.', 'Писать иконы так, как это делали раньше, – ТО(ЖЕ) самое, что (ЗА)НОВО строить египетские пирамиды.', 'Двигавшаяся (ПО)ЭТОМУ участку дороги автомашина «Лада Ларгус» (КАК)БУДТО случайно провалилась в яму с горячей водой.', 'КАК(БЫ) ты ни волновался, ЧТО(БЫ) ни переживал — пройди этак кварталов двадцать, и всё станет на свое место: сделается ясным и простым.', 'Рассказ Миши я записал, не надеясь (НА)ПАМЯТЬ, но потом обнаружил, что эта информация отличается (ОТ)ТОГО, что говорили другие участники похода.'], a:[2, 3, 4], src:'Вариант 3 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся СЛИТНО. Запишите номера ответов.', opts:['Я к человеческим слабостям отношусь (ПО)ПРОСТОМУ и радуюсь, если ко мне ТАК(ЖЕ) относятся мои друзья, знакомые.', 'Маргарита (ПО)КРЕПЧЕ сжала щётку и полетела медленнее, вглядываясь в электрические провода и вывески, висящие (ПО)ПЕРЁК тротуара.', 'Есенин был первый поэт, благодаря которому я СРАЗУ(ЖЕ) понял, что в стихах есть музыка и что (ПО)ДРУГОМУ не скажешь.', 'Несколько часов (К)РЯДУ с неба сыпались мелкие снежинки (НА)ПОДОБИЕ крупы.', 'В 2012 году не стало Сергея Петровича Капицы – человека, (В)ТЕЧЕНИЕ многих лет практически (В)ОДИНОЧКУ сражавшегося в эфире за научный взгляд на мир.'], a:[1, 3], src:'Вариант 4 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся СЛИТНО. Запишите номера ответов.', opts:['(В)ЗАКЛЮЧЕНИЕ отметим, что события позднеледникового обводнения прямого отношения к Библейскому потопу не имеют, но они (В)ПОЛНЕ могли послужить его прототипом.', 'Экскурсовод объяснила, что всё настоящее – в Италии, а эти скульптуры – точные копии, (ТО)ЕСТЬ практически ТО(ЖЕ) самое, что оригиналы, и повела группу дальше.', '(В)СКОРЕ стало известно, что Пастернак вручил свой роман «Доктор Живаго» какому-то итальянцу, который (В)ПОСЛЕДСТВИИ издал его за границей.', 'Присмотревшись к ним (ПО)БЛИЖЕ, я увидел, что это целая колония летучих мышей, висящих (В)НИЗ головой, сложив крылья.', 'На СКОЛЬКО(НИБУДЬ) серьёзных соревнованиях не увидишь боксёра, бьющего на ринге только одиночные удары: ВРЯД(ЛИ) он продвинется дальше отборочного тура.'], a:[2, 3], src:'Вариант 5 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся СЛИТНО. Запишите номера ответов.', opts:['Всё ТО(ЖЕ) выражение КАКОГО(ТО) злорадного удовольствия при виде чужого страдания заметил капитан на лице бывшего товарища.', 'Поступи он (ПО)СОВЕСТИ, а не (НА)ЗЛО, не было бы печальной развязки их дружбы.', 'Баронесса выставляла (НА)ПОКАЗ бриллиантовое кольцо, подаренное ей (НА)КАНУНЕ супругом.', '(НА)СЧЁТ обеда не волнуйтесь: всё будет, как у тётушки, обильно и вкусно, так что наедитесь (ДО)СЫТА.', 'Мысли о проигрыше он старался гнать от себя прочь, забывая (ПРИ)ТОМ, что КАК(РАЗ) эти старания и усиливают их.'], a:[2, 3], src:'Вариант 6 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся РАЗДЕЛЬНО. Запишите номера ответов.', opts:['Сказка твоя и (В)ПРЯМЬ чудесна, читал её и хохотал (ДО)УПАДУ, друг мой.', 'ЧТО(БЫ) критики ни говорили, но и в романе Пушкина встречаем мы ТО(ЖЕ) самое желание запечатлеть «приметы милой старины», что и в поэмах.', 'Решено было помолвку (В)СКОРОСТИ отпраздновать, ЧТО(БЫ) осенью свадьбу сыграть.', '(КАК)БУДТО наяву вижу эту сцену из «Каменного гостя», (НА)РЕДКОСТЬ она взволновала меня!', '(С)КРАЮ дороги двигались обозы, на телегах крестьяне с жёнами и детьми, с мешками, (ДО)ОТКАЗА набитыми нехитрым скарбом.'], a:[1, 3, 4], src:'Вариант 7 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся СЛИТНО. Запишите номера ответов.', opts:['Что имел (В)ВИДУ поэт, (НА)РАСПЕВ прочтя куплет?', 'КАК(БЫ) лоб ни напрягали, аж (В)ТРОЁМ не понимали.', 'Либо (НА)СПЕХ сочинял, либо (В)ПОПЫХАХ писал.', 'ЧТО(БЫ) не попасть (В)РАСПЛОХ, мы сказали: «Слух наш плох!»', 'Повторите (С)НОВА всё (ИЗ)СЛОВА в слово!»'], a:[2, 3], src:'Вариант 8 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся РАЗДЕЛЬНО. Запишите номера ответов.', opts:['(ДО)УПАДА танцевали и (БЕЗ)УМОЛКУ болтали.', '(В)ОБРЕЗ и времени, и сил, о ЧЁМ(БЫ) ты ни попросил.', 'Помахав рукою (В)СЛЕД, не попал ногою (В)СЛЕД.', '(ПО)НАПРАСНУ слёз не лил, (В)ДОВОЛЬ чаем напоил.', '(В)ВЕРХ по лестнице иду, размышляя (НА)ХОДУ.'], a:[0, 1], src:'Вариант 9 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся ЧЕРЕЗ ДЕФИС. Запишите номера ответов.', opts:['Настёна подкралась к бане «тихонько, (ПО)ВОРОВСКИ», потом долго ждала, «пытаясь о ЧЁМ(НИБУДЬ) думать».', '«Видно, она ВСЁ(ТАКИ) задремала, ПОТОМУ(ЧТО) не слышала шагов».', '«НАКОНЕЦ(ТО) Настёна могла разглядеть его: всё ТА(ЖЕ) корявая, слегка вывернутая вправо фигура, приплюснутое курносое лицо…».', 'Взяла (ПОЛ)ПУДА муки и (КОЕ)КАКИЕ соленья.', '«Да я спросил только <…> ИЗ(ЗА) того, что КАКАЯ(ТО) не такая ты за последнее время сделалась…» (По В. Г. Распутину)'], a:[0, 4], src:'Вариант 10 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся СЛИТНО. Запишите номера ответов.', opts:['Первое время мы ТО(ЖЕ) не понимали друг друга, а (В)ПОСЛЕДСТВИИ очень подружились.', '(В)ТЕЧЕНИЕ нескольких лет М.В. Ломоносов занимался изучением русской истории, а ТАК(ЖЕ) точных наук.', 'Мысль о (ЗА)ГРАНИЦЕ, о необходимости покупать чемоданы, билеты, выбирать маршрут приводит Обломова, (В)ОТЛИЧИЕ от его друга Андрея Штольца, в состояние, близкое к паническому.', 'Исходя из предопределённости, можно (НА)ПЕРЁД оправдать любой поступок человека, СКОЛЬ(БЫ) отталкивающим или преступным он нам ни казался.', '(ПО)НАЧАЛУ трудно было судить о таланте молодого автора, однако (В)ПОСЛЕДСТВИИ читатели оценили его произведение по достоинству.'], a:[0,4], src:'Работа №1 · вопрос 1 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся РАЗДЕЛЬНО. Запишите номера ответов.', opts:['Ночью развели огромный костёр (НА)ВЕРХУ горы, а я попытался всем объяснить, (ЗА)ЧЕМ это нужно было сделать.', 'Значение многозначного слова конкретизируется в тексте, (ПРИ)ЧЁМ некоторые слова только в данном тексте могут обозначать одно и ТО(ЖЕ) понятие.', 'Павел Петрович (НЕ)РАЗ помогал своему брату, когда тот мучился, придумывая, КАК(БЫ) извернуться и найти недостающую сумму.', 'И (ТОТ) ЧАС же хлынул дождь, да такой проливной, какой (ЗА)ЧАСТУЮ бывает только в тропических лесах.', 'ЧТО(БЫ) ни происходило вокруг, ТАК(ЖЕ), как и много веков назад, шепчет берёза о быстротечности жизни, о чём-то очень важном.'], a:[2,4], src:'Работа №1 · вопрос 2 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся СЛИТНО. Запишите номера ответов.', opts:['(В)ТЕЧЕНИЕ двадцати лет изъездил я Россию по всем направлениям, но ВСЁ(ЖЕ) лучшего места, чем отчий край, не нашёл.', '(ПО)НАЧАЛУ казалось, что слова Кирилла на летучке не произвели никакого впечатления, но (В)СКОРЕ обнаружилось, что весь отдел обсуждает его выступление.', 'Ветви дерева были настолько красивыми, БУД(ТО) (НЕ)КТО нарочно изгибал их и не давал расти прямо.', 'Для композитора, который способен слышать мир ТАК(ЖЕ), как художник -- видеть его в цвете и формах, музыка -- это именно звучание, (ТО)ЕСТЬ процесс, протекающий во времени.', '(ПО)ТОМУ, что говорил дядя, не было понятно, СДЕРЖАЛ(ЛИ) он слово.'], a:[1,2], src:'Работа №1 · вопрос 3 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся РАЗДЕЛЬНО. Запишите номера ответов.', opts:['Хорошо, что (ПО)ЭТОМУ пути давно не ездили: мы смогли внимательно всмотреться (В)СЛЕД зверя.', 'Поэт тоскует по гармонии, ТАК(КАК) она недоступна для него, и именно (ПО)ТОМУ, что в его душе гордыня борется с желанием примирения.', 'Притяжение между парой электронов может возникать (НЕ)СМОТРЯ на то, что они находятся далеко друг от друга, (ПО)ЭТОМУ движение электронов в паре становится согласованным.', 'Княгиня вела странный образ жизни: она как внезапно уезжала (ЗА)ГРАНИЦУ, ТАК(ЖЕ) внезапно и возвращалась в Россию.', '(В)ТЕЧЕНИЕ всей жизни мы много читаем, но ВСЁ(ЖЕ) у каждого из нас есть самые любимые книги.'], a:[0,3,4], src:'Работа №1 · вопрос 4 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся СЛИТНО. Запишите номера ответов.', opts:['ЕСЛИ(БЫ) природа могла чувствовать благодарность к человеку (ЗА)ТО, что он проник в её жизнь, превознёс и воспел её, эта благодарность выпала бы на долю Пришвина.', '(НИ)КТО не мог повторить рекорд легкоатлета Роберта Бимона (В) ТЕЧЕНИЕ многих лет.', 'Выбрался Муравей из-под ноги Верблюда-великана и призадумался: ЧТО(БЫ) такое сделать, ЧТО(БЫ) отомстить высокомерному обидчику?', '(С)СНАЧАЛА с признанием Ильи Ильича Ольге во второй части «Обломова» возникает завязка, а (ЗА)ТЕМ и действие романа, отсутствовавшее в первых главах.', '(ПО)СКОЛЬКУ художник свободно выбирает приёмы и планы, то он (ЗА)ЧАСТУЮ остаётся непонятым современниками.'], a:[3,4], src:'Работа №1 · вопрос 5 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся РАЗДЕЛЬНО. Запишите номера ответов.', opts:['(В)ЗАКЛЮЧЕНИЕ следует сказать, что и Пушкину, и Грибоедову удалось психологически верно изобразить дворянское общество своего времени, (В)ЧАСТНОСТИ московское дворянство.', 'ЧТО(БЫ) отец ни делал (В)ТЕЧЕНИЕ дня, всё это он делал по своему твёрдому убеждению в том, что человек сам должен выполнять всю работу по дому.', 'Обломов рисует Штольцу свой идеал семейной жизни со ссылкой на духовные запросы, неведомые его предкам, но (В)ЦЕЛОМ выдерживая патриархально-идиллический дух: прогулки (В)ДВОЁМ после сытного завтрака, неспешные беседы с друзьями.', 'ЧТО(БЫ) отец ни делал (В)ТЕЧЕНИЕ дня, всё это он делал по своему твёрдому убеждению в том, что человек сам должен выполнять всю работу по дому.', 'Стихотворение «Горная дорога» воспринимается совсем (ПО)ДРУГОМУ, (ПО)ТОМУ что на первый план в нём выступают чувства тревоги, грусти, печали.'], a:[0,1,3], src:'Работа №1 · вопрос 6 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся СЛИТНО. Запишите номера ответов.', opts:['(ОТ)ЧЕГО люди не летают и (ПО)ЧЕМУ у них нет крыльев?', '(И)ТАК, вам угодно спорить, я это понял (ТОТ)ЧАС, как только вы вошли.', 'Иван Петрович постоял с закрытыми глазами, КАК(БЫ) собираясь с мыслями, ЧТО(БЫ) произнести заключительное слово.', 'У нас оставалось время до отхода поезда, (ПО)ЭТОМУ мы отправились осматривать окрестности (В)БЛИЗИ вокзала.', '(В)ПОСЛЕДСТВИИ допуск посторонних на предприятие был ограничен (В)ЦЕЛЯХ безопасности.'], a:[0,1,3], src:'Работа №1 · вопрос 7 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся РАЗДЕЛЬНО. Запишите номера ответов.', opts:['Я хочу поговорить с вами (НА)СЧЁТ квартиры, (В)СВЯЗИ с чем прошу вас уделить мне немного внимания.', '(В)ЗАКЛЮЧЕНИЕ следует сказать, что и Пушкину, и Грибоедову удалось психологически верно изобразить дворянское общество своего времени, (В)ЧАСТНОСТИ, московское дворянство.', 'Музыка Шопена бередила воспоминания. От её звуков, ТАК(ЖЕ) как и в детстве, перехватывало горло и хотелось, ЧТО(БЫ) люди были счастливы.', 'В окружном центре Карагичев появлялся редко, (ЗА)ТО в город при каждом удобном случае уезжал Разумихин и (В)ТЕЧЕНИЕ нескольких часов пропадал там, забыв и о приятеле, и о службе.', '(ПО)ТОМУ, как Николай держится, видно, что он (ВО)ВСЁМ привык быть первым.'], a:[1,4], src:'Работа №1 · вопрос 8 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся СЛИТНО. Запишите номера ответов.', opts:['ЧТО(БЫ) образ был более колоритным, актёр импровизировал, (ПРИ)ЧЁМ делал это очень талантливо.', 'Ф. Шопен (ТОТ)ЧАС покорил парижские салоны своеобразным и непривычным исполнением, а ТАК(ЖЕ) своим блистательным юмором и гениальными импровизациями.', 'В ТО(ЖЕ) время М.В. Ломоносов обращает внимание на сейсмические процессы, предполагая ТАК(ЖЕ) существование длительных волнообразных движений земной поверхности.', '(В) ТЕЧЕНИЕ всего июля стояла ненастная погода, БУД(ТО) лето сменилось осенью.', '(В)СЛЕДСТВИЕ достаточной информативности каждый компонент в свободных словосочетаниях сохраняет самостоятельность, (ПО)ЭТОМУ и функционирует как самостоятельный член предложения.'], a:[0,1,4], src:'Работа №1 · вопрос 9 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся ЧЕРЕЗ ДЕФИС. Запишите номера ответов.', opts:['Культура речи -- это, (ВО) ПЕРВЫХ, целесообразное применение языка в общении и, (ВО) ВТОРЫХ, -- раздел лингвистики.', 'Старинное ЗЕЛЕНОВАТО(ЖЁЛТОЕ) (ПРЕСС)ПАПЬЕ было куплено ещё дедушкой и царило на письменном столе папы.', 'На Земле ещё до появления человека (В) ТЕЧЕНИЕ миллионов лет происходили события, менявшие нашу планету: поднимавшиеся из морских вод горные хребты подтачивались снеговыми водами, а ТАК(ЖЕ) ледниками, которые спускались с горных вершин.', '(ИЗ)ЗА яркого солнечного света краски начали смотреться (ПО)ДРУГОМУ.', 'Лицо Ивана (КАК) БУДТО окаменело в своём строгом выражении и (ОТ) ТОГО казалось высеченным из мрамора.'], a:[0,1,3], src:'Работа №1 · вопрос 10 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся РАЗДЕЛЬНО. Запишите номера ответов.', opts:['(ПО)ЭТОМУ признаку и (ПО)ТОМУ, что нижняя часть ствола обгорела, я разгадал происхождение ямы.', '(ПО)ОКОНЧАНИИ митинга народ разошелся ТАК(ЖЕ) быстро, как и собрался.', '(В)СЛЕД экипажам и (НА)ВСТРЕЧУ им густо двигалась толпа мужчин.', 'Хотелось, ЧТО(БЫ) счастье пришло, (КАК)БУДТО это желание что-то могло изменить.', 'ЕСЛИ(БЫ) природа могла чувствовать благодарность к человеку (ЗА)ТО, что он проник в её жизнь, превознёс и воспел её, эта благодарность выпала бы на долю Пришвина.'], a:[0,1,4], src:'Работа №1 · вопрос 11 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся СЛИТНО. Запишите номера ответов.', opts:['Ночь была такая, что ДА(ЖЕ) ветер замер в саду, и Мишка ТАК(ЖЕ) притих.', 'Я шёл напрямик, через предгорья, (В)ДАЛИ от дорог и селений, ЧТО(БЫ) увидеть море.', '(В)ТЕЧЕНИЕ всей жизни мы много читаем, но ВСЁ(ЖЕ) у каждого из нас есть особенно любимые книги.', 'В солнечный день на опушке леса собрались осинки, КАК(БУДТО) им стало одиноко они вышли поболтать, как в деревнях люди выходят из дома и В(МЕСТЕ) сидят на завалинках.', '(ОТ)ТОГО, как пройдёт встреча, зависит многое, (ПО)ЭТОМУ я так волнуюсь.'], a:[0,1], src:'Работа №1 · вопрос 12 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся РАЗДЕЛЬНО. Запишите номера ответов.', opts:['Небо наливалось свинцом ТАК(ЖЕ), как и вчера, море штормило, (ПО)ЭТОМУ признаку мы поняли, что прогулку стоит отложить.', '(ПО) ВИДИМОМУ, у Ф.И. Шаляпина (В) ПЕРВЫЕ появилась возможность поднять оперную партию до высот трагедии.', '(В)ХОДЕ экспедиций специалисты составляют каталоги животных и растений, и всё ТАК(ЖЕ) берут пробы грунта, воды и воздуха.', '(В) МЕСТО Андрея с нами пошёл Ростислав, недавно приехавший в город и мечтавший увидеть ЧТО(НИБУДЬ) необыкновенное.', 'А В(ДРУГ) обитатели других галактик давно посылают нам сигналы, но мы не понимаем их, точно ТАК(ЖЕ), как они не понимают наших сигналов?'], a:[0,2], src:'Работа №1 · вопрос 13 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся СЛИТНО. Запишите номера ответов.', opts:['Самолету нужна бетонированная дорожка, ЧТО(БЫ) разбежаться, а ТАК(ЖЕ) для полета ему нужно небо.', 'ТО(ЕСТЬ) я хочу сказать, что можно встретить ученого человека с большими конкретными знаниями и В(СКОРЕ) убедиться, что он очень, в сущности, ограниченный человек.', 'Человечество прошло такую историю, что (В)ПОЛНЕ заслужило право, ЧТО(БЫ) мы -- люди -- говорили о себе и о своем пути, пройденном сквозь века, с оттенком иронии или даже юмора.', 'А ПО(МОЕМУ), Колумб, ПРИ(ТОМ) что он действительно доплыл до Америки, совершил величайшую в истории человечества мистификацию.', 'Примирение двух враждующих сторон невозможно, (В) СЛЕДСТВИЕ этого найти выход из создавшейся ситуации будет ТО(ЖЕ) непросто.'], a:[0,2,4], src:'Работа №1 · вопрос 14 · задание 14' },
    { multi:true, q:'Укажите варианты ответов, в которых все выделенные слова пишутся РАЗДЕЛЬНО. Запишите номера ответов.', opts:['(НА) КОНЕЦ раздаётся долгожданная соловьиная песня, (ИЗ) ЗА которой теряют сон лесные обитатели.', 'Во всех типографиях сказали одно и ТО(ЖЕ): стоимость работ будет зависеть (ОТ)ТОГО, какой тираж нам нужен.', 'Я не знаю, (ОТ)ЧЕГО это зависит, но огромное большинство произведений современного, да и не только современного искусства, КАК(БЫ) добротны, обстоятельны и художественны они ни были, не дотрагиваются до нерва.', 'Зажглись ёлочные гирлянды, (ОТ) ЧЕГО ТУТ(ЖЕ) возникло ощущение праздника.', 'Печень начинает работать над очищением крови от токсинов, которые появляются (ВО)ВРЕМЯ курения, вместо того, ЧТО(БЫ) выполнять свою основную функцию.'], a:[1,2], src:'Работа №1 · вопрос 15 · задание 14' },
  ],
  15: [
    { multi:true, q:'Укажите цифру(-ы), на месте которой(-ых) пишется НН. Учитесь, соотечестве(1)ики, у поэта Рубцова не проклинать жизнь, а облагораживать её уже за то, что она вам подаре(2)а свыше и живёте вы на прекрасной русской земле, среди хорошо Богом задума(3)ых людей (В.П. Астафьев).', opts:['(1)', '(2)', '(3)'], a:[0, 2], src:'Вариант 1 · задание 15' },
    { multi:true, q:'Укажите цифру(-ы), на месте которой(-ых) пишется одна буква Н. Парки в городе Пушкине це(1)ы тем, что связа(2)ы с поэзией Державина, Карамзина, Жуковского, Тютчева и многих других, а приметы пушкинского времени особе(3)о дороги нам в городе, не случайно назва(4)ом именем великого поэта.', opts:['(1)', '(2)', '(3)', '(4)'], a:[1], src:'Вариант 2 · задание 15' },
    { multi:true, q:'Укажите все цифры, на месте которых пишется НН. Наблюдения за поведением школьников велись не только в учебном классе, но и в специально созда(1)ой группе продлё(2)ого дня, в которой были организова(3)ы постоя(4)о действующие кружки.', opts:['(1)', '(2)', '(3)', '(4)'], a:[0, 1, 3], src:'Вариант 3 · задание 15' },
    { multi:true, q:'Укажите все цифры, на месте которых пишется одна буква Н. Всё в приёмной выглядело удивительно обыкнове(1)о: столы в чернильных пятнах, деревя(2)ые диваны у стен, окошечки с некраше(3)ыми подоко(4)иками, где давались справки.', opts:['(1)', '(2)', '(3)', '(4)'], a:[2], src:'Вариант 4 · задание 15' },
    { multi:true, q:'Укажите все цифры, на месте которых пишется НН. На листке альбома красовалась умышле(1)о по-детски нарисова(2)ая фигура девочки, с лицом в профиль, но с двумя глазами, с лома(3)ыми чёрточками, торчащими вместо ног из-под юбки, с растопыре(4)ыми пальцами разведё(5)ых рук.', opts:['(1)', '(2)', '(3)', '(4)', '(5)'], a:[0, 1, 3, 4], src:'Вариант 5 · задание 15' },
    { multi:true, q:'Укажите все цифры, на месте которых пишется НН. Коло(1)ада Исаакиевского собора, золочё(2)ый его купол, ико(3)стасы и скульптуры приделов – всё вызывает восхищё(4)ые восклицания посетителей.', opts:['(1)', '(2)', '(3)', '(4)'], a:[0, 3], src:'Вариант 6 · задание 15' },

    { text:true, q:'Укажите все цифры, на месте которых пишется НН.', context:'Говорят, что когда Рубинштейн дирижировал, его дли(1)ые волосы вздымались и закрывали половину лица, точно льви(2)ая грива, и он всем видом напоминал царстве(3)ого хищника.', a:['13'], src:'Работа №1 · вопрос 11 · задание 15' },

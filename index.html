/* =======================================================================
   ФОРМА ДОБАВЛЕНИЯ / РЕДАКТИРОВАНИЯ ОБРАЗЦА СОЧИНЕНИЯ
   ======================================================================= */
function modalEssaySampleEdit(){
  const isNew = STATE.sampleEditOpen === 'new';
  const existing = isNew ? null : SAMPLES.find(x => x.id === STATE.sampleEditOpen);
  const close = () => { STATE.sampleEditOpen = null; render(); };

  /* Поля */
  const inAuthor = el('input', { type:'text', placeholder:'Автор (например: София Малинина или Ученик ФИПИ #2)',
    style:{ width:'100%', padding:'10px', borderRadius:'10px', border:'1px solid var(--border-2)' }});
  if(existing && existing.author) inAuthor.value = existing.author;

  const inTitle = el('input', { type:'text', placeholder:'Тема / проблема исходного текста',
    style:{ width:'100%', padding:'10px', borderRadius:'10px', border:'1px solid var(--border-2)' }});
  if(existing && existing.title) inTitle.value = existing.title;

  const inShort = el('input', { type:'text', placeholder:'Короткое описание (одна строка): чем хороша/плоха работа',
    style:{ width:'100%', padding:'10px', borderRadius:'10px', border:'1px solid var(--border-2)' }});
  if(existing && existing.short) inShort.value = existing.short;

  const inText = el('textarea', { placeholder:'Текст работы. Поддерживается **жирный** и переводы строк.',
    style:{ width:'100%', minHeight:'180px', padding:'12px', borderRadius:'10px', border:'1px solid var(--border-2)',
            fontFamily:'inherit', fontSize:'14px', lineHeight:'1.5', resize:'vertical' }},
    existing && existing.text || '');

  /* Поля баллов К1-К10 */
  const kInputs = {};
  CRIT.forEach(c => {
    kInputs[c.id] = el('input', { type:'number', min:'0', max: String(c.max),
      style:{ width:'56px', padding:'6px', borderRadius:'8px', border:'1px solid var(--border-2)', textAlign:'center', fontWeight:'700' }});
    if(existing && existing.kBreakdown && existing.kBreakdown[c.id] != null){
      kInputs[c.id].value = existing.kBreakdown[c.id];
    } else {
      kInputs[c.id].value = c.max;
    }
  });
  const totalEl = el('span', { style:{ fontWeight:'800', fontSize:'18px' }});
  const recalcTotal = () => {
    let t = 0;
    CRIT.forEach(c => { t += +kInputs[c.id].value || 0; });
    totalEl.textContent = t + ' / 22';
  };
  CRIT.forEach(c => kInputs[c.id].addEventListener('input', recalcTotal));
  recalcTotal();

  const kBlock = el('div', { class:'card', style:{ background:'var(--surface-soft)', marginBottom:'12px' }},
    el('h4', { style:{ marginBottom:'10px' }}, '📊 Баллы по критериям'));
  ['Содержание', 'Речь', 'Грамотность'].forEach(sec => {
    kBlock.append(el('div', { style:{ fontSize:'11px', textTransform:'uppercase', letterSpacing:'.05em', color:'var(--ink-3)', fontWeight:'700', marginTop:'8px', marginBottom:'4px' }}, sec));
    const row = el('div', { style:{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(180px, 1fr))', gap:'6px' }});
    CRIT.filter(c => c.sec === sec).forEach(c => {
      row.append(el('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'6px 10px', background:'#fff', borderRadius:'8px', border:'1px solid var(--border)' }},
        el('span', { style:{ fontSize:'12px' }}, c.id + ' · max ' + c.max),
        kInputs[c.id]));
    });
    kBlock.append(row);
  });
  kBlock.append(el('div', { style:{ marginTop:'10px', textAlign:'right', fontSize:'12px', color:'var(--ink-2)' }}, 'Итого: ', totalEl));

  const inComments = el('textarea', { placeholder:'Разбор экспертов: что хорошо, что плохо, что разобрать с учениками. **Жирный** работает.',
    style:{ width:'100%', minHeight:'150px', padding:'12px', borderRadius:'10px', border:'1px solid var(--border-2)',
            fontFamily:'inherit', fontSize:'13px', lineHeight:'1.6', resize:'vertical' }},
    existing && existing.comments || '');

  /* Загрузка фото-страниц */
  const photosState = (existing && existing.photoUrls) ? existing.photoUrls.slice() : [];
  const photosEl = el('div', { style:{ display:'flex', gap:'10px', flexWrap:'wrap', marginTop:'8px' }});
  const photoStatus = el('div', { style:{ fontSize:'12px', color:'var(--ink-3)', minHeight:'18px' }}, '');
  const renderPhotos = () => {
    photosEl.innerHTML = '';
    photosState.forEach((url, idx) => {
      photosEl.append(el('div', { class:'photo-thumb' },
        el('img', { src: url }),
        el('button', { class:'x', onclick: () => { photosState.splice(idx, 1); renderPhotos(); }}, '×')));
    });
  };
  renderPhotos();
  const fileInput = el('input', { type:'file', accept:'image/*', multiple:'multiple', style:{ display:'none' }});
  fileInput.addEventListener('change', async ev => {
    const files = Array.from(ev.target.files || []);
    if(!files.length) return;
    photoStatus.textContent = '⏳ Заливаем ' + files.length + '…';
    photoStatus.style.color = 'var(--ink-3)';
    let ok = 0, fail = 0;
    for(const f of files){
      try { photosState.push(await uploadEssayPhoto(f)); ok++; renderPhotos(); }
      catch(e){ console.error(e); fail++; }
    }
    photoStatus.textContent = '✓ Загружено: ' + ok + (fail ? ' · ⚠ ' + fail : '');
    photoStatus.style.color = fail ? 'var(--red)' : 'var(--green)';
    fileInput.value = '';
  });

  const status = el('div', { style:{ fontSize:'12px', minHeight:'16px' }}, '');
  const saveBtn = el('button', { class:'btn btn-p',
    onclick: async () => {
      const author = inAuthor.value.trim();
      const title = inTitle.value.trim();
      const text = inText.value.trim();
      if(!title){ status.style.color = 'var(--red)'; status.textContent = 'Тема обязательна'; return; }
      if(!text && !photosState.length){ status.style.color = 'var(--red)'; status.textContent = 'Нужен текст или хотя бы одно фото'; return; }
      const kBreakdown = {};
      let total = 0;
      CRIT.forEach(c => { const v = +kInputs[c.id].value || 0; kBreakdown[c.id] = v; total += v; });
      const level = total >= 18 ? 'high' : total >= 12 ? 'medium' : 'low';
      const payload = {
        author_name: author || null,
        title: title,
        text: text || null,
        photo_urls: photosState.length ? photosState : null,
        score: total,
        max_score: 22,
        level: level,
        short: inShort.value.trim() || null,
        k_breakdown: kBreakdown,
        comments: inComments.value.trim() || null
      };
      saveBtn.disabled = true; status.style.color = 'var(--ink-3)'; status.textContent = '⏳ Сохраняем…';
      try {
        if(isNew){
          await restRequest('POST', '/essay_samples', payload, { prefer: 'return=minimal' });
        } else {
          await restRequest('PATCH', '/essay_samples?id=eq.' + existing.id, payload, { prefer: 'return=minimal' });
        }
        await loadEssaySamplesFromDb();
        STATE.sampleEditOpen = null;
        showToast('✓ Образец сохранён · ' + total + '/22');
        render();
      } catch(e){
        console.error(e);
        status.style.color = 'var(--red)'; status.textContent = '⚠ ' + e.message;
        saveBtn.disabled = false;
      }
    }
  }, isNew ? '✓ Создать образец' : '✓ Сохранить изменения');

  const head = el('div', { class:'modal-head' },
    el('div', null,
      el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.08em', fontWeight:'700' }},
        isNew ? 'Новый образец' : 'Редактировать образец'),
      el('h2', { style:{ marginTop:'4px' }}, isNew ? '➕ Добавить образец сочинения' : '✏️ ' + (existing.author || 'Образец'))),
    el('button', { class:'x', onclick: close }, '×'));

  const body = el('div', { class:'modal-body' },
    el('h4', null, '📝 Автор и тема'),
    el('div', { style:{ display:'flex', flexDirection:'column', gap:'8px', marginTop:'8px', marginBottom:'14px' }},
      inAuthor, inTitle, inShort),
    el('h4', null, '🖋 Текст работы'),
    el('div', { style:{ marginTop:'8px', marginBottom:'14px' }}, inText),
    el('h4', null, '📸 Фото-страницы (опционально)'),
    el('div', { style:{ marginTop:'8px', marginBottom:'14px' }},
      el('button', { class:'btn btn-secondary btn-sm', onclick: () => fileInput.click() }, '📷 Добавить фото'),
      fileInput, photoStatus, photosEl),
    kBlock,
    el('h4', null, '🎓 Разбор экспертов'),
    el('div', { style:{ marginTop:'8px' }}, inComments));

  const foot = el('div', { class:'modal-foot' },
    status,
    el('div', { style:{ display:'flex', gap:'8px' }},
      el('button', { class:'btn btn-secondary', onclick: close }, 'Отмена'),
      saveBtn));

  return el('div', { class:'modal-bg', onclick: e => { if(e.target.classList.contains('modal-bg')) close(); }},
    el('div', { class:'modal', style:{ maxWidth:'820px' }}, head, body, foot));
}

/* =======================================================================
   МОДАЛЬ ОБРАЗЦА СОЧИНЕНИЯ — текст работы + баллы К1-К10 + разбор экспертов
   ======================================================================= */
function modalEssaySample(sampleId){
  const s = SAMPLES.find(x => x.id === sampleId);
  if(!s) return null;
  const close = () => { STATE.sampleOpen = null; render(); };

  /* Список баллов по К1-К10 */
  const scoreList = el('div', { style:{ display:'flex', flexDirection:'column', gap:'6px', marginTop:'10px' }});
  if(s.kBreakdown){
    CRIT.forEach(c => {
      const v = s.kBreakdown[c.id];
      if(v == null) return;
      const sec = c.sec;
      const colorMap = { 'Содержание':'var(--p-soft)', 'Речь':'var(--y-soft)', 'Грамотность':'var(--green-soft)' };
      scoreList.append(el('div', {
        style:{ display:'flex', justifyContent:'space-between', alignItems:'center',
                padding:'10px 12px', background:colorMap[sec] || 'var(--surface-soft)', borderRadius:'10px' }
      },
        el('div', null,
          el('div', { style:{ fontWeight:'700', fontSize:'13px' }}, c.id + ' · ' + c.name),
          el('div', { style:{ fontSize:'11px', color:'var(--ink-3)' }}, sec)),
        el('div', { style:{ fontWeight:'800', fontSize:'15px' }}, v + ' / ' + c.max)));
    });
  }

  /* Markdown-рендер для разбора (поддержка **жирного** и переводов строк) */
  const renderComments = (txt) => {
    if(!txt) return null;
    let html = escHtml(txt).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
    return el('div', { html, style:{ fontSize:'13px', lineHeight:'1.6', whiteSpace:'pre-wrap' }});
  };

  const lvlClass = s.level === 'high' ? 'green' : s.level === 'medium' ? 'warn' : 'red';

  const head = el('div', { class:'modal-head' },
    el('div', null,
      el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.08em', fontWeight:'700' }},
        'Образец сочинения · ' + s.author),
      el('h2', { style:{ marginTop:'4px' }}, s.title)),
    el('button', { class:'x', onclick: close }, '×'));

  const body = el('div', { class:'modal-body' });

  /* Бэйдж балла */
  body.append(el('div', { style:{ display:'flex', gap:'8px', alignItems:'center', marginBottom:'14px', flexWrap:'wrap' }},
    chip('🐝 ' + s.score + ' / ' + s.maxScore + ' баллов', lvlClass),
    s.short ? el('span', { style:{ fontSize:'13px', color:'var(--ink-2)', flex:1, minWidth:'200px' }}, s.short) : null));

  /* Текст работы */
  if(s.text){
    body.append(el('div', { class:'card', style:{ marginBottom:'12px' }},
      el('h4', { style:{ marginBottom:'8px' }}, '📝 Текст работы'),
      el('div', { class:'essay-text', style:{ whiteSpace:'pre-wrap' }}, s.text)));
  }

  /* Фото-страницы (если есть) */
  if(s.photoUrls && s.photoUrls.length){
    body.append(el('div', { class:'card', style:{ marginBottom:'12px' }},
      el('h4', { style:{ marginBottom:'8px' }}, '📸 Сканы работы'),
      renderPhotosWithPins(s.photoUrls, [], { readonly: true })));
  }

  /* Баллы по критериям */
  if(s.kBreakdown){
    body.append(el('h4', { style:{ marginTop:'4px' }}, '📊 Баллы по критериям'), scoreList);
  }

  /* Разбор экспертов */
  if(s.comments){
    body.append(el('div', { class:'card', style:{ background:'var(--p-soft)', border:'1px solid var(--p-2)', marginTop:'14px' }},
      el('h4', null, '🎓 Разбор экспертов'),
      renderComments(s.comments)));
  }

  const foot = el('div', { class:'modal-foot' },
    el('span', { style:{ fontSize:'12px', color:'var(--ink-3)' }}, 'Учебный материал'),
    el('button', { class:'btn btn-secondary', onclick: close }, 'Закрыть'));

  return el('div', { class:'modal-bg', onclick: e => { if(e.target.classList.contains('modal-bg')) close(); }},
    el('div', { class:'modal', style:{ maxWidth:'820px' }}, head, body, foot));
}

/* =======================================================================
   МОДАЛЬ КАРТОЧКА ЗАДАНИЯ
   ======================================================================= */
function modalTheory(n){
  const t = EGE_TASKS.find(x => x.n === n);
  if(!t) return null;
  const skill = MY_SKILL[n];
  const skillLabel = skill === 'weak' ? '⚠ Слабое место' : skill === 'ok' ? '✅ Освоено' : skill === 'mid' ? '📖 В процессе' : '⌛ Не приступал';
  const skillKind  = skill === 'weak' ? 'red' : skill === 'ok' ? 'green' : skill === 'mid' ? 'warn' : 'grey';
  const mats = MATERIALS.filter(m => m.taskN === n);
  const hasQuiz = bankFor(n).length > 0;

  return el('div', { class:'modal-bg',
    onclick: e => { if(e.target.classList.contains('modal-bg')){ STATE.theoryOpen = null; render(); }}
  },
    el('div', { class:'modal', style:{ maxWidth:'700px' }},
      el('div', { class:'modal-head' },
        el('div', null,
          el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.08em', fontWeight:'700' }},
            'Задание ' + n + ' · День ' + t.day),
          el('h2', null, t.topic)),
        el('button', { class:'x',
          onclick: () => { STATE.theoryOpen = null; render(); }
        }, '×')),
      el('div', { class:'modal-body' },
        el('div', { style:{ marginBottom:'14px' }}, chip(skillLabel, skillKind)),
        (function(){
          const card = el('div', { class:'card theory-md', style:{ marginBottom:'14px', background:'var(--surface-soft)' }},
            el('h4', null, '📖 ' + t.topic));
          const md = THEORY[n];
          if(md && md.trim()){
            const body = el('div', { style:{ marginTop:'8px', lineHeight:'1.55', color:'var(--ink)' }});
            try {
              body.innerHTML = window.marked ? window.marked.parse(md) : ('<pre>' + md.replace(/</g, '&lt;') + '</pre>');
            } catch(e){ body.textContent = md; }
            card.append(body);
          } else {
            card.append(el('p', { style:{ color:'var(--ink-2)', marginTop:'6px' }},
              'Здесь будет краткая теория от Ольги Александровны — выжимка, формулы и подводные камни.'));
          }
          return card;
        })(),
        mats.length > 0 ? el('div', { class:'card', style:{ marginBottom:'14px' }},
          el('h4', null, '📎 Материалы по этому заданию'),
          el('div', { style:{ marginTop:'10px', display:'flex', flexDirection:'column', gap:'6px' }},
            mats.map(m => {
              const icon = m.external_url ? '🔗' : '📎';
              const url = materialOpenUrl(m);
              return el('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 12px', background:'var(--bg)', borderRadius:'8px', gap:'8px' }},
                el('span', { style:{ flex:'1', minWidth:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }},
                  icon + ' ' + m.name,
                  m.size ? el('span', { style:{ fontSize:'11px', color:'var(--ink-3)', marginLeft:'6px' }}, ' · ' + m.size) : null),
                el('a', { href: url, target:'_blank', rel:'noopener', class:'btn btn-secondary btn-sm', style:{ textDecoration:'none' }},
                  m.external_url ? 'Открыть ↗' : 'Открыть'));
            }))) : null,
        hasQuiz ? (function(){
          const bankN = bankFor(n).length;
          const startWithLimit = (limit) => {
            STATE.testOpen = n;
            STATE.testAnswers = {};
            STATE.testChecked = false;
            STATE.testShuffle = null;
            STATE.testLimit = limit;          // null = «все»; иначе число
            STATE.shuffledBank = null;
            STATE.theoryOpen = null;
            render();
          };
          const wordQ = (k) => ruPlural(k, 'вопрос', 'вопроса', 'вопросов');
          return el('div', { class:'card', style:{ marginBottom:'14px', background:'var(--y-soft)', border:'1px solid var(--y-2)' }},
            el('h4', null, '🎯 Тренажёр'),
            el('p', { style:{ color:'var(--ink-2)', marginTop:'4px', marginBottom:'10px' }},
              'В банке ' + bankN + ' ' + wordQ(bankN) + '. Сколько хочешь решить? Пчёлки идут за каждый верный ответ.'),
            el('div', { style:{ display:'flex', gap:'8px', flexWrap:'wrap' }},
              /* 5 случайных */
              bankN >= 5 ? el('button', { class:'btn btn-y',
                onclick: () => startWithLimit(5)
              }, '🎯 5 вопросов') : null,
              /* 10 случайных */
              bankN >= 10 ? el('button', { class:'btn btn-y',
                onclick: () => startWithLimit(10)
              }, '🎯 10 вопросов') : null,
              /* Все вопросы */
              el('button', { class: bankN < 5 ? 'btn btn-y' : 'btn btn-secondary',
                onclick: () => startWithLimit(null)
              }, '⚡ Все ' + bankN + ' ' + wordQ(bankN)),
              /* Дополнительный режим только для паронимов (задание 5) */
              n === 5 ? el('button', { class:'btn btn-p',
                onclick: () => { STATE.testOpen = 5; STATE.testAnswers = {}; STATE.testChecked = false; STATE.testShuffle = 10; STATE.testLimit = null; STATE.shuffledBank = null; STATE.theoryOpen = null; render(); }
              }, '🎲 10 случайных пар') : null,
              n === 5 ? el('button', { class:'btn btn-secondary',
                onclick: () => { STATE.testOpen = 5; STATE.testAnswers = {}; STATE.testChecked = false; STATE.testShuffle = 5; STATE.testLimit = null; STATE.shuffledBank = null; STATE.theoryOpen = null; render(); }
              }, '🎲 Быстрые 5 пар') : null));
        })() : null,
        (function(){
          const cache = STATE.attemptsByTask || (STATE.attemptsByTask = {});
          let list = cache[n];
          /* Если кэша нет — стартуем подгрузку и просим перерендер */
          if(list === undefined && sb && MY_PROFILE){
            cache[n] = null;  /* «грузится», чтобы не запускать второй раз */
            list = null;       /* и в локальную переменную тоже, иначе при first render будет undefined */
            loadMyAttempts(n).then(arr => { cache[n] = arr; render(); });
          }
          const card = el('div', { class:'card', style:{ background:'var(--p-soft)' }},
            el('h4', null, '📊 Мои попытки'));
          if(!sb || !MY_PROFILE){
            card.append(el('p', { style:{ color:'var(--ink-2)', marginTop:'4px' }},
              'Войди через почту, чтобы попытки сохранялись и складывались в историю.'));
            return card;
          }
          if(list == null){            /* и null, и undefined */
            card.append(el('p', { style:{ color:'var(--ink-3)', marginTop:'4px', fontSize:'13px' }}, '⏳ Загружаем историю…'));
            return card;
          }
          if(!list.length){
            card.append(el('p', { style:{ color:'var(--ink-2)', marginTop:'4px' }}, 'Ещё не приступала к этому заданию. Жми «🎯 5 вопросов» — попытка попадёт сюда.'));
            return card;
          }
          /* Среднее по попыткам */
          const totalScore = list.reduce((a, x) => a + (x.score || 0), 0);
          const totalMax = list.reduce((a, x) => a + (x.max_score || 0), 0);
          const avgPct = totalMax ? Math.round(totalScore / totalMax * 100) : 0;
          card.append(el('div', { style:{ display:'flex', gap:'14px', alignItems:'center', flexWrap:'wrap', marginTop:'6px', marginBottom:'10px' }},
            el('div', null,
              el('div', { style:{ fontSize:'10px', color:'var(--ink-3)', textTransform:'uppercase', fontWeight:'700' }}, 'Среднее'),
              el('div', { style:{ fontSize:'22px', fontWeight:'800' }}, avgPct + '%')),
            el('div', null,
              el('div', { style:{ fontSize:'10px', color:'var(--ink-3)', textTransform:'uppercase', fontWeight:'700' }}, 'Попыток'),
              el('div', { style:{ fontSize:'22px', fontWeight:'800' }}, list.length))));
          /* Список последних 5 */
          const fmt = ts => {
            const d = new Date(ts);
            const today = new Date(); today.setHours(0,0,0,0);
            const dStart = new Date(d); dStart.setHours(0,0,0,0);
            const diff = Math.floor((today - dStart) / 86400000);
            const t = d.toTimeString().slice(0,5);
            if(diff === 0) return 'сегодня в ' + t;
            if(diff === 1) return 'вчера в ' + t;
            return d.toLocaleDateString('ru-RU', { day:'numeric', month:'short' }) + ' в ' + t;
          };
          list.slice(0, 5).forEach(a => {
            const pct = a.max_score ? Math.round(a.score / a.max_score * 100) : 0;
            card.append(el('div', { style:{ display:'flex', justifyContent:'space-between', padding:'8px 12px', background:'#fff', borderRadius:'8px', marginTop:'6px', fontSize:'13px' }},
              el('span', null, fmt(a.created_at)),
              el('span', { style:{ fontWeight:'700' }}, a.score + '/' + a.max_score + ' · ' + pct + '%')));
          });
          if(list.length > 5){
            card.append(el('div', { style:{ marginTop:'6px', fontSize:'11px', color:'var(--ink-3)', textAlign:'center' }},
              '…и ещё ' + (list.length - 5)));
          }
          return card;
        })()),
      el('div', { class:'modal-foot' },
        el('span', { style:{ fontSize:'12px', color:'var(--ink-2)' }},
          'Карточка задания ' + n),
        el('button', { class:'btn btn-secondary',
          onclick: () => { STATE.theoryOpen = null; render(); }
        }, 'Закрыть'))));
}

/* =======================================================================
   МОДАЛЬ ТРЕНАЖЁРА
   ======================================================================= */
function modalTest(taskN){
  /* Три режима банка:
     1. testShuffle — случайные пары паронимов (только задание 5)
     2. testLimit — N случайных вопросов из QUIZ_BANK[taskN]
     3. иначе — весь банк по заданию */
  let bank;
  if(STATE.testShuffle){
    if(!STATE.shuffledBank){
      STATE.shuffledBank = buildShuffledParonymBank(STATE.testShuffle);
    }
    bank = STATE.shuffledBank;
  } else if(STATE.testLimit != null){
    if(!STATE.shuffledBank){
      STATE.shuffledBank = buildLimitedBank(taskN, STATE.testLimit);
    }
    bank = STATE.shuffledBank;
  } else {
    bank = bankFor(taskN);
  }
  if(!bank) return null;

  /* Все ли вопросы получили ответ? */
  const isAnswered = (q, i) => {
    const ans = STATE.testAnswers[i];
    if(q.fillNn){
      return Array.isArray(ans) && ans.length === q.correct.length && ans.every(v => v === 'Н' || v === 'НН');
    }
    if(q.match){
      return ans && q.errors.every((_, k) => ans[k] != null && ans[k] !== '');
    }
    if(q.text) return ans != null && String(ans).trim().length > 0;
    if(q.multi) return Array.isArray(ans) && ans.length > 0;
    return ans != null;
  };
  const allAnswered = bank.every(isAnswered);
  /* Показываем результат только после нажатия «Проверить» */
  const all = STATE.testChecked;

  /* Правильно ли отвечено? */
  const isCorrect = (q, i) => {
    const ans = STATE.testAnswers[i];
    if(q.fillNn){
      if(!Array.isArray(ans)) return false;
      return ans.length === q.correct.length && ans.every((v, k) => v === q.correct[k]);
    }
    if(q.match){
      const seq = q.errors.map((_, k) => (ans && ans[k]) || '_').join('');
      return seq === q.a;
    }
    if(q.text){
      const accept = Array.isArray(q.a) ? q.a : [q.a];
      const norm = String(ans || '').trim().toLowerCase();
      return accept.some(a => String(a).toLowerCase() === norm);
    }
    if(q.multi){
      const sel = Array.isArray(ans) ? ans.slice().sort() : [];
      const exp = q.a.slice().sort();
      return sel.length === exp.length && sel.every((v, k) => v === exp[k]);
    }
    return ans === q.a;
  };
  const correct = bank.filter(isCorrect).length;

  /* Минимальный inline-markdown: **жирный** + HTML-escape.
     Используем для sourceText / sentences / errors / context, где встречаются
     выделения букв и слов из оригинального сборника. */
  const renderInlineMd = (text) => {
    if(!text) return '';
    return String(text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*\s][^*]*?[^*\s]|[^*\s])\*/g, '<em>$1</em>');
  };
  /* CAPS-слова на 3+ буквы кириллицей подсвечиваем жёлтым (наследие из вариантов
     с задания 5) — это поведение оставляем для задания 5. Для остальных полагаемся
     на **bold** в самих данных. */
  /* Минимум 2 буквы — чтобы подсвечивались короткие местоимения ЕЁ, ИХ, ЕМУ. */
  const highlightCaps = (htmlSafe) => htmlSafe.replace(
    /([А-ЯЁ]{2,})/g, '<b style="background:#FEF9C3;padding:1px 4px;border-radius:3px">$1</b>'
  );

  const body = el('div', { class:'modal-body' });
  bank.forEach((q, i) => {
    const block = el('div', { style:{ marginBottom:'18px', padding:'16px', border:'1px solid var(--border)', borderRadius:'14px', background:'var(--surface-soft)' }});
    block.append(el('div', { style:{ fontWeight:'700', marginBottom:'10px' }}, (i+1) + '. ' + q.q));

    /* Задание 22: формат как в задании 8 — предложения А-Д уже в q.errors,
       большой исходный текст не нужен и только мешает. Прячем его. */
    if(q.sourceText && taskN !== 22){
      const srcBox = el('details', { style:{ padding:'12px 14px', background:'#FFFCF2', borderRadius:'10px', borderLeft:'3px solid var(--y)', marginBottom:'12px', fontSize:'13px', lineHeight:'1.6', color:'var(--ink)' }});
      srcBox.append(
        el('summary', { style:{ cursor:'pointer', fontWeight:'700', color:'var(--ink-2)', fontSize:'12px', textTransform:'uppercase', letterSpacing:'.06em', marginBottom:'8px', listStyle:'none' }},
          '📖 Прочитайте текст и выполните задание ▾'),
        el('div', { html: highlightCaps(renderInlineMd(q.sourceText)), style:{ marginTop:'10px', whiteSpace:'pre-wrap' }}));
      srcBox.setAttribute('open', '');
      block.append(srcBox);
    }
    if(q.context){
      block.append(el('div', { html: renderInlineMd(q.context), style:{ padding:'10px 12px', background:'#fff', borderRadius:'8px', borderLeft:'3px solid var(--p)', marginBottom:'10px', fontSize:'13px', fontStyle:'italic', color:'var(--ink-2)' }}));
    }

    if(q.pair && q.word){
      block.append(el('div', { style:{ textAlign:'center', padding:'18px', background:'linear-gradient(135deg, #FEF9C3, #FDE68A)', borderRadius:'12px', marginBottom:'10px', border:'1px solid var(--y-2)' }},
        el('div', { style:{ fontSize:'10px', color:'#854D0E', textTransform:'uppercase', fontWeight:'700', marginBottom:'6px', letterSpacing:'.08em' }}, '🔁 Слово'),
        el('div', { style:{ fontSize:'28px', fontWeight:'800', letterSpacing:'-.02em', color:'var(--ink)' }}, q.word),
        el('div', { style:{ fontSize:'11px', color:'#854D0E', marginTop:'6px' }}, '↓ напишите его пароним')));
    }

    if(q.sentences && !q.match){
      /* Это блок sentences для задания 5 (паронимы и подобное) — НЕ для match-вопросов.
         Match-вопросы используют q.sentences внутри своей таблицы ниже. */
      const sentList = el('div', { style:{ marginBottom:'12px', display:'flex', flexDirection:'column', gap:'6px' }});
      q.sentences.forEach((s, si) => {
        /* Сначала markdown (**жирный**), потом подсветка CAPS-слов жёлтым */
        const html = highlightCaps(renderInlineMd(s));
        sentList.append(el('div', {
          html: '<span style="color:var(--ink-3);font-size:11px;font-weight:700;margin-right:6px">' + (si+1) + ')</span>' + html,
          style:{ padding:'8px 12px', background:'#fff', borderRadius:'8px', borderLeft:'3px solid var(--p-2)', fontSize:'13px', lineHeight:'1.5' }
        }));
      });
      block.append(sentList);
    }

    if(q.multi){
      block.append(el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', marginBottom:'8px' }},
        '☑ Выберите ВСЕ верные варианты'));
    }

    if(q.fillNn){
      const ans = Array.isArray(STATE.testAnswers[i]) ? STATE.testAnswers[i] : new Array(q.correct.length).fill(null);
      const pieces = q.text.split(/\(\d+\)/);
      const wrap = el('div', { style:{ padding:'14px 16px', background:'#FFFCF2', borderRadius:'10px', fontSize:'15px', lineHeight:'2.4', border:'1px solid var(--border)' }});

      pieces.forEach((piece, idx) => {
        wrap.append(document.createTextNode(piece));
        if(idx < q.correct.length){
          const sel = ans[idx];           // null | 'Н' | 'НН'
          const correct = q.correct[idx];
          const showResult = all;
          const isRight = sel === correct;

          /* Стилизация в зависимости от состояния */
          let letterColor = sel ? '#0F766E' : 'var(--ink-3)'; // teal-700 для выбранного
          let bg = '#fff', borderC = 'var(--border-2)';
          if(showResult){
            if(isRight){ bg = '#D1FAE5'; borderC = 'var(--green)'; letterColor = '#065F46'; }
            else { bg = '#FECACA'; borderC = 'var(--red)'; letterColor = '#991B1B'; }
          }

          /* Содержимое: текущая буква (или пусто) + номер в скобках */
          const innerText = sel ? sel : '   ';   // 3 неразрывных пробела как «пусто»
          const btn = el('button', {
            style:{
              display:'inline-block',
              minWidth: sel === 'НН' ? '34px' : '24px',
              padding:'2px 6px',
              fontSize:'15px', fontWeight:'700',
              color: letterColor,
              background: bg,
              border:'1px solid '+borderC,
              borderRadius:'6px',
              cursor: showResult ? 'default' : 'pointer',
              lineHeight:'1.3',
              margin:'0 2px',
              verticalAlign:'baseline',
              borderBottom: sel ? '1px solid '+borderC : '2px dashed '+borderC
            },
            disabled: showResult || undefined,
            onclick: () => {
              if(showResult) return;
              const cur = Array.isArray(STATE.testAnswers[i]) ? STATE.testAnswers[i].slice() : new Array(q.correct.length).fill(null);
              /* Цикл: null → Н → НН → null */
              const next = cur[idx] == null ? 'Н' : cur[idx] === 'Н' ? 'НН' : null;
              cur[idx] = next;
              STATE.testAnswers[i] = cur;
              render();
            }
          }, innerText);
          wrap.append(btn);
          /* Номерок (1), (2)... с пометкой результата если уже проверено */
          wrap.append(el('span', { style:{ fontSize:'11px', color: showResult ? (isRight ? 'var(--green)' : 'var(--red)') : 'var(--ink-3)', fontWeight:'700', verticalAlign:'super', margin:'0 2px' }},
            '(' + (idx+1) + (showResult ? (isRight ? ' ✓' : ' → '+correct) : '') + ')'));
        }
      });

      block.append(wrap);
      block.append(el('div', { style:{ marginTop:'8px', fontSize:'11px', color:'var(--ink-3)' }},
        '💡 Кликайте на пустое место: переключается Н → НН → пусто'));

      if(all){
        const ok = isCorrect(q, i);
        block.append(el('div', { style:{ marginTop:'10px', fontSize:'12px', color: ok ? 'var(--green)' : 'var(--red)' }},
          ok ? '✓ Все позиции правильно' : '✗ Правильно: ' + q.correct.map((c, k) => (k+1) + ') ' + c).join(', ')));
        if(q.hint){
          block.append(el('div', { style:{ marginTop:'6px', padding:'8px 10px', background:'var(--p-soft)', borderRadius:'8px', fontSize:'12px', color:'var(--p-deep)' }},
            '💡 ' + q.hint));
        }
      }
    } else if(q.match){
      const ans = STATE.testAnswers[i] || {};
      const ok = all && isCorrect(q, i);
      const grid = el('div', { style:{ display:'grid', gridTemplateColumns:'minmax(0,1fr) minmax(0,1.4fr)', gap:'18px', alignItems:'flex-start' }});
      /* Левая колонка: ошибки А-Д с селектами */
      const leftCol = el('div', null);
      leftCol.append(el('div', { style:{ fontSize:'11px', textTransform:'uppercase', color:'var(--ink-3)', fontWeight:'700', letterSpacing:'.08em', marginBottom:'10px' }}, q.leftLabel || 'Грамматические ошибки'));
      q.errors.forEach((errText, ei) => {
        const sel = (ans[ei] != null && ans[ei] !== '') ? ans[ei] : '';
        const expected = q.a[ei];
        let bg = '#fff', border = 'var(--border-2)';
        if(all){
          if(String(sel) === String(expected)){ bg = 'var(--green-soft)'; border = 'var(--green)'; }
          else { bg = 'var(--red-soft)'; border = 'var(--red)'; }
        }
        const row = el('div', { style:{ display:'flex', alignItems:'center', gap:'10px', marginBottom:'10px', padding:'8px', background:bg, border:'1px solid '+border, borderRadius:'10px' }});
        const select = el('select', {
          disabled: all || undefined,
          style:{ padding:'6px 8px', fontWeight:'700', fontSize:'14px', minWidth:'56px', borderRadius:'8px', border:'1px solid var(--border-2)' },
          onchange: ev => {
            const cur = Object.assign({}, STATE.testAnswers[i] || {});
            cur[ei] = ev.target.value;
            STATE.testAnswers[i] = cur;
          }
        });
        select.append(el('option', { value:'' }, '—'));
        for(let s=1; s<=q.sentences.length; s++){
          const opt = el('option', { value: String(s) }, String(s));
          if(String(sel) === String(s)) opt.setAttribute('selected', 'selected');
          select.append(opt);
        }
        row.append(select);
        row.append(el('div', { html: renderInlineMd(errText), style:{ fontSize:'13px', flex:1, lineHeight:'1.4' }}));
        if(all){
          row.append(el('span', { style:{ fontSize:'11px', color: String(sel) === String(expected) ? 'var(--green)' : 'var(--red)', fontWeight:'700' }},
            String(sel) === String(expected) ? '✓' : '→ '+expected));
        }
        leftCol.append(row);
      });
      grid.append(leftCol);

      /* Правая колонка: список предложений */
      const rightCol = el('div', null);
      rightCol.append(el('div', { style:{ fontSize:'11px', textTransform:'uppercase', color:'var(--ink-3)', fontWeight:'700', letterSpacing:'.08em', marginBottom:'10px' }}, q.rightLabel || 'Предложения'));
      q.sentences.forEach((s, si) => {
        rightCol.append(el('div', { style:{ display:'flex', gap:'10px', padding:'8px 10px', background:'#fff', borderRadius:'8px', marginBottom:'6px', fontSize:'13px', lineHeight:'1.4' }},
          el('b', { style:{ color:'var(--p)', minWidth:'18px' }}, (si+1) + ')'),
          el('div', { html: renderInlineMd(s), style:{ flex:1 }})));
      });
      grid.append(rightCol);
      block.append(grid);

      if(all && q.hint){
        block.append(el('div', { style:{ marginTop:'12px', padding:'10px 12px', background:'var(--p-soft)', borderRadius:'8px', fontSize:'12px', color:'var(--p-deep)' }},
          '💡 ' + q.hint));
      }
    } else if(q.text){
      const ans = STATE.testAnswers[i];
      const ok = all && isCorrect(q, i);
      const bad = all && !ok;
      block.append(el('input', {
        type:'text', placeholder:'Введите ответ…', value: ans || '',
        disabled: all || undefined,
        style:{ width:'100%', padding:'10px 14px', borderRadius:'10px', fontSize:'14px',
                border: '2px solid ' + (ok ? 'var(--green)' : bad ? 'var(--red)' : 'var(--border-2)'),
                background: ok ? 'var(--green-soft)' : bad ? 'var(--red-soft)' : 'var(--surface)' },
        oninput: ev => { STATE.testAnswers[i] = ev.target.value; }
      }));
      if(all){
        const accept = Array.isArray(q.a) ? q.a : [q.a];
        block.append(el('div', { style:{ marginTop:'8px', fontSize:'12px', color: ok ? 'var(--green)' : 'var(--red)' }},
          ok ? '✓ Верно' : '✗ Правильный ответ: ' + accept[0]));
        if(q.hint){
          block.append(el('div', { style:{ marginTop:'6px', padding:'8px 10px', background:'var(--p-soft)', borderRadius:'8px', fontSize:'12px', color:'var(--p-deep)' }},
            '💡 ' + q.hint));
        }
      }
    } else {
      const opts = el('div', { style:{ display:'flex', flexDirection:'column', gap:'6px' }});
      q.opts.forEach((opt, idx) => {
        const ans = STATE.testAnswers[i];
        const sel = q.multi ? (Array.isArray(ans) && ans.includes(idx)) : ans === idx;
        const isRight = q.multi ? q.a.includes(idx) : idx === q.a;
        let bg = 'var(--surface)', color = 'var(--ink)', border = '1px solid var(--border-2)';
        let mark = '';   /* подсказка справа: ✓ или ✗ или «пропустила» */
        if(all){
          if(q.multi){
            /* Различаем 4 случая, чтобы было видно, что именно ученик выбрал */
            if(sel && isRight){ bg='var(--green-soft)'; color='#065F46'; border='1px solid var(--green)'; mark = '✓'; }
            else if(sel && !isRight){ bg='var(--red-soft)'; color='#991B1B'; border='1px solid var(--red)'; mark = '✗'; }
            else if(!sel && isRight){ bg='var(--y-soft)'; color='#854D0E'; border='1px dashed var(--y)'; mark = 'пропущено'; }
            /* !sel && !isRight — нейтрально (правильно не выбрала), оставляем как есть */
          } else {
            /* single: правильный = зелёный, выбранный неправильный = красный */
            if(isRight){ bg='var(--green-soft)'; color='#065F46'; border='1px solid var(--green)'; }
            else if(sel){ bg='var(--red-soft)'; color='#991B1B'; border='1px solid var(--red)'; }
          }
        } else if(sel){ bg='var(--y-soft)'; color='var(--ink)'; border='1px solid var(--y)'; }
        opts.append(el('button', {
          style:{ padding:'10px 14px', textAlign:'left', borderRadius:'10px', background:bg, color:color, border:border, fontWeight:'600', display:'flex', alignItems:'center', gap:'10px' },
          onclick: () => {
            if(all) return;
            if(q.multi){
              const cur = Array.isArray(STATE.testAnswers[i]) ? STATE.testAnswers[i].slice() : [];
              const k = cur.indexOf(idx);
              if(k >= 0) cur.splice(k, 1);
              else cur.push(idx);
              STATE.testAnswers[i] = cur;
            } else {
              STATE.testAnswers[i] = idx;
            }
            render();
          }
        }, q.multi ? (sel ? '☑' : '☐') : (sel ? '●' : '○'), (idx + 1) + ') ' + opt,
          mark ? el('span', { style:{ marginLeft:'auto', fontSize: mark === 'пропущено' ? '11px' : '15px', fontWeight:'700', textTransform: mark === 'пропущено' ? 'uppercase' : 'none', letterSpacing: mark === 'пропущено' ? '.04em' : '0' }}, mark) : null));
      });
      block.append(opts);
    }

    if(q.src){
      block.append(el('div', { style:{ marginTop:'8px', fontSize:'10px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.06em', fontWeight:'700' }},
        '📚 ' + q.src));
    }
    body.append(block);
  });

  return el('div', { class:'modal-bg',
    onclick: e => { if(e.target.classList.contains('modal-bg')){ STATE.testOpen = null; STATE.testAnswers = {}; STATE.testChecked = false; STATE.testShuffle = null; STATE.testLimit = null; STATE.shuffledBank = null; render(); }}
  },
    el('div', { class:'modal', style:{ maxWidth:'700px' }},
      el('div', { class:'modal-head' },
        el('div', null,
          el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.08em', fontWeight:'700' }},
            '⚡ Тренажёр · автопроверка · задание ' + taskN +
            (STATE.testLimit != null ? ' · ' + bank.length + ' вопр.' : '')),
          el('h2', { style:{ marginTop:'4px' }},
            (EGE_TASKS.find(t => t.n === taskN) || {}).topic || 'Разминка')),
        el('button', { class:'x',
          onclick: () => { STATE.testOpen = null; STATE.testAnswers = {}; STATE.testChecked = false; STATE.testShuffle = null; STATE.testLimit = null; STATE.shuffledBank = null; render(); }
        }, '×')),
      body,
      el('div', { class:'modal-foot' },
        el('span', { style:{ fontSize:'13px', color:'var(--ink-2)' }},
          STATE.testChecked
            ? '🎉 Готово · ' + correct + ' из ' + bank.length + ' · попытка записана'
            : (allAnswered ? '✓ Все ответы заполнены — нажмите «Проверить»' : 'Заполните все вопросы')),
        el('div', { style:{ display:'flex', gap:'8px', flexWrap:'wrap' }},
          STATE.testChecked
            ? el('button', { class:'btn btn-secondary',
                onclick: () => {
                  STATE.testAnswers = {};
                  STATE.testChecked = false;
                  /* В любом режиме случайной выборки — пересобрать подборку */
                  if(STATE.testShuffle || STATE.testLimit != null) STATE.shuffledBank = null;
                  render();
                }
              }, '↻ Пройти ещё раз')
            : null,
          STATE.testChecked
            ? el('button', { class:'btn btn-y',
                onclick: async () => {
                  const beeEarned = correct * 2;
                  ME_STUDENT.bee += beeEarned;          /* мгновенный фидбек в UI */
                  /* Сохраняем попытку в БД (если онлайн с реальным профилем). Не блокируем UI ошибкой. */
                  try {
                    await saveAttempt({
                      taskN, bank,
                      getUser: i => STATE.testAnswers[i] ?? null,
                      isCorrect, beeEarned,
                      limit: STATE.testLimit, shuffled: STATE.testShuffle
                    });
                  } catch(e){ console.warn(e); }
                  /* Сбрасываем кэш истории попыток, чтобы при след. открытии перечитать.
                     Именно delete (а не = null), иначе условие подгрузки `list === undefined`
                     не сработает и блок «Мои попытки» зависнет на «Загружаем…». */
                  if(STATE.attemptsByTask) delete STATE.attemptsByTask[taskN];
                  STATE.testOpen = null;
                  STATE.testAnswers = {};
                  STATE.testChecked = false;
                  STATE.testShuffle = null;
                  STATE.testLimit = null;
                  STATE.shuffledBank = null;
                  showToast('Сохранено · +' + beeEarned + ' 🐝 на счёт');
                  render();
                }
              }, 'Сохранить и закрыть')
            : el('button', { class:'btn btn-p',
                onclick: () => {
                  /* Берём свежее состояние — на случай если ввод текста не вызвал ререндер */
                  const allNow = bank.every(isAnswered);
                  if(!allNow){ showToast('Заполните все вопросы'); return; }
                  STATE.testChecked = true; render();
                }
              }, '✓ Проверить')))));
}

        el('button', { class:'btn btn-primary',
          onclick: () => { STATE.teacherTab = 'students'; render(); }
        }, 'Открыть →'))));
  }

  if(preCheckedEssays > 0){
    wrap.append(el('div', { class:'card', style:{ marginBottom:'18px', background:'var(--teal-soft)', border:'1px solid #5EEAD4' }},
      el('div', { style:{ display:'flex', alignItems:'center', gap:'14px', flexWrap:'wrap' }},
        el('span', { style:{ fontSize:'28px' }}, '🤝'),
        el('div', { style:{ flex:1, minWidth:'200px' }},
          el('h3', null, preCheckedEssays + ' сочинений ждут вашего подтверждения'),
          el('div', { style:{ fontSize:'13px', color:'var(--ink-2)' }},
            'Кураторы проверили предварительно. Просмотрите и опубликуйте.')),
        el('button', { class:'btn btn-teal',
          onclick: () => { STATE.teacherTab = 'essays'; render(); }
        }, 'Открыть →'))));
  }

  const kpiRow = el('div', { class:'grid grid-4' });
  kpiRow.append(
    kpiCard('Учеников', total,
      STUDENTS.filter(s => s.type === 'свой').length + ' своих · ' + STUDENTS.filter(s => s.type === 'гость').length + ' гостей',
      '👥', 'var(--p-soft)'),
    kpiCard('Активны сегодня', activeCount,
      '↑ ' + Math.round(activeCount / total * 100) + '% от группы', '✅', 'var(--green-soft)'),
    kpiCard('Средний балл', '78%', '↑ +4% к вчера', '🎯', '#FFEDD5'),
    el('div', { class:'card kpi card-pink' },
      el('div', { class:'ic-box', style:{ background:'rgba(239,68,68,.18)' }}, '⚠️'),
      el('div', { class:'label' }, 'Не приступали'),
      el('div', { class:'value' }, notStarted),
      el('div', { class:'hint' }, 'стоит написать')));
  wrap.append(kpiRow);
  wrap.append(el('div', { style:{ height:'18px' }}));

  /* Посещаемость + слабые места + сочинения */
  const row = el('div', { class:'grid grid-2' });

function essayRow(e, isCurator){
  let stChip;
  if(e.status === 'new' || e.status === 'submitted') stChip = chip('новое', 'red');
  else if(e.status === 'in_progress') stChip = chip('в работе', 'warn');
  else if(e.status === 'pre_checked') stChip = chip('🤝 куратор: ' + (e.preScore != null ? e.preScore + '/22' : 'проверено'), 'teal');
  else stChip = chip('✓ ' + (e.finalScore != null ? e.finalScore + '/22' : 'готово'), 'green');

  /* Превью: для реальных DB-сочинений берём первые 80 символов body_text;
     для фото-работ — спецметка; для моков — text + when. */
  let preview;
  if(e.format === 'photo'){
    preview = '📸 фото-работа · ' + (e.photoUrls || []).length + ' стр.';
  } else if(e.text && e.text.length > 60){
    preview = e.text.slice(0, 80).replace(/\s+/g, ' ') + '…';
  } else {
    preview = e.text || '';
  }
  /* Дата сдачи: реальная из submittedAt или мок-«2 ч. назад» */
  let when = '';
  if(e.submittedAt){
    const d = new Date(e.submittedAt);
    const today = new Date(); today.setHours(0,0,0,0);
    const dStart = new Date(d); dStart.setHours(0,0,0,0);
    const diff = Math.floor((today - dStart) / 86400000);
    const t = d.toTimeString().slice(0,5);
    if(diff === 0) when = 'сегодня в ' + t;
    else if(diff === 1) when = 'вчера в ' + t;
    else when = d.toLocaleDateString('ru-RU', { day:'numeric', month:'short' }) + ' в ' + t;
  } else if(e.when){
    when = e.when;
  }

  /* Пометка про <150 слов */
  let wcWarn = null;
  if(e.wordCount != null){
    if(e.wordCount < 150){
      wcWarn = el('span', { style:{ color:'var(--red)', fontWeight:'700', fontSize:'11px' }}, '⚠ ' + e.wordCount + ' слов');
    } else {
      wcWarn = el('span', { style:{ color:'var(--ink-3)', fontSize:'11px' }}, '🐝 ' + e.wordCount + ' слов');
    }
  }

  const openReview = async () => {
    STATE.essayOpen = e.id;
    STATE.essayBy = isCurator ? 'curator' : 'teacher';
    STATE.scoresK = {};
    STATE.errors = {};
    STATE.essayComment = '';
    if(typeof e.id === 'number' && sb){
      try {
        const [r, cmts] = await Promise.all([loadEssayReview(e.id), loadEssayComments(e.id)]);
        if(r){
          ['k1','k2','k3','k4','k5','k6','k7','k8','k9','k10'].forEach(k => {
            if(r[k] != null) STATE.scoresK[k.toUpperCase()] = r[k];
          });
          ['k7_errors','k8_errors','k9_errors','k10_errors'].forEach(k => {
            if(r[k] != null) STATE.errors[k.replace('_errors','').toUpperCase()] = r[k];
          });
          if(r.general_comment) STATE.essayComment = r.general_comment;
          if(r.voice_url) STATE.essayVoiceUrl = r.voice_url;
        }
        e.comments = cmts;
        ESSAY_COMMENTS_CACHE[e.id] = cmts;
      } catch(err){ console.warn(err); }
    }
    render();
  };
  /* Только для проверенных работ — показ как у ученика */
  const canPreviewAsStudent = e.status === 'done' || e.status === 'pre_checked';

  return el('div', {
    class:'card',
    style:{ background:'var(--surface-soft)', padding:'12px 14px', cursor:'pointer', display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px', gap:'10px' },
    onclick: openReview
  },
    el('div', { style:{ display:'flex', gap:'10px', alignItems:'center', minWidth:0, flex:1 }},
      el('span', { style:{ fontSize:'20px' }}, '📝'),
      el('div', { style:{ minWidth:0, flex:1 }},
        el('div', { style:{ fontWeight:'700', display:'flex', gap:'8px', alignItems:'center', flexWrap:'wrap' }},
          e.studentName,
          wcWarn),
        el('div', { style:{ fontSize:'12px', color:'var(--ink-2)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }},
          preview + (when ? ' · ' + when : '') + (e.preBy ? ' · 🤝 София: ' + e.preScore + '/22' : '')))),
    el('div', { style:{ display:'flex', gap:'6px', alignItems:'center' }},
      stChip,
      canPreviewAsStudent
        ? el('button', { class:'btn-icon', title:'Посмотреть как ученик',
            style:{ background:'var(--p-soft)', color:'var(--p)' },
            onclick: async (ev) => {
              ev.stopPropagation();
              if(typeof e.id === 'number' && sb && !ESSAY_COMMENTS_CACHE[e.id]){
                try {
                  const arr = await loadEssayComments(e.id);
                  e.comments = arr;
                  ESSAY_COMMENTS_CACHE[e.id] = arr;
                }
                catch(err){ e.comments = []; }
              }
              STATE.studentEssayResultOpen = e.id;
              render();
            }}, '👁')
        : null));
}

function modalStudentDetail(){
  const sid = STATE.studentDetailOpen;
  if(!sid) return null;
  const s = STUDENTS.find(x => x.id === sid) || { id: sid, name: 'Ученик', email: '—', color: '#A78BFA' };

  /* Подгрузка попыток ученика (асинхронно, при первом открытии) */
  const cache = STATE.studentAttempts || (STATE.studentAttempts = {});
  let list = cache[sid];
  if(list === undefined && sb){
    cache[sid] = null;
    list = null;
    loadStudentAttempts(sid).then(arr => { cache[sid] = arr; render(); });
  }

  /* Группировка попыток по заданиям + агрегаты */
  const byTask = {};
  let totalScore = 0, totalMax = 0;
  if(Array.isArray(list)){
    for(const a of list){
      const t = a.ege_task_n;
      if(!byTask[t]) byTask[t] = { attempts: [], score: 0, max: 0 };
      byTask[t].attempts.push(a);
      byTask[t].score += a.score || 0;
      byTask[t].max += a.max_score || 0;
      totalScore += a.score || 0;
      totalMax += a.max_score || 0;
    }
  }
  const totalAvg = totalMax ? Math.round(totalScore / totalMax * 100) : null;
  /* Слабые темы: где средний балл < 70% и есть хотя бы 2 попытки */
  const weakTopics = Object.entries(byTask)
    .filter(([_, b]) => b.attempts.length >= 2 && b.score / b.max < 0.7)
    .sort((a, b) => (a[1].score / a[1].max) - (b[1].score / b[1].max))
    .slice(0, 5);

  const close = () => { STATE.studentDetailOpen = null; render(); };

  const head = el('div', { class:'modal-head' },
    el('div', { style:{ display:'flex', alignItems:'center', gap:'14px' }},
      avatarChip(s.name, s.color, 56),
      el('div', null,
        el('h2', { style:{ marginBottom:'2px' }}, s.name),
        el('div', { style:{ color:'var(--ink-2)', fontSize:'13px' }}, s.email))),
    el('button', { class:'x', onclick: close }, '×'));

  const body = el('div', { class:'modal-body' });

  /* Агрегаты */
  body.append(el('div', { style:{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(150px, 1fr))', gap:'10px', marginBottom:'14px' }},
    kpiCard('Всего попыток', list ? list.length : '⏳', '', '🎯', 'var(--p-soft)'),
    kpiCard('Средний балл', totalAvg != null ? totalAvg + '%' : '—', list && list.length ? 'по всем попыткам' : 'нет данных', '📊', 'var(--y-soft)'),
    kpiCard('Заданий охвачено', Object.keys(byTask).length || '—', 'из 26', '📚', 'var(--green-soft)'),
    kpiCard('Слабые темы', weakTopics.length, weakTopics.length ? '< 70% точности' : 'все ровно', '⚠', '#FEF3C7')));

  /* Слабые темы */
  if(weakTopics.length){
    const weak = el('div', { class:'card', style:{ marginBottom:'14px', background:'#FFFBEB', border:'1px solid #FDE68A' }});
    weak.append(el('h4', null, '⚠ Слабые места'));
    weak.append(el('p', { style:{ fontSize:'12px', color:'var(--ink-2)', marginTop:'4px', marginBottom:'10px' }},
      'Задания, где у ' + s.name.split(' ')[0] + ' средняя точность ниже 70%. Стоит вернуться к этим темам.'));
    weakTopics.forEach(([taskN, b]) => {
      const pct = Math.round(b.score / b.max * 100);
      const topic = (EGE_TASKS.find(t => t.n == taskN) || {}).topic || '';
      weak.append(el('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 12px', background:'#fff', borderRadius:'8px', marginBottom:'6px', fontSize:'13px' }},
        el('span', null, el('b', null, '№' + taskN), ' · ' + topic),
        el('span', { style:{ fontWeight:'700', color: pct < 50 ? 'var(--red)' : 'var(--warn)' }}, pct + '% · ' + b.attempts.length + ' попыт.')));
    });
    body.append(weak);
  }

  /* История попыток по заданиям */
  if(list === null){
    body.append(el('div', { class:'card', style:{ textAlign:'center', color:'var(--ink-3)' }},
      '⏳ Загружаем попытки…'));
  } else if(!list || !list.length){
    body.append(el('div', { class:'card', style:{ textAlign:'center', color:'var(--ink-3)' }},
      'У этого ученика пока нет попыток в тренажёре.'));
  } else {
    const histCard = el('div', { class:'card' });
    histCard.append(el('h4', null, '📈 История по заданиям'));
    histCard.append(el('p', { style:{ fontSize:'12px', color:'var(--ink-2)', marginTop:'4px', marginBottom:'12px' }},
      'Сгруппировано по номеру задания. Вторая колонка — все попытки с датой и результатом.'));
    Object.entries(byTask).sort((a, b) => +a[0] - +b[0]).forEach(([taskN, b]) => {
      const avg = Math.round(b.score / b.max * 100);
      const topic = (EGE_TASKS.find(t => t.n == taskN) || {}).topic || '';
      const block = el('div', { style:{ marginBottom:'12px', borderBottom:'1px solid var(--border)', paddingBottom:'10px' }});
      block.append(el('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'6px' }},
        el('div', null,
          el('b', null, 'Задание ' + taskN), ' · ',
          el('span', { style:{ color:'var(--ink-2)' }}, topic)),
        el('div', null,
          el('span', { style:{ fontWeight:'700', color: avg >= 80 ? 'var(--green)' : avg >= 60 ? 'var(--ink)' : 'var(--red)' }}, avg + '%'),
          el('span', { style:{ fontSize:'11px', color:'var(--ink-3)', marginLeft:'8px' }}, b.attempts.length + ' попыт.'))));
      const fmt = ts => {
        const d = new Date(ts);
        return d.toLocaleDateString('ru-RU', { day:'numeric', month:'short' }) + ' · ' + d.toTimeString().slice(0, 5);
      };
      const aList = el('div', { style:{ display:'flex', gap:'6px', flexWrap:'wrap' }});
      b.attempts.slice(0, 10).forEach(a => {
        const pct = a.max_score ? Math.round(a.score / a.max_score * 100) : 0;
        const bg = pct >= 80 ? 'var(--green-soft)' : pct >= 60 ? 'var(--y-soft)' : 'var(--red-soft)';
        aList.append(el('span', { style:{ fontSize:'11px', padding:'3px 8px', background:bg, borderRadius:'6px', color:'var(--ink)' }},
          fmt(a.created_at) + ' · ' + a.score + '/' + a.max_score));
      });
      if(b.attempts.length > 10) aList.append(el('span', { style:{ fontSize:'11px', color:'var(--ink-3)' }}, '…и ещё ' + (b.attempts.length - 10)));
      block.append(aList);
      histCard.append(block);
    });
    body.append(histCard);
  }

  const foot = el('div', { class:'modal-foot' },
    el('span', { style:{ fontSize:'12px', color:'var(--ink-2)' }},
      'Карточка ученика'),

/* =======================================================================
   ONBOARDING — спросить имя у только что зарегистрированного пользователя
   ======================================================================= */
/* =======================================================================
   УЧЕНИК · СДАЧА СОЧИНЕНИЯ (форма с текстом + счётчик слов)
   ======================================================================= */
function modalEssayDraft(){
  const close = () => { STATE.essayDraftOpen = false; render(); };

  /* Переключатель формата */
  const formatToggle = el('div', { style:{ display:'flex', gap:'8px', marginBottom:'14px', padding:'4px', background:'var(--surface-soft)', borderRadius:'10px' }});
  const mkTab = (mode, label) => el('button', {
    class: 'btn btn-sm' + (STATE.essayDraftMode === mode ? ' btn-p' : ' btn-secondary'),
    style:{ flex:1 },
    onclick: () => { STATE.essayDraftMode = mode; render(); }
  }, label);
  formatToggle.append(mkTab('typed', '⌨️ Текстом'), mkTab('photo', '📸 Фото'));

  const textArea = el('textarea', {
    placeholder: 'Введи свой текст сочинения. Минимум 150 слов, иначе работа не зачтётся (правило ФИПИ).',
    style:{ width:'100%', minHeight:'320px', padding:'14px', borderRadius:'10px',
            border:'1px solid var(--border-2)', fontSize:'14px', lineHeight:'1.6',
            fontFamily:'inherit', resize:'vertical' }
  }, STATE.essayDraftText || '');

  const wcEl = el('span', null, '0');
  const wcStatus = el('span', { style:{ fontSize:'12px', color:'var(--ink-3)' }}, '');
  const updateCount = () => {
    const n = countEssayWords(textArea.value);
    STATE.essayDraftText = textArea.value;
    wcEl.textContent = n;
    if(n === 0){ wcStatus.textContent = ''; wcStatus.style.color = 'var(--ink-3)'; }
    else if(n < 150){
      wcStatus.textContent = '< 150: работа не зачтётся (нужно ещё ' + (150 - n) + ')';
      wcStatus.style.color = 'var(--red)';
    } else {
      wcStatus.textContent = '✓ норма';
      wcStatus.style.color = 'var(--green)';
    }
  };
  textArea.addEventListener('input', updateCount);
  setTimeout(updateCount, 0);

  /* === Фото-режим === */
  const photoStatus = el('div', { style:{ fontSize:'12px', color:'var(--ink-3)', minHeight:'18px' }}, '');
  const photoList = el('div', { style:{ display:'flex', gap:'10px', flexWrap:'wrap', marginTop:'8px' }});
  const renderThumbs = () => {
    photoList.innerHTML = '';
    STATE.essayDraftPhotos.forEach((p, idx) => {
      const thumb = el('div', { class:'photo-thumb' },
        el('img', { src: p.url, alt: 'фото ' + (idx+1) }),
        el('button', { class:'x', title:'Удалить', onclick: () => {
          STATE.essayDraftPhotos.splice(idx, 1);
          renderThumbs();
        }}, '×'));
      photoList.append(thumb);
    });
  };
  renderThumbs();
  const fileInput = el('input', { type:'file', accept:'image/*', multiple:'multiple',
    style:{ display:'none' }});
  fileInput.addEventListener('change', async ev => {
    const files = Array.from(ev.target.files || []);
    if(!files.length) return;
    photoStatus.textContent = '⏳ Заливаем ' + files.length + ' файл(ов)…';
    photoStatus.style.color = 'var(--ink-3)';
    let ok = 0, fail = 0;
    for(const f of files){
      try {
        const url = await uploadEssayPhoto(f);
        STATE.essayDraftPhotos.push({ url, name: f.name });
        ok++;
        renderThumbs();
      } catch(e){
        console.error(e);
        fail++;
      }
    }
    photoStatus.textContent = '✓ Загружено: ' + ok + (fail ? ' · ⚠ ошибок: ' + fail : '');
    photoStatus.style.color = fail ? 'var(--red)' : 'var(--green)';
    fileInput.value = '';
  });

  const photoBlock = el('div', null,
    el('div', { class:'card', style:{ background:'var(--surface-soft)', border:'2px dashed var(--border-2)', textAlign:'center', padding:'20px' }},
      el('div', { style:{ fontSize:'40px', marginBottom:'8px' }}, '📸'),
      el('h4', { style:{ marginBottom:'4px' }}, 'Загрузи фото своей работы'),
      el('p', { style:{ color:'var(--ink-2)', fontSize:'13px', marginBottom:'12px' }},
        'Можно несколько страниц — учитель сможет ставить пометки прямо на фотографии.'),
      el('button', { class:'btn btn-p',
        onclick: () => fileInput.click()
      }, '📷 Выбрать фото')),
    fileInput,
    photoStatus,
    photoList);

  const submitBtn = el('button', { class:'btn btn-p',
    onclick: async () => {
      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ Сдаём…';
      try {
        if(STATE.essayDraftMode === 'typed'){
          const text = textArea.value.trim();
          if(text.length < 50){ showToast('Текст слишком короткий'); throw new Error(); }
          const wc = countEssayWords(text);
          if(wc < 150){
            if(!confirm('У тебя ' + wc + ' слов из 150 — по правилам ФИПИ работа за < 150 слов не оценивается. Всё равно сдать?')){ throw new Error(); }
          }
          await submitEssay({ format:'typed', text });
          showToast('✓ Сочинение сдано · ' + wc + ' слов');
        } else {
          if(!STATE.essayDraftPhotos.length){ showToast('Загрузите хотя бы одно фото'); throw new Error(); }
          await submitEssay({ format:'photo', photoUrls: STATE.essayDraftPhotos.map(p => p.url) });
          showToast('✓ Сдано · ' + STATE.essayDraftPhotos.length + ' фото');
        }
        await loadEssaysFromDb();
        STATE.essayDraftOpen = false;
        STATE.essayDraftText = '';
        STATE.essayDraftPhotos = [];
        STATE.essayDraftMode = 'typed';
        render();
      } catch(e){
        if(e && e.message) console.error('submitEssay упал:', e);
        if(e && e.message) showToast('⚠ ' + e.message);
        submitBtn.disabled = false;
        submitBtn.textContent = '✓ Сдать на проверку';
      }
    }
  }, '✓ Сдать на проверку');

  const head = el('div', { class:'modal-head' },
    el('div', null,
      el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.08em', fontWeight:'700' }},
        '✍️ Задание 27'),
      el('h2', { style:{ marginTop:'4px' }}, 'Сочинение по тексту')),
    el('button', { class:'x', onclick: close }, '×'));

  const body = el('div', { class:'modal-body' },
    el('div', { class:'card', style:{ background:'var(--p-soft)', border:'1px solid var(--p-2)', marginBottom:'14px' }},
      el('h4', null, '📝 Что нужно сделать'),
      el('p', { style:{ color:'var(--ink-2)', marginTop:'6px', fontSize:'13px', lineHeight:'1.5' }},
        'Сформулируй проблему текста, прокомментируй её двумя примерами с пояснением, укажи позицию автора, выскажи своё отношение и обоснуй пример-аргумент. Минимум 150 слов.')),
    formatToggle,
    STATE.essayDraftMode === 'typed'
      ? el('div', null,
          el('div', { style:{ marginBottom:'10px', display:'flex', justifyContent:'space-between', alignItems:'baseline' }},
            el('h4', null, '🖋 Твой текст'),
            el('span', { style:{ fontSize:'13px', color:'var(--ink-2)' }},
              '🐝 Слов: ', el('b', null, wcEl), ' · ', wcStatus)),
          textArea)
      : photoBlock);

  const foot = el('div', { class:'modal-foot' },
    el('span', { style:{ fontSize:'11px', color:'var(--ink-3)' }},
      'После сдачи учитель проверит работу по К1–К10 и пришлёт результат с комментариями.'),
    el('div', { style:{ display:'flex', gap:'8px' }},
      el('button', { class:'btn btn-secondary', onclick: close }, 'Сохранить как черновик'),
      submitBtn));

  return el('div', { class:'modal-bg',
    onclick: e => { if(e.target.classList.contains('modal-bg')) close(); }
  }, el('div', { class:'modal', style:{ maxWidth:'780px' }}, head, body, foot));
}

/* =======================================================================
   УЧЕНИК · РЕЗУЛЬТАТ ПРОВЕРКИ СОЧИНЕНИЯ (К1–К10 + комментарий учителя)
   ======================================================================= */
function modalEssayResult(essayId){
  const essay = DB_ESSAYS.find(e => e.id === essayId);
  if(!essay || !essay.review) return null;
  const r = essay.review;
  const close = () => { STATE.studentEssayResultOpen = null; render(); };

  /* Список баллов по К1-К10 */
  const list = el('div', { style:{ display:'flex', flexDirection:'column', gap:'6px', marginTop:'10px' }});
  CRIT.forEach(c => {
    const v = r[c.id.toLowerCase()];
    const sec = c.sec;
    const colorMap = { 'Содержание':'var(--p-soft)', 'Речь':'var(--y-soft)', 'Грамотность':'var(--green-soft)' };
    list.append(el('div', {
      style:{ display:'flex', justifyContent:'space-between', alignItems:'center',
              padding:'10px 12px', background:colorMap[sec] || 'var(--surface-soft)', borderRadius:'10px' }
    },
      el('div', null,
        el('div', { style:{ fontWeight:'700', fontSize:'13px' }}, c.id + ' · ' + c.name),
        el('div', { style:{ fontSize:'11px', color:'var(--ink-3)' }}, sec)),
      el('div', { style:{ fontWeight:'800', fontSize:'15px' }}, (v != null ? v : 0) + ' / ' + c.max)));
  });

  const head = el('div', { class:'modal-head' },
    el('div', null,
      el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.08em', fontWeight:'700' }},
        'Результат проверки · сочинение'),
      el('h2', { style:{ marginTop:'4px' }}, '🐝 ' + (r.total != null ? r.total : 0) + ' / 22 баллов')),
    el('button', { class:'x', onclick: close }, '×'));

  const body = el('div', { class:'modal-body' });

  /* Полный текст или фото работы с замечаниями */
  const isPhotoEssay = essay.format === 'photo';
  /* Берём из единого кэша, чтобы не зависеть от ссылки на старый объект */
  if(!essay.comments && ESSAY_COMMENTS_CACHE[essay.id]) essay.comments = ESSAY_COMMENTS_CACHE[essay.id];
  const commentsForView = ESSAY_COMMENTS_CACHE[essay.id] || essay.comments || [];
  let bodyEl;
  if(isPhotoEssay){
    bodyEl = renderPhotosWithPins(essay.photoUrls || [], commentsForView, {
      readonly: true,
      onPinClick: (c, pinEl) => showStudentCommentTooltip(c, pinEl)
    });
  } else {
    bodyEl = renderEssayWithMarks(essay.text || '', commentsForView, { readonly: true });
    bodyEl.addEventListener('click', ev => {
      if(ev.target && ev.target.tagName === 'MARK'){
        const cid = +ev.target.getAttribute('data-id');
        const c = commentsForView.find(x => x.id === cid);
        if(c) showStudentCommentTooltip(c, ev.target);
      }
    });
  }
  /* Легенда цветов — только если есть выделения */
  let legend = null;
  if(commentsForView && commentsForView.length){
    const usedKinds = [...new Set(commentsForView.map(c => c.kind))];
    legend = el('div', { style:{ display:'flex', gap:'6px', flexWrap:'wrap', marginBottom:'8px' }},
      ...usedKinds.map(k => {
        const m = errKindMeta(k);
        return el('span', { style:{ fontSize:'11px', padding:'3px 8px', background: m.bg, color:'var(--ink)', borderRadius:'5px', fontWeight:'700' }},
          m.crit + ' · ' + m.label);
      }));
  }
  const subtitleParts = [];
  if(!isPhotoEssay && essay.wordCount != null) subtitleParts.push(essay.wordCount + ' слов');
  if(isPhotoEssay) subtitleParts.push('📸 ' + (essay.photoUrls || []).length + ' стр.');
  if(essay.submittedAt) subtitleParts.push('сдано ' + new Date(essay.submittedAt).toLocaleString('ru-RU', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }));

  const textBlock = el('div', { class:'card', style:{ marginBottom:'12px' }},
    el('h4', { style:{ marginBottom:'8px' }}, '📝 Твоя работа'),
    el('div', { style:{ fontSize:'12px', color:'var(--ink-3)', marginBottom:'8px' }}, subtitleParts.join(' · ') || '—'),
    legend,
    (commentsForView && commentsForView.length)
      ? el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', marginBottom:'6px' }},
          isPhotoEssay
            ? '💡 Кликни по цветному пину, чтобы прочитать замечание учителя.'
            : '💡 Кликни по выделенному фрагменту, чтобы прочитать замечание учителя.')
      : null,
    bodyEl);
  body.append(textBlock);

  const rTxt = safeComment(r.general_comment);
  const rVu = safeVoiceUrl(r.voice_url);
  if(rTxt || rVu){
    body.append(el('div', { class:'card', style:{ background:'var(--p-soft)', border:'1px solid var(--p-2)', marginBottom:'10px' }},
      el('h4', null, '💬 Комментарий учителя'),
      rTxt
        ? el('p', { style:{ marginTop:'6px', whiteSpace:'pre-wrap', lineHeight:'1.5', fontSize:'14px' }}, rTxt)
        : null,
      rVu
        ? el('div', { style:{ marginTop:'8px' }},
            el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', marginBottom:'4px' }}, '🎤 Голосовое сообщение:'),
            el('audio', { controls:'controls', src: rVu, style:{ width:'100%', height:'36px' }}))
        : null));
  }
  body.append(
    el('h4', { style:{ marginTop:'4px' }}, '📊 Баллы по критериям'),
    list);

  const foot = el('div', { class:'modal-foot' },
    el('span', { style:{ fontSize:'12px', color:'var(--ink-3)' }},
      'Оценка по критериям ФИПИ К1–К10'),
    el('button', { class:'btn btn-secondary', onclick: close }, 'Закрыть'));

  return el('div', { class:'modal-bg',
    onclick: e => { if(e.target.classList.contains('modal-bg')) close(); }
  }, el('div', { class:'modal', style:{ maxWidth:'620px' }}, head, body, foot));
}

function modalOnboardingName(){
  const close = () => { STATE._onboardingDismissed = true; render(); };
  const head = el('div', { class:'modal-head' },
    el('div', null,
      el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.08em', fontWeight:'700' }},
        '🐝 Добро пожаловать!'),
      el('h2', { style:{ marginTop:'4px' }}, 'Как тебя зовут?')),
    el('button', { class:'x', onclick: close }, '×'));

  const firstInput = el('input', {
    type:'text', placeholder:'Анна', autofocus:'autofocus',
    style:{ width:'100%', padding:'12px 14px', borderRadius:'10px', border:'1px solid var(--border-2)', fontSize:'15px' }
  });
  const lastInput = el('input', {
    type:'text', placeholder:'Соколова',
    style:{ width:'100%', padding:'12px 14px', borderRadius:'10px', border:'1px solid var(--border-2)', fontSize:'15px' }
  });

  const status = el('div', { style:{ fontSize:'12px', minHeight:'16px', color:'var(--ink-3)', marginTop:'6px' }}, '');

  const save = async () => {
    const first = firstInput.value.trim();
    const last = lastInput.value.trim();
    if(!first){ status.textContent = 'Имя обязательно'; status.style.color = 'var(--red)'; return; }
    const fullName = (first + (last ? ' ' + last : '')).trim();
    status.textContent = '⏳ Сохраняем…';
    status.style.color = 'var(--ink-3)';
    try {
      await restRequest('PATCH', '/profiles?id=eq.' + MY_PROFILE.id, { full_name: fullName }, { prefer: 'return=minimal' });
      MY_PROFILE.full_name = fullName;
      STATE._onboardingDismissed = true;
      showToast('✓ Привет, ' + first + '!');
      render();
    } catch(e){
      status.textContent = '⚠ ' + e.message;
      status.style.color = 'var(--red)';
    }
  };

  const body = el('div', { class:'modal-body', style:{ padding:'24px' }});
  body.append(
    el('p', { style:{ color:'var(--ink-2)', marginBottom:'18px' }},
      'Чтобы учитель и одноклассники увидели тебя по имени, а не по почте — скажи, как тебя зовут. Поменять можно позже в Профиле.'),
    el('div', { style:{ marginBottom:'12px' }},
      el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', fontWeight:'700', textTransform:'uppercase', letterSpacing:'.08em', marginBottom:'6px' }}, 'Имя *'),
      firstInput),
    el('div', { style:{ marginBottom:'10px' }},
      el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', fontWeight:'700', textTransform:'uppercase', letterSpacing:'.08em', marginBottom:'6px' }}, 'Фамилия'),
      lastInput),
    status);

  /* Сохранить по Enter */
  firstInput.addEventListener('keypress', e => { if(e.key === 'Enter') lastInput.focus(); });
  lastInput.addEventListener('keypress', e => { if(e.key === 'Enter') save(); });

  const foot = el('div', { class:'modal-foot' },
    el('button', { class:'btn btn-secondary', onclick: close }, 'Позже'),
    el('button', { class:'btn btn-y', onclick: save }, 'Сохранить'));

  return el('div', { class:'modal-bg', onclick: e => { if(e.target.classList.contains('modal-bg')) close(); }},
    el('div', { class:'modal', style:{ maxWidth:'440px' }}, head, body, foot));
}

function attendRow(s){
  const status = ATTENDANCE.webinar1[s.id];
  const cls = status === 'teacher' ? 'attend-row checked' : status === 'self' ? 'attend-row self-checked' : 'attend-row';
  const checkCls = status === 'teacher' ? 'attend-check on' : status === 'self' ? 'attend-check self' : 'attend-check';
  const checkIcon = status === 'teacher' ? '✓' : status === 'self' ? '🐝' : '○';
  return el('div', { class: cls },
    el('div', { style:{ display:'flex', alignItems:'center', gap:'10px' }},
      avatarChip(s.name, s.color, 30),
      el('div', null,
        el('div', { style:{ fontWeight:'700', fontSize:'13px' }}, s.name),

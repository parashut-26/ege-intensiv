/* =======================================================================
   УЧИТЕЛЬ · СОЧИНЕНИЯ
   ======================================================================= */
function viewTeacherEssays(){
  const wrap = el('div', { class:'fade-in' });
  /* Объединяем реальные (DB) сочинения и моки. Реальные — приоритетно, потому что у них
     есть конкретный текст и word_count. Моки оставляем как «исторические» для UX-демо. */
  const allEssays = [...DB_ESSAYS, ...ESSAYS.filter(m => !DB_ESSAYS.find(d => d.id === m.id))];
  /* Маппинг статусов: в БД enum {draft, submitted, in_progress, pre_checked, done},
     в моке — {new, pre_checked, in_progress, done}. submitted ≈ new. */
  const norm = e => ({ ...e, status: e.status === 'submitted' ? 'new' : e.status });
  const essays = allEssays.map(norm);

  wrap.append(
    el('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'14px', flexWrap:'wrap', gap:'10px' }},
      el('div', null,
        el('h1', null, '📝 Сочинения'),
        el('p', { style:{ color:'var(--ink-2)', marginTop:'4px' }},
          'Очередь работ на проверку. Кликните на сочинение, чтобы открыть форму проверки К1–К10.')),
      el('button', { class:'btn btn-secondary btn-sm',
        onclick: async () => {
          showToast('⏳ Обновляю список…');
          await loadEssaysFromDb();
          showToast('✓ Загружено: ' + DB_ESSAYS.length);
          render();
        }
      }, '🔄 Обновить')),
    el('div', { style:{ display:'flex', gap:'8px', marginBottom:'14px', flexWrap:'wrap' }},
      chip('Новые ' + essays.filter(e => e.status === 'new').length, 'red'),
      chip('🤝 От кураторов ' + essays.filter(e => e.status === 'pre_checked').length, 'teal'),
      chip('В работе ' + essays.filter(e => e.status === 'in_progress').length, 'warn'),
      chip('Готовы ' + essays.filter(e => e.status === 'done').length, 'green')));

  if(!essays.length){
    wrap.append(el('div', { class:'card', style:{ textAlign:'center', color:'var(--ink-3)', padding:'30px' }},
      'Пока нет сданных сочинений. Когда ученики начнут сдавать — появятся здесь.'));
    return wrap;
  }
  essays.forEach(e => wrap.append(essayRow(e, false)));
  return wrap;
}

/* =======================================================================
   ФОРМА ПРОВЕРКИ СОЧИНЕНИЯ (К1–К10)
   ======================================================================= */
function modalEssayReview(essayId){
  /* Ищем сначала в реальных DB_ESSAYS, потом в моках */
  const essay = DB_ESSAYS.find(e => e.id === essayId) || ESSAYS.find(e => e.id === essayId);
  if(!essay) return null;
  /* Ярлык сочинения: для DB-работы это «Сочинение по тексту…» (берём начало body), для мока — essay.text */
  const isDb = DB_ESSAYS.find(e => e.id === essayId);
  const essayLabel = isDb ? 'Сочинение' : essay.text;
  /* Подзаголовок с датой */
  let whenLabel = essay.when;
  if(!whenLabel && essay.submittedAt){
    try { whenLabel = new Date(essay.submittedAt).toLocaleString('ru-RU', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); }
    catch(e){ whenLabel = essay.submittedAt; }
  }
  if(!whenLabel) whenLabel = '—';

  const k1 = STATE.scoresK.K1 ?? 1;
  const lockK2K3 = k1 === 0;

  let total = 0, max = 0;
  CRIT.forEach(c => {
    max += c.max;
    let v = STATE.scoresK[c.id];
    if((c.id === 'K2' || c.id === 'K3') && lockK2K3) v = 0;
    if(v == null) v = c.max;
    total += v;
  });

  const sectionScore = sec => {
    let s = 0, m = 0;
    CRIT.filter(c => c.sec === sec).forEach(c => {
      m += c.max;
      let v = STATE.scoresK[c.id];
      if((c.id === 'K2' || c.id === 'K3') && lockK2K3) v = 0;
      if(v == null) v = c.max;
      s += v;
    });
    return s + '/' + m;
  };

  /* Текст работы: для реального DB-сочинения используем essay.text, для мока — SAMPLE */
  const essayText = essay.text || SAMPLE_ESSAY_TEXT;
  const wordCount = essay.wordCount != null ? essay.wordCount : countEssayWords(essayText);
  const isCurator = STATE.essayBy === 'curator';

  /* Левая колонка: текст или фото + выделения/пины */
  const leftCol = el('div', null);
  const isPhotoEssay = essay.format === 'photo';

  /* Берём замечания из кэша (если был fresh-load после предыдущего рендера —
     ссылка essay.comments может быть устарелая из старого DB_ESSAYS) */
  if(!essay.comments && ESSAY_COMMENTS_CACHE[essay.id]) essay.comments = ESSAY_COMMENTS_CACHE[essay.id];
  const commentsForView = ESSAY_COMMENTS_CACHE[essay.id] || essay.comments || [];

  let essayBodyEl;
  if(isPhotoEssay){
    essayBodyEl = renderPhotosWithPins(essay.photoUrls || [], commentsForView, {
      readonly: false,
      onPinClick: (c, pinEl) => showExistingCommentPopup(essay, c, pinEl),
      onPhotoClick: ({ page, x, y, pageWrap }) => showPhotoErrPopup(essay, pageWrap, { page, x, y })
    });
  } else {
    essayBodyEl = renderEssayWithMarks(essayText, commentsForView, { readonly: false });
    essayBodyEl.addEventListener('mouseup', () => {
      setTimeout(() => showErrPopup(essay, essayBodyEl, essayText), 0);
    });
    essayBodyEl.addEventListener('click', ev => {
      if(ev.target && ev.target.tagName === 'MARK'){
        const cid = +ev.target.getAttribute('data-id');
        const c = commentsForView.find(x => x.id === cid);
        if(c) showExistingCommentPopup(essay, c, ev.target);
      }
    });
  }

  /* Шапка с инфой о работе */
  const headBadges = el('div', { style:{ display:'flex', gap:'8px', alignItems:'center', marginBottom:'10px', flexWrap:'wrap' }},
    el('div', { style:{ fontWeight:'700', fontSize:'14px' }}, '✍️ ' + (essay.studentName || 'Ученик')));
  if(isPhotoEssay){
    headBadges.append(
      chip('📸 фото · ' + (essay.photoUrls || []).length + ' стр.', 'p'));
  } else {
    headBadges.append(
      chip('📝 текстовая сдача', 'p'),
      chip(wordCount + ' слов · ' + (wordCount >= 150 ? 'норма' : '< 150 — НЕ ЗАСЧИТЫВАЕТСЯ'),
           wordCount >= 150 ? 'green' : 'red'));
  }

  leftCol.append(
    headBadges,
    el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', marginBottom:'8px' }},
      isPhotoEssay
        ? '💡 Кликни по фото в месте ошибки — поставится пин с категорией и комментарием. Клик по пину — посмотреть/удалить. Баллы К4–К10 пересчитаются автоматически.'
        : '💡 Выделите фрагмент текста, чтобы добавить комментарий-ошибку. Клик по подсветке — посмотреть/удалить. Баллы К4–К10 пересчитаются автоматически.'),
    essayBodyEl,
    (commentsForView && commentsForView.length)
      ? el('div', { class:'card', style:{ marginTop:'12px', background:'var(--surface-soft)' }},
          el('h4', { style:{ marginBottom:'8px' }}, '🏷 Замечания (' + commentsForView.length + ')'),
          el('div', { class:'err-comments-list' }, commentsForView.map(c => commentItemRow(essay, c))))
      : null);

  /* Правая колонка */
  const rightCol = el('div', null);
  rightCol.append(
    el('div', { class:'score-total' },
      el('div', null,
        el('div', { style:{ fontSize:'11px', textTransform:'uppercase', letterSpacing:'.08em', opacity:.8 }}, 'Итого'),
        el('div', { style:{ fontSize:'10px', opacity:.8 }},
          'Содержание ' + sectionScore('Содержание') + ' · Речь ' + sectionScore('Речь') + ' · Грамотность ' + sectionScore('Грамотность'))),
      el('div', { class:'big' }, total + ' / 22')),
    el('div', { style:{ height:'10px' }}));

  ['Содержание', 'Речь', 'Грамотность'].forEach(sec => rightCol.append(sectionBlock(sec, lockK2K3)));

  rightCol.append(
    el('div', { class:'card', style:{ marginTop:'14px', background:'var(--surface-soft)' }},
      el('h4', null, '💬 Общий комментарий ученику'),
      el('textarea', {
        placeholder: isCurator ? 'Куратор: ваш предварительный комментарий — учитель сможет его дополнить.' : 'Аня, отличная работа над комментарием…',
        style:{ width:'100%', padding:'10px', borderRadius:'10px', border:'1px solid var(--border-2)', minHeight:'80px', resize:'vertical', marginTop:'8px' },
        oninput: ev => { STATE.essayComment = ev.target.value; }
      }, STATE.essayComment || ''),
      (() => {
        const wrap = el('div', { style:{ marginTop:'8px', display:'flex', gap:'8px', alignItems:'center', flexWrap:'wrap' }});
        wrap.append(el('span', { style:{ fontSize:'12px', color:'var(--ink-3)' }}, 'Голос:'));
        const v = makeVoiceRecorder(STATE.essayVoiceUrl, url => { STATE.essayVoiceUrl = url; });
        wrap.append(v.node);
        return wrap;
      })()));

  /* Футер */
  const foot = el('div', { class:'modal-foot' });
  foot.append(
    el('div', { style:{ fontSize:'12px', color:'var(--ink-2)' }},
      lockK2K3 ? '⚠️ К1=0 → К2 и К3 автоматически 0 (по методике)' : '✓ К1≠0 — можно ставить К2 и К3'));

  /* Действие после сохранения: чистим STATE и рендерим */
  const doAfter = (msg) => {
    STATE.essayOpen = null;
    STATE.essayBy = null;
    STATE.scoresK = {};
    STATE.errors = {};
    STATE.essayComment = '';
    STATE.essayVoiceUrl = null;
    if(msg) showToast(msg);
    render();
  };
  /* Универсальный хэндлер сохранения review (для DB-сочинений) или мок-обновления */
  const doSave = async (nextStatus, isPreCheck, msg) => {
    if(isDb && sb && MY_PROFILE){
      try {
        const t = await saveEssayReview(essayId, nextStatus, isPreCheck);
        doAfter(msg.replace('{score}', t));
      } catch(err){
        console.error(err);
        showToast('Ошибка сохранения: ' + err.message);
      }
    } else {
      /* мок — как раньше */
      essay.status = nextStatus;
      if(isPreCheck){ essay.preBy = 'c-sofia'; essay.preScore = total; }
      if(nextStatus === 'done') essay.finalScore = total;
      doAfter(msg.replace('{score}', total));
    }
  };

  if(isCurator){
    foot.append(el('button', { class:'btn btn-teal',
      onclick: () => doSave('pre_checked', true, 'Передано учителю · {score}/22')
    }, '✓ Передать учителю на подтверждение'));
  } else {
    foot.append(
      el('div', { style:{ display:'flex', gap:'8px', flexWrap:'wrap' }},
        el('button', { class:'btn btn-secondary',
          onclick: () => doSave('in_progress', false, 'Сохранено как «в работе»')
        }, 'Сохранить и закрыть'),
        el('button', { class:'btn btn-p',
          onclick: () => doSave('done', false, 'Опубликовано · +{score} 🐝')
        }, '✓ Опубликовать ученику')));
  }

  /* Модаль */
  const modal = el('div', { class:'modal' });
  modal.append(
    el('div', { class:'modal-head' },
      el('div', null,
        el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.08em', fontWeight:'700' }},
          essay.studentName + ' · ' + whenLabel + (isCurator ? ' · режим куратора' : '')),
        el('h2', null, '✍️ ' + essayLabel)),
      el('button', { class:'x',
        onclick: () => { STATE.essayOpen = null; STATE.essayBy = null; STATE.scoresK = {}; STATE.errors = {}; STATE.essayComment = ''; STATE.essayVoiceUrl = null; render(); }
      }, '×')),
    el('div', { class:'modal-body' },
      el('div', { class:'essay-grid' }, leftCol, rightCol)),
    foot);

  return el('div', { class:'modal-bg',
    onclick: e => { if(e.target.classList.contains('modal-bg')){ STATE.essayOpen = null; STATE.essayBy = null; STATE.scoresK = {}; STATE.errors = {}; STATE.essayComment = ''; STATE.essayVoiceUrl = null; render(); }}
  }, modal);
}

/* Popup для нового пина на фото — учитель кликнул по точке на фотографии */
function showPhotoErrPopup(essay, pageWrap, anchor){
  document.querySelectorAll('.err-popup').forEach(n => n.remove());
  /* Поставим временный «призрак» пина в месте клика, чтобы было понятно куда */
  const ghost = el('div', {
    class: 'pin pin-orf',
    style: { left: (anchor.x * 100) + '%', top: (anchor.y * 100) + '%', opacity:'.5' }
  }, '?');
  pageWrap.append(ghost);

  const rect = pageWrap.getBoundingClientRect();
  const popup = el('div', { class:'err-popup' });
  popup.style.left = Math.max(8, Math.min(window.innerWidth - 360, rect.left + rect.width * anchor.x)) + 'px';
  popup.style.top = (rect.top + window.scrollY + rect.height * anchor.y + 30) + 'px';

  let chosenKind = 'orf';
  const kindBtns = ERR_KINDS.map(k => el('button', {
    class: 'kind-btn' + (k.id === chosenKind ? ' active' : ''),

/* Popup для нового замечания при выделении текста */
function showErrPopup(essay, container, fullText){
  /* Удалить уже открытые popup-ы */
  document.querySelectorAll('.err-popup').forEach(n => n.remove());
  const sel = window.getSelection();
  if(!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  if(!container.contains(range.startContainer) || !container.contains(range.endContainer)) return;

  const startPos = getCharOffsetIn(container, range.startContainer, range.startOffset);
  const endPos = getCharOffsetIn(container, range.endContainer, range.endOffset);
  if(startPos < 0 || endPos < 0 || endPos <= startPos) return;
  const fragment = fullText.slice(startPos, endPos);
  if(fragment.length < 1 || fragment.length > 500) return;

  /* Позиция popup-а — под выделенным фрагментом */
  const rect = range.getBoundingClientRect();
  const containerRect = container.getBoundingClientRect();
  const popup = el('div', { class:'err-popup' });
  /* Привязываем popup к body чтобы не мешать селекту */
  popup.style.left = Math.max(8, Math.min(window.innerWidth - 360, rect.left)) + 'px';
  popup.style.top = (rect.bottom + window.scrollY + 6) + 'px';
  popup.style.position = 'absolute';

  let chosenKind = 'orf';
  const kindBtns = ERR_KINDS.map(k => el('button', {
    class: 'kind-btn' + (k.id === chosenKind ? ' active' : ''),
    style: { background: k.bg, borderColor: k.bg },
    onclick: ev => {
      chosenKind = k.id;
      popup.querySelectorAll('.kind-btn').forEach(b => b.classList.remove('active'));
      ev.currentTarget.classList.add('active');
    }
  }, k.crit + ' ' + k.label));

  const ta = el('textarea', { placeholder: 'Комментарий (например: «нужна запятая перед союзом и»)' });
  const voiceRec = makeVoiceRecorder();
  const status = el('span', { style:{ fontSize:'11px', color:'var(--ink-3)' }}, '');
  const cancelBtn = el('button', { class:'btn btn-secondary btn-sm',
    onclick: () => popup.remove() }, 'Отмена');
  const saveBtn = el('button', { class:'btn btn-p btn-sm',
    onclick: async () => {
      saveBtn.disabled = true; status.textContent = '⏳';
      try {
        const row = await saveEssayComment(essay.id, {
          fragment, start_pos: startPos, end_pos: endPos, kind: chosenKind, comment: ta.value.trim() || '',
          voice_url: voiceRec.getUrl()
        });
        essay.comments = ESSAY_COMMENTS_CACHE[essay.id] || essay.comments || [];
        if(row) essay.comments.push(row);
        ESSAY_COMMENTS_CACHE[essay.id] = essay.comments;
        recomputeErrorsFromComments(essay.comments);
        popup.remove();
        sel.removeAllRanges();
        render();
      } catch(e){
        status.textContent = '⚠ ' + e.message;
        saveBtn.disabled = false;
      }
    }
  }, '✓ Сохранить');

  popup.append(
    el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', marginBottom:'6px' }},
      'Фрагмент: «' + (fragment.length > 60 ? fragment.slice(0, 60) + '…' : fragment) + '»'),
    el('div', { class:'kinds' }, ...kindBtns),
    ta,
    el('div', { style:{ marginTop:'8px', display:'flex', gap:'6px', alignItems:'center', flexWrap:'wrap' }},
      el('span', { style:{ fontSize:'11px', color:'var(--ink-3)' }}, 'Голос:'),
      voiceRec.node),
    el('div', { class:'row' }, status, cancelBtn, saveBtn));
  document.body.append(popup);
  setTimeout(() => ta.focus(), 50);

  /* Закрыть по клику вне */
  const closer = (ev) => {
    if(!popup.contains(ev.target) && !container.contains(ev.target)){
      popup.remove();
      document.removeEventListener('mousedown', closer);
    }
  };
  setTimeout(() => document.addEventListener('mousedown', closer), 100);
}

function critRow(c, lockK2K3){
  const isLocked = lockK2K3 && (c.id === 'K2' || c.id === 'K3');
  let value = STATE.scoresK[c.id];
  if(isLocked) value = 0;
  if(value == null) value = c.max;

  let right;
  if(c.byErrors){
    right = el('div', { style:{ display:'flex', gap:'6px', alignItems:'center' }},
      el('input', { type:'number', min:'0', value: STATE.errors[c.id] != null ? STATE.errors[c.id] : 0,
        style:{ width:'56px', padding:'6px', borderRadius:'8px', border:'1px solid var(--border-2)', textAlign:'center', fontWeight:'700' },
        onchange: ev => {
          const n = +ev.target.value || 0;
          STATE.errors[c.id] = n;
          STATE.scoresK[c.id] = n === 0 ? 3 : n <= 2 ? 2 : n <= 4 ? 1 : 0;
          render();
        }
      }),
      el('span', { style:{ fontSize:'11px', color:'var(--ink-3)' }}, 'ош'),
      el('span', { style:{ fontWeight:'800', minWidth:'34px', textAlign:'right' }}, value + '/' + c.max));
  } else {
    const select = el('select', {
      style:{ padding:'6px 10px', borderRadius:'8px', border:'1px solid var(--border-2)', fontWeight:'700', minWidth:'70px' },
      disabled: isLocked || undefined,
      onchange: ev => { STATE.scoresK[c.id] = +ev.target.value; render(); }
    });
    for(let v = c.max; v >= 0; v--){
      const opt = el('option', { value: v }, v + ' / ' + c.max);
      if(v === value) opt.setAttribute('selected', 'selected');
      select.append(opt);
    }
    right = select;
  }

  return el('div', { class: 'crit ' + (isLocked ? 'locked' : ''), title: c.hint },
    el('div', { style:{ minWidth:0, flex:1 }},
      el('div', { class:'nm' }, c.id + ' · ' + c.name),
      el('div', { class:'desc' }, isLocked ? 'Заблокировано: К1 = 0' : c.hint.split('.')[0])),
    right);
}

function viewContentTheory(){
  const wrap = el('div', null);
  wrap.append(
    el('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'14px', flexWrap:'wrap', gap:'10px' }},
      el('div', null,
        el('h3', null, '📖 Теория по 26 заданиям'),
        el('p', { style:{ color:'var(--ink-2)', fontSize:'13px', marginTop:'4px' }},
          'Тексты тем для каждого задания. То, что увидит ученик в карточке теории.')),
      el('button', { class:'btn btn-secondary',
        onclick: async () => {
          try {
            showToast('⏳ Загружаю theory_import.json…');
            const resp = await fetch('./theory_import.json?ts=' + Date.now());
            if(!resp.ok){ showToast('⚠ Файл theory_import.json не найден'); return; }
            const data = await resp.json();
            const entries = Object.entries(data);
            if(!entries.length){ showToast('⚠ Файл пуст'); return; }

            /* Считаем, у скольких заданий уже есть теория в БД, чтобы предупредить */
            const filled = entries.filter(([n]) => (THEORY[n] || '').trim().length > 0).length;
            let mode = 'new';   /* 'new' = только пустые; 'all' = перезаписать всё */
            if(filled > 0){
              const choice = prompt(
                'У ' + filled + ' из ' + entries.length + ' заданий теория уже сохранена в БД (возможно, ты её правила вручную).\\n\\n' +
                'Что делать?\\n' +
                '  «новые» — заполнить только пустые задания (твои правки сохранятся)\\n' +
                '  «все» — перезаписать всё из файла (твои правки будут потеряны)\\n' +
                '  Cancel — отменить импорт',
                'новые'
              );
              if(choice === null) return;
              const c = choice.trim().toLowerCase();
              if(c === 'все' || c === 'all') mode = 'all';
              else mode = 'new';
            }

            let ok = 0, skipped = 0, fail = 0;
            for(const [n, md] of entries){
              if(mode === 'new' && (THEORY[n] || '').trim().length > 0){ skipped++; continue; }
              try { await saveTheoryToDb(+n, md); ok++; }
              catch(e){ console.warn('Не сохранилось задание', n, ':', e.message); fail++; }
            }
            showToast('✓ Сохранено: ' + ok + (skipped ? ' · пропущено: ' + skipped : '') + (fail ? ' · ошибок: ' + fail : ''));
            render();
          } catch(e){
            console.error('Импорт упал:', e);
            showToast('⚠ Ошибка: ' + e.message);
          }
        }
      }, '⬆ Импорт из theory_import.json')));

  const grid = el('div', { style:{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(280px, 1fr))', gap:'12px' }});
  EGE_TASKS.forEach(t => {
    const filled = MY_SKILL[t.n] != null || (MATERIALS.find(m => m.taskN === t.n)) || (QUIZ_BANK[t.n] && QUIZ_BANK[t.n].length);
    grid.append(
      el('div', { class:'card',
        style:{ padding:'14px', cursor:'pointer', borderLeft: '4px solid var(--' + (t.day === 1 ? 'y' : t.day === 2 ? 'p' : 'o-to') + ')' },
        onclick: () => { STATE.contentEditTaskN = t.n; render(); }

        el('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'8px' }},
          el('div', { style:{ fontSize:'24px', fontWeight:'800', color:'var(--p)', fontStyle:'italic' }},
            String(t.n).padStart(2, '0')),
          chip('День ' + t.day, t.day === 1 ? 'y' : t.day === 2 ? 'p' : 'warn')),
        el('div', { style:{ fontWeight:'700', fontSize:'13px', marginBottom:'8px' }}, t.topic),
        el('div', { style:{ display:'flex', gap:'6px', alignItems:'center', flexWrap:'wrap' }},
          chip(filled ? '✓ заполнено' : '⚠ пусто', filled ? 'green' : 'grey'),
          el('span', { style:{ fontSize:'11px', color:'var(--ink-3)' }},
            (QUIZ_BANK[t.n] || []).length + ' вопр. · ' +
            MATERIALS.filter(m => m.taskN === t.n).length + ' мат.')),
        el('button', { class:'btn btn-secondary btn-sm', style:{ marginTop:'10px', width:'100%' }
        }, '✏️ Редактировать')));

          'Все вопросы для тренажёров и сборки случайных вариантов. Чем больше вопросов — тем разнообразнее тренировки.')),
      el('div', { style:{ display:'flex', gap:'8px', flexWrap:'wrap' }},
        el('button', { class:'btn btn-secondary',
          onclick: () => showToast('Импорт вопросов из CSV')
        }, '⬆ Импорт CSV'),
        el('button', { class:'btn btn-y',
          onclick: () => showToast('Откроется форма создания вопроса')
        }, '➕ Добавить вопрос'))));

  const stats = el('div', { class:'card', style:{ marginBottom:'14px', background:'var(--y-soft)', border:'1px solid var(--y-2)' }});
  const totalQ = Object.values(QUIZ_BANK).reduce((a, arr) => a + arr.length, 0);
  const filledTasks = Object.keys(QUIZ_BANK).length;
  stats.append(
    el('div', { style:{ display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:'12px' }},
      el('div', null,
        el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', textTransform:'uppercase', fontWeight:'700' }}, 'Всего вопросов'),
        el('div', { style:{ fontSize:'24px', fontWeight:'800' }}, totalQ)),
      el('div', null,
        el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', textTransform:'uppercase', fontWeight:'700' }}, 'Заданий ЕГЭ заполнено'),
        el('div', { style:{ fontSize:'24px', fontWeight:'800' }}, filledTasks + ' / 26')),
      el('div', null,
        el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', textTransform:'uppercase', fontWeight:'700' }}, 'Готовность к рандому'),
        el('div', { style:{ fontSize:'24px', fontWeight:'800', color: filledTasks > 20 ? 'var(--green)' : 'var(--warn)' }},
          Math.round(filledTasks / 26 * 100) + '%'))));
  wrap.append(stats);

  /* Список номеров с количеством */
  const list = el('div', { class:'card', style:{ padding:0, overflow:'hidden' }});
  list.append(el('table', { class:'table' },
    el('thead', null, el('tr', null,
      el('th', null, '№'),
      el('th', null, 'Тема'),
      el('th', null, 'День'),
      el('th', null, 'Вопросов в банке'),
      el('th', { style:{ textAlign:'right' }}, ''))),
    el('tbody', null, EGE_TASKS.map(t => {
      const cnt = (QUIZ_BANK[t.n] || []).length;
      return el('tr', null,
        el('td', null, el('b', null, String(t.n).padStart(2, '0'))),
        el('td', null, t.topic),
        el('td', null, chip('День ' + t.day, t.day === 1 ? 'y' : t.day === 2 ? 'p' : 'warn')),
        el('td', null,
          cnt > 0
            ? el('span', null, '🐝 ', el('b', null, cnt), ' вопр.')
            : el('span', { style:{ color:'var(--red)' }}, '⚠ пусто')),
        el('td', { style:{ textAlign:'right' }},
          el('button', { class:'btn btn-secondary btn-sm',
            onclick: () => { STATE.contentEditTaskN = t.n; render(); }
          }, '✏️ Открыть')));
    }))));
  wrap.append(list);
  return wrap;
}

function viewContentMaterials(){
  const wrap = el('div', null);

  /* Скрытый file input для общей загрузки (без привязки к заданию) */
  const fileInput = el('input', { type:'file', style:{ display:'none' },
    onchange: async (ev) => {
      const file = ev.target.files[0];
      if(!file) return;
      try {
        const taskNStr = prompt('К какому заданию привязать (1–26)? Оставь пустым, если без привязки:');
        const taskN = taskNStr && taskNStr.trim() ? parseInt(taskNStr.trim()) : null;
        showToast('⏳ Загружаю «' + file.name + '»…');
        await uploadMaterial(file, taskN);
        await loadMaterialsFromDb();
        showToast('✓ Файл «' + file.name + '» загружен');
        render();
      } catch(e){
        console.error('Загрузка упала:', e);
        showToast('⚠ ' + e.message);
      } finally {
        ev.target.value = '';
      }
    }
  });
  wrap.append(fileInput);

  wrap.append(
    el('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'14px', flexWrap:'wrap', gap:'10px' }},
      el('div', null,
        el('h3', null, '📎 Материалы'),
        el('p', { style:{ color:'var(--ink-2)', fontSize:'13px', marginTop:'4px' }},
          'PDF, DOC, изображения, видео + ссылки. Появляются у учеников в карточке соответствующего задания.')),
      el('div', { style:{ display:'flex', gap:'8px', flexWrap:'wrap' }},
        el('button', { class:'btn btn-y',
          onclick: () => fileInput.click()
        }, '⬆ Загрузить файл'),
        el('button', { class:'btn btn-secondary',
          onclick: async () => {
            const url = prompt('URL ссылки:');
            if(!url || !url.trim()) return;
            let cleanUrl = url.trim();
            if(!/^https?:\/\//i.test(cleanUrl)) cleanUrl = 'https://' + cleanUrl;
            const name = prompt('Название ссылки:', extractDomain(cleanUrl));
            if(!name || !name.trim()) return;
            const taskNStr = prompt('К какому заданию привязать (1–26)? Оставь пустым, если без привязки:');
            const taskN = taskNStr && taskNStr.trim() ? parseInt(taskNStr.trim()) : null;
            try {
              await attachLink(name.trim(), cleanUrl, taskN);
              await loadMaterialsFromDb();
              showToast('✓ Ссылка прикреплена');
              render();
            } catch(e){ console.error(e); showToast('⚠ ' + e.message); }
          }
        }, '🔗 Добавить ссылку'))));

  /* Подсчёт использованного хранилища */
  const totalBytes = MATERIALS.filter(m => m.storage_path).reduce((a, m) => a + (m.size_bytes || 0), 0);
  const sizeMaxMB = 1024;     /* 1 ГБ — лимит free-tier Supabase */
  const sizeUsedMB = totalBytes / (1024*1024);
  wrap.append(el('div', { class:'card', style:{ marginBottom:'14px' }},
    el('div', { style:{ display:'flex', justifyContent:'space-between', marginBottom:'8px' }},
      el('span', { style:{ fontSize:'13px', color:'var(--ink-2)' }}, 'Использовано хранилища'),
      el('b', null, sizeUsedMB.toFixed(1) + ' МБ из ' + sizeMaxMB + ' МБ')),
    el('div', { class:'bar' }, el('i', { style:{ width: Math.min(100, sizeUsedMB / sizeMaxMB * 100) + '%' }}))));

  if(MATERIALS.length === 0){
    wrap.append(el('div', { class:'card', style:{ textAlign:'center', color:'var(--ink-3)', padding:'30px' }},
      'Пока нет загруженных материалов. Жми «⬆ Загрузить файл» или «🔗 Добавить ссылку»'));
    return wrap;
  }

  const list = el('div', { class:'card', style:{ padding:0, overflow:'hidden' }});
  list.append(el('table', { class:'table' },
    el('thead', null, el('tr', null,
      el('th', null, 'Файл / Ссылка'),
      el('th', null, 'Тип'),
      el('th', null, 'Привязка'),
      el('th', null, 'Размер'),
      el('th', { style:{ textAlign:'right' }}, ''))),
    el('tbody', null, MATERIALS.map(m => {
      const icon = m.external_url ? '🔗' : '📎';
      return el('tr', null,
        el('td', null, el('div', { style:{ display:'flex', gap:'10px', alignItems:'center' }},
          el('span', { style:{ fontSize:'18px' }}, icon),
          el('a', { href: materialOpenUrl(m), target:'_blank', rel:'noopener',
            style:{ fontWeight:'600', color:'var(--ink)', textDecoration:'none' }}, m.name))),
        el('td', null, chip(m.tag || 'теория', (m.tag === 'теория' || !m.tag) ? 'p' : m.tag === 'вариант' ? 'y' : 'red')),
        el('td', null, m.taskN ? chip('Задание ' + m.taskN, 'grey') : el('span', { style:{ color:'var(--ink-3)' }}, '—')),
        el('td', null, el('span', { style:{ color:'var(--ink-3)' }}, m.size || '—')),
        el('td', { style:{ textAlign:'right' }},
          el('div', { style:{ display:'flex', gap:'4px', justifyContent:'flex-end' }},
            el('button', { class:'btn-icon', title:'Редактировать',
              onclick: async () => {
                try {
                  const ok = await editMaterial(m);
                  if(!ok) return;
                  /* Дополнительно для глобального списка предлагаем поменять привязку и тег */
                  const newTaskNStr = prompt('Привязка к заданию (1–26, пусто — без привязки):', m.taskN || '');
                  if(newTaskNStr !== null){
                    const newTaskN = newTaskNStr.trim() ? parseInt(newTaskNStr.trim()) : null;
                    await restRequest('PATCH', '/materials?id=eq.' + m.id, { ege_task_n: newTaskN }, { prefer: 'return=minimal' });
                  }
                  const newTag = prompt('Тег (теория / вариант / разбор / видео):', m.tag || 'теория');
                  if(newTag !== null && newTag.trim()){
                    await restRequest('PATCH', '/materials?id=eq.' + m.id, { tag: newTag.trim() }, { prefer: 'return=minimal' });
                  }
                  await loadMaterialsFromDb();
                  showToast('✓ Изменения сохранены');
                  render();
                } catch(e){ console.error(e); showToast('⚠ ' + e.message); }
              }
            }, '✏️'),
            el('button', { class:'btn-icon', style:{ color:'var(--red)' }, title:'Удалить',
              onclick: async () => {
                if(!confirm('Удалить «' + m.name + '»?')) return;
                try {
                  await deleteMaterial(m);
                  await loadMaterialsFromDb();
                  showToast('Удалено');
                  render();
                } catch(e){ showToast('⚠ ' + e.message); }
              }
            }, '🗑'))));
    }))));
  wrap.append(list);
  return wrap;
}

/* =======================================================================
   ПРЕВЬЮ ВОПРОСА В РЕДАКТОРЕ — РЕНДЕР КАК У УЧЕНИКА, НО С ОТВЕТАМИ
   ======================================================================= */
function questionPreview(q, idx, taskN){
  const block = el('div', { style:{ marginBottom:'12px', padding:'14px', border:'1px solid var(--border)', borderRadius:'12px', background:'#FFFCF2' }});

  /* Шапка */
  let typeLabel, typeKind;
  if(q.match){ typeLabel = '🔀 соответствие А–Д'; typeKind = 'p'; }
  else if(q.fillNn){ typeLabel = '✏️ заполнить Н/НН'; typeKind = 'warn'; }
  else if(q.text){ typeLabel = q.pair ? '🔁 пара паронимов' : '✏️ короткий ответ'; typeKind = 'p'; }
  else if(q.multi){ typeLabel = '☑ несколько верных'; typeKind = 'y'; }
  else { typeLabel = '○ один верный'; typeKind = 'grey'; }
  block.append(el('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px' }},
    el('div', { style:{ display:'flex', gap:'6px', alignItems:'center' }},
      chip(typeLabel, typeKind),
      el('span', { style:{ fontSize:'11px', color:'var(--ink-3)' }}, '#' + (idx+1))),
    el('div', { style:{ display:'flex', gap:'4px' }},
      el('button', { class:'btn-icon', title:'Редактировать вопрос',
        onclick: () => {
          /* Базовое редактирование: меняем текст вопроса и/или правильный ответ.
             Полноценный редактор всех типов вопросов (с опциями, предложениями и т.д.) —
             это отдельный экран, пока что только самое нужное. */
          const newQ = prompt('Текст вопроса:', q.q || '');
          if(newQ === null) return;
          q.q = newQ.trim() || q.q;
          if(q.match){
            const newA = prompt('Правильная последовательность цифр (например 81963):', String(q.a || ''));
            if(newA !== null && /^\d{5}$/.test(newA.trim())) q.a = newA.trim();
          } else if(q.text){
            const accept = (Array.isArray(q.a) ? q.a : [q.a]).join(' / ');
            const newA = prompt('Правильный ответ (несколько через «/»):', accept);
            if(newA !== null && newA.trim()) q.a = newA.split('/').map(s => s.trim()).filter(Boolean);
          } else if(q.multi){
            const cur = (q.a || []).map(x => x+1).join('');
            const newA = prompt('Номера правильных вариантов (например 134):', cur);
            if(newA !== null && /^\d+$/.test(newA.trim())) q.a = newA.split('').map(d => parseInt(d) - 1);
          } else if(typeof q.a === 'number'){
            const newA = prompt('Номер правильного ответа (1, 2, 3…):', String(q.a + 1));
            if(newA !== null && /^\d+$/.test(newA.trim())) q.a = parseInt(newA.trim()) - 1;
          }
          showToast('✏️ Изменения внесены в текущей сессии. Постоянное хранение вопросов в БД — отдельная задача.');
          render();
        }
      }, '✏️'),
      el('button', { class:'btn-icon', style:{ color:'var(--red)' }, title:'Удалить вопрос',
        onclick: () => {
          if(!confirm('Удалить этот вопрос из банка? (только в текущей сессии)')) return;
          const taskBank = QUIZ_BANK[taskN];
          if(taskBank){
            const i = taskBank.indexOf(q);
            if(i >= 0) taskBank.splice(i, 1);
          }
          showToast('Удалено из текущей сессии. Постоянное удаление — отдельная задача.');
          render();
        }
      }, '🗑'))));

  /* Текст вопроса */
  block.append(el('div', { style:{ fontWeight:'700', marginBottom:'10px' }}, q.q));

  /* Исходный текст (для заданий 1-3, 22-26).
     Для задания 22 он формально есть в данных, но не нужен в работе — прячем (как и у ученика). */
  if(q.sourceText && taskN !== 22){
    block.append(el('div', { style:{ padding:'12px 14px', background:'#FFFCF2', borderRadius:'10px', borderLeft:'3px solid var(--y)', marginBottom:'10px', fontSize:'12px', lineHeight:'1.6', whiteSpace:'pre-wrap' }},
      el('div', { style:{ fontWeight:'700', color:'var(--ink-2)', fontSize:'10px', textTransform:'uppercase', letterSpacing:'.06em', marginBottom:'6px' }}, '📖 Исходный текст'),
      q.sourceText));
  }

  /* Контекст (предложение или пронумерованный текст) */
  if(q.context){
    block.append(el('div', { style:{ padding:'10px 12px', background:'#fff', borderRadius:'8px', borderLeft:'3px solid var(--p)', marginBottom:'10px', fontSize:'13px', fontStyle:'italic', color:'var(--ink-2)', whiteSpace:'pre-wrap' }}, q.context));
  }

  /* Текст-шаблон для fillNn (задание 15) */
  if(q.fillNn && q.text){
    block.append(el('div', { style:{ padding:'12px 14px', background:'#FFFCF2', borderRadius:'10px', border:'1px solid var(--border)', marginBottom:'10px', fontSize:'14px', lineHeight:'1.6' }},
      el('div', { style:{ fontWeight:'700', color:'var(--ink-2)', fontSize:'10px', textTransform:'uppercase', letterSpacing:'.06em', marginBottom:'6px' }}, '📝 Текст с пропусками'),
      q.text));
  }

  /* Предложения (для задания 5).
     Для match-вопросов (8, 22) sentences — это правый столбец таблицы, его рендерим ниже,
     поэтому здесь как самостоятельный список НЕ показываем (был дубль). */
  if(q.sentences && !q.match){
    const sentList = el('div', { style:{ marginBottom:'10px', display:'flex', flexDirection:'column', gap:'6px' }});
    q.sentences.forEach((s, si) => {
      const html = s.replace(/[А-ЯЁ]{2,}/g, m => '<b style="background:#FEF9C3;padding:1px 4px;border-radius:3px">' + m + '</b>');
      sentList.append(el('div', {
        html: '<span style="color:var(--ink-3);font-size:11px;font-weight:700;margin-right:6px">' + (si+1) + ')</span>' + html,
        style:{ padding:'8px 12px', background:'#fff', borderRadius:'8px', borderLeft:'3px solid var(--p-2)', fontSize:'13px', lineHeight:'1.5' }
      }));
    });
    block.append(sentList);
  }

  /* Большое слово для пар */
  if(q.pair && q.word){
    block.append(el('div', { style:{ textAlign:'center', padding:'14px', background:'linear-gradient(135deg, #FEF9C3, #FDE68A)', borderRadius:'12px', marginBottom:'10px', border:'1px solid var(--y-2)' }},
      el('div', { style:{ fontSize:'10px', color:'#854D0E', textTransform:'uppercase', fontWeight:'700', marginBottom:'6px', letterSpacing:'.08em' }}, '🔁 Слово'),
      el('div', { style:{ fontSize:'24px', fontWeight:'800', letterSpacing:'-.02em', color:'var(--ink)' }}, q.word)));
  }

  /* Ответ — поле или варианты с правильным ответом */
  if(q.match){
    /* Соответствие А-Д ↔ номера */
    const grid = el('div', { style:{ display:'grid', gridTemplateColumns:'minmax(0,1fr) minmax(0,1.4fr)', gap:'12px' }});
    const leftCol = el('div', null,
      el('div', { style:{ fontSize:'10px', textTransform:'uppercase', color:'var(--ink-3)', fontWeight:'700', letterSpacing:'.06em', marginBottom:'8px' }}, q.leftLabel || 'Грамматические ошибки'));
    q.errors.forEach((errText, ei) => {
      const correct = q.a[ei];
      leftCol.append(el('div', {
        style:{ display:'flex', alignItems:'center', gap:'8px', padding:'6px 8px', background:'var(--green-soft)', border:'1px solid var(--green)', borderRadius:'8px', marginBottom:'6px' }
      },
        el('b', { style:{ minWidth:'20px', textAlign:'center', color:'#065F46' }}, correct),
        el('div', { style:{ fontSize:'12px', flex:1 }}, errText)));
    });
    const rightCol = el('div', null,
      el('div', { style:{ fontSize:'10px', textTransform:'uppercase', color:'var(--ink-3)', fontWeight:'700', letterSpacing:'.06em', marginBottom:'8px' }}, q.rightLabel || 'Предложения'));
    q.sentences.forEach((s, si) => {
      rightCol.append(el('div', { style:{ display:'flex', gap:'8px', padding:'6px 10px', background:'#fff', borderRadius:'8px', marginBottom:'6px', fontSize:'12px', lineHeight:'1.4' }},
        el('b', { style:{ color:'var(--p)', minWidth:'18px' }}, (si+1) + ')'),
        el('div', { style:{ flex:1 }}, s)));
    });
    grid.append(leftCol);
    grid.append(rightCol);
    block.append(grid);
  } else if(q.fillNn){
    /* Для Н/НН показываем правильную раскладку под текстом */
    block.append(el('div', { style:{ padding:'8px 10px', background:'var(--green-soft)', borderRadius:'8px', fontSize:'12px', color:'#065F46', fontWeight:'700' }},
      '✓ Правильно: ' + q.correct.map((c, k) => (k+1) + ') ' + c).join(', ')));
  } else if(q.text){
    const accept = Array.isArray(q.a) ? q.a : [q.a];
    block.append(el('div', null,
      el('input', {
        type:'text', value: accept[0], readonly:'readonly',
        style:{ width:'100%', padding:'10px 14px', borderRadius:'10px', fontSize:'14px',
                border:'2px solid var(--green)', background:'var(--green-soft)', color:'#065F46', fontWeight:'700' }
      }),
      accept.length > 1
        ? el('div', { style:{ marginTop:'6px', fontSize:'12px', color:'var(--ink-2)' }},
            'Также принимаются: ' + accept.slice(1).join(', '))
        : null));
  } else if(q.opts){
    const opts = el('div', { style:{ display:'flex', flexDirection:'column', gap:'6px' }});
    q.opts.forEach((opt, i) => {
      const isCorrect = q.multi ? q.a.includes(i) : i === q.a;
      opts.append(el('div', {
        style:{ padding:'10px 14px', borderRadius:'10px', display:'flex', alignItems:'center', gap:'10px',
                background: isCorrect ? 'var(--green-soft)' : '#fff',
                color: isCorrect ? '#065F46' : 'var(--ink-2)',
                border: '1px solid ' + (isCorrect ? 'var(--green)' : 'var(--border-2)'),
                fontWeight: isCorrect ? '700' : '500' }
      },
        q.multi ? (isCorrect ? '☑' : '☐') : (isCorrect ? '●' : '○'),
        (i+1) + ') ' + opt));
    });
    block.append(opts);
  }

  /* Подсказка */
  if(q.hint){
    block.append(el('div', { style:{ marginTop:'8px', padding:'8px 10px', background:'var(--p-soft)', borderRadius:'8px', fontSize:'12px', color:'var(--p-deep)' }},
      '💡 ' + q.hint));
  }

  if(q.src){
    block.append(el('div', { style:{ marginTop:'6px', fontSize:'10px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.06em', fontWeight:'700' }},
      '📚 ' + q.src));
  }

  return block;
}

function modalEditTheory(n){

  const mats = MATERIALS.filter(m => m.taskN === n);
  const qs = QUIZ_BANK[n] || [];

    onclick: e => { if(e.target.classList.contains('modal-bg')){ STATE.contentEditTaskN = null; render(); }}
  },
    el('div', { class:'modal' },
      el('div', { class:'modal-head' },
        el('div', null,
          el('div', { style:{ fontSize:'11px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.08em', fontWeight:'700' }},
            '✏️ Редактирование · Задание ' + n + ' · День ' + t.day),
          el('h2', null, t.topic)),
        el('button', { class:'x', onclick: () => { STATE.contentEditTaskN = null; render(); }}, '×')),
      el('div', { class:'modal-body' },
        /* Текст теории */
        (function(){
          const card = el('div', { class:'card', style:{ marginBottom:'14px', background:'var(--surface-soft)' }});
          const ta = el('textarea', {
            placeholder: 'Опишите тему: что проверяется в задании ' + n + ', типичные ловушки, формулы, правила. Можно с разметкой Markdown.',
            style:{ width:'100%', padding:'12px', borderRadius:'10px', border:'1px solid var(--border-2)', minHeight:'160px', resize:'vertical', marginTop:'8px', fontFamily:'inherit', fontSize:'14px', lineHeight:'1.5' }
          }, THEORY[n] || '');
          const status = el('span', { style:{ fontSize:'12px', color:'var(--ink-3)', marginLeft:'10px' }}, '');
          const saveBtn = el('button', { class:'btn btn-y btn-sm', style:{ marginTop:'8px' },
            onclick: async () => {
              const text = ta.value.trim();
              saveBtn.disabled = true;
              status.textContent = '⏳ Сохраняем…';
              status.style.color = 'var(--ink-3)';
              try {
                await saveTheoryToDb(n, text);
                status.textContent = '✓ Сохранено в БД';
                status.style.color = 'var(--green)';
                showToast('Теория задания ' + n + ' сохранена в базу');
              } catch(e){
                console.warn(e);
                status.textContent = '⚠ ' + e.message;
                status.style.color = 'var(--red)';
              } finally {
                saveBtn.disabled = false;
              }
            }
          }, '💾 Сохранить в БД');
          card.append(
            el('h4', null, '📖 Текст теории (то, что увидит ученик)'),
            el('p', { style:{ fontSize:'12px', color:'var(--ink-3)', margin:'4px 0 4px 0' }},
              'Сохраняется в таблицу ege_tasks, поле theory_md. После сохранения — обновите страницу, чтобы убедиться, что записалось.'),
            ta,
            el('div', { style:{ display:'flex', alignItems:'center', marginTop:'8px' }}, saveBtn, status));
          return card;
        })(),

        /* Материалы */
        (function(){
          const card = el('div', { class:'card', style:{ marginBottom:'14px' }});
          const fileInput = el('input', { type:'file', style:{ display:'none' },
            onchange: async (ev) => {
              const file = ev.target.files[0];
              if(!file) return;
              const status = document.getElementById('mat-status-' + n);
              if(status){ status.textContent = '⏳ Загружаю «' + file.name + '»…'; status.style.color = 'var(--ink-3)'; }
              try {
                await uploadMaterial(file, n);
                await loadMaterialsFromDb();
                showToast('✓ Файл «' + file.name + '» прикреплён к заданию ' + n);
                render();
              } catch(e){
                console.error('Загрузка упала:', e);
                showToast('⚠ Не загрузилось: ' + e.message);
                if(status){ status.textContent = '⚠ ' + e.message; status.style.color = 'var(--red)'; }
              } finally {
                ev.target.value = '';
              }
            }
          });
          card.append(fileInput);
          card.append(el('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px', flexWrap:'wrap', gap:'8px' }},
            el('h4', null, '📎 Материалы по этому заданию (' + mats.length + ')'),
            el('div', { style:{ display:'flex', gap:'6px', flexWrap:'wrap' }},
              el('button', { class:'btn btn-y btn-sm',
                onclick: () => fileInput.click()
              }, '⬆ Прикрепить файл'),
              el('button', { class:'btn btn-secondary btn-sm',
                onclick: () => {
                  const url = prompt('URL ссылки (например, на Padlet, Google Drive, Yandex Disk):');
                  if(!url || !url.trim()) return;
                  let cleanUrl = url.trim();
                  if(!/^https?:\/\//i.test(cleanUrl)) cleanUrl = 'https://' + cleanUrl;
                  /* По умолчанию подставляем домен — короче и понятнее, чем длинный URL */
                  const defaultName = extractDomain(cleanUrl);
                  const name = prompt('Название ссылки (что увидит ученик):', defaultName);
                  if(!name || !name.trim()) return;
                  attachLink(name.trim(), cleanUrl, n).then(() => loadMaterialsFromDb()).then(() => {
                    showToast('✓ Ссылка прикреплена');
                    render();
                  }).catch(e => { console.error(e); showToast('⚠ ' + e.message); });
                }
              }, '🔗 Прикрепить ссылку'))));
          card.append(el('div', { id:'mat-status-' + n, style:{ fontSize:'12px', marginBottom:'8px', minHeight:'14px' }}, ''));

              /* Если у ссылки в name случайно тот же URL — не показываем второй раз справа */
              const showRightSide = m.external_url
                ? (m.name !== m.external_url)

              row.append(el('span', { style:{ flex:'1', minWidth:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }},
                icon + ' ' + m.name, showRightSide ? sizeOrUrl : null));
              row.append(el('button', { class:'btn-icon', style:{ color:'var(--p)' },
                title: 'Редактировать',
                onclick: async () => {
                  try {
                    const ok = await editMaterial(m);
                    if(!ok) return;
                    await loadMaterialsFromDb();
                    showToast('✓ Изменения сохранены');

                  } catch(e){ console.error(e); showToast('⚠ ' + e.message); }
                }
              }, '✏️'));
              row.append(el('button', { class:'btn-icon', style:{ color:'var(--red)' },
                title: 'Удалить',
                onclick: async () => {
                  if(!confirm('Удалить «' + m.name + '»?')) return;
                  try {
                    await deleteMaterial(m);
                    await loadMaterialsFromDb();
                    showToast('Удалено');
                    render();
                  } catch(e){ showToast('⚠ ' + e.message); }
                }
              }, '✕'));
              list.append(row);
            });
            card.append(list);
          } else {
            card.append(el('p', { style:{ color:'var(--ink-3)', fontSize:'13px' }},
              'Нет привязанных материалов. Загрузите PDF/DOC/PNG или прикрепите ссылку.'));
          }
          return card;
        })(),

        /* Банк тестов */
        el('div', { class:'card', style:{ background:'var(--y-soft)', border:'1px solid var(--y-2)' }},
          el('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px' }},
            el('h4', null, '🎯 Вопросы тренажёра (' + qs.length + ')'),
            el('button', { class:'btn btn-y btn-sm',
              onclick: () => showToast('Откроется форма нового вопроса')
            }, '➕ Добавить вопрос')),
          qs.length > 0
            ? el('div', null, qs.map((q, i) => questionPreview(q, i, n)))
            : el('p', { style:{ color:'var(--ink-3)', fontSize:'13px' }},
                'Банк пуст. Добавьте 5–10 вопросов — и они начнут появляться в тренажёрах и сборке случайного варианта.'))),
      el('div', { class:'modal-foot' },
        el('span', { style:{ fontSize:'12px', color:'var(--ink-2)' }},
          'Изменения видны ученикам сразу после сохранения'),
        el('button', { class:'btn btn-p',
          onclick: () => { STATE.contentEditTaskN = null; showToast('Карточка задания ' + n + ' сохранена'); }

      if(actMats.length){
        const matList = el('div', { style:{ display:'flex', flexDirection:'column', gap:'4px', paddingTop:'6px', borderTop:'1px dashed var(--border)' }});

          const kind = prompt('Тип (morning / webinar / review / essay):', 'morning');
          if(!kind || !/^(morning|webinar|review|essay)$/.test(kind.trim())){
            showToast('Тип должен быть одним из: morning, webinar, review, essay'); return;
          }
          const time = prompt('Время начала (например, «13:00» или «утро»):', '13:00');
          const est = prompt('Длительность (например, «15 мин», «1.5 ч»):', '1 ч');
          const maxBeeStr = prompt('Сколько пчёлок можно заработать (число):', '5');
          d.tasks.push({
            id: 't' + d.id + '-' + (d.tasks.length + 1),
            title: title.trim(),
            kind: kind.trim(),
            time: (time || '').trim(),
            est: (est || '').trim(),
            maxBee: /^\d+$/.test((maxBeeStr || '').trim()) ? parseInt(maxBeeStr.trim()) : 5
          });
          showToast('✓ Задание добавлено в день ' + d.id);
          render();
        }
      }, '＋ Добавить задание'));
    det.append(inner);
    wrap.append(det);
  });
  wrap.append(el('p', { style:{ fontSize:'11px', color:'var(--ink-3)', marginTop:'14px', fontStyle:'italic' }},
    '💡 Изменения сейчас живут только в текущей сессии браузера. Постоянное хранение в БД (intensive_days / day_activities) — отдельная задача.'));
  return wrap;
}

  const panel = el('div', { class:'chat-panel' });
  panel.append(
    el('div', { class:'chat-head' },
      el('div', null,
        el('h4', null, '💬 Чат интенсива'),
        el('div', { style:{ fontSize:'11px', opacity:.8 }}, '🐝 Краш-тест 2026')),
      el('button', { style:{ color:'#fff', fontSize:'18px' },
        onclick: () => { STATE.chatOpen = false; render(); }
      }, '×')),
    el('div', { class:'chat-tabs' },
      el('button', { class: STATE.chatChannel === 'group' ? 'active' : '',
        onclick: () => { STATE.chatChannel = 'group'; render(); }
      }, 'Общий'),
      el('button', { class: STATE.chatChannel === 'dm' ? 'active' : '',
        onclick: () => { STATE.chatChannel = 'dm'; render(); }
      }, role === 'student' ? 'Личное · Учитель' : 'Личное · Аня')));

  const msgsBox = el('div', { class:'chat-msgs', id:'chat-msgs' });
  msgs.forEach(m => msgsBox.append(chatBubble(m, role, meId)));
  panel.append(msgsBox);

  panel.append(
    el('div', { class:'chat-input' },
      el('input', { id:'chat-i', placeholder:'Сообщение…',
        onkeydown: e => { if(e.key === 'Enter'){ e.preventDefault(); sendChat(role, meId, meName); }}}),
      el('button', { onclick: () => sendChat(role, meId, meName) }, 'Отправить')));
  return panel;
}

function chatBubble(m, role, meId){
  const mine = m.from === meId;
  const canMark = (role === 'teacher' || role === 'curator') && m.helpable && !mine;
  const wasMarked = STATE.helpedMsgs[m.id];
  const bubble = el('div', { class: 'bubble ' + (mine ? 'me' : 'them') });
  if(!mine){
    const who = el('div', { class:'who' }, m.name);
    if(m.curator) who.append(el('span', { class:'role-mini' }, '🤝 куратор'));
    if(m.from === 't') who.append(el('span', { class:'role-mini', style:{ background:'var(--p-soft)', color:'var(--p-deep)' }}, '👩‍🏫 учитель'));
    bubble.append(who);
  }
  bubble.append(el('div', null, m.text));
  bubble.append(el('div', { class:'time' }, m.time));
  if(canMark){
    bubble.append(
      el('button', { class:'helped-btn ' + (wasMarked ? 'active' : ''),
        onclick: () => {
          if(!wasMarked){
            STATE.helpedMsgs[m.id] = true;
            showToast('🤝 ' + m.name + ' получает «Помогла другу» (+10 🐝)');
            render();
          }
        }
      }, wasMarked ? '✓ помогло' : '🤝 пометить «помогло»'));
  }
  return bubble;
}

function sendChat(role, meId, meName){
  const i = document.getElementById('chat-i');
  if(!i || !i.value.trim()) return;
  const arr = STATE.chatChannel === 'group' ? CHAT_GROUP : CHAT_DM;
  arr.push({
    id: 'm' + Date.now(),
    from: meId, name: meName, text: i.value,
    time: new Date().toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' }),
    curator: role === 'curator'
  });
  i.value = '';
  render();
}

function chatFab(){
  return el('button', { class:'chat-fab',
    onclick: () => { STATE.chatOpen = true; render(); },
    title: 'Чат'
  }, '💬', el('span', { class:'dot' }));
}

/* =======================================================================
   ОСНОВНОЙ РЕНДЕР
   ======================================================================= */
function render(){
  const root = document.getElementById('root');

  /* Сохраняем позиции прокрутки, чтобы экран не прыгал наверх при клике */
  const savedModalScroll = (document.querySelector('.modal-body') || {}).scrollTop || 0;
  const savedChatScroll = (document.querySelector('.chat-msgs') || {}).scrollTop || 0;
  const savedWindowScroll = window.scrollY || 0;

  root.innerHTML = '';

  if(STATE.view === 'login'){
    root.append(viewLogin());
    if(STATE.toast) root.append(el('div', { class:'toast' }, STATE.toast));
    return;
  }

  if(STATE.view === 'student'){
    const tabs = [
      { key:'home', label:'Главная', ic:'🏠' },
      { key:'days', label:'Дни интенсива', ic:'📅' },
      { key:'theory', label:'Теория', ic:'📚' },
      { key:'achievements', label:'Достижения', ic:'🏆' },
      { key:'profile', label:'Профиль', ic:'👤' },
    ];
    const map = {
      home: viewStudentHome,
      days: viewStudentDays,
      theory: viewStudentTheory,
      achievements: viewStudentAchievements,
      profile: viewStudentProfile,
    };
    const content = map[STATE.studentTab]();
    root.append(
      shellHeader('student'),
      shellTabs('student', tabs, STATE.studentTab, k => { STATE.studentTab = k; render(); }),
      el('main', { class:'main' }, content),
      chatFab()
    );
  }

  if(STATE.view === 'curator'){
    const tabs = [
      { key:'students', label:'Ученики', ic:'👥' },
      { key:'essays', label:'Сочинения', ic:'📝',
        badge: ESSAYS.filter(e => e.status === 'new').length || null },
      { key:'chat', label:'Чат', ic:'💬' },
    ];
    const map = {
      students: viewCuratorStudents,
      essays: viewCuratorEssays,
      chat: viewCuratorChat,
    };
    const content = map[STATE.curatorTab]();
    root.append(
      shellHeader('curator'),
      shellTabs('curator', tabs, STATE.curatorTab, k => { STATE.curatorTab = k; render(); }),
      el('main', { class:'main' }, content),
      chatFab()
    );
  }

  if(STATE.view === 'teacher'){
    const pendingCount = STUDENTS.filter(s => s.status === 'pending').length;
    const newEssays = ESSAYS.filter(e => e.status === 'new').length;
    const preCheckEssays = ESSAYS.filter(e => e.status === 'pre_checked').length;
    const tabs = [
      { key:'overview', label:'Сводка', ic:'📊' },
      { key:'students', label:'Ученики', ic:'👥', badge: pendingCount || null, badgeKind:'warn' },
      { key:'attendance', label:'Посещаемость', ic:'✓' },
      { key:'payments', label:'Оплаты', ic:'💰' },
      { key:'essays', label:'Сочинения', ic:'📝', badge: (newEssays + preCheckEssays) || null },
      { key:'analytics', label:'Аналитика', ic:'📈' },
      { key:'content', label:'Контент', ic:'📚' },
      { key:'days', label:'Дни', ic:'📅' },
    ];
    const map = {
      overview: viewTeacherOverview,
      students: viewTeacherStudents,
      attendance: viewTeacherAttendance,
      payments: viewTeacherPayments,
      essays: viewTeacherEssays,
      analytics: viewTeacherAnalytics,
      content: viewTeacherContent,
      days: viewTeacherDays,
    };
    const content = map[STATE.teacherTab]();
    root.append(
      shellHeader('teacher'),
      shellTabs('teacher', tabs, STATE.teacherTab, k => { STATE.teacherTab = k; render(); }),
      el('main', { class:'main' }, content),
      chatFab()
    );
  }

  /* Модалки */
  if(STATE.testOpen != null) root.append(modalTest(STATE.testOpen));
  if(STATE.essayOpen) root.append(modalEssayReview(STATE.essayOpen));
  if(STATE.newStudentForm) root.append(modalNewStudent());
  if(STATE.curatorPermsFor) root.append(modalCuratorPerms());
  if(STATE.studentDetailOpen) root.append(modalStudentDetail());
  /* Onboarding: если у профиля имя = префикс email (то есть дефолтное автогенерённое),
     показываем форму с просьбой ввести имя. Только один раз. */
  if(MY_PROFILE && !STATE._onboardingDismissed){
    const emailPrefix = (MY_PROFILE.email || '').split('@')[0];
    const needsName = !MY_PROFILE.full_name
      || MY_PROFILE.full_name === emailPrefix
      || MY_PROFILE.full_name === 'Гость';
    if(needsName) root.append(modalOnboardingName());
  }
  if(STATE.attendanceOpen) root.append(modalAttendance());
  if(STATE.theoryOpen != null) root.append(modalTheory(STATE.theoryOpen));
  if(STATE.contentEditTaskN != null) root.append(modalEditTheory(STATE.contentEditTaskN));
  if(STATE.variantMode) root.append(modalVariantBuilder());
  if(STATE.showOnboarding) root.append(modalOnboarding());
  if(STATE.essayDraftOpen) root.append(modalEssayDraft());
  if(STATE.studentEssayResultOpen != null) root.append(modalEssayResult(STATE.studentEssayResultOpen));
  if(STATE.sampleOpen != null) root.append(modalEssaySample(STATE.sampleOpen));
  if(STATE.sampleEditOpen != null) root.append(modalEssaySampleEdit());
  if(STATE.chatOpen && STATE.view !== 'login') root.append(chatPanel(STATE.view));
  if(STATE.toast) root.append(el('div', { class:'toast' }, STATE.toast));

  /* Восстанавливаем позиции прокрутки после ререндера */
  requestAnimationFrame(() => {
    const newModal = document.querySelector('.modal-body');
    if(newModal && savedModalScroll) newModal.scrollTop = savedModalScroll;
    const newChat = document.querySelector('.chat-msgs');
    if(newChat && savedChatScroll) newChat.scrollTop = savedChatScroll;
    if(savedWindowScroll) window.scrollTo(0, savedWindowScroll);
  });
}

/* Стартуем с восстановления сессии (если есть) */
if(sb){
  restoreSession();
} else {
  STATE.authLoading = false;
  STATE.authMode = 'demo';
  render();
}
</script>
</body>
</html>

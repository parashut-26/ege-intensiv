<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZebRus · Зимняя гонка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Зимний полдень: светлый ледяной фон + красные/золотые акценты
       (как ягоды рябины на снегу и солнце в инее). Гоночная серия,
       тема — зимняя гонка на санях. */
    --bg-0: #f0f9ff;
    --bg-1: #e0f2fe;
    --bg-2: #cffafe;
    --asphalt: #cbd5e1;            /* укатанная снежная трасса */
    --line-yellow: #f59e0b;        /* солнечный акцент */
    --racing-red: #dc2626;         /* красные ягоды рябины */
    --neon-cyan: #0891b2;          /* морозная глубокая бирюза */
    --neon-lime: #15803d;          /* зелёная хвоя */
    --gold: #d97706;
    --text: #0f172a;
    --text-dim: #64748b;
    --correct: #16a34a;
    --wrong: #dc2626;
    --partial: #d97706;
    --font-display: 'Marck Script', 'Comic Sans MS', system-ui, cursive;
    --font-body: 'Manrope', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100vh;
    background: var(--bg-0);
    color: var(--text);
    font-family: var(--font-body);
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at top, rgba(8, 145, 178, 0.10), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(245, 158, 11, 0.08), transparent 50%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-2) 100%);
    z-index: -2;
  }
  body::after {
    /* падающие снежинки-точки (тёмные на светлом фоне) */
    content: ""; position: fixed; inset: 0;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(255,255,255,0.9) 2px, transparent 2.5px),
      radial-gradient(circle at 80% 60%, rgba(255,255,255,0.8) 2px, transparent 2.5px),
      radial-gradient(circle at 50% 80%, rgba(255,255,255,0.9) 2px, transparent 2.5px),
      radial-gradient(circle at 30% 50%, rgba(255,255,255,0.7) 2px, transparent 2.5px),
      radial-gradient(circle at 70% 10%, rgba(255,255,255,0.85) 2px, transparent 2.5px);
    background-size: 240px 240px;
    z-index: -1; pointer-events: none;
    opacity: 0.6;
  }
  .app { max-width: 980px; margin: 0 auto; padding: 32px 20px 80px; position: relative; }

  /* СТАРТОВЫЙ ЭКРАН */
  .start-screen { text-align: center; padding: 50px 20px 30px; animation: slideIn 0.5s ease; }
  .start-screen .title {
    font-family: var(--font-display);
    font-size: clamp(2.2rem, 6vw, 4rem);
    line-height: 0.95;
    color: var(--line-yellow);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-shadow: 0 0 40px rgba(255, 216, 61, 0.3);
  }
  .start-screen .title .accent { color: var(--racing-red); }
  .start-screen .subtitle {
    font-family: var(--font-mono);
    font-size: 0.9rem;
    color: var(--text-dim);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 40px;
  }
  .start-screen .car-anim {
    font-size: 5rem;
    margin-bottom: 30px;
    display: inline-block;
    animation: drive 3s ease-in-out infinite;
  }
  @keyframes drive {
    0%, 100% { transform: translateX(-30px); }
    50% { transform: translateX(30px); }
  }
  .start-screen .input-group { max-width: 400px; margin: 0 auto 24px; text-align: left; }
  .start-screen label {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--neon-cyan);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .start-screen input {
    width: 100%;
    padding: 16px 20px;
    background: var(--bg-2);
    border: 2px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 1.1rem;
    font-weight: 600;
    transition: all 0.2s ease;
    outline: none;
  }
  .start-screen input:focus {
    border-color: var(--line-yellow);
    box-shadow: 0 0 0 4px rgba(255, 216, 61, 0.1);
  }
  .start-screen input::placeholder { color: var(--text-dim); }
  .rules {
    max-width: 500px;
    margin: 28px auto;
    padding: 24px;
    background: rgba(0, 229, 255, 0.05);
    border: 1px dashed rgba(0, 229, 255, 0.3);
    border-radius: 12px;
    text-align: left;
  }
  .rules h3 {
    font-family: var(--font-display);
    font-size: 1rem;
    color: var(--neon-cyan);
    letter-spacing: 3px;
    margin-bottom: 12px;
  }
  .rules ul { list-style: none; }
  .rules li { padding: 6px 0; color: var(--text-dim); font-size: 0.95rem; }
  .rules li::before { content: "▸ "; color: var(--line-yellow); margin-right: 6px; }

  /* ШАПКА */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px dashed rgba(255, 216, 61, 0.3);
    position: relative;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header::after {
    content: ""; position: absolute;
    left: 0; right: 0; bottom: -2px;
    height: 6px;
    background-image: repeating-conic-gradient(var(--text) 0% 25%, transparent 0% 50%);
    background-size: 12px 12px;
    opacity: 0.4;
  }
  .logo {
    font-family: var(--font-display);
    font-size: clamp(1.2rem, 2.5vw, 1.6rem);
    line-height: 0.95;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .logo .accent { color: var(--racing-red); }
  .logo .player {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-top: 4px;
    font-weight: 500;
  }
  .stats { display: flex; gap: 20px; align-items: center; font-family: var(--font-mono); }
  .stat .label {
    font-size: 0.65rem;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .stat .value { font-family: var(--font-display); font-size: 1.5rem; line-height: 1; }
  .stat .value.bees { color: var(--line-yellow); }
  .stat .value.timer { color: var(--neon-cyan); }
  .sound-toggle {
    background: transparent;
    border: 1px solid var(--text-dim);
    color: var(--text-dim);
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.2s ease;
  }
  .sound-toggle:hover {
    color: var(--line-yellow);
    border-color: var(--line-yellow);
  }
  .sound-toggle.muted { opacity: 0.4; }

  /* ТРАССА */
  .track { margin-bottom: 28px; position: relative; }
  .track-info {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .track-info .current { color: var(--neon-cyan); }
  .track-bar {
    height: 22px;
    background: var(--asphalt);
    border-radius: 11px;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .track-bar::before {
    content: "";
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 3px;
    transform: translateY(-50%);
    background-image: repeating-linear-gradient(90deg,
      var(--line-yellow) 0 16px, transparent 16px 28px);
    opacity: 0.4;
  }
  .track-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--racing-red), var(--gold));
    transition: width 0.6s cubic-bezier(.2, .9, .3, 1);
  }
  .track-car {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 1.3rem;
    transition: left 0.6s cubic-bezier(.2, .9, .3, 1);
    filter: drop-shadow(0 0 8px rgba(255, 216, 61, 0.6));
    z-index: 2;
  }

  /* КАРТА ЗАДАНИЯ */
  .card {
    background: linear-gradient(180deg, #ffffff, #f8fafc);
    border: 1px solid rgba(8, 145, 178, 0.15);
    border-radius: 20px;
    padding: 36px 32px;
    position: relative;
    box-shadow: 0 20px 40px -20px rgba(8, 145, 178, 0.25), 0 4px 12px rgba(15, 23, 42, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.8);
  }
  .card::before {
    content: attr(data-num);
    position: absolute;
    top: -14px;
    left: 28px;
    background: var(--line-yellow);
    color: var(--bg-0);
    font-family: var(--font-display);
    font-size: 0.9rem;
    padding: 4px 14px;
    border-radius: 4px;
    letter-spacing: 2px;
    transform: skewX(-12deg);
  }
  .task-label {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--neon-cyan);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .task-label .hint { color: var(--text-dim); margin-left: 8px; }
  .sentence {
    font-size: clamp(1.1rem, 2.2vw, 1.45rem);
    line-height: 1.7;
    font-weight: 500;
    margin-bottom: 28px;
    color: var(--text);
  }
  .word {
    display: inline-block;
    padding: 4px 8px;
    margin: 2px 1px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    border: 1.5px solid transparent;
    user-select: none;
  }
  .word:hover {
    background: rgba(255, 216, 61, 0.1);
    border-color: rgba(255, 216, 61, 0.4);
  }
  .word.selected {
    background: rgba(255, 216, 61, 0.2);
    border-color: var(--line-yellow);
    color: var(--line-yellow);
    box-shadow: 0 0 12px rgba(255, 216, 61, 0.4);
  }
  .word.correct {
    background: rgba(0, 255, 136, 0.2);
    border-color: var(--correct);
    color: var(--correct);
    box-shadow: 0 0 16px rgba(0, 255, 136, 0.5);
    pointer-events: none;
  }
  .word.wrong {
    background: rgba(255, 56, 96, 0.2);
    border-color: var(--wrong);
    color: var(--wrong);
    text-decoration: line-through;
    pointer-events: none;
  }
  .word.missed {
    background: rgba(255, 184, 0, 0.15);
    border-color: var(--partial);
    color: var(--partial);
    pointer-events: none;
    animation: pulseMiss 1s ease 2;
  }
  @keyframes pulseMiss {
    0%, 100% { box-shadow: 0 0 0 rgba(255, 184, 0, 0); }
    50% { box-shadow: 0 0 18px rgba(255, 184, 0, 0.6); }
  }
  .word.disabled { pointer-events: none; opacity: 0.5; }
  .punct { display: inline; color: var(--text-dim); }

  /* КНОПКИ */
  .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .btn {
    font-family: var(--font-display);
    font-size: 1rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 14px 28px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-primary {
    background: var(--racing-red);
    color: #ffffff;
    box-shadow: 0 4px 0 #991b1b, 0 10px 30px -10px rgba(220, 38, 38, 0.5);
  }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #991b1b, 0 14px 36px -10px rgba(220, 38, 38, 0.6);
  }
  .btn-primary:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #991b1b;
  }
  .btn-primary:disabled {
    background: var(--asphalt);
    color: var(--text-dim);
    box-shadow: none;
    cursor: not-allowed;
  }
  .btn-secondary {
    background: transparent;
    color: var(--text-dim);
    border: 1.5px solid var(--text-dim);
  }
  .btn-secondary:hover {
    color: var(--neon-cyan);
    border-color: var(--neon-cyan);
  }
  .btn-large { font-size: 1.3rem; padding: 20px 48px; }

  /* ФИДБЕК */
  .feedback {
    margin-top: 24px;
    padding: 20px 24px;
    border-radius: 12px;
    border-left: 4px solid;
    animation: slideIn 0.4s cubic-bezier(.2, .9, .3, 1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .feedback.correct { background: rgba(0, 255, 136, 0.08); border-color: var(--correct); }
  .feedback.partial { background: rgba(255, 184, 0, 0.08); border-color: var(--partial); }
  .feedback.wrong { background: rgba(255, 56, 96, 0.08); border-color: var(--wrong); }
  .feedback .status {
    font-family: var(--font-display);
    font-size: 1.1rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .feedback.correct .status { color: var(--correct); }
  .feedback.partial .status { color: var(--partial); }
  .feedback.wrong .status { color: var(--wrong); }
  .phrase {
    font-family: var(--font-mono);
    font-size: 1.1rem;
    color: var(--line-yellow);
    margin-bottom: 6px;
  }
  .phrase::before { content: "» "; color: var(--text-dim); }
  .meaning { color: var(--text); line-height: 1.6; }
  .meaning strong { color: var(--neon-cyan); }

  /* ФИНИШ */
  .finish { text-align: center; padding: 50px 20px; animation: slideIn 0.6s ease; }
  .finish .flag { font-size: 4rem; margin-bottom: 16px; animation: wave 2s ease-in-out infinite; }
  @keyframes wave {
    0%, 100% { transform: rotate(-10deg); }
    50% { transform: rotate(10deg); }
  }
  .finish h2 {
    font-family: var(--font-display);
    font-size: clamp(2rem, 5vw, 3rem);
    color: var(--line-yellow);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .finish .player-name {
    font-family: var(--font-mono);
    color: var(--neon-cyan);
    font-size: 1.1rem;
    margin-bottom: 32px;
  }
  .finish-stats {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .finish-stat .label {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .finish-stat .value { font-family: var(--font-display); font-size: 2.5rem; }
  .finish-stat .value.bees { color: var(--gold); }
  .finish-stat .value.time { color: var(--neon-cyan); }
  .finish .medal {
    display: inline-block;
    padding: 12px 32px;
    background: linear-gradient(135deg, var(--racing-red), var(--gold));
    color: var(--bg-0);
    font-family: var(--font-display);
    letter-spacing: 3px;
    border-radius: 8px;
    margin-bottom: 28px;
    transform: skewX(-8deg);
  }

  @media (max-width: 600px) {
    .app { padding: 20px 14px 60px; }
    .card { padding: 28px 20px; }
    .stats { gap: 14px; }
    .stat .value { font-size: 1.2rem; }
    .btn { font-size: 0.85rem; padding: 12px 20px; }
  }
</style>
</head>
<body>

<div class="app" id="app"></div>

<script>
const CONFIG = {
  gameName: 'winter-forest',
  gameTitle: 'Зимняя гонка',
};

const TASKS = [
  { sentence: "Он стоял у окна и думал, звонить ли ей. Грешным делом подумал, что она могла бы сама написать. Но тут же прогнал эту мысль. Ему не хотелось быть мелочным.",
    phraseologism: { phrase: "Грешным делом", meaning: "признаюсь, каюсь; иногда так бывает (с оттенком самокритики)" } },
  { sentence: "Он вернулся домой, не раздеваясь прошёл на кухню и сел. Мать сразу поняла: что-то случилось. Он был сам не свой, отвечал коротко и смотрел в пол. Она молча поставила чайник.",
    phraseologism: { phrase: "сам не свой", meaning: "крайне расстроен, не в нормальном состоянии" } },
  { sentence: "Он хлопнул дверью так, что посуда на полке дрогнула. Слова вылетели сами, он не выбирал выражений. Он сказал это в сердцах, и уже через минуту пожалел. Но было поздно.",
    phraseologism: { phrase: "в сердцах", meaning: "в порыве гнева, раздражения; не сдержавшись" } },
  { sentence: "Он зашёл в кабинет и сразу почувствовал холодный взгляд начальника. В комнате было тихо, слишком тихо. Ему стало не по себе, хотя он ничего не сделал. Хотелось выйти.",
    phraseologism: { phrase: "не по себе", meaning: "неловко, тревожно, не в своей тарелке" } },
  { sentence: "Она слушала его речь спокойно. Но одно слово зацепило за живое. Она отвела глаза и больше не произнесла ни слова. Всё остальное стало неважным.",
    phraseologism: { phrase: "зацепило за живое", meaning: "задело самое важное, чувствительное; вызвало сильные переживания" } },
  { sentence: "Он вышел на улицу — и тут начался дождь. Как назло, зонт остался дома, а автобус уехал у него из-под носа. День начался неудачно. Он устало вытер лицо рукавом.",
    phraseologism: { phrase: "Как назло", meaning: "словно нарочно, в самый неподходящий момент" } },
  { sentence: "Девочка сидела тихо, но глаза у неё были яркие, живые. Когда она начинала говорить, в комнате становилось светлее. В ней была та самая искра божья, которую не спутаешь ни с чем. Учителя это сразу заметили.",
    phraseologism: { phrase: "искра божья", meaning: "талант, природная одарённость" } },
  { sentence: "Они прожили вместе тридцать лет. Не ругались, не спорили по пустякам, делили всё поровну. Жили душа в душу, как говорили соседи. Их считали редким примером согласия.",
    phraseologism: { phrase: "душа в душу", meaning: "в полном согласии, очень дружно" } },
  { sentence: "Он долго держал письмо в руках. Скрепя сердце, открыл конверт и начал читать. Там было именно то, чего он боялся. И всё равно легче стало, когда знал точно.",
    phraseologism: { phrase: "Скрепя сердце", meaning: "против своей воли, с большим нежеланием" } },
  { sentence: "Она услышала, что его переводят в другой город. Сердце сжалось, но она не подала виду. Пожала плечами и спросила: «Когда уезжаешь?» Он так и не понял, как ей было трудно.",
    phraseologism: { phrase: "не подала виду", meaning: "не показала своих чувств, скрыла переживания" } },
  { sentence: "Он всегда был в команде первым. Никогда не жаловался, не просил замену, не опаздывал. Он был в игре душой и телом, это чувствовали все. Тренер ценил его больше остальных.",
    phraseologism: { phrase: "душой и телом", meaning: "полностью, всем существом отдаваясь делу" } },
  { sentence: "Каждый раз, проходя мимо старого дома, он невольно замедлял шаг. Там теперь жила чужая семья. Но душа болит: будто предал кого-то. Хотел забыть, но не получалось.",
    phraseologism: { phrase: "душа болит", meaning: "сильно переживать, тревожиться о чём-либо" } },
  { sentence: "Она смотрела на сына, как будто он был единственным человеком на свете. Знала каждую привычку, чувствовала любое его настроение. Внуки говорили, что она души не чает в нём. И это была правда.",
    phraseologism: { phrase: "души не чает", meaning: "очень сильно любит, обожает" } },
  { sentence: "Он попробовал себя в разных делах — торговля, стройка, даже курсы кройки. Но всё было не то. Только когда начал преподавать, понял: душа лежит именно к этому. С тех пор не сомневался в выборе.",
    phraseologism: { phrase: "душа лежит", meaning: "нравится, имеется внутренняя склонность к чему-либо" } },
  { sentence: "Он молча смотрел, как она смеётся. Всё в ней казалось ему чудесным, даже то, что раньше раздражало. Он был без ума от неё. И сам это прекрасно понимал.",
    phraseologism: { phrase: "без ума", meaning: "очень сильно влюблён, в восторге от кого-либо или чего-либо" } },
  { sentence: "Предложение казалось разумным, выгодным и перспективным. Но что-то в нём было не по нутру. Он не мог объяснить, почему. Просто не хотел соглашаться.",
    phraseologism: { phrase: "не по нутру", meaning: "не нравится, противно по внутреннему ощущению" } }
];

function tokenize(text) {
  const tokens = [];
  const regex = /([А-Яа-яЁё\-]+|[.,!?;:«»—…"']+|\s+)/g;
  let m;
  while ((m = regex.exec(text)) !== null) {
    const t = m[0];
    if (/^\s+$/.test(t)) tokens.push({ type: 'space', text: ' ' });
    else if (/^[А-Яа-яЁё\-]+$/.test(t)) tokens.push({ type: 'word', text: t });
    else tokens.push({ type: 'punct', text: t });
  }
  return tokens;
}
function findPhraseIndices(tokens, phrase) {
  const phraseWords = phrase.toLowerCase().split(/\s+/).filter(Boolean);
  const wordIndices = [];
  tokens.forEach((tok, idx) => { if (tok.type === 'word') wordIndices.push(idx); });
  for (let i = 0; i <= wordIndices.length - phraseWords.length; i++) {
    let match = true;
    for (let j = 0; j < phraseWords.length; j++) {
      if (tokens[wordIndices[i + j]].text.toLowerCase() !== phraseWords[j]) { match = false; break; }
    }
    if (match) return phraseWords.map((_, j) => wordIndices[i + j]);
  }
  return [];
}
TASKS.forEach(task => {
  task.tokens = tokenize(task.sentence);
  task.phraseologism.indices = findPhraseIndices(task.tokens, task.phraseologism.phrase);
});

/* ===== ЗВУК (Web Audio — без файлов) ===== */
const Sound = {
  ctx: null,
  engineOscillator: null,
  engineGain: null,
  enabled: true,

  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { this.enabled = false; }
  },

  startEngine() {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx || this.engineOscillator) return;

    const osc1 = this.ctx.createOscillator();
    const osc2 = this.ctx.createOscillator();
    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    const masterGain = this.ctx.createGain();
    const filter = this.ctx.createBiquadFilter();

    osc1.type = 'sawtooth';
    osc1.frequency.value = 55;
    osc2.type = 'square';
    osc2.frequency.value = 82;

    lfo.frequency.value = 8;
    lfoGain.gain.value = 4;
    lfo.connect(lfoGain);
    lfoGain.connect(osc1.frequency);

    filter.type = 'lowpass';
    filter.frequency.value = 280;
    filter.Q.value = 5;

    masterGain.gain.value = 0;
    masterGain.gain.linearRampToValueAtTime(0.05, this.ctx.currentTime + 0.5);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(masterGain);
    masterGain.connect(this.ctx.destination);

    osc1.start(); osc2.start(); lfo.start();
    this.engineOscillator = { osc1, osc2, lfo };
    this.engineGain = masterGain;
  },

  stopEngine() {
    if (!this.engineOscillator) return;
    const now = this.ctx.currentTime;
    this.engineGain.gain.linearRampToValueAtTime(0, now + 0.4);
    const refs = this.engineOscillator;
    this.engineOscillator = null;
    setTimeout(() => {
      try { refs.osc1.stop(); refs.osc2.stop(); refs.lfo.stop(); } catch(e) {}
    }, 500);
  },

  rev() {
    if (!this.enabled || !this.engineOscillator) return;
    const now = this.ctx.currentTime;
    this.engineOscillator.osc1.frequency.cancelScheduledValues(now);
    this.engineOscillator.osc1.frequency.setValueAtTime(55, now);
    this.engineOscillator.osc1.frequency.linearRampToValueAtTime(110, now + 0.08);
    this.engineOscillator.osc1.frequency.linearRampToValueAtTime(55, now + 0.4);
  },

  /* ===== ЗИМНИЕ ЗВУКИ ===== */
  success() {
    /* Звон хрустальной сосульки: 4 тона по октаве вверх,
       синусоида, очень короткое атакование, длинный «звенящий» хвост. */
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [1046.5, 1318.5, 1568.0, 2093.0].forEach((freq, i) => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.value = 0;
      g.gain.linearRampToValueAtTime(0.10, now + i * 0.06 + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.8);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(now + i * 0.06); o.stop(now + i * 0.06 + 0.85);
    });
  },

  fail() {
    /* Звук падения в сугроб: мягкий «пуф» — низкая частота
       с быстрым затуханием + узкополосный шум через фильтр. */
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    /* низкий «упал»: */
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    const filt = this.ctx.createBiquadFilter();
    o.type = 'sine';
    o.frequency.setValueAtTime(180, now);
    o.frequency.exponentialRampToValueAtTime(60, now + 0.25);
    filt.type = 'lowpass';
    filt.frequency.value = 400;
    g.gain.value = 0;
    g.gain.linearRampToValueAtTime(0.18, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    o.connect(filt); filt.connect(g); g.connect(this.ctx.destination);
    o.start(now); o.stop(now + 0.4);
  },

  finish() {
    /* Бубенцы русской тройки на финиш: 6 высоких звонких нот,
       синусоида с лёгкой инкрементной модуляцией. */
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const bells = [1568.0, 1318.5, 1760.0, 2093.0, 1760.0, 2349.3];
    bells.forEach((freq, i) => {
      const o = this.ctx.createOscillator();
      const o2 = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'sine';
      o2.type = 'sine';
      o.frequency.value = freq;
      o2.frequency.value = freq * 2.01;  // лёгкий призвук
      g.gain.value = 0;
      g.gain.linearRampToValueAtTime(0.09, now + i * 0.13 + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.13 + 0.6);
      o.connect(g); o2.connect(g); g.connect(this.ctx.destination);
      o.start(now + i * 0.13); o.stop(now + i * 0.13 + 0.65);
      o2.start(now + i * 0.13); o2.stop(now + i * 0.13 + 0.65);
    });
  },

  toggle() {
    this.enabled = !this.enabled;
    if (!this.enabled) this.stopEngine();
    return this.enabled;
  }
};

/* ===== СОСТОЯНИЕ ===== */
const state = {
  playerName: '',
  inviteCode: null,
  current: 0,
  score: 0,
  selected: new Set(),
  answered: false,
  startTime: null,
  elapsedSeconds: 0,
  timerInterval: null,
  wrongTasks: []
};

const urlParams = new URLSearchParams(window.location.search);
state.inviteCode = urlParams.get('invite') || urlParams.get('id') || null;

/* ===== РЕЖИМ ВСТРАИВАНИЯ В ПЛАТФОРМУ ZebRus =====
   Если игра открыта в iframe платформы (`?mode=embed`):
   - стартовый экран ввода имени пропускается;
   - имя ученика берётся из ?name=... (передаёт платформа);
   - по финишу шлём результат через postMessage родителю;
   - кнопка «Новый заезд» заменяется на «Закрыть».
   В standalone-режиме (без mode=embed) игра работает как обычно
   — имя в localStorage, никаких отправок наружу. */
const EMBED = urlParams.get('mode') === 'embed';
if (EMBED) {
  state.playerName = urlParams.get('name') || 'Гость';
}

/* ===== ТАЙМЕР ===== */
function startTimer() {
  state.startTime = Date.now();
  state.timerInterval = setInterval(updateTimerDisplay, 1000);
}
function stopTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.elapsedSeconds = Math.floor((Date.now() - state.startTime) / 1000);
}
function updateTimerDisplay() {
  const seconds = Math.floor((Date.now() - state.startTime) / 1000);
  const el = document.getElementById('timer-value');
  if (el) el.textContent = formatTime(seconds);
}
function formatTime(seconds) {
  const m = Math.floor(seconds / 60).toString().padStart(2, '0');
  const s = (seconds % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

/* ===== СОХРАНЕНИЕ РЕЗУЛЬТАТА =====
   В embed-режиме: шлём postMessage родителю (платформа ZebRus сама
   запишет в Supabase в таблицу game_attempts с привязкой к ученику).
   В standalone-режиме (внешняя ссылка, гостевая игра): ничего не
   сохраняем — только лог в консоль.
*/
async function saveResult() {
  const result = {
    game_slug: CONFIG.gameName,        // 'race-phraseo'
    game_title: CONFIG.gameTitle,
    player_name: state.playerName,
    score: state.score,
    max_score: TASKS.length,
    time_seconds: state.elapsedSeconds,
    wrong_tasks: state.wrongTasks,
    finished_at: new Date().toISOString()
  };
  console.log('📊 Результат:', result);

  if (EMBED && window.parent && window.parent !== window) {
    try {
      window.parent.postMessage({ type: 'zebrus_game_result', payload: result }, '*');
    } catch (e) {
      console.warn('postMessage failed:', e);
    }
  }
}

/* ===== РЕНДЕР: СТАРТ ===== */
function renderStart() {
  const savedName = localStorage.getItem('zebrus_player_name') || '';
  document.getElementById('app').innerHTML = `
    <div class="start-screen">
      <div class="car-anim">🛷</div>
      <h1 class="title">Зимняя<span class="accent">.</span><br>гонка</h1>
      <p class="subtitle">Сани · ZebRus · 2026</p>
      <div class="input-group">
        <label for="name-input">Имя гонщика</label>
        <input type="text" id="name-input" placeholder="Например: Аня"
               value="${escapeAttr(savedName)}" maxlength="40" autocomplete="off">
      </div>
      <button class="btn btn-primary btn-large" id="start-btn">🏁 На старт</button>
      <div class="rules">
        <h3>Правила гонки</h3>
        <ul>
          <li>В каждом тексте спрятан фразеологизм</li>
          <li>Кликай по словам, чтобы выделить весь фразеологизм</li>
          <li>Жми «На финиш!», когда уверена</li>
          <li>За каждый правильный ответ — ❄ снежинка</li>
          <li>Время гонки тоже считается — постарайся быстрее</li>
        </ul>
      </div>
    </div>
  `;

  const input = document.getElementById('name-input');
  const btn = document.getElementById('start-btn');
  input.focus();
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') btn.click(); });
  btn.addEventListener('click', () => {
    const name = input.value.trim();
    if (!name) {
      input.focus();
      input.style.borderColor = 'var(--racing-red)';
      setTimeout(() => { input.style.borderColor = ''; }, 1500);
      return;
    }
    state.playerName = name;
    localStorage.setItem('zebrus_player_name', name);
    Sound.init();
    /* двигатель НЕ запускаем — звуки только дискретные */
    startTimer();
    renderGame();
  });
}

/* ===== РЕНДЕР: ИГРА ===== */
function renderGame() {
  if (state.current >= TASKS.length) { renderFinish(); return; }

  document.getElementById('app').innerHTML = `
    <header class="header">
      <div class="logo">
        Зимняя гонка<span class="accent">.</span>
        <span class="player">🛷 ${escapeHtml(state.playerName)}</span>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="label">❄ Снежинки</div>
          <div class="value bees" id="score-value">${state.score}</div>
        </div>
        <div class="stat">
          <div class="label">⏱️ Время</div>
          <div class="value timer" id="timer-value">00:00</div>
        </div>
        <button class="sound-toggle ${Sound.enabled ? '' : 'muted'}" id="sound-btn">
          ${Sound.enabled ? '🔊' : '🔇'}
        </button>
      </div>
    </header>
    <div class="track">
      <div class="track-info">
        <span>Старт</span>
        <span class="current" id="track-label"></span>
        <span>Финиш 🏁</span>
      </div>
      <div class="track-bar">
        <div class="track-fill" id="track-fill"></div>
        <div class="track-car" id="track-car">🛷</div>
      </div>
    </div>
    <main id="game-area"></main>
  `;

  document.getElementById('sound-btn').addEventListener('click', (e) => {
    const enabled = Sound.toggle();
    e.currentTarget.textContent = enabled ? '🔊' : '🔇';
    e.currentTarget.classList.toggle('muted', !enabled);
    /* двигатель не запускаем */
  });

  updateTrack();
  updateTimerDisplay();
  renderTask();
}

function renderTask() {
  const task = TASKS[state.current];
  state.selected = new Set();
  state.answered = false;
  updateTrack();

  const wordsHTML = task.tokens.map((tok, idx) => {
    if (tok.type === 'space') return ' ';
    if (tok.type === 'punct') return `<span class="punct">${escapeHtml(tok.text)}</span>`;
    return `<span class="word" data-idx="${idx}">${escapeHtml(tok.text)}</span>`;
  }).join('');

  document.getElementById('game-area').innerHTML = `
    <div class="card" data-num="№ ${String(state.current + 1).padStart(2, '0')}">
      <div class="task-label">
        Задание · найди фразеологизм
        <span class="hint">кликай по словам</span>
      </div>
      <p class="sentence">${wordsHTML}</p>
      <div class="actions">
        <button class="btn btn-primary" id="check-btn" disabled>На финиш!</button>
        <button class="btn btn-secondary" id="reset-btn">Сбросить</button>
      </div>
      <div id="feedback"></div>
    </div>
  `;

  document.querySelectorAll('.word').forEach(el => {
    el.addEventListener('click', () => {
      if (state.answered) return;
      const idx = parseInt(el.dataset.idx);
      Sound.rev();
      if (state.selected.has(idx)) {
        state.selected.delete(idx);
        el.classList.remove('selected');
      } else {
        state.selected.add(idx);
        el.classList.add('selected');
      }
      document.getElementById('check-btn').disabled = state.selected.size < 2;
    });
  });

  document.getElementById('check-btn').addEventListener('click', checkAnswer);
  document.getElementById('reset-btn').addEventListener('click', () => {
    if (state.answered) return;
    state.selected.clear();
    document.querySelectorAll('.word').forEach(el => el.classList.remove('selected'));
    document.getElementById('check-btn').disabled = true;
  });
}

function checkAnswer() {
  if (state.answered) return;
  state.answered = true;
  const task = TASKS[state.current];
  const correctIndices = new Set(task.phraseologism.indices);
  const selectedIndices = state.selected;

  const allCorrectFound = [...correctIndices].every(i => selectedIndices.has(i));
  const noExtra = [...selectedIndices].every(i => correctIndices.has(i));
  const isFullyCorrect = allCorrectFound && noExtra && correctIndices.size === selectedIndices.size;
  const isPartial = !isFullyCorrect && [...selectedIndices].some(i => correctIndices.has(i));

  document.querySelectorAll('.word').forEach(el => {
    const idx = parseInt(el.dataset.idx);
    el.classList.remove('selected');
    if (correctIndices.has(idx) && selectedIndices.has(idx)) el.classList.add('correct');
    else if (!correctIndices.has(idx) && selectedIndices.has(idx)) el.classList.add('wrong');
    else if (correctIndices.has(idx) && !selectedIndices.has(idx)) el.classList.add('missed');
    else el.classList.add('disabled');
  });

  let statusText, cssClass;
  if (isFullyCorrect) {
    state.score++;
    document.getElementById('score-value').textContent = state.score;
    statusText = '✨ В точку!';
    cssClass = 'correct';
    Sound.success();
  } else if (isPartial) {
    state.wrongTasks.push(state.current + 1);
    statusText = '🌨 Почти — снег не там';
    cssClass = 'partial';
    Sound.fail();
  } else {
    state.wrongTasks.push(state.current + 1);
    statusText = '❄️ Авария в сугробе!';
    cssClass = 'wrong';
    Sound.fail();
  }

  document.getElementById('feedback').innerHTML = `
    <div class="feedback ${cssClass}">
      <div class="status">${statusText}</div>
      <div class="phrase">${escapeHtml(task.phraseologism.phrase)}</div>
      <div class="meaning"><strong>Значение:</strong> ${escapeHtml(task.phraseologism.meaning)}</div>
    </div>
  `;

  const checkBtn = document.getElementById('check-btn');
  checkBtn.disabled = false;
  checkBtn.textContent = state.current === TASKS.length - 1 ? 'К финишу 🏁' : 'Следующий поворот →';
  const newBtn = checkBtn.cloneNode(true);
  checkBtn.parentNode.replaceChild(newBtn, checkBtn);
  newBtn.addEventListener('click', () => {
    state.current++;
    if (state.current >= TASKS.length) {
      renderFinish();
    } else {
      renderTask();
    }
  });
  document.getElementById('reset-btn').remove();
}

function updateTrack() {
  const total = TASKS.length;
  const progress = ((state.current + 1) / total) * 100;
  const fill = document.getElementById('track-fill');
  const car = document.getElementById('track-car');
  const label = document.getElementById('track-label');
  if (fill) fill.style.width = progress + '%';
  if (car) car.style.left = progress + '%';
  if (label) label.textContent = `Чекпоинт ${state.current + 1} / ${total}`;
}

/* ===== РЕНДЕР: ФИНИШ ===== */
function renderFinish() {
  stopTimer();
  /* двигатель не запускали — останавливать нечего */
  setTimeout(() => Sound.finish(), 300);

  const total = TASKS.length;
  const pct = Math.round((state.score / total) * 100);
  let medal = '🌲 Лесная странница';
  if (pct >= 90) medal = '❄️ Снежная королева';
  else if (pct >= 70) medal = '🌟 Полярная звезда';
  else if (pct >= 50) medal = '🦌 Доброе сердце';

  saveResult();

  document.getElementById('app').innerHTML = `
    <div class="finish">
      <div class="flag">🏁</div>
      <h2>Гонка завершена</h2>
      <div class="player-name">🛷 ${escapeHtml(state.playerName)}</div>
      <div class="finish-stats">
        <div class="finish-stat">
          <div class="label">Снежинки</div>
          <div class="value bees">❄ ${state.score}/${total}</div>
        </div>
        <div class="finish-stat">
          <div class="label">Время</div>
          <div class="value time">${formatTime(state.elapsedSeconds)}</div>
        </div>
      </div>
      <div class="medal">${medal}</div>
      <div style="margin-top: 20px;">
        <button class="btn btn-primary" id="restart-btn">${EMBED ? 'Закрыть' : 'Новый заезд'}</button>
      </div>
    </div>
  `;

  document.getElementById('restart-btn').addEventListener('click', () => {
    if (EMBED && window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'zebrus_game_close' }, '*');
      return;
    }
    state.current = 0;
    state.score = 0;
    state.wrongTasks = [];
    /* двигатель не запускаем */
    startTimer();
    renderGame();
  });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(str) {
  return String(str).replace(/"/g, '&quot;');
}

/* ===== ЗАПУСК =====
   В embed-режиме сразу стартуем игру (имя уже взяли из ?name=…),
   стартовый экран ввода имени не показываем.
   В standalone-режиме — обычный стартовый экран. */
if (EMBED) {
  Sound.init();
  startTimer();
  renderGame();
} else {
  renderStart();
}
</script>
